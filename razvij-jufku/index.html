<script>
(function(){
'use strict';

/* ==========================================================================
   RAZVIJ JUFKU — da se kroz nju Trebević vidi
   Single-file, Canvas 2D, Web Audio, localStorage.  © by FG
   Ista kuhinja kao TRI FILDŽANA: virtuelno platno 720×1280, sve nacrtano
   proceduralno, stari televizor oko slike kad ekran nije 9:16.

   Jedna pita = oklagija → razvijanje rukama → fil → motanje → pečenje → Nana.
   ========================================================================== */

/* ---------- konfiguracija ---------- */
var W = 720, HH = 1280;
var cv, ctx, DPR = 1, SC = 1, OX = 0, OY = 0, VW = 720, VH = 1280;

var HUD_H = 112;
/* sto: krug u ravni stola, na ekranu elipsa (pogled malo odozgo) */
var TCX = 360, TCY = 840, R_T = 300, PERSP = 0.58;
var R0 = 112;                  /* poluprečnik jufke poslije oklagije */
var T_THIN = 0.17;             /* ispod ovoga "vidi se šara" */
var T_TEAR = 0.035;            /* ispod ovoga puca */
var RH = 78;                   /* koliko ruka hvata */
var NANA_X = 360, NANA_HY = 330;

/* ---------- pomoćne ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function eio(t){ return 0.5-0.5*Math.cos(Math.PI*clamp(t,0,1)); }
function eoc(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function eic(t){ t=clamp(t,0,1); return t*t*t; }
function eob(t){ t=clamp(t,0,1); var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function fmt(n){
  var s = String(Math.round(n)), o = '';
  while(s.length > 3){ o = '.' + s.slice(-3) + o; s = s.slice(0, -3); }
  return s + o;
}
function rr(g,x,y,w,h,r){ g.beginPath(); rrSub(g,x,y,w,h,r); }
function rrSub(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
var FONT = 'system-ui,-apple-system,"Segoe UI",sans-serif';
function txt(s,x,y,font,fill,align,base){
  ctx.font = font; ctx.fillStyle = fill;
  ctx.textAlign = align||'center'; ctx.textBaseline = base||'middle';
  ctx.fillText(s,x,y);
}
function txtO(s,x,y,font,fill,lw,align){
  ctx.font = font; ctx.textAlign = align||'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw||10; ctx.strokeStyle = 'rgba(18,10,6,0.9)';
  ctx.strokeText(s,x,y); ctx.fillStyle = fill; ctx.fillText(s,x,y);
}
function wrap(s,maxw,font){
  ctx.font = font;
  var words = String(s).split(' '), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(ctx.measureText(t).width > maxw && cur){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
/* ravan stola ↔ ekran */
function toScr(u, v){ return { x: TCX + u, y: TCY + v*PERSP }; }
function toPlane(x, y){ return { u: x - TCX, v: (y - TCY)/PERSP }; }

/* ==========================================================================
   SPREMANJE
   ========================================================================== */
var STORE = 'razvij_jufku_v1';
var META = { best:0, games:0, pite:0, bestGrade:0, holes:0, thinnest:9, snd:1, total:0 };
function load(){
  try{
    var r = localStorage.getItem(STORE);
    if(!r) return;
    var o = JSON.parse(r);
    if(!o || typeof o !== 'object') return;
    META.best      = clamp(o.best|0, 0, 99999999);
    META.games     = clamp(o.games|0, 0, 9999999);
    META.pite      = clamp(o.pite|0, 0, 9999999);
    META.bestGrade = clamp(o.bestGrade|0, 0, 100);
    META.holes     = clamp(o.holes|0, 0, 99999999);
    META.thinnest  = (typeof o.thinnest === 'number') ? clamp(o.thinnest, 0, 9) : 9;
    META.total     = clamp(o.total|0, 0, 999999999);
    META.snd       = (o.snd === 0) ? 0 : 1;
  }catch(e){}
}
function save(){
  try{ META.snd = AU.on ? 1 : 0; localStorage.setItem(STORE, JSON.stringify(META)); }catch(e){}
}

/* ==========================================================================
   ZVUK — Web Audio, sve sintetizirano: tijesto, brašno, oklagija, šporet
   ========================================================================== */
var AU = {
  on: true, ctx: null, amb: null,
  init: function(){
    if(this.ctx) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      var nlen = Math.floor(this.ctx.sampleRate*2);
      this.noiseBuf = this.ctx.createBuffer(1,nlen,this.ctx.sampleRate);
      var nd = this.noiseBuf.getChannelData(0);
      for(var ni=0;ni<nlen;ni++) nd[ni] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  ok: function(){
    if(!this.on || !this.ctx) return false;
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }
    return true;
  },
  tone: function(f,dur,type,vol,f2,delay){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.05);
  },
  noise: function(dur,freq,q,vol,delay,slideTo,type){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    var f = this.ctx.createBiquadFilter();
    f.type = type||'bandpass'; f.frequency.setValueAtTime(freq,t0); f.Q.value = q||1;
    if(slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    var off = Math.random()*Math.max(0.01, s.buffer.duration-dur-0.01);
    s.start(t0, off, Math.min(dur, s.buffer.duration-off)); s.stop(t0+dur+0.02);
  },
  pluck: function(f,dur,vol,delay){
    if(!this.ok()) return;
    this.tone(f,dur,'triangle',vol||0.14,f*0.995,delay);
    this.tone(f*2.01,dur*0.4,'sine',(vol||0.14)*0.4,f*2,delay);
  },
  click: function(){ this.tone(1180,0.06,'triangle',0.10,1560); this.tone(1560,0.08,'sine',0.06,2100,0.05); },
  /* tijesto se vuče — tiho šuštanje, jače što se brže vuče */
  stretchT: 0,
  stretch: function(k){
    if(!this.ctx) return;
    var now = this.ctx.currentTime;
    if(now - this.stretchT < 0.09) return;
    this.stretchT = now;
    this.noise(0.12, 500+k*700, 0.7, 0.02+k*0.05, 0, 300, 'lowpass');
  },
  rip: function(){ this.noise(0.22, 1800, 0.8, 0.22, 0, 500); this.noise(0.12, 900, 1.2, 0.12, 0.05, 300, 'lowpass'); this.tone(180, 0.12, 'sawtooth', 0.05, 90); },
  flour: function(){ this.noise(0.28, 3200, 0.5, 0.08, 0, 1400, 'highpass'); this.noise(0.18, 600, 0.8, 0.05, 0.04, 200, 'lowpass'); },
  pin: function(k){ if(!this.ctx) return; var now = this.ctx.currentTime; if(now - this.stretchT < 0.12) return; this.stretchT = now; this.noise(0.10, 300, 0.9, 0.04+k*0.05, 0, 150, 'lowpass'); },
  spoon: function(){ this.noise(0.07, 2400, 1.0, 0.03, 0, 1200); this.tone(900, 0.04, 'triangle', 0.02, 700); },
  roll: function(k){ if(!this.ctx) return; var now = this.ctx.currentTime; if(now - this.stretchT < 0.1) return; this.stretchT = now; this.noise(0.14, 400, 0.6, 0.03+k*0.06, 0, 200, 'lowpass'); },
  lim: function(){ this.tone(140, 0.14, 'sine', 0.14, 60); this.tone(2100, 0.06, 'triangle', 0.05, 1500); this.noise(0.1, 2600, 1.3, 0.05, 0, 900); },
  oven: function(){ this.noise(0.5, 200, 0.5, 0.10, 0, 90, 'lowpass'); this.tone(90, 0.3, 'sine', 0.08, 50); },
  ding: function(){ this.tone(1560,0.35,'sine',0.12,1550); this.tone(2340,0.25,'sine',0.05,2330,0.02); },
  tick: function(){ this.tone(1400, 0.03, 'square', 0.03, 1200); },
  good: function(){ var f=[392,493.88,587.33,783.99]; for(var i=0;i<f.length;i++) this.pluck(f[i],0.4,0.12,i*0.09); },
  meh: function(){ this.tone(330, 0.3, 'triangle', 0.08, 300); this.tone(262, 0.4, 'triangle', 0.08, 250, 0.3); },
  bad: function(){ this.tone(300,0.45,'sawtooth',0.10,70); this.tone(196,0.5,'square',0.05,52,0.04); },
  over: function(){ var f=[349.23,329.63,293.66,261.63,196.00]; for(var i=0;i<f.length;i++) this.pluck(f[i],0.6,0.14,i*0.17); },
  tsk: function(){ this.noise(0.04, 4200, 2, 0.08, 0, 3000); this.noise(0.04, 4200, 2, 0.08, 0.12, 3000); },
  /* kuhinja: šporet tiho bruji, sat kucka */
  ambOn: function(){
    if(!this.ok() || this.amb) return;
    try{
      var c = this.ctx, g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, c.currentTime+1.5);
      g.connect(this.master);
      var hum = c.createOscillator(); hum.type = 'sine'; hum.frequency.value = 55;
      var hg = c.createGain(); hg.gain.value = 0.3; hum.connect(hg); hg.connect(g);
      var n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 0.5;
      var ng = c.createGain(); ng.gain.value = 0.5;
      var lfo = c.createOscillator(); lfo.frequency.value = 0.11;
      var lg = c.createGain(); lg.gain.value = 0.2; lfo.connect(lg); lg.connect(ng.gain);
      n.connect(f); f.connect(ng); ng.connect(g);
      hum.start(); n.start(); lfo.start();
      this.amb = { g:g, nodes:[hum,n,lfo] };
    }catch(e){ this.amb = null; }
  },
  ambOff: function(){
    if(!this.amb || !this.ctx) return;
    var a = this.amb; this.amb = null;
    try{
      a.g.gain.setValueAtTime(a.g.gain.value, this.ctx.currentTime);
      a.g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.6);
      setTimeout(function(){ try{ for(var i=0;i<a.nodes.length;i++) a.nodes[i].stop(); }catch(e){} }, 800);
    }catch(e){}
  }
};

/* ==========================================================================
   JUFKA — NS sektora × NR prstenova. Svaki sektor pamti gdje mu je koji
   prsten (poluprečnik). Ruka ispod tijesta koja ide prema rubu:
     · sve što je ispred ruke ide s njom (nosi ga dlan),
     · sve što je iza ruke (između sredine i dlana) ravnomjerno se razvuče.
   Debljina ćelije = masa / površina; što tanje, to se više vidi šara mušeme.
   Ispod T_TEAR puca. Ovako se tijesto nikad ne "presavije" samo preko sebe.
   ========================================================================== */
var NS = 36, NR = 7;
var D = { v:[], rad:[], cells:[], holes:0, dry:0, sticky:0, flour:2, T0:1, ready:false,
          thin:0, cover:0, minT:1, dryTime:70 };
var SECT = Math.PI*2/NS;
function vidx(r,s){ if(r===0) return 0; s = ((s%NS)+NS)%NS; return 1 + (r-1)*NS + s; }
function polyArea(idx){
  var a = 0, n = idx.length;
  for(var i=0;i<n;i++){ var p = D.v[idx[i]], q = D.v[idx[(i+1)%n]]; a += p.u*q.v - q.u*p.v; }
  return Math.abs(a)*0.5;
}
function doughInit(r0, T0){
  var r, s;
  D.rad = [];
  for(r=0;r<=NR;r++){ D.rad.push(new Float32Array(NS)); for(s=0;s<NS;s++) D.rad[r][s] = r0*r/NR*(1 + (r===NR ? 0.02*Math.sin(s*1.7) : 0)); }
  D.v = [{u:0, v:0, over:false}];
  for(r=1;r<=NR;r++) for(s=0;s<NS;s++) D.v.push({u:0, v:0, over:false});
  doughPlace();
  D.cells = [];
  for(s=0;s<NS;s++) D.cells.push({i:[0, vidx(1,s), vidx(1,s+1)], m:0, t:T0, hole:false, r:0, s:s, cu:0, cv:0});
  for(r=1;r<NR;r++) for(s=0;s<NS;s++) D.cells.push({i:[vidx(r,s), vidx(r,s+1), vidx(r+1,s+1), vidx(r+1,s)], m:0, t:T0, hole:false, r:r, s:s, cu:0, cv:0});
  for(var i=0;i<D.cells.length;i++){ var c = D.cells[i]; c.m = polyArea(c.i)*T0; }
  D.holes = 0; D.dry = 0; D.sticky = 0; D.T0 = T0; D.ready = true;
  D.thin = 0; D.cover = 0; D.minT = T0;
  doughMeasure();
}
/* iz poluprečnika u tačke */
function doughPlace(){
  for(var r=1;r<=NR;r++) for(var s=0;s<NS;s++){
    var a = s*SECT, rad = D.rad[r][s], vt = D.v[vidx(r,s)];
    vt.u = Math.cos(a)*rad; vt.v = Math.sin(a)*rad;
    vt.over = rad > R_T + 6;
  }
}
/* debljina, tankoća, rub, najtanje mjesto */
function doughMeasure(){
  var thinA = 0, totA = 0, minT = 9, i, c;
  for(i=0;i<D.cells.length;i++){
    c = D.cells[i];
    var A = polyArea(c.i);
    c.t = (A > 0.01) ? c.m/A : 9;
    var cu = 0, cvv = 0;
    for(var k=0;k<c.i.length;k++){ cu += D.v[c.i[k]].u; cvv += D.v[c.i[k]].v; }
    c.cu = cu/c.i.length; c.cv = cvv/c.i.length;
    if(c.hole) continue;
    totA += A;
    if(c.t <= T_THIN) thinA += A;
    if(c.t < minT) minT = c.t;
  }
  D.thin = totA > 0 ? thinA/totA : 0;
  D.minT = minT;
  var over = 0;
  for(var s=0;s<NS;s++) if(D.rad[NR][s] > R_T + 6) over++;
  D.cover = over/NS;
}
function tearT(){ return T_TEAR*(1 + D.dry*0.9 + D.sticky*0.45); }
/* tijesto se polako skuplja tamo gdje ne visi preko ruba */
function doughRelax(dt){
  var sh = 1 - 0.008*dt;
  for(var s=0;s<NS;s++){
    if(D.rad[NR][s] > R_T + 6) continue;
    for(var r=1;r<=NR;r++){ var r0 = R0*r/NR; if(D.rad[r][s] > r0) D.rad[r][s] = r0 + (D.rad[r][s] - r0)*sh; }
  }
  doughPlace();
}

/* ---------- ruka ispod jufke ---------- */
var HAND = { on:false, u:0, v:0, rho:0, ang:0, speed:0, moved:0, show:false, sx:0, sy:0, frameDist:0, strokeCarry:0, strokeMax:0 };
function handDown(u, v){
  HAND.on = true; HAND.u = u; HAND.v = v; HAND.rho = Math.hypot(u, v); HAND.ang = Math.atan2(v, u);
  HAND.speed = 0; HAND.moved = 0; HAND.frameDist = 0;
  HAND.strokeCarry = 0; HAND.strokeMax = Math.max(HAND.rho, 20)*0.25;
}
/* težina sektora prema kutnoj udaljenosti od ruke: pun dlan ±12°, pa do ±45° sve manje */
function sectW(s, ang){
  var da = Math.abs(((s*SECT - ang + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI);
  if(da < 0.21) return 1;
  if(da >= 0.8) return 0;
  var q = (da - 0.21)/0.59;
  return 1 - (3*q*q - 2*q*q*q);
}
function handMove(u, v, dt){
  if(!HAND.on){ HAND.u = u; HAND.v = v; return; }
  var rho1 = Math.hypot(u, v), ang1 = Math.atan2(v, u);
  var drho = rho1 - HAND.rho;
  var dist = Math.hypot(u - HAND.u, v - HAND.v);
  HAND.moved += dist;
  if(drho > 0 && HAND.rho > 4){
    HAND.frameDist += drho;
    var eff = 1 - D.sticky*0.45;                     /* ljepljivo tijesto ide teže */
    var rho0 = Math.max(HAND.rho, 20);
    /* jedan potez ne može razvući više od ~25% — dalje dlan samo klizi ispod */
    var maxCarry = HAND.strokeMax - HAND.strokeCarry;
    var dcar = Math.min(drho*eff, Math.max(0, maxCarry));
    HAND.strokeCarry += dcar;
    for(var s=0;s<NS;s++){
      var w = sectW(s, ang1);
      if(w <= 0) continue;
      var carry = dcar*w;
      for(var r=1;r<=NR;r++){
        var rr2 = D.rad[r][s];
        /* iza dlana: što bliže dlanu, to više; sredina ostaje deblja (zato se i vuče "ispod sredine") */
        D.rad[r][s] = (rr2 < rho0) ? rr2 + carry*(rr2/rho0)*(rr2/rho0) : rr2 + carry;
      }
    }
    doughPlace();
    AU.stretch(clamp(drho/14, 0, 1));
  }
  HAND.u = u; HAND.v = v; HAND.rho = rho1; HAND.ang = ang1;
}
/* brzina razvlačenja po frame-u — ne ovisi o tome koliko često stižu događaji */
function handFrame(dt){
  HAND.speed = HAND.on ? HAND.frameDist/Math.max(dt, 0.004) : 0;
  HAND.frameDist = 0;
}
function handUp(){ HAND.on = false; HAND.speed = 0; HAND.frameDist = 0; }
/* pukne li? — pretanko, ili prebrzo dok je tanko */
function doughTearCheck(dt){
  D.tearCd = Math.max(0, (D.tearCd||0) - dt);
  if(D.tearCd > 0) return;
  var tt = tearT(), i, c, worst = null;
  for(i=0;i<D.cells.length;i++){
    c = D.cells[i];
    if(c.hole) continue;
    if(c.t < tt){ tear(c); return; }
  }
  if(HAND.on && HAND.speed > 900){
    var p = clamp((HAND.speed - 900)/1600, 0, 0.5);
    for(i=0;i<D.cells.length;i++){
      c = D.cells[i];
      if(c.hole) continue;
      if(sectW(c.s, HAND.ang) > 0.5 && c.t < 0.26 && (!worst || c.t < worst.t)) worst = c;
    }
    if(worst && Math.random() < p) tear(worst);
  }
}
function tear(c){
  c.hole = true; D.holes++; META.holes++; D.tearCd = 0.45;
  var p = toScrV(c.cu, c.cv);
  puff(p.x, p.y, 8, '#e8d9b8');
  AU.rip(); vib([30,40,30]);
  G.shake = 4;
  nanaEvent(D.holes === 1 ? 'RUPA1' : 'RUPA', 3, 2.6);
}
/* koja ćelija je pod tačkom (u,v) — null ako je van jufke */
function cellAt(u, v){
  if(!D.ready) return null;
  var rho = Math.hypot(u, v), a = Math.atan2(v, u); if(a < 0) a += Math.PI*2;
  var s = Math.floor((a + SECT/2)/SECT) % NS;
  if(rho >= D.rad[NR][s]) return null;
  for(var r=1;r<=NR;r++){
    if(rho < D.rad[r][s]) return (r === 1) ? D.cells[s] : D.cells[NS + (r-2)*NS + s];
  }
  return null;
}
function insideDough(u, v){ var c = cellAt(u, v); return !!c && !c.hole; }
/* ravan stola → ekran; što visi preko ruba pada niz prednju stranu */
function projV(vt){
  var rad = Math.hypot(vt.u, vt.v);
  if(rad > R_T){
    var k = R_T/rad, ex = rad - R_T;
    if(vt.v >= 0) return { x: TCX + vt.u*k, y: TCY + vt.v*k*PERSP + Math.min(ex, 90)*0.85 };
    return { x: TCX + vt.u*k, y: TCY + vt.v*k*PERSP };
  }
  return { x: TCX + vt.u, y: TCY + vt.v*PERSP };
}
function toScrV(u, v){ return projV({u:u, v:v}); }
/* demo-jufka za meni: već razvučena, malo neravna */
function doughDemo(){
  doughInit(R0, 1);
  for(var s=0;s<NS;s++){
    var a = s*SECT, k = 2.6 + Math.sin(a*3)*0.2 + Math.sin(a*7+1)*0.1;
    for(var r=1;r<=NR;r++) D.rad[r][s] = R0*r/NR*k*(0.9 + 0.1*r/NR);

}

var PARTS = [], PART_N = 200, PART_I = 0;

function part(k, x, y, vx, vy, life, r, c){
  var p = PARTS[PART_I]; PART_I = (PART_I+1) % PART_N;

}
function updateParts(dt){

/* ==========================================================================

function newGame(){
  G.st = S.PLAYING; G.t = 0;
  G.idx = 0; G.score = 0; G.strikes = 0; G.newBest = false; G.bestSaid = false;
  G.pitasGrades = [];
  for(var i=0;i<PART_N;i++) PARTS[i].on = false;
  META.games++; save();
  AU.ambOn();
  startPita();
}
function setPhase(ph){
  G.phase = ph; G.phT = 0;
  if(ph === PHASE.OKL) G.instr = 'Oklagijom preko lopte, naprijed-nazad.';
  if(ph === PHASE.RAZ) G.instr = 'Ruka ispod jufke. Vuci prema rubu, polako, okolo.';
  if(ph === PHASE.FIL) G.instr = 'Kašikom pospi fil. Ravnomjerno, ne do ruba.';
  if(ph === PHASE.MOT) G.instr = 'Povuci čaršaf od gore prema sebi. Polako.';
  if(ph === PHASE.PEC) G.instr = 'Dodirni kad je taman.';
  if(ph === PHASE.OCJ) G.instr = '';
}
function startPita(){
  G.idx++;
  G.pita = (G.idx - 1) % PITE.length;
  G.okl.p = 0; G.okl.down = false; G.okl.x = 360; G.okl.y = TCY;
  G.raz.time = 0; G.raz.thin = 0; G.raz.cover = 0; G.raz.holes = 0; G.raz.dryOut = false;
  G.fil.bowl = 1; G.fil.pts = []; G.fil.grid = new Float32Array(144); G.fil.lost = 0; G.fil.score = 0; G.fil.down = false;
  G.mot.p = 0; G.mot.on = false; G.mot.snapped = false; G.mot.coil = 0; G.mot.done = false;
  G.pec.needle = 0; G.pec.taken = false; G.pec.bake = 0; G.pec.t = 0;
  D.ready = false; D.flour = (G.idx >= 4) ? 1 : 2; D.dryTime = Math.max(50, 95 - (G.idx-1)*7);
  HAND.on = false; HAND.show = false;
  NANA.say = ''; NANA.sayT = 0; NANA.prio = 0; NANA.cd = 3;
  setPhase(PHASE.OKL);
  nanaSay(G.idx === 1 ? 'Danas: ' + PITE[G.pita].name.toLowerCase() + '. Prvo oklagijom.' : pick(L.OKL), 3.2, 3);
}
function gradePita(){
  var g = G.grade;
  g.tanko = Math.round(40*G.raz.thin);
  g.rub   = Math.round(20*G.raz.cover);
  g.rupe  = Math.max(0, 10 - 5*G.raz.holes);
  g.fil   = Math.round(15*G.fil.score);
  var b = G.pec.bake, bs = 1 - Math.min(1, Math.abs(b - 0.70)/0.22);
  g.pec   = Math.round(15*bs);
  g.total = clamp(g.tanko + g.rub + g.rupe + g.fil + g.pec, 0, 100);
  g.bonus = (G.raz.time < 45 && g.total >= 40) ? Math.round((45 - G.raz.time)*4) : 0;
  g.pts   = g.total*10 + g.bonus;
  G.score += g.pts; META.total += g.pts; META.pite++;
  G.pitasGrades.push(g.total);
  if(g.total > META.bestGrade) META.bestGrade = g.total;
  if(D.minT < META.thinnest) META.thinnest = D.minT;
  if(G.score > META.best){ META.best = G.score; if(!G.newBest){ G.newBest = true; } }
  save();
  var key = g.total >= 85 ? 'V90' : g.total >= 70 ? 'V70' : g.total >= 50 ? 'V50' : g.total >= 40 ? 'V40' : 'V0';
  G.verdict = pick(L[key]);
  if(g.total < 40){ G.strikes++; AU.bad(); }
  else if(g.total >= 70) AU.good(); else AU.meh();
  nanaSay(G.verdict, 4, 4);
}
function gameOver(){
  G.st = S.OVER; G.t = 0;
  G.overLine = pick(L.OVER);
  save();
  NANA.say = ''; NANA.sayT = 0; NANA.prio = 0;
  AU.over(); AU.ambOff(); vib([40,60,80]);
}
function toMenu(){
  G.st = S.MENU; G.t = 0;
  NANA.say = ''; NANA.sayT = 0;
  HAND.on = false; HAND.show = false;
  doughDemo();
  AU.ambOff();
}
function togglePause(){
  if(G.st === S.PLAYING){ G.st = S.PAUSED; G.t = 0; handUp(); AU.ambOff(); }
  else if(G.st === S.PAUSED){ G.st = S.PLAYING; AU.ambOn(); }
}
function useFlour(){
  if(G.st !== S.PLAYING || G.phase !== PHASE.RAZ || D.flour <= 0) return;
  D.flour--; D.sticky = 0;
  for(var i=0;i<26;i++){ var a = rnd(0,6.28), rd = rnd(0, R_T*0.9); var p = toScr(Math.cos(a)*rd, Math.sin(a)*rd); part(0, p.x, p.y-20, rnd(-20,20), rnd(10,40), rnd(0.5,1.1), rnd(1.5,3.5), '#fbf6ea'); }
  AU.flour(); nanaEvent('FLOUR', 2, 2.2);
}
/* GOTOVO — igrač sam kaže kad je razvijanje / fil gotov */
function finishPhase(){
  if(G.st !== S.PLAYING) return;
  if(G.phase === PHASE.RAZ) endRaz();
  else if(G.phase === PHASE.FIL) endFil();
}
function endRaz(){
  handUp(); HAND.show = false;
  doughMeasure();
  G.raz.thin = D.thin; G.raz.cover = D.cover; G.raz.holes = D.holes;
  setPhase(PHASE.FIL);
  nanaEvent('FIL', 3, 3);
}
function filMeasure(){
  var grid = G.fil.grid, cells = 0, sum = 0, sum2 = 0, covered = 0;
  for(var gy=0; gy<12; gy++) for(var gx=0; gx<12; gx++){
    var u = (gx+0.5)/12*660 - 330, v = (gy+0.5)/12*660 - 330;
    if(!insideDough(u, v)) continue;
    cells++;
    var a = grid[gy*12+gx];
    sum += a; sum2 += a*a;
    if(a >= 0.6) covered++;
  }
  if(!cells){ G.fil.score = 0; return; }
  var mean = sum/cells, sd = Math.sqrt(Math.max(0, sum2/cells - mean*mean));
  var even = mean > 0 ? clamp(1 - sd/mean*0.8, 0, 1) : 0;
  G.fil.score = clamp(0.6*(covered/cells) + 0.4*even, 0, 1);
}
function endFil(){
  G.fil.down = false;
  filMeasure();
  setPhase(PHASE.MOT);
  G.mot.p = 0;
  nanaEvent('MOT', 3, 3);
}

/* ==========================================================================
   GLAVNA PETLJA LOGIKE
   ========================================================================== */
function update(dt){
  G.gt += dt; G.t += dt;
  G.shake *= Math.pow(0.002, dt);
  G.flash = Math.max(0, G.flash - dt*1.8);
  updateParts(dt);
  updateNana(dt);
  if(G.st === S.INTRO){
    if(G.t > 3.05 && !G.introSaid){ G.introSaid = true; nanaSay('Sjedi. Danas učiš.', 2.6, 4); }
    if(G.t > 5.6){ G.st = S.MENU; G.t = 1; }
    return;
  }
  if(G.st !== S.PLAYING) return;
  G.phT += dt;
  NANA.idleT += dt;

  if(G.phase === PHASE.OKL){
    if(G.okl.p >= 1){
      doughInit(R0, Math.max(0.8, 1 - (G.idx-1)*0.03));
      setPhase(PHASE.RAZ);
      nanaEvent('RAZ', 3, 3.2);
    }
  }
  else if(G.phase === PHASE.RAZ){
    G.raz.time += dt;
    D.dry = Math.min(1, D.dry + dt/D.dryTime);
    D.sticky = Math.min(1, D.sticky + dt/34);
    handFrame(dt);
    doughRelax(dt);
    doughMeasure();
    doughTearCheck(dt);
    if(D.thin > 0.5 && !G.raz.thinSaid){ G.raz.thinSaid = true; nanaEvent('THIN', 2, 2.8); }
    if(D.dry > 0.75 && !G.raz.drySaid){ G.raz.drySaid = true; nanaEvent('DRY', 2, 2.6); }
    if(D.dry >= 1){ G.raz.dryOut = true; nanaSay('Osušila se. Dosta.', 3, 4); endRaz(); return; }
    if(NANA.idleT > 9 && Math.random() < dt*0.25){ nanaEvent('IDLE', 1, 2.8); }
    /* vuče ukrug umjesto prema rubu */
    if(HAND.on && HAND.moved > 260 && HAND.strokeCarry < 12 && !G.raz.circSaid){ G.raz.circSaid = true; nanaSay('Prema rubu vuci, ne ukrug.', 2.8, 2); }
    /* sve s jedne strane? */
    if(G.raz.time > 20 && !G.raz.sideSaid){
      var over = 0, side = [0,0,0,0];
      for(var s=0;s<NS;s++) if(D.v[vidx(NR,s)].over){ over++; side[Math.floor(s/(NS/4))]++; }
      if(over >= 6 && (side[0]+side[1] === 0 || side[2]+side[3] === 0)){ G.raz.sideSaid = true; nanaEvent('SIDE', 2, 2.8); }
    }
  }
  else if(G.phase === PHASE.FIL){
    if(G.fil.bowl <= 0 && G.phT > 1.0 && !G.fil.emptyT) G.fil.emptyT = G.phT;
    if(G.fil.emptyT && G.phT - G.fil.emptyT > 0.9) endFil();
  }
  else if(G.phase === PHASE.MOT){
    if(G.mot.p >= 1 && !G.mot.done){ G.mot.done = true; G.mot.on = false; AU.roll(1); }
    if(G.mot.done){
      G.mot.coil = Math.min(1, G.mot.coil + dt/1.7);
      if(G.mot.coil >= 1 && G.phT > 0.5){ setPhase(PHASE.PEC); AU.oven(); nanaEvent('PEC', 3, 3); }
    }
  }
  else if(G.phase === PHASE.PEC){
    if(!G.pec.taken){
      if(G.phT > 0.8) G.pec.needle = Math.min(1, G.pec.needle + dt/5.5);
      if(G.pec.needle >= 1){ G.pec.taken = true; G.pec.bake = 1; G.pec.t = 0; AU.lim(); }
    } else {
      G.pec.t += dt;
      if(G.pec.t > 0.9){ setPhase(PHASE.OCJ); gradePita(); }
    }
  }
  else if(G.phase === PHASE.OCJ){
    if(G.score > META.best && META.best > 0 && !G.bestSaid && G.grade.total >= 40){ G.bestSaid = true; }
  }
}
function takeOut(){
  if(G.st !== S.PLAYING || G.phase !== PHASE.PEC || G.pec.taken || G.phT < 0.8) return;
  G.pec.taken = true; G.pec.bake = G.pec.needle; G.pec.t = 0;
  AU.lim(); AU.ding(); vib(12);
  var p = toScr(0, 0); steam(p.x, p.y - 60, 6, true);
}
function nextPita(){
  if(G.strikes >= 3){ gameOver(); return; }
  startPita();
}

/* ==========================================================================
   CRTANJE SCENE — kuhinja u bosanskoj kući. Statično jednom u sprite (2×).
   ========================================================================== */
var BG_SPR = null;
function bgSprite(){
  if(BG_SPR) return BG_SPR;
  var c = document.createElement('canvas');
  c.width = W*2; c.height = HH*2;
  var g = c.getContext('2d');
  g.scale(2, 2);
  var i, k;

  /* zid — krečen, topao, star */
  var pg = g.createLinearGradient(0, 0, 0, 700);
  pg.addColorStop(0, '#6a5440'); pg.addColorStop(0.5, '#8d7357'); pg.addColorStop(1, '#a08663');
  g.fillStyle = pg; g.fillRect(0, 0, W, 760);
  g.strokeStyle = 'rgba(40,26,16,0.25)'; g.lineWidth = 1.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(28, 40); g.lineTo(46, 96); g.lineTo(38, 140); g.stroke();
  g.fillStyle = 'rgba(60,40,24,0.14)';
  g.beginPath(); g.ellipse(640, 120, 60, 36, 0.3, 0, 6.284); g.fill();

  /* pod: daske */
  g.fillStyle = '#4a321f'; g.fillRect(0, 760, W, HH-760);
  for(i=0;i<14;i++){
    g.fillStyle = (i%2) ? '#553b25' : '#4c3421';
    g.fillRect(0, 760 + i*40, W, 38);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 760 + i*40 + 38, W, 2);
  }
  var fg = g.createLinearGradient(0, 760, 0, HH);
  fg.addColorStop(0, 'rgba(0,0,0,0.15)'); fg.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = fg; g.fillRect(0, 760, W, HH-760);
  /* lajsna zid/pod */

var TBL_SPR = null;
function tableSprite(){
  if(TBL_SPR) return TBL_SPR;
  var size = R_T*2 + 40;
  var c = document.createElement('canvas'); c.width = c.height = size*2;
  var g = c.getContext('2d'); g.scale(2, 2); g.translate(size/2, size/2);
  g.beginPath(); g.arc(0, 0, R_T+8, 0, 6.284); g.clip();
  g.fillStyle = '#e6dcc6'; g.fillRect(-size/2, -size/2, size, size);
  g.fillStyle = 'rgba(176,54,44,0.62)';
  var sq = 40;
  for(var i=-9;i<=9;i++) for(var k=-9;k<=9;k++){ if((i+k)%2) continue; g.fillRect(i*sq, k*sq, sq, sq); }
  g.strokeStyle = 'rgba(120,40,32,0.30)'; g.lineWidth = 1.5;
  for(i=-9;i<=9;i++){ g.beginPath(); g.moveTo(i*sq, -size); g.lineTo(i*sq, size); g.stroke(); g.beginPath(); g.moveTo(-size, i*sq); g.lineTo(size, i*sq); g.stroke(); }
  /* stare fleke */
  g.strokeStyle = 'rgba(86,52,26,0.25)'; g.lineWidth = 4;
  g.beginPath(); g.arc(160, -120, 22, 0, 6.284); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.beginPath(); g.ellipse(-80, -90, 140, 90, 0.4, 0, 6.284); g.fill();
  TBL_SPR = { c:c, size:size };
  return TBL_SPR;
}

function drawDough(clipY){

function bakeColor(b){
  if(b <= 0.05) return '#efe1c4';
  if(b < 0.55) return lerpCol('#efe1c4', '#e6c27a', b/0.55);
  if(b < 0.75) return lerpCol('#e6c27a', '#cf8a3a', (b-0.55)/0.2);
  if(b < 0.9)  return lerpCol('#cf8a3a', '#8a4a1a', (b-0.75)/0.15);
  return lerpCol('#8a4a1a', '#2e1c12', (b-0.9)/0.1);
}
function bakeEdge(b){ return b < 0.6 ? '#b9a37a' : (b < 0.9 ? '#6e3f18' : '#1a100a'); }
function lerpCol(a, b, t){
  t = clamp(t, 0, 1);

}

var SNOW_SPR = null;
function snowSprite(){
  if(SNOW_SPR) return SNOW_SPR;
  var c = document.createElement('canvas'); c.width = 240; c.height = 400;
  var g = c.getContext('2d'), img = g.createImageData(240, 400), d = img.data;

  g.putImageData(img, 0, 0);

}

function drawIntro(){
  var t = G.t;
  if(t < 0.85){
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,HH);
    var k = clamp(t/0.85, 0, 1);
    var lw = (k < 0.40) ? lerp(40, W, eoc(k/0.40)) : W;
    var lh = (k < 0.40) ? 4 : lerp(4, HH, eoc((k-0.40)/0.60));

    ctx.fillStyle = 'rgba(232,255,250,'+la+')';
    ctx.fillRect((W-lw)/2, 640-lh/2, lw, lh);

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  ctx.save();
  ctx.translate(OX,OY); ctx.scale(SC,SC);
  ctx.beginPath(); ctx.rect(0,0,W,HH); ctx.clip();
  var sh = G.shake;
  if(sh>0.3) ctx.translate(rnd(-sh,sh), rnd(-sh,sh));
  BTN = [];

  drawBackLive();
  drawNana();
  drawTable();
  var playing = (G.st === S.PLAYING || G.st === S.PAUSED);
  if(G.st === S.MENU || G.st === S.HOWTO || G.st === S.STATS || G.st === S.INTRO){
    drawDough();
  } else if(playing || G.st === S.OVER){
    var ph = G.phase;
    if(ph === PHASE.OKL){
      drawBall(G.okl.p);
      drawOklagija(G.okl.x, G.okl.y);
    } else if(ph === PHASE.RAZ){
      if(HAND.show) drawHand(HAND.sx, HAND.sy, true);
      drawDough();
    } else if(ph === PHASE.FIL){
      drawDough(); drawFil();
      if(G.fil.down) drawSpoon(G.fil.sx, G.fil.sy);
    } else if(ph === PHASE.MOT){
      drawRoll();
      if(G.mot.coil < 1){
        var yf = lerp(TCY - R_T*PERSP - 8, TCY + R_T*PERSP + 30, G.mot.p);
        ctx.save(); ctx.beginPath(); ctx.rect(0, yf + 8, W, HH); ctx.clip(); drawFil(); ctx.restore();
      }
    } else if(ph === PHASE.PEC){
      drawCoil(1, G.pec.taken ? G.pec.bake : G.pec.needle);
    } else if(ph === PHASE.OCJ){
      drawCoil(1, G.pec.bake);
    }
  }
  drawTableFront();
  drawParts();
  if(G.flash>0){ ctx.fillStyle = 'rgba(255,230,170,'+(G.flash*0.4)+')'; ctx.fillRect(0,0,W,HH); }

  if(playing){
    if(NANA.sayT > 0) speechBubble(NANA.say, 360, 246, 520, NANA_X, 282, false);
    drawHUD();
    drawBottomBar();
    if(G.phase === PHASE.OCJ) drawOcjena();

  }

  if(G.st === S.HOWTO) drawHowto();
  if(G.st === S.STATS) drawStats();
  if(G.st === S.PAUSED) drawPaused();
  if(G.st === S.OVER){ drawHUD(); drawOver(); }
  if(G.st === S.INTRO) drawIntro();

  if(!(G.st === S.INTRO && G.t < 2.94)) drawWatermark();
  drawCRT();
  ctx.restore();
  drawOkvir();
}

/* ==========================================================================
   UNOS — prst i miš rade isto. Šta pokret znači, zavisi od faze.
   ========================================================================== */
function hit(x,y){
  for(var i=BTN.length-1;i>=0;i--){
    var b = BTN[i];
    if(b.dis) continue;
    if(x>=b.x-8 && x<=b.x+b.w+8 && y>=b.y-8 && y<=b.y+b.h+10) return b.id;
  }
  return null;
}
function toVirt(cx,cy){ return {x:(cx-OX)/SC, y:(cy-OY)/SC}; }
var PTR = { down:false, x:0, y:0, t:0 };
function onDown(cx,cy){
  AU.init();
  var v = toVirt(cx,cy), now = performance.now();
  var id = hit(v.x, v.y);
  if(id){ PRESS.id = id; return; }
  PRESS.id = null;
  PTR.down = true; PTR.x = v.x; PTR.y = v.y; PTR.t = now;
  if(G.st === S.INTRO){ G.st = S.MENU; G.t = 0; NANA.sayT = 0; AU.click(); return; }
  if(G.st !== S.PLAYING) return;
  var p = toPlane(v.x, v.y);
  if(G.phase === PHASE.OKL){ G.okl.down = true; G.okl.x = v.x; G.okl.y = clamp(v.y, TCY - R_T*PERSP - 20, TCY + R_T*PERSP + 20); }
  else if(G.phase === PHASE.RAZ){ if(v.y > 480){ handDown(p.u, p.v); HAND.show = true; HAND.sx = v.x; HAND.sy = v.y; } }
  else if(G.phase === PHASE.FIL){ G.fil.down = true; G.fil.sx = v.x; G.fil.sy = v.y; G.fil.u = p.u; G.fil.v = p.v; }
  else if(G.phase === PHASE.MOT){
    var yf = lerp(TCY - R_T*PERSP - 8, TCY + R_T*PERSP + 30, G.mot.p);
    if(!G.mot.done && Math.abs(v.y - yf) < 110){ G.mot.on = true; G.mot.lastY = v.y; }
  }
  else if(G.phase === PHASE.PEC){ takeOut(); }
}
function onMove(cx,cy){
  var v = toVirt(cx,cy), now = performance.now();
  var dt = Math.min(0.05, Math.max(0.004, (now - PTR.t)/1000));
  var dx = v.x - PTR.x, dy = v.y - PTR.y;
  PTR.x = v.x; PTR.y = v.y; PTR.t = now;
  if(G.st !== S.PLAYING) return;
  var p = toPlane(v.x, v.y);
  if(G.phase === PHASE.OKL && G.okl.down && !PRESS.id){
    G.okl.x = v.x; G.okl.y = clamp(v.y, TCY - R_T*PERSP - 20, TCY + R_T*PERSP + 20);
    var r = lerp(50, R0, G.okl.p);
    if(Math.abs(p.v) < r + 40 && Math.abs(p.u) < r + 140){
      G.okl.p = Math.min(1, G.okl.p + Math.abs(dy)/820);
      AU.pin(clamp(Math.abs(dy)/30, 0, 1));
      if(Math.abs(dy) > 6 && Math.random() < 0.3) puff(v.x + rnd(-60,60), v.y + rnd(-6,6), 1, 'rgba(255,255,255,0.7)');
    }
  }
  else if(G.phase === PHASE.RAZ && HAND.on){
    HAND.sx = v.x; HAND.sy = v.y;
    handMove(p.u, p.v, dt);
  }
  else if(G.phase === PHASE.FIL && G.fil.down){ G.fil.sx = v.x; G.fil.sy = v.y; G.fil.u = p.u; G.fil.v = p.v; }
  else if(G.phase === PHASE.MOT && G.mot.on && !G.mot.done){
    var ddy = v.y - G.mot.lastY;
    G.mot.lastY = v.y;
    if(ddy > 0){
      var H = R_T*PERSP*2 + 38;
      G.mot.p = Math.min(1, G.mot.p + ddy/H);
      AU.roll(clamp(ddy/20, 0, 1));
      if(ddy > 40 && !G.mot.snapped){ G.mot.snapped = true; AU.rip(); G.shake = 5; nanaEvent('SNAP', 3, 2.4); G.fil.score = Math.max(0, G.fil.score - 0.25); }
    }
  }
}
function onUp(cx,cy){
  AU.init();
  var v = toVirt(cx,cy);
  var id = hit(v.x, v.y);
  var was = PRESS.id; PRESS.id = null;
  PTR.down = false;
  if(id && id === was){ handle(id); return; }
  if(G.st !== S.PLAYING) return;
  if(G.phase === PHASE.OKL) G.okl.down = false;
  if(G.phase === PHASE.RAZ){ handUp(); HAND.show = false; }
  if(G.phase === PHASE.FIL) G.fil.down = false;
  if(G.phase === PHASE.MOT) G.mot.on = false;
}
function handle(id){
  if(id==='snd' || id==='sndbig'){ AU.on = !AU.on; if(AU.on){ AU.click(); if(G.st === S.PLAYING) AU.ambOn(); } else AU.ambOff(); save(); return; }
  AU.click();
  if(id==='play'){ newGame(); return; }
  if(id==='howto'){ G.st = S.HOWTO; G.t = 0; return; }
  if(id==='stats'){ G.st = S.STATS; G.t = 0; return; }
  if(id==='back'){ toMenu(); return; }
  if(id==='pause'){ togglePause(); return; }
  if(id==='resume'){ if(G.st === S.PAUSED) togglePause(); return; }
  if(id==='menu'){ toMenu(); return; }
  if(id==='again'){ newGame(); return; }
  if(id==='flour'){ useFlour(); return; }
  if(id==='done'){ finishPhase(); return; }
  if(id==='next'){ nextPita(); return; }
}
function onKey(e){
  if(e.key === ' ' || e.key === 'Enter'){
    AU.init();
    if(G.st === S.INTRO){ G.st = S.MENU; G.t = 0; NANA.sayT = 0; }
    else if(G.st === S.MENU) handle('play');
    else if(G.st === S.OVER) handle('again');
    else if(G.st === S.PAUSED) togglePause();
    else if(G.st === S.HOWTO || G.st === S.STATS) toMenu();
    else if(G.st === S.PLAYING){
      if(G.phase === PHASE.RAZ || G.phase === PHASE.FIL) finishPhase();
      else if(G.phase === PHASE.PEC) takeOut();
      else if(G.phase === PHASE.OCJ && G.phT > 0.8) nextPita();
    }
    e.preventDefault();
  }
  else if(e.key === 'f' || e.key === 'F' || e.key === 'b' || e.key === 'B'){ useFlour(); }
  else if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ if(G.st === S.PLAYING || G.st === S.PAUSED) togglePause(); }
  else if(e.key === 'm' || e.key === 'M'){ handle('snd'); }
}

/* fil se sipa dok se drži kašika — vremenski, ne po događaju */
function filStep(dt){
  var F = G.fil;
  if(!F.down || F.bowl <= 0) return;
  var amt = Math.min(F.bowl, 0.26*dt);
  F.bowl -= amt;
  var gx = Math.floor((F.u + 330)/660*12), gy = Math.floor((F.v + 330)/660*12);
  if(gx >= 0 && gx < 12 && gy >= 0 && gy < 12) F.grid[gy*12+gx] += amt*100;
  var c = cellAt(F.u, F.v);
  if(c && c.hole){ F.lost += amt; if(!F.holeSaid){ F.holeSaid = true; nanaEvent('FILH', 2, 2.4); } }
  F.spoonT = (F.spoonT||0) + dt;
  if(F.spoonT > 0.018){
    F.spoonT = 0;
    if(F.pts.length < 1400){
      F.pts.push({u:F.u + rnd(-34,34), v:F.v + rnd(-34,34), r:rnd(8,14), k:Math.random() < 0.4, a:rnd(0,3.14)});
      F.pts.push({u:F.u + rnd(-30,30), v:F.v + rnd(-30,30), r:rnd(6,11), k:Math.random() < 0.4, a:rnd(0,3.14)});
    }
    if(Math.random() < 0.3) AU.spoon();
  }
}

/* ==========================================================================
   PLATNO, PETLJA, POKRETANJE
   ========================================================================== */
var RQ = 1;
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  var maxDpr = (Math.min(w, h) >= 700) ? 2 : 3;
  DPR = Math.min(window.devicePixelRatio||1, maxDpr) * RQ;
  cv.width = Math.floor(w*DPR); cv.height = Math.floor(h*DPR);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  SC = Math.min(w/W, h/HH);
  OX = (w - W*SC)/2; OY = (h - HH*SC)/2;
  VW = w; VH = h;
  _vigG = null; _scanP = null; DOUGH_P = null;
  DL = null;   /* sloj jufke ide u rezoluciju ekrana */
}
var lastT = 0, HIDDEN = false, FPS_T=0, FPS_N=0, FPS_SUM=0, LAST_RQ_CHANGE=0;
function frame(ts){
  if(HIDDEN){ lastT = ts; window.requestAnimationFrame(frame); return; }
  var dt = Math.min(0.05, (ts-lastT)/1000 || 0.016);
  lastT = ts;
  update(dt);
  if(G.st === S.PLAYING && G.phase === PHASE.FIL) filStep(dt);
  render();
  FPS_T += dt; FPS_N++; FPS_SUM += 1/Math.max(0.001,dt);
  if(FPS_T > 2.4){
    var fps=FPS_SUM/FPS_N; FPS_T=0; FPS_N=0; FPS_SUM=0;
    if(ts-LAST_RQ_CHANGE>5000){
      var nr=RQ;
      if(fps<49 && RQ>0.62) nr=Math.max(0.60,RQ-0.12);
      else if(fps>58 && RQ<1) nr=Math.min(1,RQ+0.08);
      if(Math.abs(nr-RQ)>0.01){RQ=nr;LAST_RQ_CHANGE=ts;resize();}
    }
  }
  window.requestAnimationFrame(frame);
}
function boot(){
  cv = document.getElementById('c');
  ctx = cv.getContext('2d');
  load();
  AU.on = META.snd !== 0;
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
  document.addEventListener('visibilitychange', function(){
    HIDDEN = !!document.hidden;
    if(HIDDEN){
      if(G.st === S.PLAYING) togglePause();
      if(AU.ctx){ try{ AU.ctx.suspend(); }catch(e){} }
    } else if(AU.ctx){ try{ AU.ctx.resume(); }catch(e){} }
  });
  if('serviceWorker' in navigator &&
     (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
  if(window.PointerEvent){
    cv.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} onDown(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointermove', function(e){ e.preventDefault(); onMove(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointerup', function(e){ e.preventDefault(); onUp(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointercancel', function(e){ onUp(e.clientX, e.clientY); });
  }else{
    cv.addEventListener('touchstart', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onDown(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('touchmove', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onMove(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('touchend', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onUp(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('mousedown', function(e){ onDown(e.clientX,e.clientY); });
    cv.addEventListener('mousemove', function(e){ onMove(e.clientX,e.clientY); });
    cv.addEventListener('mouseup', function(e){ onUp(e.clientX,e.clientY); });
  }
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('keydown', onKey);
  bgSprite(); tableSprite(); doughLayer();
  doughDemo();
  G.st = S.INTRO; G.t = 0;
  window.requestAnimationFrame(frame);
}

function drawJufkaIcon(g, cx, cy, R){

  g.save();
  g.translate(cx, cy);
  g.fillStyle = '#6e4b2e'; g.beginPath(); g.arc(0, 0, R*1.06, 0, 6.284); g.fill();
  g.save(); g.beginPath(); g.arc(0, 0, R, 0, 6.284); g.clip();
  g.drawImage(T.c, -R*1.05, -R*1.05, R*2.1, R*2.1); g.restore();
  g.fillStyle = 'rgba(243,232,208,0.62)';
  g.beginPath();
  for(var i=0;i<=40;i++){ var a = i/40*6.283, rad = R*0.96*(1 + 0.05*Math.sin(a*3) + 0.03*Math.sin(a*7+1)); var x = Math.cos(a)*rad, y = Math.sin(a)*rad; if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(150,120,80,0.8)'; g.lineWidth = R*0.02; g.stroke();
  g.fillStyle = 'rgba(243,232,208,0.9)'; g.beginPath(); g.arc(-R*0.05, -R*0.05, R*0.35, 0, 6.284); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.ellipse(-R*0.25, -R*0.3, R*0.2, R*0.1, -0.6, 0, 6.284); g.fill();
  g.restore();
}
function renderIcon(size){
