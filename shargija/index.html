<style>
  :root{
    color-scheme:dark;
    --night:#0a0908; --wine:#6b1119; --ember:#d43a2a;
    --cream:#f4ead6; --amber:#f0a83c; --brass:#c9a24a; --teal:#2e7d8a;
    --cond:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow",Impact,sans-serif;
    --epic:"Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--night);color:var(--cream);font-family:var(--cond);
    overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    position:fixed;width:100%;
  }
  #app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
       max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;
       padding:max(4px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
               max(3px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
         flex:0 0 auto;height:22px}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.18em;margin:0;opacity:.75;
            transform:scaleX(.86);transform-origin:left}
  .readout{display:flex;align-items:center;gap:8px}
  .readout .lab{font-size:7.5px;letter-spacing:.24em;color:rgba(244,234,214,.38)}
  #mult{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--amber);
        opacity:0;transition:opacity .2s}
  .readout b{font-size:16px;font-weight:700;letter-spacing:-.01em;
             transform:scaleX(.88);display:inline-block;font-variant-numeric:tabular-nums}
  .ghost{background:none;border:1px solid rgba(244,234,214,.2);color:rgba(244,234,214,.55);
    font-family:var(--cond);font-size:8.5px;font-weight:700;letter-spacing:.2em;
    padding:5px 11px;cursor:pointer;border-radius:1px}
  .ghost:hover{border-color:var(--ember);color:var(--ember)}
  .ghost:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* Deutlicher Ausstieg während der Demo: der kleine Kopfzeilen-Knopf ist
     am Handy leicht zu übersehen, darum liegt hier ein zweiter, gut
     tippbarer direkt auf der Bühne.                                      */
  #stopBtn{position:absolute;right:10px;top:10px;z-index:6;display:none;
    background:rgba(10,9,8,.55);border:1px solid rgba(240,168,60,.7);color:var(--amber);
    font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.24em;
    padding:9px 16px;border-radius:1px;cursor:pointer;pointer-events:auto}
  #stopBtn:hover{background:rgba(240,168,60,.15)}
  #stopBtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  #staffWrap{flex:0 0 auto;margin-top:1px;position:relative;
             height:clamp(58px,17.5%,104px);background:#0d0b09}
  /* Läuft Text mit, braucht die Bahn eine Zeile mehr. Ohne diesen Zuschlag
     rücken die Bundreihen auf dem Handy so eng zusammen, dass man die
     Tonhöhe nicht mehr ablesen kann.                                     */
  body.lyr #staffWrap{height:clamp(72px,21.5%,118px)}
  #staff{display:block;width:100%;height:100%}
  #judge{position:absolute;right:0;top:-1px;font-size:15px;font-weight:700;letter-spacing:.1em;
    transform:scaleX(.85);transform-origin:right;opacity:0;transition:opacity .26s;pointer-events:none}

  /* ── Bühne ── */
  #stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;
         background:#07060a;isolation:isolate}
  #stage>div{position:absolute;pointer-events:none}
  #stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scene{pointer-events:none}
  #inst{pointer-events:auto;touch-action:none;transition:opacity .5s ease}
  body.gate #inst{opacity:0}
  #money{pointer-events:none}
  #warm{inset:-20% -25%;
    background:
      radial-gradient(46% 52% at 52% 44%, rgba(240,168,60,.30), rgba(150,70,20,.10) 48%, transparent 74%),
      radial-gradient(70% 46% at 50% 104%, rgba(107,17,25,.34), transparent 72%);
    opacity:.5}
  .beam{top:-24%;height:160%;width:44%;margin-left:-22%;transform-origin:50% 0;
        opacity:0;mix-blend-mode:screen;
        clip-path:polygon(46% 0, 54% 0, 120% 100%, -20% 100%)}
  .beam.w{background:linear-gradient(180deg,rgba(255,232,190,.20),rgba(255,214,150,.05) 42%,transparent 74%)}
  .beam.r{background:linear-gradient(180deg,rgba(212,58,42,.22),rgba(160,30,26,.05) 46%,transparent 76%)}
  #beamA{left:26%} #beamB{left:74%} #beamC{left:50%}
  #haze1,#haze2{inset:-25%;
    background:radial-gradient(36% 26% at 32% 60%, #d8c9a8, transparent 70%),
               radial-gradient(28% 20% at 70% 42%, #d8c9a8, transparent 70%)}
  #haze1{animation:drift1 53s linear infinite;opacity:.1}
  #haze2{animation:drift2 79s linear infinite;opacity:.07}
  @keyframes drift1{0%{transform:translate(-4%,2%) scale(1)}50%{transform:translate(6%,-3%) scale(1.1)}100%{transform:translate(-4%,2%) scale(1)}}
  @keyframes drift2{0%{transform:translate(5%,-2%)}50%{transform:translate(-6%,3%)}100%{transform:translate(5%,-2%)}}
  #flare{inset:0;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(100deg,transparent 38%,rgba(255,240,214,.5) 49%,rgba(240,168,60,.35) 52%,transparent 62%)}
  #blackout{inset:0;background:#000;opacity:0}
  #burst{inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(46px,13vw,140px);font-weight:700;letter-spacing:-.03em;
    transform:scaleX(.8);color:rgba(244,234,214,.12);opacity:0;white-space:nowrap}

  #stage #intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:auto;z-index:5}
  #stage #intro.done{display:none;pointer-events:none}
  .ititle{font-size:clamp(44px,14vw,132px);font-weight:700;line-height:.86;
    color:#f4ead6;opacity:0;transform:scaleX(.82);
    text-shadow:0 0 34px rgba(212,58,42,.55),0 0 90px rgba(240,168,60,.32)}
  .isub{overflow:hidden;margin-top:8px;height:0}
  .isub span{display:block;font-size:clamp(11px,2.6vw,18px);font-weight:700;
    letter-spacing:.44em;color:var(--amber);white-space:nowrap;transform:translateY(100%)}
  .itag{margin-top:14px;font-family:var(--epic);font-style:italic;
    font-size:clamp(11px,2.2vw,17px);letter-spacing:.2em;
    color:rgba(240,168,60,.88);opacity:0;transform:translateY(8px);
    text-shadow:0 0 22px rgba(212,58,42,.4)}
  .icopy{margin-top:12px;font-size:9.5px;font-weight:700;letter-spacing:.42em;
    color:rgba(201,162,74,.75);opacity:0}
  .iskip{position:absolute;bottom:12px;font-size:9px;letter-spacing:.3em;
    color:rgba(244,234,214,.3);opacity:0}
  #sig{position:fixed;z-index:40;pointer-events:none;
    right:calc(11px + env(safe-area-inset-right));
    bottom:calc(5px + env(safe-area-inset-bottom));
    font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:.26em;
    color:rgba(244,234,214,.3);transition:opacity .6s}
  body.intro #sig{opacity:0}
  /* Startschirm und Intro laufen randlos: Kopfzeile, Notenbahn und Fuß
     werden nicht nur unsichtbar, sondern auf null zusammengeklappt, damit
     die Bühne den ganzen Bildschirm bekommt.                             */
  body.intro header,body.intro #staffWrap,body.intro footer,
  body.gate  header,body.gate  #staffWrap,body.gate  footer{
    opacity:0;flex:0 0 0;height:0;min-height:0;
    margin:0;padding:0;border:0;overflow:hidden}
  body.intro #app,body.gate #app{padding:0}
  body.intro #stage,body.gate #stage{border-radius:0}

  footer{flex:0 0 auto;text-align:center;font-size:7.5px;letter-spacing:.22em;
    color:rgba(244,234,214,.22);padding-top:1px;height:12px;line-height:11px}
  footer.solo{color:var(--amber);letter-spacing:.4em}

  /* ── Menü: feste Bildschirme, niemals Scrollen ── */
  /* Dieselbe Nacht wie auf der Bühne: kalter Himmel oben, warmes Licht
     von unten, der rote Schein der Scheinwerfer dazwischen.              */
  #veil{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:20;
    overflow:hidden;
    background:
      radial-gradient(64% 46% at 50% 96%, rgba(240,168,60,.22), transparent 72%),
      radial-gradient(86% 58% at 50% 112%, rgba(107,17,25,.46), transparent 74%),
      radial-gradient(52% 40% at 50% 6%, rgba(212,58,42,.16), transparent 70%),
      linear-gradient(180deg,#0b1420 0%, #141018 44%, #241310 86%, #150b07 100%);
    padding:max(10px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
            max(10px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  /* Die Lichterkette hängt auch über dem Menü — zwei Reihen, versetzt.   */
  #veil::before{content:"";position:absolute;left:-4%;right:-4%;top:0;height:46px;
    pointer-events:none;opacity:.55;
    background:
      radial-gradient(circle at 11px 15px, rgba(255,212,137,.95) 0 2.1px, transparent 3.4px),
      linear-gradient(rgba(36,26,18,.9),rgba(36,26,18,.9)) 0 14px/100% 1px no-repeat,
      radial-gradient(circle at 34px 33px, rgba(255,212,137,.55) 0 1.7px, transparent 2.8px),
      linear-gradient(rgba(36,26,18,.7),rgba(36,26,18,.7)) 0 32px/100% 1px no-repeat;
    background-size:44px 46px, 100% 1px, 44px 46px, 100% 1px;
    background-repeat:repeat-x, no-repeat, repeat-x, no-repeat}
  body.thrift #veil::before{opacity:.35}
  #veil.hidden{display:none}
  /* Es wird nirgends gescrollt: passt ein Bildschirm nicht in die Höhe,
     skaliert fitVeil() den ganzen Inhalt herunter — die App bleibt ein
     Spiel, keine Website.                                                */
  .inner{max-width:1120px;height:100%;margin:0 auto;display:flex;flex-direction:column;
         justify-content:center;overflow:visible;transform-origin:50% 50%}
  /* Auf sehr flachen Displays zuerst kompakter, erst dann skalieren.     */
  @media (max-height:400px){
    .nav{gap:5px} .nav button{padding:8px 12px;font-size:11px}
    .cards{gap:6px} .card{padding:8px 8px 6px}
    .steps li{margin-bottom:4px} .big{padding:8px;margin-top:6px}
    .mm .brand .status{margin-top:8px}
  }
  h1{font-size:clamp(34px,8.4vw,86px);font-weight:700;letter-spacing:-.035em;line-height:.84;
     margin:0 0 4px;transform:scaleX(.82);transform-origin:left;color:var(--cream);
     text-shadow:0 0 30px rgba(212,58,42,.45),0 0 82px rgba(240,168,60,.22)}
  .sub{font-size:clamp(11px,2.4vw,17px);font-weight:700;letter-spacing:.3em;
       color:var(--amber);margin:0}
  .tagline{font-family:var(--epic);font-style:italic;font-size:clamp(10px,1.8vw,14px);
    letter-spacing:.16em;color:rgba(201,162,74,.72);margin:6px 0 0}
  .rule{height:1px;background:linear-gradient(90deg,rgba(212,58,42,.6),rgba(244,234,214,.1),transparent);margin:10px 0}
  .eyebrow{font-size:9px;letter-spacing:.32em;color:rgba(244,234,214,.38);margin:0 0 6px}

  /* Kopfzeile eines Unterbildschirms */
  .shead{display:flex;align-items:baseline;gap:14px;flex:0 0 auto;margin-bottom:8px}
  .shead h2{margin:0;font-size:clamp(20px,4.4vw,34px);font-weight:700;letter-spacing:-.02em;
    transform:scaleX(.84);transform-origin:left;color:var(--cream)}
  .shead .note{font-size:9px;letter-spacing:.26em;color:rgba(244,234,214,.34)}
  .back{margin-left:auto;background:none;border:1px solid rgba(244,234,214,.22);
    color:rgba(244,234,214,.6);font-family:var(--cond);font-size:9px;font-weight:700;
    letter-spacing:.24em;padding:6px 12px;cursor:pointer;border-radius:1px;flex:0 0 auto}
  .back:hover{border-color:var(--ember);color:var(--ember)}
  .back:focus-visible,.nav button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* Hauptmenü */
  .mm{display:flex;gap:clamp(18px,5vw,54px);align-items:center;flex:1 1 auto;min-height:0}
  .mm .brand{flex:1 1 44%;min-width:0}
  .mm .brand .status{margin-top:14px;font-size:9.5px;letter-spacing:.24em;
    color:rgba(244,234,214,.36);line-height:2}
  .mm .brand .status b{color:var(--amber);font-weight:700}
  .nav{flex:1 1 56%;display:flex;flex-direction:column;gap:7px;min-width:0}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;
    background:linear-gradient(90deg,rgba(212,58,42,.16),rgba(240,168,60,.06));
    border:1px solid rgba(212,58,42,.55);
    color:var(--cream);font-family:var(--cond);font-size:12px;font-weight:700;
    letter-spacing:.3em;padding:11px 14px;cursor:pointer;border-radius:1px;text-align:left}
  .nav button:hover{background:rgba(212,58,42,.22)}
  .nav button.quiet{background:rgba(240,168,60,.05);border-color:rgba(201,162,74,.3);
    color:rgba(244,234,214,.7)}
  .nav button.quiet:hover{border-color:var(--amber);color:var(--amber)}
  .nav button i{font-style:normal;font-size:9px;letter-spacing:.18em;
    color:rgba(244,234,214,.34);margin-left:auto;text-align:right}

  /* Songkarten */
  .cards{flex:1 1 auto;min-height:0;display:grid;gap:9px;
    grid-template-columns:repeat(2,1fr);align-content:center}
  @media (min-width:620px){ .cards{grid-template-columns:repeat(4,1fr)} }
  .card{display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;
    border:1px solid rgba(201,162,74,.22);min-width:0;
    background:linear-gradient(180deg,rgba(240,168,60,.07),rgba(107,17,25,.07))}
  .card .ct{font-family:var(--epic);font-size:14px;line-height:1.18;color:var(--cream)}
  .card .cg{font-size:8.5px;letter-spacing:.2em;color:rgba(244,234,214,.34);line-height:1.7}
  /* Die gesungene Zeile — in Kursiv, damit sie als Text lesbar bleibt
     und nicht wie eine weitere Beschriftung wirkt.                    */
  .card .clyr{font-family:var(--epic);font-style:italic;font-size:11px;
    letter-spacing:.01em;color:rgba(240,168,60,.55);margin:5px 0 2px;
    line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .cg em{font-style:normal;color:var(--amber)}
  .card .crow{display:flex;gap:6px;margin-top:auto}
  .card .crow button{flex:1;background:rgba(212,58,42,.14);border:1px solid rgba(212,58,42,.6);
    color:var(--cream);font-family:var(--cond);font-size:9.5px;font-weight:700;
    letter-spacing:.2em;padding:8px 2px;cursor:pointer;border-radius:1px}
  .card .crow button.d{flex:0 0 40px;background:none;border-color:rgba(240,168,60,.45);
    color:var(--amber);letter-spacing:0}
  .card .crow button:hover{background:rgba(212,58,42,.28)}
  .card .crow button.d:hover{background:rgba(240,168,60,.16)}
  .kits{display:flex;gap:3px}
  .kits button{flex:1;background:none;border:1px solid rgba(244,234,214,.14);
    color:rgba(244,234,214,.45);font-family:var(--cond);font-size:8.5px;font-weight:700;
    letter-spacing:.06em;padding:4px 0;cursor:pointer;border-radius:1px}
  .kits button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}

  /* Anleitung und Einstellungen */
  .cols{display:flex;gap:26px;align-items:flex-start;flex:1 1 auto;min-height:0}
  .cols>div{flex:1;min-width:0}
  .diag{display:block;width:100%;max-width:390px;margin:0 auto;height:auto}
  .diag .dl{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;
    fill:rgba(244,234,214,.85)}
  .diag .ds{font-family:var(--cond);font-size:9.5px;letter-spacing:.14em;
    fill:rgba(244,234,214,.4)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:st}
  .steps li{position:relative;padding-left:22px;margin-bottom:6px;font-size:11.5px;
    line-height:1.5;color:rgba(244,234,214,.62)}
  .steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;
    width:15px;height:15px;border:1px solid rgba(212,58,42,.7);border-radius:50%;
    font-size:8.5px;font-weight:700;color:var(--ember);
    display:flex;align-items:center;justify-content:center}
  .steps b{color:var(--cream);font-weight:700;letter-spacing:.06em}
  .howto{margin:0 0 4px;font-size:11.5px;line-height:1.55;color:rgba(244,234,214,.62)}
  .howto b{color:var(--cream);font-weight:700;letter-spacing:.1em}
  .row{display:flex;gap:6px;margin-bottom:10px}
  .chip{flex:1;background:none;border:1px solid rgba(244,234,214,.14);color:rgba(244,234,214,.45);
    padding:7px 3px;cursor:pointer;font-family:var(--cond);font-size:8px;letter-spacing:.14em;border-radius:1px}
  .chip .cn{display:block;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    color:rgba(244,234,214,.85);margin-bottom:2px;transform:scaleX(.92)}
  .chip[aria-pressed="true"]{border-color:var(--ember);background:rgba(212,58,42,.1);color:var(--ember)}
  .chip[aria-pressed="true"] .cn{color:var(--cream)}
  .chip[disabled]{opacity:.26;cursor:default}
  /* Einstellungen: groß genug, um sie am Telefon ohne Lupe zu lesen.     */
  .setup .eyebrow{font-size:12px;letter-spacing:.22em;color:rgba(244,234,214,.72);margin:0 0 7px}
  .setup .row{gap:8px;margin-bottom:14px}
  .setup .chip{padding:10px 6px 9px;font-size:11px;letter-spacing:.06em;line-height:1.35;
    color:rgba(244,234,214,.78)}
  .setup .chip .cn{font-size:17px;margin-bottom:4px;transform:none;color:#F7EDD5}
  .setup .chip[disabled]{opacity:.5}
  .setup .howto{font-size:12.5px;color:rgba(244,234,214,.66)!important}
  .setup .big{font-size:12.5px;padding:12px}
  .setup{flex:0 0 auto!important;min-height:auto!important}
  @media (max-height:420px){
    .setup .chip{padding:7px 5px 6px;font-size:10.5px} .setup .chip .cn{font-size:15px;margin-bottom:2px}
    .setup .row{margin-bottom:10px} .setup .eyebrow{margin-bottom:5px}
    .setup .howto{font-size:11px;margin-bottom:4px!important} .setup .big{padding:8px;font-size:11px;margin-top:6px}
  }
  .big{display:block;width:100%;margin-top:8px;padding:10px;background:rgba(212,58,42,.12);
    border:1px solid var(--ember);color:var(--cream);font-family:var(--cond);
    font-size:10.5px;font-weight:700;letter-spacing:.3em;cursor:pointer;border-radius:1px}
  .big:hover{background:rgba(212,58,42,.24)}
  .big.q{background:none;border-color:rgba(244,234,214,.3);color:rgba(244,234,214,.66)}

  /* Ergebnis */
  .meter{display:flex;align-items:center;gap:10px;margin:6px 0}
  .meter span{font-size:8.5px;letter-spacing:.26em;color:rgba(244,234,214,.42);width:72px}
  .meter i{flex:1;height:3px;background:rgba(244,234,214,.09)}
  .meter i b{display:block;height:3px;background:linear-gradient(90deg,var(--ember),var(--amber))}
  .meter em{font-style:normal;font-size:15px;font-weight:700;width:42px;text-align:right;
    transform:scaleX(.86);display:inline-block;font-variant-numeric:tabular-nums}

  .tally b{color:var(--cream);font-weight:700;font-size:17px}
  .tally .hot{color:var(--amber)}

  /* Lichterkette: das Flackern läuft in CSS, nicht pro Frame in JS */
  .bulb{animation:twink 3.4s ease-in-out infinite}
  @keyframes twink{0%,100%{opacity:1}50%{opacity:.62}}

  /* Startschirm: Browser geben Ton erst nach einer Berührung frei. Statt
     das Intro stumm anlaufen zu lassen, wartet es hier auf den Spieler.  */
  /* Kein eigenes Bild: das Dorf liegt schon da, nur angehalten und
     abgedunkelt, damit die Schrift darauf steht.                         */
  #gate{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:50;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:
      radial-gradient(44% 40% at 50% 50%, rgba(7,6,10,.82), rgba(7,6,10,.5) 62%, rgba(7,6,10,.42)),
      linear-gradient(180deg, rgba(7,6,10,.72) 0%, rgba(7,6,10,.34) 26%,
                              rgba(7,6,10,.34) 74%, rgba(7,6,10,.78) 100%);
    animation:gatein .8s ease both}
  @keyframes gatein{from{opacity:0}to{opacity:1}}
  #gate.done{display:none}
  .gwrap{display:flex;flex-direction:column;align-items:center;gap:26px;
         padding:0 24px;text-align:center}
  .gtitle{font-size:clamp(24px,6.4vw,62px);font-weight:700;letter-spacing:.24em;
    line-height:1.05;color:var(--cream);transform:scaleX(.9);
    text-shadow:0 0 34px rgba(212,58,42,.5),0 0 90px rgba(240,168,60,.26);
    animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
  .gring{position:relative;width:44px;height:44px}
  .gring i{position:absolute;inset:0;border:1.5px solid rgba(240,168,60,.85);
    border-radius:50%;animation:ping 2.6s ease-out infinite}
  .gring i:nth-child(2){animation-delay:1.3s}
  .gnote{font-size:clamp(9px,1.7vw,12px);letter-spacing:.16em;
    color:rgba(244,234,214,.42);max-width:26em;line-height:1.6}
  @keyframes ping{0%{transform:scale(.42);opacity:0}
    18%{opacity:.9}100%{transform:scale(1);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .gtitle{animation:none;opacity:1} .gring i{animation:none;opacity:.5}}
  body.gate #sig{opacity:0}

  #rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:#07060a;text-align:center;gap:16px}
  #rotate.on{display:flex}
  #rotate p{font-size:11px;letter-spacing:.34em;color:rgba(244,234,214,.6);margin:0}
  #rotate .ph{width:54px;height:88px;border:2px solid var(--amber);border-radius:8px;
    animation:turn 2.4s ease-in-out infinite}
  @keyframes turn{0%,30%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#haze1,#haze2,#rotate .ph,.bulb{animation:none}}
  body.thrift .bulb{animation:none}
  /* Sparsam: Nebel weg — zwei große, weiche Radialflächen weniger. */
  body.thrift #haze1,body.thrift #haze2{display:none}

<script>
(function(){
"use strict";

/* ═══════════ Daten ═══════════
   Die Šargija ist gebundet: der Griff rastet auf Bünde ein, es wird nicht
   geglitten. Die Bundfolge ist ein Hidžaz-nahes Tongeschlecht, wie es in
   der izvorna-Musik und im Sevdah klingt.                                   */
/* Der Tonvorrat gehört zum Lied, nicht zum Spiel.

   Das war der Fehler in der ersten Fassung: das Griffbrett stand fest auf
   Hidžaz (1 ♭2 3 4 5 ♭6 7 8), und jeder Ton, der da nicht hineinpasste,
   wurde auf den nächsten Bund gebogen. "Kad ja pođoh na Bembašu" steht
   aber in a-Moll — große Sekunde, kleine Terz, natürliche Sexte. Keiner
   dieser drei Töne existiert im Hidžaz-Raster. Das Lied konnte gar nicht
   erkennbar klingen, egal wie gut die Melodieführung war.

   Darum bringt jetzt jedes Lied seinen eigenen Bundsatz mit: die Zahlen
   sind Cent über der leeren Saite, und es sind genau so viele Bünde, wie
   das Stück braucht — sieben bis neun. Ein Šargijaš greift für ein anderes
   Makam ebenfalls anders; das Instrument gibt den Tonvorrat nicht vor.

   tonic sagt, welcher Bund der Grundton ist: darauf werden die Bordune
   gestimmt. Bei manchen Liedern liegt der Grundton auf Bund 1, weil die
   Melodie unter ihn greift — "…na Bembašu" endet einen Ton tiefer.       */
const SCALES = {
  // 1 ♭2 3 4 5 ♭6 7 8 — das alte feste Raster, für die Tanzfiguren
  hidzaz:  [0,100,400,500,700,800,1100,1200],
  // Grundton auf Bund 1: darunter die Subtonika, darüber Hidžaz bis ♭7
  hidzaz7: [0,200,300,600,700,900,1000,1200],
  // dasselbe ohne den Spitzenton
  hidzaz6: [0,200,300,600,700,900,1000],
  // Grundton auf Bund 0, phrygisch-dominant bis ♭7
  frigDom: [0,100,400,500,700,800,1000],
  // reines Moll mit Subtonika unten und Oktave oben — neun Bünde
  moll9:   [0,200,400,500,700,900,1000,1200,1400]
};
const ROMANS=["0","I","II","III","IV","V","VI","VII","VIII","IX","X"];
let CENTS = SCALES.hidzaz;
let ROMAN = ROMANS.slice(0,CENTS.length);

const INSTRUMENTS = [
  /* damp = Nachklang · bright = Anriss · comb/combAmt = Anschlagstelle,
     je näher am Steg desto nasaler · drone = Anteil der Bordunsaiten      */
  /* punch = Bühnenimpuls des Anschlags · room = Anteil der Saalfahne.
     Die drei spielen sich verschieden: die Šargija spricht schnell an und
     klingt kurz, die Krajišnica schiebt mit Bass und Impuls, der Saz
     trägt lange und warm nach.                                            */
  /* t60mel/t60dr = Ausklang in Sekunden, fcMel/fcDr = wie lange die Saite
     hell bleibt, couple = wieviel der Steg an die Nachbarsaiten weitergibt.
     Die Šargija ist kurz, hell und drahtig; die Krajišnica schiebt mehr
     Holz darunter; der Saz trägt am längsten und am wärmsten.

     fcMel/fcDr sind gemessen, nicht geraten: bei 8200 Hz steht der zehnte
     Teilton einer Stahlsaite noch etwa 0,7 s — so lange, wie er an einem
     echten Instrument steht. Bei den 3450 Hz, die hier vorher standen,
     war er nach 0,2 s weg, und der Ton klang wie hinter einer Decke.     */
  { id:"sar", name:"Šargija",     base:146.83,
    wood:"url(#wJav)", top:"url(#topJav)", damp:.9940, bright:.72,
    comb:.17, combAmt:.78, drone:.15, punch:1, room:1,
    t60mel:3.1, t60dr:5.2, fcMel:8200, fcDr:5600, couple:.0034, seed:7, out:.9,
    strings:4, drones:[1,1.4983], body:[275,960,2650], pegs:4, need:0 },
  { id:"kra", name:"Krajišnica",  base:130.81,
    wood:"url(#wDud)", top:"url(#topDud)", damp:.9970, bright:.42,
    comb:.13, combAmt:.64, drone:.24, punch:1.35, room:1.05,
    t60mel:3.6, t60dr:5.8, fcMel:6100, fcDr:4200, couple:.0040, seed:23, out:.78,
    strings:4, drones:[1,1.4983], body:[205,745,2050], pegs:4, need:9000 },
  { id:"saz", name:"Bosanski saz",base:110.00,
    wood:"url(#wOra)", top:"url(#topOra)", damp:.9986, bright:.23,
    comb:.10, combAmt:.52, drone:.27, punch:.8, room:1.5,
    t60mel:4.6, t60dr:7.2, fcMel:4500, fcDr:3200, couple:.0046, seed:41, out:.66,
    strings:6, drones:[1,1.4983,2], body:[158,600,1740], pegs:6, need:26000 }
];

/* cleanMs/nearMs: Zeitfenster um den Schlag · slack: geduldeter Bundfehler
   nearKeep: was nach einem BLIZU von der Serie übrig bleibt
   lead: Vorlauf der Noten, 1.25 heißt ein Viertel mehr Bedenkzeit
   show 2 = Zielband und Richtungspfeil · 1 = nur Bundnummer · 0 = nichts   */
const LEVELS = [
  /* BLIZU kostet nicht mehr die halbe Serie: ein knapper Treffer nach 18
     sauberen soll den Lauf dämpfen, nicht zusammenbrechen lassen.        */
  { name:"POČETNIK", cleanMs:135, nearMs:240, slack:1, show:2,
    soloAt:8,  nearKeep:1,   lead:1.28 },
  { name:"ŠARGIJAŠ", cleanMs:90,  nearMs:170, slack:1, show:1,
    soloAt:14, nearKeep:.75, lead:1 },
  { name:"MAJSTOR",  cleanMs:60,  nearMs:115, slack:0, show:0,
    soloAt:20, nearKeep:.5,  lead:.92 }
];

/* Notation je Schlag:  n = Bund anschlagen · . = Pause
   - = klingen lassen · n* = Prebir über zwei Schläge · n** über drei
   a+b = zwei Töne in einem Schlag (a+b+c drei) · n! = betont
   g>n = Vorschlag: die linke Hand setzt kurz auf g und zieht auf n.

   s: die gesungenen Silben, eine je Ton. ~ steht für einen Ton, der noch
   zur Silbe davor gehört: das Melisma. Silben eines Wortes werden mit -
   verbunden, Wörter mit Leerzeichen.

   scale/tonic: der Tonvorrat des Stücks (siehe SCALES weiter oben) und
   der Bund, auf dem der Grundton liegt — darauf stehen die Bordune.

   ── Woher die Melodien kommen ──
   Die erste Fassung dieses Spiels hatte frei gesetzte Melodieführungen auf
   einem festen Hidžaz-Griffbrett. Man erkannte die Lieder nicht, und das
   lag am Griffbrett: was nicht ins Raster passte, wurde verbogen.

   Jetzt stehen hier Übertragungen echter Abschriften, Ton für Ton, und
   jedes Stück bringt sein eigenes Bundraster mit:

   · MOJ DILBERE, ZAPJEVALA SOJKA PTICA und ČUDNA JADA OD MOSTARA GRADA
     nach den abc-Übertragungen von Jack Campin (campin.me.uk, Nine-Note
     Tunebook), Quelle dort: Muhamed Zero, "Sevdah Bošnjaka", Sarajevo
     1995. Alle drei stehen phrygisch-dominant (Hidžaz).
   · KAD JA POĐOH NA BEMBAŠU nach der abc-Fassung im Archiv von John
     Chambers (trillian.mit.edu), mit der dort notierten Silbenverteilung.
     Das Lied steht in reinem Moll — große Sekunde, kleine Terz, natürliche
     Sexte. Auf dem alten Hidžaz-Raster war kein einziger dieser Töne
     greifbar. Es braucht neun Bünde, weil die Melodie einen Ton unter den
     Grundton greift und oben bis zur Oktave steigt.
   · KRAJIŠKO KOLO und BRZO KOLO haben keine feste Melodie; die Läufe sind
     die Figur. Sie bleiben auf dem alten Hidžaz-Raster.

   Was Rhythmus und Tempo angeht, sind die Notenwerte der Abschriften
   übernommen; die Tempi sind fürs Spielen etwas beruhigt.               */

/* Betonung im Takt. Das Kolo steht im aksak 7/8 und zählt 3+2+2 — die
   Eins jeder Gruppe trägt, alles andere geht mit. Dieses schwere Zählen
   macht den Gang des Tanzes aus; ohne Betonung klingt es wie eine
   Fingerübung.                                                           */
const BEAT_ACC = {
  2:[1,0],
  4:[1,0,.55,0],
  6:[1,0,0,.55,0,0],
  7:[1,0,0,1,0,1,0]
};

const SONGS = [
  /* Bünde: 0=G 1=A 2=H 3=c 4=d 5=e 6=f 7=g 8=a — a-Moll, Grundton auf 1.
     Ein Viertel je Feld, 6/4 wie in der Abschrift (dort 3/2).           */
  { id:"bem", title:"Kad ja pođoh na Bembašu", gloss:"SARAJEVO",
    beat:640, meter:6, rounds:3, scale:"moll9", tonic:1,
    verses:[
    { p:"3! 2 1 - 2 - 3 2 1 - 0 -",
      s:"Kad ja po-đoh na Bem-ba-šu" },
    { p:"4! -+5 6 - 8 - 7 6 5 - . .",
      s:"na Bem-ba-šu na vo-du" },
    { p:"4! -+5 6+7 6+5 4 - 3 -+4 5+6 5+4 3+2 1",
      s:"ja po-ve-~-~-~-doh bje-lo ja-~-~-~-nje-~-~" },
    { p:"2! -+3 4 - 5 - 3 2 1 - . .",
      s:"bje-lo ja-nje sa so-bom" }]},

  /* Bünde: 0=D 1=E 2=F 3=gis 4=A 5=H 6=c 7=d — Hidžaz auf E,
     Grundton auf 1. Die Melodie greift im letzten Takt unter ihn.       */
  { id:"dil", title:"Moj dilbere", gloss:"SEVDAH",
    beat:660, meter:4, rounds:3, scale:"hidzaz7", tonic:1,
    line:"Moj dilbere, kud se šećeš",
    verses:[
    { p:"3! 4 5 6+5+4 5 - - -" },
    { p:"6! -+5 6 7 5 -+6 5 4" },
    { p:"3! -+5 4+3 2 1 - - -" },
    { p:"5! -+6 7 6 5 -+6 5 4+3" },
    { p:"2! - - 1 0 -+1 2+1 3+2 1 - - -" }]},

  /* Bünde: 0=D 1=E 2=F 3=gis 4=A 5=H 6=c — Hidžaz auf E, Grundton auf 1.
     7/8, ein Achtel je Feld.                                            */
  { id:"soj", title:"Zapjevala sojka ptica", gloss:"SEVDAH · 7/8",
    beat:280, meter:7, rounds:3, scale:"hidzaz6", tonic:1,
    line:"Zapjevala sojka ptica",
    verses:[
    { p:"1! 2 0 1! 2 3! 4  5! - 6 5! 4 4! 3" },
    { p:"3! - 4 3! 2 2! 1  1! 2 0 1! 2 3! -" },
    { p:"3! - 4 5! - 5 -   6! - 5 4! - 4 3" },
    { p:"1! - - 4! - 4 -   4! 5 4 3! - 2 1" },
    { p:"2! - - 2! - 2 -   3! - 5 4! 3 2 -" },

function detectLang(){
  let l="";
  try{ l=(navigator.languages&&navigator.languages[0])||navigator.language||""; }catch(e){}
  l=String(l).toLowerCase();
  if(/^(sr|bs|hr|cnr|sh|me)/.test(l)) return "sr";
  if(/^de/.test(l)) return "de";
  return "en";
}
function TR(k,a,b){
  const tab=STR[LANG]||STR.de;
  let v=(k in tab)?tab[k]:STR.de[k];
  if(v===undefined) return k;
  if(a!==undefined) v=v.replace("%1",a);
  if(b!==undefined) v=v.replace("%2",b);
  return v;
}

function makeCalls(a){
  const c1=Math.max(3,Math.round(a*.4)), c2=Math.max(c1+2,Math.round(a*.7));

  return [[c1,TR("callRun")+c1],[c2,"OPA!"],[a,"ŠARGIJAŠ!"],[a*2,"MAJSTORE"]];
}

function hasLS(){ try{ return typeof localStorage!=="undefined"&&!!localStorage; }catch(e){ return false; } }
function dbLoad(){
  try{ if(hasLS()){ const r=localStorage.getItem(KEY); if(r){ Object.assign(DB,JSON.parse(r)); return Promise.resolve(); } } }catch(e){}
  if(window.storage&&window.storage.get)
    return window.storage.get(KEY).then(function(r){ if(r&&r.value) Object.assign(DB,JSON.parse(r.value)); }).catch(function(){});
  return Promise.resolve();
}
function dbSave(){
  try{ if(hasLS()){ localStorage.setItem(KEY,JSON.stringify(DB)); return; } }catch(e){}
  try{ if(window.storage&&window.storage.set) window.storage.set(KEY,JSON.stringify(DB)).catch(function(){}); }catch(e){}

   ghosts und blur sind die beiden teuren Posten, decoMs der Takt, in dem
   Dekoration überhaupt angefasst wird.                                    */
const GFX={mode:"auto", ghosts:true, blur:true, decoMs:33, low:false,
           thrift:false, staffMs:33, billMax:10};
function setGfx(m){
  GFX.mode=m; GFX.low=false;
  applyGfx();
}
function applyGfx(){
  const thrift=(GFX.mode==="thrift")||(GFX.mode==="auto"&&GFX.low);
  GFX.thrift=thrift;
  GFX.ghosts=!thrift&&!reduce;
  GFX.blur=!thrift;
  GFX.decoMs=thrift?50:33;      // Kolo, Licht, Scheine: 30 bzw. 20 FPS
  GFX.staffMs=thrift?40:33;     // Notenbahn: nie schneller als ~30 FPS
  GFX.billMax=thrift?5:10;      // Scheine gleichzeitig in der Luft
  document.body.classList.toggle("thrift",thrift);
  /* Der Saal wird bewusst nicht mit umgeschaltet: die Effektstufe regelt
     das Bild, und ein Hall, der mitten im Lied die Länge wechselt, ist
     deutlich hörbar. Seine Länge steht einmal beim Start fest.          */
  if(!GFX.ghosts&&ghostsG){ ghostsG.style.display="none"; ghostsG.setAttribute("opacity","0"); }
  if(edgeFlashEl) edgeFlashEl.setAttribute("filter",GFX.blur?"url(#soft)":"none");
}
/* Klangfarbe: was hier eingestellt wird, verschiebt die Eckfrequenz des
   Verlustfilters in den Saiten und die Menge Saal. "Warm" ist ein
   Instrument mit älteren Saiten in einem trockenen Zimmer, "hell" ein
   frisch bezogenes auf der Bühne.                                        */
const TONES=[
  { id:"warm",  fc:.72, room:.75, tilt:-5.5 },
  { id:"srce",  fc:1,   room:1,   tilt:-3.5 },
  { id:"svijet",fc:1.34, room:1.2, tilt:-1.5 }

let TONE=1;
/* Der Grundton des laufenden Stücks als Faktor über der leeren Saite.
   Die Bordune folgen ihm — ein Šargijaš stimmt sie auf die Tonart des
   Liedes, nicht auf die leere Melodiesaite.                             */
let TONIC_MUL=1;
function applyTone(){
  const T=TONES[TONE];
  if(AC&&AC._tilt) AC._tilt.gain.value=T.tilt;
  if(workletOn&&strNode) setupStrings();
}
const PKEY="sargija:prefs";
function prefsLoad(){
  LANG=detectLang();                       // Voreinstellung kommt vom Gerät
  try{ if(hasLS()){
    const r=localStorage.getItem(PKEY);
    if(r){ const o=JSON.parse(r);
      if(typeof o.level==="number") S.level=Math.max(0,Math.min(LEVELS.length-1,o.level));
      if(typeof o.inst==="number") S.inst=Math.max(0,Math.min(INSTRUMENTS.length-1,o.inst));
      if(typeof o.tone==="number") TONE=Math.max(0,Math.min(TONES.length-1,o.tone));
      if(o.gfx) GFX.mode=o.gfx;
      if(o.lang&&LANGS.indexOf(o.lang)>=0) LANG=o.lang;   // eigene Wahl geht vor
    } } }catch(e){}
}
function prefsSave(){
  try{ if(hasLS()) localStorage.setItem(PKEY,
    JSON.stringify({level:S.level,inst:S.inst,gfx:GFX.mode,lang:LANG,tone:TONE})); }catch(e){}
}
/* Was fest im Markup steht, wird beim Sprachwechsel nachgezogen. */
function applyLang(){
  document.documentElement.setAttribute("lang",LANG);
  const g=document.querySelector(".gtitle"); if(g) g.textContent=TR("touch");
  const gn=document.querySelector(".gnote");
  if(gn) gn.textContent=IOSISH?TR("silent"):"";

/* ═══════════ Audio ═══════════
   Eine Šargija klingt nicht wie ein Oszillator und auch nicht wie ein
   fertig gerechneter Puffer. Der Klang lebt davon, dass alle Saiten
   gleichzeitig weiterschwingen: die Bordune stehen als Teppich, die
   Melodiesaiten laufen paarweise leicht gegeneinander, und über den Steg
   nimmt jede Saite ein bisschen von dem auf, was die anderen tun.

   Darum rechnet ein AudioWorklet jede Saite einzeln in Echtzeit: eine
   Verzögerungsschleife je Saite, darin ein Verlustfilter, das die hohen
   Teiltöne schneller sterben lässt als den Grundton — genau wie an einer
   echten Stahlsaite. Ein neuer Anschlag löscht die alte Schwingung nicht,
   er legt Energie dazu; die Trzalica dämpft nur, was sie berührt.

   Browser ohne AudioWorklet bekommen weiter den alten Pufferweg. Er
   klingt flacher, aber er klingt.                                        */

/* Der Worklet-Quelltext läuft in einem eigenen Thread und wird als
   Blob nachgeladen — so bleibt die Seite eine einzige Datei.             */
const STRING_DSP = `
'use strict';
/* Eine Saite: Verzögerungsschleife mit Allpass-Feinstimmung, Verlust-
   filter (Einpol) und Gleichspannungssperre. Alles pro Abtastwert.      */
class Zica {
  constructor(sr){
    this.sr=sr;
    this.L=4096;                       // reicht hinab bis ~12 Hz
    this.buf=new Float32Array(this.L);
    this.exc=new Float32Array(1024);   // laufender Anriss
    this.excN=0; this.excI=0;
    this.wait=0;                       // Restverzögerung im Anschlag
    this.pending=null;
    this.wp=0; this.Ni=200; this.c=0;
    this.apx=0; this.apy=0; this.lp=0; this.a=.6; this.R=.985;
    this.dcx=0; this.dcy=0;
    this.gl=.5; this.gr=.5;
    this.live=false; this.idle=0; this.o=0;
    this.D=200; this.Dcur=200; this.dD=0; this.gN=0;   // Gleiten
    this.bend=0; this.bendK=1; this.tick=0;            // Anschlagsbiegung
    this.thr=1e9; this.bg=0; this.nzp=0; this.bh=0;   // Schnarren am Bund
  }
  hush(){
    this.buf.fill(0); this.lp=this.apx=this.apy=this.dcx=this.dcy=0;
    this.excN=this.excI=0; this.wait=0; this.pending=null;
    this.live=false; this.o=0; this.bend=0; this.gN=0;
  }
  /* f = Tonhöhe, t60 = Ausklang des Grundtons in Sekunden,
     fc = Eckfrequenz des Verlustfilters: je höher, desto länger bleibt
     die Saite hell.                                                     */
  tune(f,t60,fc,glide){
    const sr=this.sr;
    let D=sr/Math.max(20,f);
    if(D>this.L-8) D=this.L-8;
    /* Greift die Hand um, während die Saite klingt, rutscht der Finger
       über den Bund: die Länge wandert in glide Abtastwerten zum Ziel.  */
    if(glide>0&&this.live&&Math.abs(D-this.Dcur)>.01){
      this.D=D; this.gN=glide|0; this.dD=(D-this.Dcur)/this.gN;
    }else{ this.D=D; this.Dcur=D; this.gN=0; }
    const a=Math.min(.93,Math.max(.02,Math.exp(-6.2831853*fc/sr)));
    this.a=a;
    const w=6.2831853*f/sr, ca=Math.cos(w);
    const mag=(1-a)/Math.sqrt(Math.max(1e-9,1-2*a*ca+a*a));
    const G=Math.pow(10,-3/(Math.max(.08,t60)*f));
    // Der Steg koppelt Energie zurück; ohne Reserve schaukelt sich das auf.
    this.R=Math.min(.9955,G/Math.max(1e-6,mag));
    this.dlp=a/(1-a);
    this.len(this.Dcur/(1+this.bend));
  }
  /* Schleifenlänge D (in Abtastwerten) auf ganze Verzögerung + Allpass. */
  len(D){
    let rem=D-this.dlp; if(rem<4) rem=4;
    let Ni=Math.floor(rem)-1, frac=rem-Ni;    // frac liegt in [1,2)
    if(Ni<2){ Ni=2; frac=1; }
    this.Ni=Ni;
    this.c=(1-frac)/(1+frac);
  }
  /* Anriss: gefiltertes Rauschen über eine Periodenlänge, dazu der
     Kamm der Anschlagstelle. Er wird nicht in den Puffer geschrieben,
     sondern über die nächsten Abtastwerte eingespeist — dadurch addiert
     er sich zu dem, was noch schwingt.                                  */
  strike(amp,pick,edge,damp,dly,bend,thr,bg){
    /* Ein kräftiger Anriss dehnt die Stahlsaite: der Ton beginnt ein paar
       Cent zu hoch und sinkt in gut 0,1 s auf seine Höhe.               */
    this.bend=bend>0?Math.pow(2,bend/1200)-1:0;
    this.bendK=Math.exp(-16/(this.sr*.07));
    if(thr>0){ this.thr=thr; this.bg=bg; }
    this.len(this.Dcur/(1+this.bend));
    const N=Math.min(this.exc.length,Math.max(12,this.Ni));
    const e=this.exc;
    let s=0;
    for(let i=0;i<N;i++){ const n=Math.random()*2-1; s+=(n-s)*edge; e[i]=s; }
    const pp=Math.max(1,Math.min(N-1,Math.round(N*pick)));
    for(let i=N-1;i>=pp;i--) e[i]-=e[i-pp]*.86;
    // weicher Ein- und Ausstieg, sonst knackt der Anriss
    const ed=Math.max(2,(N*.12)|0);
    for(let i=0;i<ed;i++){
      const u=.5-.5*Math.cos(3.14159265*i/ed);
      e[i]*=u; e[N-1-i]*=u;
    }
    let pk=0;
    for(let i=0;i<N;i++){ const v=e[i]<0?-e[i]:e[i]; if(v>pk) pk=v; }
    if(pk>0){ const k=amp/pk; for(let i=0;i<N;i++) e[i]*=k; }
    if(damp>0){
      const k=1-damp;
      for(let i=0;i<this.L;i++) this.buf[i]*=k;
      this.lp*=k; this.apy*=k; this.dcy*=k;
    }
    this.excN=N; this.excI=0; this.wait=dly|0;
    this.live=true; this.idle=0;
  }
  step(inj){
    if(this.wait>0){ this.wait--; }
    let x2=0;
    if(this.wait===0&&this.excI<this.excN) x2=this.exc[this.excI++];
    if((this.gN>0||this.bend!==0)&&++this.tick>=16){
      this.tick=0;
      if(this.gN>0){ this.gN=Math.max(0,this.gN-16); this.Dcur=this.gN?this.Dcur+this.dD*16:this.D; }
      if(this.bend!==0){ this.bend*=this.bendK; if(this.bend<1e-5) this.bend=0; }
      this.len(this.Dcur/(1+this.bend));
    }
    let rp=this.wp-this.Ni; if(rp<0) rp+=this.L;
    const x=this.buf[rp];
    const y=this.c*x+this.apx-this.c*this.apy;
    this.apx=x; this.apy=y;
    this.lp=(1-this.a)*y+this.a*this.lp;
    const v=this.R*this.lp;
    const d=v-this.dcx+.9985*this.dcy;
    this.dcx=v; this.dcy=d;
    this.buf[this.wp]=d+x2+inj;
    this.wp++; if(this.wp>=this.L) this.wp=0;
    this.o=d;
    /* Schnarren: schwingt die Saite weit genug aus, schlägt sie in jeder
       Periode kurz an den Bund — ein Sirren im Takt des Grundtons, das
       mit dem Ausschlag wächst und verschwindet, sobald der Ton leiser
       wird. Es geht nach außen, nicht zurück in die Schleife.           */
    const av=d<0?-d:d;
    if(av>this.thr){
      const nz=Math.random()*2-1, e=av-this.thr;
      this.bh=(nz-this.nzp)*e*this.bg; this.nzp=nz;
      return d+this.bh;
    }
    return d;
  }
}

/* Das Geräusch der Trzalica selbst: ein kurzer, harter Anstrich am
   Draht, bevor der Ton steht, und das Schnarren des frisch gegriffenen
   Bundes. Beides läuft hier mit, statt für jeden Schlag ein halbes
   Dutzend Audioknoten anzulegen und wieder wegzuwerfen.                 */
class Klik {
  constructor(sr){
    this.sr=sr; this.n=0; this.a=0; this.dec=0;
    this.f=3000; this.q=1.2; this.lp=0; this.bp=0; this.wait=0;
  }
  set(amp,freq,ms,dly){
    this.a=amp; this.f=freq; this.n=Math.round(this.sr*ms/1000);
    this.dec=Math.exp(-1/(this.sr*ms/3000));
    this.wait=dly|0; this.lp=0; this.bp=0;
  }
  step(){
    if(this.wait>0){ this.wait--; return 0; }
    if(this.n<=0) return 0;
    this.n--;
    // Zustandsvariablen-Bandpass auf weißem Rauschen
    const f=2*Math.sin(3.14159265*this.f/this.sr);
    const x=(Math.random()*2-1)*this.a;
    this.lp+=f*this.bp;
    const hp=x-this.lp-this.bp/this.q;
    this.bp+=f*hp;
    this.a*=this.dec;
    return this.bp;
  }
}

class Sargija extends AudioWorkletProcessor {
  constructor(){
    super();
    this.Z=[]; for(let i=0;i<8;i++) this.Z.push(new Zica(sampleRate));
    this.K=[]; for(let i=0;i<6;i++) this.K.push(new Klik(sampleRate));
    this.ki=0;
    this.n=0;            // wie viele Saiten das Instrument gerade hat
    this.coup=.0035;     // Stegkopplung: davon lebt die Mitschwingung
    this.fb=0;
    this.q=[];           // vorgemerkte Anschläge mit festem Zeitpunkt
    this.port.onmessage=(ev)=>{
      const m=ev.data;
      if(m.t==="setup"){
        this.n=m.n; this.coup=m.coup;
        for(let i=0;i<this.Z.length;i++){
          const z=this.Z[i];
          if(i<m.n){ const p=m.pan[i]; z.gl=Math.cos((p+1)*.7853981); z.gr=Math.sin((p+1)*.7853981); }
          else z.hush();
        }
      }else if(m.t==="tune"){
        // Umgreifen bei klingender Saite: der Ton läuft weiter
        if(m.at>=0) this.q.push(m); else this.Z[m.i].tune(m.f,m.t60,m.fc,m.glide||0);
      }else if(m.t==="strum"){
        /* Ein Schlag kommt als eine Nachricht, damit der Versatz zwischen
           den Saiten abtastgenau bleibt. Mit "at" wird er auf einen festen
           Bildindex gelegt — sonst gilt er ab sofort.                     */
        if(m.at>=0) this.q.push(m); else this.fire(m,0);
      }else if(m.t==="hush"){
        for(let i=0;i<this.Z.length;i++) this.Z[i].hush();
        this.q.length=0;
      }
    };
  }
  klik(amp,freq,ms,dly){
    const k=this.K[this.ki++%this.K.length];
    k.set(amp,freq,ms,dly);
  }
  fire(m,dly){
    if(m.t==="tune"){ this.Z[m.i].tune(m.f,m.t60,m.fc,m.glide||0); return; }
    const L=m.v;
    for(let k=0;k<L.length;k+=7){
      const z=this.Z[L[k]];
      z.tune(L[k+1],L[k+2],L[k+3],0);
      z.strike(L[k+4],m.pick,m.edge,L[k+6],L[k+5]+dly,
               (m.bend||0)*Math.min(1.6,L[k+4]/.34),m.thr?m.thr[L[k]]:0,m.bg||0);
    }
    if(m.klik) this.klik(m.klik,m.kf||3000,m.kms||42,dly+(L[5]||0));
    if(m.buzz) this.klik(m.buzz,2600+Math.random()*1400,55,dly+(L[5]||0));
  }
  process(inputs,outputs){
    const out=outputs[0];
    const L=out[0], R=out.length>1?out[1]:out[0];
    const Z=this.Z, n=this.n, len=L.length;
    // Was in diesem Block fällig wird, wird jetzt mit dem passenden
    // Versatz gezündet; alles Weitere bleibt liegen.
    if(this.q.length){
      const end=currentFrame+len;
      for(let i=this.q.length-1;i>=0;i--){
        const m=this.q[i];
        if(m.at<end){
          this.fire(m,Math.max(0,m.at-currentFrame));
          this.q.splice(i,1);
        }
      }
    }
    let any=false;
    for(let i=0;i<n;i++) if(Z[i].live) any=true;
    for(let i=0;i<this.K.length&&!any;i++) if(this.K[i].n>0) any=true;
    if(!any) return true;
    let fb=this.fb, coup=this.coup;
    const K=this.K;
    for(let i=0;i<len;i++){
      let sl=0, sr=0, sum=0;
      for(let k=0;k<n;k++){
        const z=Z[k];
        if(!z.live) continue;
        const o=z.step(fb);
        sum+=o; sl+=o*z.gl; sr+=o*z.gr;
      }
      let kk=0;
      for(let k=0;k<K.length;k++) kk+=K[k].step();
      fb=sum*coup;
      L[i]=sl+kk*.5; if(R!==L) R[i]=sr+kk*.5;
    }
    this.fb=fb;
    // Saiten, die praktisch stillstehen, kosten ab jetzt nichts mehr
    for(let k=0;k<n;k++){
      const z=Z[k];
      if(!z.live) continue;
      const v=z.o<0?-z.o:z.o;
      if(v<1e-5){ if(++z.idle>60){ z.live=false; z.idle=0; } } else z.idle=0;
    }
    return true;
  }
}
registerProcessor("sargija-zice",Sargija);

let AC=null, master, bodyIn, roomGain, noiseBuf;
let strNode=null, strGain=null, workletOn=false;
const ksCache={};

/* Der Korpus ist kein Equalizer, sondern ein Holzkasten mit vielen engen
   Eigentönen. Statt drei breiter Glocken wird darum eine kurze Antwort
   aus abklingenden Moden gerechnet und gefaltet — links und rechts mit
   eigenen Phasen, das gibt dem Ton Breite.                              */
function bodyIR(ctx,B,seedBase){
  const sr=ctx.sampleRate, len=Math.max(64,Math.round(sr*.115));
  const buf=ctx.createBuffer(2,len,sr);
  // Grundmoden aus der Instrumentbeschreibung, dazu die Nachbarn, die
  // ein Korpus immer mitbringt.
  const modes=[];
  const spread=[1,1.34,1.71,2.23,2.9];
  for(let i=0;i<B.length;i++){
    for(let j=0;j<spread.length;j++){
      const f=B[i]*spread[j];
      if(f>sr*.42) continue;
      modes.push([f, .9/(1+j*.9)/(1+i*.5), 24+j*7+i*11]);
    }
  }
  let s=seedBase>>>0;
  const rnd=function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    d[0]=1;                                     // Direktschall
    for(let m=0;m<modes.length;m++){
      const f=modes[m][0], g=modes[m][1], q=modes[m][2];
      const dec=q/(3.14159265*f), ph=rnd()*6.2831853;
      const w=6.2831853*f/sr, k=Math.exp(-1/(sr*dec));
      let a=g*(.7+rnd()*.6);
      for(let i=1;i<len;i++){
        a*=k;
        if(a<1e-5) break;
        d[i]+=a*Math.sin(w*i+ph);
      }
    }
    // Luft im Korpus: ein Hauch Rauschen, der mit den Moden ausklingt
    for(let i=1;i<len;i++) d[i]+=(rnd()*2-1)*.06*Math.exp(-i/(sr*.012));
    /* Nicht auf die Spitze normieren, sondern auf die Energie: eine
       Antwort aus dreißig Moden trägt sonst zwanzig Mal so viel Pegel
       heraus, wie hineingeht, und alles Weitere klemmt im Begrenzer.    */
    let en=0;
    for(let i=0;i<len;i++) en+=d[i]*d[i];
    if(en>0){ const k=1/Math.sqrt(en); for(let i=0;i<len;i++) d[i]*=k; }
  }
  return buf;
}

/* Der Saal: frühe Reflexionen einer kleinen Halle, danach eine
   gefärbte Fahne, die nach oben hin schneller wegstirbt. Eine echte
   Faltung statt der alten Rückkopplungsverzögerung — die klang metallisch
   und hat bei schnellen Läufen geflattert.                              */
function roomIR(ctx,sec){
  const sr=ctx.sampleRate, len=Math.max(256,Math.round(sr*sec));
  const buf=ctx.createBuffer(2,len,sr);
  let s=20250819;
  const rnd=function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  const early=[[.009,.62],[.017,.48],[.023,-.4],[.031,.36],[.043,-.3],
               [.058,.26],[.071,.21],[.089,-.17]];
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    let lo=0, hi=0;
    for(let i=0;i<len;i++){
      const u=i/len;
      const n=rnd()*2-1;
      lo+=(n-lo)*.34;                       // dunkler Nachhall
      hi+=(n-hi)*.86;
      const env=Math.pow(1-u,2.4)*Math.exp(-u*3.1);
      d[i]=(lo*.8+hi*.2*Math.pow(1-u,3))*env;
    }
    for(let e=0;e<early.length;e++){
      const p=Math.round(early[e][0]*sr*(ch?1.07:1))|0;
      if(p<len) d[p]+=early[e][1]*(ch?-1:1)*.55;
    }
    let pk=0;
    for(let i=0;i<len;i++){ const v=d[i]<0?-d[i]:d[i]; if(v>pk) pk=v; }
    if(pk>0){ const k=.86/pk; for(let i=0;i<len;i++) d[i]*=k; }
  }
  return buf;
}

/* Sanfte Sättigung: eine Stahlsaite auf niedrigem Steg schnarrt, wenn
   kräftig angerissen wird. Die Kennlinie tut wenig bei leisem Spiel und
   rundet die Spitzen bei lautem — daher kommt der Biss.                 */
function driveCurve(){
  const n=2048, c=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*2-1;
    c[i]=Math.tanh(x*1.9)/Math.tanh(1.9)*.86+x*.14;
  }
  return c;
}
/* Ganz am Ende ein weicher Deckel. Ein Kompressor braucht Millisekunden,
   ein Anschlag hat seine Spitze schon nach einer Zehntel — ohne diese
   Kennlinie schlagen einzelne Anrisse über die Vollaussteuerung. Bis
   0,7 ist sie linear, darüber biegt sie sanft ab und erreicht 1 nie.    */
function limitCurve(){
  const n=4096, c=new Float32Array(n), k=.7;
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*2-1, a=Math.abs(x);
    c[i]=(a<=k)?x:Math.sign(x)*(k+(1-k)*Math.tanh((a-k)/(1-k)));
  }
  return c;
}

/* Der ganze Klangweg an einem Stück, damit er auf jedem Kontext steht —
   im Spiel auf dem laufenden, für Aufnahmen auf einem Offline-Kontext.   */
function buildGraph(ctx){
  const comp=ctx.createDynamicsCompressor();
  /* Nur Spitzen abfangen. Ein Kompressor, der ständig arbeitet, nimmt dem
     Anschlag genau das, was ihn echt macht: den harten Kopf.            */
  comp.threshold.value=-6; comp.ratio.value=6;
  comp.attack.value=.002; comp.release.value=.2; comp.knee.value=6;
  const lim=ctx.createWaveShaper();
  lim.curve=limitCurve(); lim.oversample="4x";
  const master=ctx.createGain(); master.gain.value=.9;
  master.connect(comp); comp.connect(lim); lim.connect(ctx.destination);

  /* Kette: Saiten → Schnarren → Korpusfaltung (+ Direktanteil) →
     Hochpass → Saal.                                                    */
  const bodyIn=ctx.createGain(); bodyIn.gain.value=1;

  const shaper=ctx.createWaveShaper();
  shaper.curve=driveCurve(); shaper.oversample="2x";

  const bodyConv=ctx.createConvolver(); bodyConv.normalize=false;
  /* Ganz ohne Direktanteil frisst der Korpus den Grundton auf und es
     bleibt ein hohler Oktavklang. Ein gutes Drittel geht daran vorbei. */
  const bodyWet=ctx.createGain(); bodyWet.gain.value=.74;
  const bodyDry=ctx.createGain(); bodyDry.gain.value=.5;

  const hp=ctx.createBiquadFilter(); hp.type="highpass";
  hp.frequency.value=78; hp.Q.value=.6;
  // Der Deckel nimmt der Faltung die Schärfe, die kein Holz hätte.
  const tilt=ctx.createBiquadFilter(); tilt.type="highshelf";
  tilt.frequency.value=5200; tilt.gain.value=TONES[TONE].tilt;
  const mix=ctx.createGain(); mix.gain.value=1;

  bodyIn.connect(shaper);
  shaper.connect(bodyConv); bodyConv.connect(bodyWet); bodyWet.connect(mix);
  shaper.connect(bodyDry); bodyDry.connect(mix);
  mix.connect(hp); hp.connect(tilt); tilt.connect(master);

  const nlen=Math.round(ctx.sampleRate*2);
  const noise=ctx.createBuffer(1,nlen,ctx.sampleRate);
  const d=noise.getChannelData(0);
  for(let i=0;i<nlen;i++) d[i]=Math.random()*2-1;

  // Saal
  const room=ctx.createGain(); room.gain.value=.14;
  let verb=null;
  try{
    verb=ctx.createConvolver(); verb.normalize=true;
    /* Die Faltung ist der einzige Posten der Tonkette, der auf alten
       Geräten wirklich zählt. Wenig Kerne oder Sparsam-Modus: ein
       kleinerer Saal statt gar keiner.                                  */
    const weak=GFX.thrift||((navigator.hardwareConcurrency||8)<=4);
    verb.buffer=roomIR(ctx,weak?.8:1.6);
    ctx._verb=verb;
  }catch(e){ verb=null; }
  if(verb){
    const pre=ctx.createDelay(.2); pre.delayTime.value=.018;
    const damp=ctx.createBiquadFilter(); damp.type="lowpass"; damp.frequency.value=4200;
    tilt.connect(pre); pre.connect(verb); verb.connect(damp);
    damp.connect(room); room.connect(master);
  }else{
    const dl=ctx.createDelay(1); dl.delayTime.value=.085;
    const fbk=ctx.createGain(); fbk.gain.value=.34;
    const rf=ctx.createBiquadFilter(); rf.type="lowpass"; rf.frequency.value=2200;
    tilt.connect(dl); dl.connect(rf); rf.connect(fbk); fbk.connect(dl);
    rf.connect(room); room.connect(master);
  }

  const str=ctx.createGain(); str.gain.value=.72;
  str.connect(bodyIn);

  ctx._body=bodyConv; ctx._shaper=shaper; ctx._comp=comp;
  ctx._mix=mix; ctx._str=str; ctx._tilt=tilt;
  return {master:master, bodyIn:bodyIn, room:room, noise:noise, str:str};
}

function initAudio(){
  if(AC) return;
  /* Safari behandelt Web Audio wie einen Klingelton und schaltet es mit
     dem Lautlos-Schalter stumm. Seit Safari 16.4 lässt sich das mit einer
     eigenen Audiositzung abwählen — dann klingt das Spiel wie ein
     Musikstück und ignoriert den Schalter.                               */
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  const Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  try{ AC=new Ctor({latencyHint:"interactive"}); }catch(e){ AC=new Ctor(); }
  const g=buildGraph(AC);
  master=g.master; bodyIn=g.bodyIn; roomGain=g.room;
  noiseBuf=g.noise; strGain=g.str;
  applyInstrument();
  unlock();
  startWorklet();
}

/* Der Worklet wird nachgeladen; bis er steht, spielt der Pufferweg.
   Auf Browsern ohne AudioWorklet bleibt es dabei.                       */
function startWorklet(){
  if(!AC||!AC.audioWorklet||typeof AudioWorkletNode!=="function") return;
  let url;
  try{ url=URL.createObjectURL(new Blob([STRING_DSP],{type:"text/javascript"})); }
  catch(e){ return; }
  AC.audioWorklet.addModule(url).then(function(){
    try{
      strNode=new AudioWorkletNode(AC,"sargija-zice",
        {numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
      strNode.connect(strGain);
      workletOn=true;
      setupStrings();
    }catch(e){ workletOn=false; strNode=null; }
    try{ URL.revokeObjectURL(url); }catch(e){}
  }).catch(function(){ try{ URL.revokeObjectURL(url); }catch(e){} });
}

/* Ältere iOS-Fassungen geben den Ton erst frei, wenn noch innerhalb der
   Berührung wirklich etwas abgespielt wurde. Ein einzelnes stummes Sample
   genügt — ohne das bleibt die Melodie zweieinhalb Sekunden später stumm. */
function unlock(){
  if(!AC) return;
  try{
    const b=AC.createBuffer(1,1,AC.sampleRate);
    const s0=AC.createBufferSource();
    s0.buffer=b; s0.connect(AC.destination);
    if(s0.start) s0.start(0); else if(s0.noteOn) s0.noteOn(0);
  }catch(e){}
}

/* Der Saitensatz: die Melodie läuft über ein Chorpaar in Einklang, leicht
   gegeneinander verstimmt — dieses langsame Schweben ist das Erkennungs-
   zeichen der Šargija. Darunter liegen die Bordune.                     */
/* Regler für den Saitenklang — 0 schaltet eine Zutat ab, 1 ist der
   abgestimmte Wert, darüber wird sie deutlicher.
   buzz   Schnarren am Bund, solange die Saite laut schwingt
   bend   Anschlagsbiegung: kräftige Schläge beginnen leicht zu hoch
   glide  Rutschen beim Umgreifen auf der klingenden Saite (ms)
   trem   schnelles Tremolo dämpft die Melodiesaite weniger              */
const SOUND={buzz:1, bend:1, glide:1, trem:1};
const BUZZ={sar:1, kra:.7, saz:.45};
let lastPluckT=-1;
function stringSet(I){
  const set=[], k=TONES[TONE].fc;
  set.push({mel:1, mult:1, cents:-3.2, pan:-.16, t60:I.t60mel, fc:I.fcMel*k});
  set.push({mel:1, mult:1, cents:+3.8, pan:+.18, t60:I.t60mel*.94, fc:I.fcMel*1.06*k});
  for(let i=0;i<I.drones.length;i++){
    const dv=I.drones[i];
    set.push({mel:0, mult:dv, cents:(i%2?2.6:-2.2), pan:(i%2? .34:-.36),
              t60:I.t60dr*(dv<1.2?1:.86), fc:I.fcDr*k});
  }
  if(I.strings>=6&&I.drones.length<3)
    set.push({mel:0, mult:2, cents:3.4, pan:.42, t60:I.t60dr*.8, fc:I.fcDr*1.15*k});
  return set;
}
let STRSET=null;
function setupStrings(){
  if(!workletOn||!strNode) return;
  STRSET=stringSet(INST());
  strNode.port.postMessage({t:"setup", n:STRSET.length,
    coup:INST().couple, pan:STRSET.map(function(s){ return s.pan; })});
}

function applyInstrument(){
  if(!AC) return;
  const I=INST();
  if(AC._body){ try{ AC._body.buffer=bodyIR(AC,I.body,I.seed||7); }catch(e){} }
  /* Der Saz hat mehr Saiten und trägt länger — ohne eigenen Pegel läuft
     er dem Begrenzer in die Arme, während die Šargija Luft lässt.       */
  if(strGain) strGain.gain.value=.72*(I.out||1);
  if(workletOn&&strNode){
    strNode.port.postMessage({t:"hush"});
    setupStrings();
  }else setTimeout(function(){ if(!workletOn) prefetchBuffers(); },500);
}

/* ── Rückfallweg: fertig gerechnete Karplus-Strong-Puffer ──
   Nur für Browser ohne AudioWorklet. Jede Tonhöhe wird einmal gerechnet
   und gemerkt.                                                          */
let prefTok=0;
function prefetchBuffers(){
  if(!AC||workletOn) return;
  const tok=++prefTok, inst=S.inst, I=INSTRUMENTS[inst];
  const freqs=[];
  for(let i=0;i<I.drones.length;i++) freqs.push(I.base*I.drones[i]);
  for(let f=0;f<CENTS.length;f++) freqs.push(I.base*Math.pow(2,CENTS[f]/1200));
  let k=0;
  (function step(){
    if(tok!==prefTok||!AC||S.inst!==inst||workletOn) return;
    if(k>=freqs.length) return;
    try{ ksBuffer(freqs[k]); }catch(e){}
    k++;
    setTimeout(step,70);
  })();
}
function ksBuffer(freq){
  const key=Math.round(freq*4)+"|"+S.inst;
  if(ksCache[key]) return ksCache[key];
  const I=INST(), sr=AC.sampleRate;
  const N=Math.max(4,Math.round(sr/freq));
  const secs=Math.min(2.4, 1.0+ (190/freq));
  const total=Math.floor(sr*secs);
  const buf=AC.createBuffer(1,total,sr);
  const out=buf.getChannelData(0);
  const line=new Float32Array(N);
  for(let i=0;i<N;i++) line[i]=Math.random()*2-1;
  let e=0;
  for(let i=0;i<N;i++){ e+=(line[i]-e)*I.bright; line[i]=e; }
  const pp=Math.max(1,Math.floor(N*I.comb));
  for(let i=N-1;i>=pp;i--) line[i]-=line[i-pp]*I.combAmt;
  let peak=0;
  for(let i=0;i<N;i++) if(Math.abs(line[i])>peak) peak=Math.abs(line[i]);
  if(peak>0){ const k=.94/peak; for(let i=0;i<N;i++) line[i]*=k; }
  let idx=0;
  for(let i=0;i<total;i++){
    const v=line[idx], nxt=line[(idx+1)%N];
    out[i]=v;
    line[idx]=I.damp*.5*(v+nxt);
    idx=(idx+1)%N;
  }
  const fade=Math.floor(total*.34);
  for(let i=0;i<fade;i++){
    const u=i/fade;
    out[total-1-i]*=.5-.5*Math.cos(u*Math.PI);
  }
  ksCache[key]=buf;
  return buf;
}
function tone(freq,gain,when,detune){
  if(!AC) return;
  const src=AC.createBufferSource();
  src.buffer=ksBuffer(freq);
  src.playbackRate.value=1+(detune||0);
  const g=AC.createGain(); g.gain.value=gain;
  src.connect(g); g.connect(bodyIn);
  src.start(when);
  src.stop(when+src.buffer.duration+.02);
}

/* Die Trzalica selbst macht Geräusch: ein kurzer, harter Anstrich am
   Draht, bevor der Ton steht. Ohne ihn klingt jeder Anschlag wie aus
   dem Nichts.                                                           */
function pickNoise(when,amt,dir){
  if(!AC||!noiseBuf) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=1.3+Math.random()*.5;
  s.loop=false;
  const off=Math.random()*1.5;
  const bp=AC.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=(dir<0?3400:2500)+Math.random()*1600; bp.Q.value=.9;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(amt*.085,when+.002);
  g.gain.exponentialRampToValueAtTime(.00008,when+.045);
  s.connect(bp); bp.connect(g); g.connect(bodyIn);
  s.start(when,off,.09); s.stop(when+.09);
}
function fretBuzz(when,amt){
  if(!AC||!noiseBuf) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=1.6;
  const bp=AC.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=2600+Math.random()*1400; bp.Q.value=1.2;
  const g=AC.createGain();
  g.gain.setValueAtTime(amt*.12,when);
  g.gain.exponentialRampToValueAtTime(.0001,when+.055);
  s.connect(bp); bp.connect(g); g.connect(bodyIn);
  s.start(when,Math.random()*1.5,.1); s.stop(when+.1);
}
function freqOfFret(f){
  const i=Math.max(0,Math.min(CENTS.length-1,Math.round(f)));
  return INST().base*Math.pow(2,CENTS[i]/1200);
}
const cents=function(c){ return Math.pow(2,c/1200); };

/* Greifen, während die Saite noch klingt, ist kein neuer Anschlag: der
   Ton läuft weiter und wechselt die Höhe. Bei kräftigem Aufsetzen kommt
   ein leiser Anriss dazu — das ist der Hammer-on der linken Hand.       */
function fretChange(fresh,when){
  if(!AC||!workletOn||!strNode||!STRSET) return;
  const I=INST(), f=freqOfFret(S.fret);
  const at=(when===undefined)?-1:Math.round(when*AC.sampleRate);
  const v=[];
  for(let i=0;i<STRSET.length;i++){
    const s=STRSET[i];
    if(!s.mel) continue;
    const fr=f*cents(s.cents);
    if(fresh) v.push(i,fr,s.t60*.8,s.fc*.85,.055+Math.random()*.02,(i*40)|0,.5);
    else strNode.port.postMessage({t:"tune",i:i,f:fr,t60:s.t60,fc:s.fc,at:at,
      glide:Math.round(AC.sampleRate*.022*SOUND.glide)});
  }
  if(v.length) strNode.port.postMessage({t:"strum",v:v,at:at,pick:.22,edge:.5});
}

/* Ein Anschlag streicht die Saiten nacheinander — abwärts von der tiefen
   zur hohen, aufwärts umgekehrt. Genau dieser Versatz macht das Rauschen
   eines echten Trzalica-Schlags aus. Er ist nicht gleichmäßig: die Hand
   beschleunigt über den Satz, und ganz gleich fällt sie nie.             */
function pluck(dir,power,when){
  if(!AC) return;
  const I=INST();
  const p=Math.max(.25,Math.min(1.4,power||1));
  const up=dir<0;
  const fresh=(performance.now()-S.lastFretT)<140;
  /* Ohne Zeitangabe gilt: gleich jetzt. Mit Zeitangabe lässt sich ein
     ganzer Vortrag im Voraus legen — davon lebt die Aufnahme.           */
  const t0=(when===undefined)?AC.currentTime+.005:when;

  if(workletOn&&strNode&&STRSET){
    const sr=AC.sampleRate;
    const mel=freqOfFret(S.fret);
    // Grundversatz zwischen zwei Saiten; der Aufschlag ist eiliger.
    const step=(up?.0058:.0079)*(1.42-p*.5);
    let gap=t0-lastPluckT; if(lastPluckT<0||gap<0) gap=1; lastPluckT=t0;
    const trem=1-SOUND.trem*.45*Math.max(0,Math.min(1,(.16-gap)/.1));
    const bz=SOUND.buzz*(BUZZ[I.id]||0);
    const order=[];
    for(let i=0;i<STRSET.length;i++) order.push(i);
    if(up) order.reverse();
    const v=[];
    let tt=0;
    for(let k=0;k<order.length;k++){
      const i=order[k], s=STRSET[i];
      const f=(s.mel?mel:I.base*s.mult*TONIC_MUL)*cents(s.cents);
      /* Der Aufschlag erwischt die Bordune nur streifend, der Abschlag
         legt sein Gewicht auf sie.                                      */
      let g=s.mel?(up?.30:.34):(I.drone*(up?.5:1.05));
      g*=p*(.88+Math.random()*.24);
      // Die Hand beschleunigt: die letzten Saiten kommen dichter.
      tt+=step*(1-k*.09)*(.82+Math.random()*.36);
      /* Hohe Töne stehen kürzer als tiefe — das gilt für jede Saite.    */
      const t60=s.t60*(.9+p*.14)*Math.pow(I.base/Math.max(40,f),.35);
      /* Die Trzalica löscht die Melodiesaite fast, die Bordune streift
         sie nur — sonst bricht der Teppich bei jedem Schlag ab.         */
      let dmp=s.mel?Math.min(.86,.34+p*.32):Math.min(.3,.08+p*.14);
      /* Beim Prebir liegt die Trzalica kaum auf: je dichter die Schläge,
         desto weniger nimmt sie der Melodiesaite weg.                   */
      if(s.mel&&trem<1) dmp*=trem;
      v.push(i,f,t60,s.fc*(.74+p*.42),g,Math.round(tt*sr),dmp);
    }
    strNode.port.postMessage({t:"strum", v:v,
      at:(when===undefined)?-1:Math.round(t0*sr),
      pick:I.comb*(up?1.22:1)*(.92+Math.random()*.16),
      edge:Math.min(.95,I.bright*(.8+p*.34)),
      /* Anstrich und Schnarren rechnet der Worklet mit — abtastgenau
         zum Schlag und ohne für jeden Anschlag Knoten anzulegen.       */
      klik:p*(up?.5:.62), kf:(up?3400:2500)+Math.random()*1600, kms:40,
      bend:SOUND.bend*(up?5:8),
      thr:STRSET.map(function(s){ return bz>0?(s.mel?.05:.07):0; }), bg:bz*1.2,
      buzz:p*(fresh?.5:.14)*(S.fret>0?.8:.4)});
  }else{
    // Rückfallweg
    const t=t0;
    const spread=(up?.0065:.0085)*(1.4-p*.5);
    const dg=I.drone*(up?.42:1);
    const mg=up?.24:.32, cg=up?.15:.23;
    const list=[];
    for(let i=0;i<I.drones.length;i++)
      list.push({f:I.base*I.drones[i], g:dg*p*(i?.8:1)});
    const mel=freqOfFret(S.fret);
    list.push({f:mel, g:mg*p});
    list.push({f:mel, g:cg*p});
    if(up) list.reverse();
    for(let i=0;i<list.length;i++){
      const det=(Math.random()-.5)*.0028 + (i===list.length-1?.004:0);
      tone(list[i].f, list[i].g, t+i*spread, det+(up?.0016:0));
    }
    /* Auf dem Rückfallweg gibt es keinen Worklet — dort bleibt es bei
       eigenen Knoten für Anstrich und Schnarren.                        */
    pickNoise(t,p*(up?.8:1),dir);
    fretBuzz(t0,p*(fresh?1:.28)*(S.fret>0?.8:.4));
  }
  if(roomGain) roomGain.gain.setTargetAtTime(
    Math.min(.42,(.085+S.energy*.1+S.solo*.085)*I.room*TONES[TONE].room),t0,.5);
}
function roar(strength){
  if(!AC||!noiseBuf) return;
  const t=AC.currentTime, g=AC.createGain(), a=.05+(strength||0)*.08;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(a,t+.1);
  g.gain.exponentialRampToValueAtTime(.0002,t+.9);
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=720; bp.Q.value=.9;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t+1);
}
function thumpSnd(){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(140,t);
  o.frequency.exponentialRampToValueAtTime(32,t+.4);
  g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.0005,t+.55);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.6);
}

/* ═══════════ Geometrie ═══════════
   Alles Instrumentale wird in einem lokalen Rahmen gezeichnet, dessen
   x-Achse die Saite vom Sattel zum Steg ist. Die eine Drehung am Ende
   legt das Instrument diagonal ins Querbild.                              */
const NS="http://www.w3.org/2000/svg";
const NUTX=160, NUTY=130, BRX=780, BRY=246;
const LDX=BRX-NUTX, LDY=BRY-NUTY;
const SLEN=Math.sqrt(LDX*LDX+LDY*LDY);
const ANG=Math.atan2(LDY,LDX)*180/Math.PI;
const NECK_END=418, BODY_X0=388, BODY_X1=758, BODY_W=101, BODY_W0=30;
const TAIL_X=736;

function neckHalf(x){ return 20+Math.max(0,Math.min(1,(x+8)/(NECK_END+8)))*10; }

/* Bundabstände: physikalisch nehmen sie zum Korpus hin stark ab. Rein
   physikalisch wären die oberen Bünde am Handy nicht mehr zu treffen,
   darum werden sie zu 55 % gleichmäßig verzogen — sichtbar bleibt die
   typische Staffelung, spielbar wird sie trotzdem.                        */
const FRET_MIX=.55;
let FX=[], FX_EXTRA=[];
function calcFX(){
  const span=SLEN*.5, a=[];
  for(let i=0;i<CENTS.length;i++){
    const real=SLEN*(1-Math.pow(2,-CENTS[i]/1200));
    const lin=span*i/(CENTS.length-1);
    a.push(real*(1-FRET_MIX)+lin*FRET_MIX);
  }
  FX=a;
  const last=a[a.length-1];
  FX_EXTRA=[last+19,last+35,last+48];   // Zierbünde jenseits des Spielraums
}
calcFX();
/* Wechselt der Tonvorrat, wandern die Bünde: Hals, Marken und Notenbahn
   werden danach neu gezeichnet.                                          */
function setScale(name){
  const c=SCALES[name]||SCALES.hidzaz;
  if(c===CENTS) return false;
  CENTS=c; ROMAN=ROMANS.slice(0,c.length);
  calcFX();
  return true;
}
/* Vor jedem Stück: Bünde setzen, Hals neu zeichnen, Bordune stimmen.
   Das Instrument wird gewissermaßen umgebunden — genau das tut ein
   Spieler auch, wenn er das Makam wechselt.                            */
function applyScaleOf(song){
  const changed=setScale((song&&song.scale)||"hidzaz");
  const t=Math.max(0,Math.min(CENTS.length-1,(song&&song.tonic)||0));
  TONIC_MUL=Math.pow(2,CENTS[t]/1200);

  S.visFret=Math.min(S.visFret,CENTS.length-1);
  if(changed) rebuild();
  if(AC) applyInstrument();          // Bordune und Puffer neu
}

function bodyOutline(inset){
  const x0=BODY_X0+inset*1.6, x1=BODY_X1-inset*1.1;
  const top=[], bot=[];
  for(let i=0;i<=72;i++){
    const u=i/72, x=x0+(x1-x0)*u;
    let w;
    if(u<.60){ const k=u/.60; w=BODY_W0+(BODY_W-BODY_W0)*Math.pow(Math.sin(k*Math.PI/2),1.18); }
    else{ const k=(u-.60)/.40; w=BODY_W*Math.sqrt(Math.max(0,1-k*k)); }
    w=Math.max(0,w-inset);
    top.push([x,-w]); bot.push([x,w]);
  }
  let d="M"+top[0][0].toFixed(1)+" "+top[0][1].toFixed(1);
  for(let i=1;i<top.length;i++) d+=" L"+top[i][0].toFixed(1)+" "+top[i][1].toFixed(1);
  for(let i=bot.length-1;i>=0;i--) d+=" L"+bot[i][0].toFixed(1)+" "+bot[i][1].toFixed(1);
  return d+" Z";
}

/* Eine gegriffene Saite schwingt nicht auf ganzer Länge, sondern nur
   zwischen Finger und Steg — der Bauch der Schwingung wandert mit dem
   Bund nach vorn und wird enger. Vor dem Finger liegt die Saite still.
   Das ist der sichtbare Teil dessen, was man hört.                      */
function updateStrings(wob,t,fx){
  const cut=fx||0;
  for(let i=0;i<strEls.length;i++){
    const s=strEls[i];
    const w=s.mel?wob:wob*.22;
    // Bordune sind offen: sie schwingen immer vom Sattel an
    const x0=s.mel?cut:0;
    const y0=s.nut+(s.br-s.nut)*(x0/SLEN);
    const mx=(x0+SLEN)*.5, my=(y0+s.br)*.5+w;
    let d="M0 "+s.nut.toFixed(1);
    if(x0>1) d+=" L"+x0.toFixed(1)+" "+y0.toFixed(1);
    d+=" Q"+mx.toFixed(1)+" "+my.toFixed(1)+" "+SLEN.toFixed(1)+" "+s.br.toFixed(1)+
       " L"+(TAIL_X+8)+" "+(s.br*.5).toFixed(1);
    s.el.setAttribute("d",d);
  }
}

/* Hände: Glieder aus einer Mittellinie mit veränderlicher Dicke, damit
   die Finger nicht als gleich dicke Würste lesen.                        */
const SKIN_DARK="#3a2118", SKIN_LIT="rgba(226,164,118,.28)";
function taperD(P,w0,w1){
  const n=P.length, A=[], B=[];
  let ltx=1, lty=0;
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)], b=P[Math.min(n-1,i+1)];
    let tx=b[0]-a[0], ty=b[1]-a[1];
    const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    if(i===n-1){ ltx=tx; lty=ty; }
    const u=n>1?i/(n-1):0;
    const w=(w0+(w1-w0)*u)*(1+.07*Math.sin(u*Math.PI*2.6));
    A.push([P[i][0]-ty*w/2, P[i][1]+tx*w/2]);
    B.push([P[i][0]+ty*w/2, P[i][1]-tx*w/2]);
  }
  const c=w1*.62;
  let d="M"+A[0][0].toFixed(1)+" "+A[0][1].toFixed(1);
  for(let i=1;i<n;i++) d+=" L"+A[i][0].toFixed(1)+" "+A[i][1].toFixed(1);
  d+=" C"+(A[n-1][0]+ltx*c).toFixed(1)+" "+(A[n-1][1]+lty*c).toFixed(1)+
     " "+(B[n-1][0]+ltx*c).toFixed(1)+" "+(B[n-1][1]+lty*c).toFixed(1)+
     " "+B[n-1][0].toFixed(1)+" "+B[n-1][1].toFixed(1);
  for(let i=n-2;i>=0;i--) d+=" L"+B[i][0].toFixed(1)+" "+B[i][1].toFixed(1);
  return d+" Z";
}
function digit(P,w0,w1,p){
  const d=taperD(P,w0,w1);
  el("path",{d:d,fill:"none",stroke:"#7d2f18","stroke-width":"3",
    "stroke-linejoin":"round",opacity:".55"},p);
  el("path",{d:d,fill:SKIN_DARK,stroke:"#1a0d08","stroke-width":".8"},p);
  const hi=[]; for(let i=0;i<P.length;i++) hi.push([P[i][0],P[i][1]-w0*.22]);
  el("path",{d:taperD(hi,w0*.3,w1*.22),fill:SKIN_LIT},p);
}
function limb(d,w,p){
  el("path",{d:d,fill:"none",stroke:"#7d2f18","stroke-width":(w+4).toFixed(1),

}

function throwBills(n){
  let made=0;
  for(let i=0;i<bills.length&&made<n;i++){
    if(liveBills>=GFX.billMax) break;
    const b=bills[i];
    if(b.live) continue;
    b.live=1; b.life=0;
    b.x=Math.random()<.5?-30:1030;
    b.y=250+Math.random()*120;
    b.vx=(b.x<0?1:-1)*(4.2+Math.random()*3.4);
    b.vy=-(3.2+Math.random()*2.6);
    b.rot=Math.random()*360; b.spin=(Math.random()-.5)*16;
    made++; liveBills++;
  }
}
function driveBills(f){
  for(let i=0;i<bills.length;i++){
    const b=bills[i];
    if(!b.live) continue;
    b.life+=f;
    b.vy+=.11*f; b.vx*=Math.pow(.988,f);
    b.x+=b.vx*f; b.y+=b.vy*f; b.rot+=b.spin*f;
    if(b.y>470||b.life>260){ b.live=0; liveBills--; b.g.setAttribute("opacity","0"); continue; }
    b.g.setAttribute("opacity",Math.min(1,b.life/8).toFixed(2));
    b.g.setAttribute("transform","translate("+b.x.toFixed(1)+","+b.y.toFixed(1)+
      ") rotate("+b.rot.toFixed(1)+") scale("+(1+Math.sin(b.rot*.03)*.28).toFixed(3)+",1)");
  }
}

const NECK_ZONE_X=402;
function zoneOf(p){
  if(!p) return null;
  if(p.x<NECK_ZONE_X) return (p.y>-190&&p.y<210)?"neck":null;
  return (p.y>-260&&p.y<260&&p.x<980)?"pick":null;
}
function fretFromX(x){
  let best=0, bd=1e9;
  for(let i=0;i<FX.length;i++){ const d=Math.abs(x-FX[i]); if(d<bd){ bd=d; best=i; } }
  return best;
}
let fretPid=null, pickPid=null, lastPerpY=0, tapPid=false;
const STROKE_MIN=11, STROKE_COOL=52;

function setFret(i,when){
  const n=Math.max(0,Math.min(FX.length-1,i));
  if(n!==S.fret){
    const jump=Math.abs(n-S.fret);
    S.fret=n; S.ring=Math.max(S.ring,.18); S.lastFretT=performance.now();
    /* Greifen, während die Saite noch klingt, ändert den Ton, ohne dass
       die Trzalica etwas tut — bei kräftigem Aufsetzen hört man den
       Aufschlag der Finger.                                             */
    fretChange(S.ring>.25&&jump<=2,when);
  }
  S.holding=true;
}
function doStroke(dir,power){
  const t=performance.now();
  if(t-S.strokeT<STROKE_COOL) return;
  S.strokeT=t; S.lastDir=dir;
  S.strumT=t; S.strumDir=dir; S.strumP=Math.max(.3,Math.min(1.4,power||1));
  S.strokes++;
  S.pickVel+=dir*7.5;
  S.ring=1;
  /* Die Kamera bleibt ruhig: kein Pendeln mehr bei jedem Schlag, nur ein
     kleiner Thump, wenn wirklich kräftig angeschlagen wurde.             */
  const pw=power||1, pun=INST().punch;
  if(pw>1.02) S.thumpVel-=(pw-1)*2.4*pun;
  S.pulse=Math.min(1,Math.max(S.pulse,(.5+pw*.3)*Math.min(1.15,pun)));
  pluck(dir,power);
  if(S.mode==="song") judgeStroke(t-S.t0);
  else{
    S.sparks.push({t:t,pos:S.fret});
    if(S.mode==="free") S.freeStrokes++;
  }
  if(S.lastStroke){
    const gap=t-S.lastStroke;
    if(gap<2200){
      S.gapN++; S.gapSum+=gap;
      if(S.gapN>1) S.gapDev+=Math.abs(gap-S.gapSum/S.gapN);
      if(S.mode==="free"){
        S.freeGaps.push(gap);
        if(S.freeGaps.length>10) S.freeGaps.shift();
      }
    }
  }
  S.lastStroke=t;
}
instSvg.addEventListener("pointerdown",function(e){

  if(S.mode==="demo"){ endDemo(); e.preventDefault(); return; }
  begin();
  const p=toLocal(e.clientX,e.clientY), z=zoneOf(p);
  if(z==="pick"&&pickPid===null){
    pickPid=e.pointerId; lastPerpY=p.y; tapPid=true;
    try{ instSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }else if(z==="neck"&&fretPid===null){
    fretPid=e.pointerId; setFret(fretFromX(p.x));
    try{ instSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }
});
instSvg.addEventListener("pointermove",function(e){
  if(S.paused) return;
  if(e.pointerId!==pickPid&&e.pointerId!==fretPid) return;
  const p=toLocal(e.clientX,e.clientY); if(!p) return;
  if(e.pointerId===pickPid){
    const dy=p.y-lastPerpY;
    S.pickY=Math.max(-52,Math.min(52,S.pickY+dy*.72));
    if(Math.abs(dy)>1){
      if(S.strokeAcc*dy<0) S.strokeAcc=0;
      S.strokeAcc+=dy;
      if(Math.abs(S.strokeAcc)>=STROKE_MIN){
        const power=Math.min(1.35,.55+Math.abs(S.strokeAcc)/26);
        doStroke(S.strokeAcc>0?1:-1,power);
        S.strokeAcc=0; tapPid=false;
      }
    }
    lastPerpY=p.y;
  }else setFret(fretFromX(p.x));
});
function release(e){

const held=[];

    begin(); const n=+e.key-1, i=held.indexOf(n);
    if(i>=0) held.splice(i,1);

  if(e.key==="0"){ held.length=0; S.fret=0; S.holding=false; }
  if(e.code==="Space"||e.key==="j"||e.key==="J"){ begin(); doStroke(1,1); e.preventDefault(); }
  if(e.key==="k"||e.key==="K"){ begin(); doStroke(-1,1); }
  if(e.key==="ArrowLeft"){ begin(); setFret(S.fret-1); }
  if(e.key==="ArrowRight"){ begin(); setFret(S.fret+1); }

const cv=document.getElementById("staff"), g2=cv.getContext("2d");
let W=0,H=0,HITX=70;
/* Ausdehnung des Instruments im Bühnenrahmen — daraus wird der Ausschnitt
   berechnet, damit auf jedem Seitenverhältnis möglichst viel davon steht. */
const INST_W=894, INST_H=300, INST_CX=465, INST_CY=216;
function frameInstrument(){
  const st=document.getElementById("stage");
  if(!st||!st.getBoundingClientRect) return;
  const r=st.getBoundingClientRect();
  if(!(r.width>8&&r.height>8)) return;
  /* Ausschnitt und Bühne bekommen dasselbe Seitenverhältnis: dann schneidet
     slice gar nichts weg. Die Breite wächst nur so weit mit, wie das flache
     Fenster es erzwingt — das Instrument bleibt so groß wie möglich.      */
  const R=r.width/r.height;
  const vbH=Math.max(INST_H, INST_W/R), vbW=vbH*R;
  instSvg.setAttribute("viewBox",
    (INST_CX-vbW/2).toFixed(1)+" "+(INST_CY-vbH/2).toFixed(1)+" "+
    vbW.toFixed(1)+" "+vbH.toFixed(1));
}
function fit(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  g2.setTransform(dpr,0,0,dpr,0,0);
  HITX=Math.max(56,Math.min(120,W*.13));
  // Vorlauf: langsamere Bahn heißt, die Note ist früher zu sehen
  PXMS=.20/LVL().lead;
  readFont();
  frameInstrument();
  checkOrient();
}
function checkOrient(){

}
