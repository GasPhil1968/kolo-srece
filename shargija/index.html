addEventListener("orientationchange",function(){ setTimeout(function(){ fit(); if(veilOpen) fitVeil(); },220); });
let PXMS=.20;
/* Die Schriftfamilie steht fest, sobald das Blatt geladen ist — sie
   jeden Frame neu zu erfragen erzwingt ein Style-Recalc.                  */
let FAM="Arial Narrow, Arial, sans-serif";
let FNT10='700 10px '+FAM, FNT12='700 12px '+FAM, FNT9='700 9px '+FAM;
function readFont(){
  try{
    const f=getComputedStyle(document.body).fontFamily;
    if(f) FAM=f;
  }catch(e){}
  FNT10='700 10px '+FAM; FNT12='700 12px '+FAM; FNT9='700 9px '+FAM;
}
/* Hat das Lied Text, wird unten eine Zeile für die Silben frei
   gehalten und die Bahn rückt entsprechend nach oben.                    */
let SYLLANE=0;
function ny(p){ return H-11-SYLLANE-(p/Math.max(1,FX.length-1))*(H-26-SYLLANE); }
function setSylLane(song){
  let has=false;
  if(song&&song.verses)
    for(let i=0;i<song.verses.length;i++) if(verseS(song.verses[i])){ has=true; break; }
  SYLLANE=has?10:0;
  // die Bahn wächst mit — fit() misst sie danach neu
  document.body.classList.toggle("lyr",has);
  fit();
}

/* Der Hintergrundverlauf wird einmal je Höhe gebaut; die veränderliche
   Stärke läuft über globalAlpha statt über einen frischen Gradient.      */
let staffGrad=null, staffGradH=0;
/* Notenmarker aus assets/: 20x20 logisch, die Form selbst hat Radius 6,5
   (Vorschlag 2,6). Solange ein Bild nicht geladen ist, malt drawStaff die
   Vektorform wie bisher.                                                 */
const NOTE_IMG={}, NOTE_BASE={diamond:6.5,open:6.5,grace:2.6};
function noteArt(kind,grade,x,y,r){
  const g=grade===2?"clean":grade===1?"near":grade===0?"miss":"normal";
  const id=kind+"_"+g;
  let im=NOTE_IMG[id];
  if(!im){ im=NOTE_IMG[id]=new Image(); im.src="assets/note_"+id+".png"; }
  if(!im.complete||!im.naturalWidth) return false;
  const s=20*r/NOTE_BASE[kind];
  g2.drawImage(im,x-s/2,y-s/2,s,s);
  return true;
}
function drawStaff(now){
  /* Die Bahn malt ihren dunklen Grund selbst, deckend — sie hängt damit
     nicht mehr am Seitenhintergrund. Browser mit erzwungenem Hell-Modus
     oder Invertierung fassen Canvas-Pixel nicht an; die Noten stehen
     immer auf Dunkel.                                                    */
  g2.fillStyle="#1b2640"; g2.fillRect(0,0,W,H);
  g2.lineCap="round"; g2.lineJoin="round";

  if(!staffGrad||staffGradH!==H){
    staffGrad=g2.createLinearGradient(0,0,0,H);
    staffGrad.addColorStop(0,"rgba(37,52,81,0)");
    staffGrad.addColorStop(1,"rgb(80,59,88)");
    staffGradH=H;
  }
  g2.globalAlpha=Math.min(1,.12+S.energy*.2+S.solo*.18);
  g2.fillStyle=staffGrad; g2.fillRect(0,0,W,H);
  g2.globalAlpha=1;

  // Bundlinien der Bahn
  for(let p=0;p<FX.length;p++){
    const y=ny(p);
    g2.strokeStyle=(p===0)?"rgba(244,234,214,.3)":"rgba(244,234,214,"+(.11+S.energy*.05).toFixed(3)+")";
    g2.lineWidth=1;
    g2.beginPath(); g2.moveTo(HITX-26,y); g2.lineTo(W,y); g2.stroke();
  }

  if((S.mode==="song"||S.mode==="demo")&&S.song){
    const s=S.song;
    // Taktraster: dünne Schläge, kräftige Taktstriche
    const G=S.notes.grid;
    const startT=1800-s.beat*2, endT=S.notes.length?S.notes[S.notes.length-1].t+s.beat*4:0;
    const firstK=G?0:Math.floor((now-HITX/PXMS-startT)/s.beat);
    const lastK=G?G.length-1:Math.ceil((now+(W-HITX)/PXMS-startT)/s.beat);
    const gT0=now-HITX/PXMS-8/PXMS, gT1=now+(W-HITX)/PXMS+8/PXMS;
    let k0=Math.max(0,firstK);
    if(G){ let lo=0, hi=G.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(G[m].t<gT0) lo=m+1; else hi=m; } k0=lo; }
    for(let k=k0;k<=lastK;k++){
      const tt=G?G[k].t:startT+k*s.beat;
      if(G?tt>gT1:tt>endT) break;
      const x=HITX+(tt-now)*PXMS;
      if(x<-8||x>W+8) continue;
      const inBar=G?G[k].k:k%s.meter;
      const bar=inBar===0;
      /* Im aksak trägt nicht nur die Eins: die Gruppengrenzen 3+2+2
         bekommen einen eigenen Strich, sonst sieht der Siebener aus wie
         ein schiefer Vierer.                                            */
      const A=BEAT_ACC[s.meter], heavy=!bar&&A&&A[inBar]>=1;
      g2.strokeStyle=bar?"rgba(240,168,60,.38)":
        (heavy?"rgba(240,168,60,.2)":"rgba(244,234,214,.12)");
      g2.lineWidth=bar?1.4:(heavy?1.2:1);
      g2.beginPath(); g2.moveTo(x,ny(7)-7); g2.lineTo(x,ny(0)+7); g2.stroke();
    }
    g2.font=FNT10; g2.textAlign="left";
    g2.fillStyle="rgba(244,234,214,.5)";
    g2.fillText(s.title.toUpperCase()+(S.verse?("  ·  "+TR("verseWord",S.verse)):""),0,10);

    for(let i=S.notes.length-1;i>=0;i--){
      const n=S.notes[i], x=HITX+(n.t-now)*PXMS;
      if(x<-70||x>W+70) continue;
      const y=ny(n.pos);
      let col="rgba(250,241,222,.9)";
      if(n.grade===2) col="#f0a83c";
      else if(n.grade===1) col="rgba(244,234,214,.6)";
      else if(n.grade===0) col="rgba(212,58,42,.9)";

      if(n.type===1){
        // Der Balken ist in so viele Abschnitte geteilt, wie Schläge nötig
        // sind. Jeder Treffer füllt einen davon — sichtbar 1/4, 2/4, 3/4.
        const w=n.dur*PXMS, seg=w/n.need, gap=Math.min(2.6,seg*.16);
        for(let k=0;k<n.need;k++){
          const x0=x+k*seg+gap*.5, x1=x+(k+1)*seg-gap*.5;
          if(x1<-60||x0>W+60) continue;
          const filled=k<n.strokes;
          if(n.grade!==null) g2.strokeStyle=col;
          else if(filled) g2.strokeStyle="#ffe9a8";
          else g2.strokeStyle="rgba(240,168,60,.5)";
          g2.lineWidth=filled&&n.grade===null?9:7;
          if(filled&&n.grade===null){
            g2.shadowBlur=8; g2.shadowColor="rgba(255,214,120,.8)";
          }
          g2.beginPath(); g2.moveTo(x0,y); g2.lineTo(Math.max(x0+1,x1),y); g2.stroke();
          g2.shadowBlur=0;
        }
        if(n.grade===null&&n.strokes>0&&x<W){
          g2.font=FNT9; g2.textAlign="center";
          g2.fillStyle=n.strokes>=n.need?"#f0a83c":"rgba(244,234,214,.85)";
          g2.fillText(Math.min(n.strokes,n.need)+"/"+n.need,x+w*.5,y-11);
        }
      }
      /* Der Vorschlag steht als kleiner Kopf davor, mit einem Strich zum
         Zielton — man sieht, dass die Hand zieht und nicht zweimal
         anschlägt.                                                       */
      if(n.orn>=0&&n.grade===null){
        const oy=ny(n.orn);
        g2.strokeStyle="rgba(240,168,60,.5)"; g2.lineWidth=1;
        g2.beginPath(); g2.moveTo(x-9,oy); g2.lineTo(x-2,y); g2.stroke();
        if(!noteArt("grace",null,x-9,oy,2.6)){
          g2.fillStyle="rgba(240,168,60,.6)";
          g2.beginPath(); g2.arc(x-9,oy,2.6,0,6.284); g2.fill();
        }
      }
      g2.shadowBlur=(n.grade===2)?14:0;
      g2.shadowColor="rgba(240,168,60,.95)";
      g2.fillStyle=col; g2.strokeStyle=col;
      const r=(n.type===1?4.5:6.5)*(n.acc?1.16:1);
      if(noteArt(n.pos===0?"open":"diamond",n.grade,x,y,r)){
        /* gemalter Marker aus assets/ (Engine-Grafiken v2) */
      }else if(n.pos===0){
        g2.lineWidth=n.acc?2.6:2; g2.beginPath(); g2.arc(x,y,r,0,6.284); g2.stroke();
      }else{
        g2.beginPath(); g2.moveTo(x,y-r); g2.lineTo(x+r,y);
        g2.lineTo(x,y+r); g2.lineTo(x-r,y); g2.closePath(); g2.fill();
      }
      g2.shadowBlur=0;
      /* Die Silbe läuft unter dem Ton mit. Melismen — mehrere Töne auf
         einer Silbe — bekommen einen Bindestrich statt eines Wortes.    */
      if(n.syl||n.melis){
        g2.font=FNT9; g2.textAlign="center";
        g2.fillStyle=(n.grade===2)?"rgba(240,168,60,.9)":"rgba(244,234,214,.5)";
        g2.fillText(n.melis?"·":n.syl, x, H-2.5);
      }
    }
  }

  // Trefferlinie
  g2.shadowBlur=10+S.solo*14; g2.shadowColor="rgba(217,144,131,.9)";
  g2.strokeStyle="rgba(217,144,131,"+(.7+S.solo*.28).toFixed(2)+")"; g2.lineWidth=2;
  g2.beginPath(); g2.moveTo(HITX+.5,2); g2.lineTo(HITX+.5,H-1); g2.stroke();
  g2.shadowBlur=0;

  // Der eigene Anschlag hinterlässt eine Spur
  const tNow=performance.now();
  for(let i=S.sparks.length-1;i>=0;i--){
    const sp=S.sparks[i], age=(tNow-sp.t)/700;
    if(age>=1){ S.sparks.splice(i,1); continue; }
    const x=HITX-(tNow-sp.t)*PXMS*.85, a=(1-age)*(1-age), y=ny(sp.pos);
    g2.strokeStyle="rgba(240,168,60,"+(a*.9).toFixed(3)+")";
    g2.lineWidth=3.2*a+.6;
    g2.shadowBlur=13*a; g2.shadowColor="rgba(255,214,120,.9)";
    g2.beginPath(); g2.moveTo(x,y); g2.lineTo(x+24*a+6,y); g2.stroke();
    g2.shadowBlur=0;
  }

  // Griffmarke: wo die linke Hand gerade steht
  const yy=ny(S.visFret);
  g2.shadowBlur=S.holding?14:0; g2.shadowColor="rgba(255,240,200,.95)";
  g2.fillStyle=S.holding?"#fff":"rgba(244,234,214,.55)";
  g2.beginPath(); g2.moveTo(HITX-12,yy-6.5); g2.lineTo(HITX-2,yy);
  g2.lineTo(HITX-12,yy+6.5); g2.closePath(); g2.fill(); g2.shadowBlur=0;

  if((S.mode==="song")&&LVL().show>1){
    const cur=S.curNote;
    if(cur&&cur.pos!==S.fret&&now>=cur.t-260){
      g2.fillStyle="rgba(212,58,42,.9)"; g2.textAlign="left";
      g2.font=FNT12;
      g2.fillText(cur.pos>S.fret?"▲":"▼",HITX-28,yy+5);
    }
  }
}

/* ═══════════ Lied ═══════════ */
/* Ein Vers wird in Noten zerlegt. buildSong setzt zwischen die Kitice eine
   Atempause, buildDrill lässt die Figur ohne Lücke weiterlaufen. rounds
   wiederholt die ganze Strophenfolge — so spielt die Demo das Lied in
   voller Länge, mit einem tieferen Atemzug zwischen den Strophen.         */
/* Eine Kitica kann als reine Zeichenkette oder als {p,s} kommen —
   p ist das Muster, s sind die Silben.                                   */
function verseP(v){ return (typeof v==="string")?v:v.p; }
function verseS(v){ return (typeof v==="string")?null:(v.s||null); }

// Bis zu zehn Bünde: der Tonvorrat kommt vom Lied, nicht vom Spiel.
const TOKRE=/^(?:([0-9])>)?([0-9])(!)?(\*{1,3})?$/;

/* Taktraster: jeder Platz einer Zeile bekommt einen Eintrag mit seiner
   Zeit und seiner Stelle im Takt. Danach richten sich die Taktstriche der
   Bahn, das Tempo der Tänzer und die Füllschläge der Demo — auch wenn das
   Tempo von Zeile zu Zeile anzieht.                                       */
function gridPush(out,t,beat,bi,meter,rest){
  if(out.grid) out.grid.push({t:t, b:beat, k:bi%(meter||4), rest:rest?1:0});
}
function parseVerse(v,beat,t,vi,out,meter){
  const pat=verseP(v), sl=verseS(v);
  const sy=sl?sl.split(/[\s-]+/):null;
  const toks=pat.split(/\s+/);
  const acc=BEAT_ACC[meter||0]||null;
  let si=0, bi=0;
  /* Ein Ton. adv ist der Platz, den er im Takt einnimmt; die Klanglänge
     ist etwas kürzer, damit zwischen zwei Tönen Luft bleibt.             */
  function put(tok,adv,strong){
    const m=TOKRE.exec(tok);
    if(!m){ t+=adv; return 0; }
    const stars=m[4]?m[4].length:0, beats=stars?stars+1:1;
    if(stars){ adv=beat*beats; for(let j=1;j<beats;j++) gridPush(out,t+beat*j,beat,bi+j,meter,0); }
    const s=sy?(sy[si++]||""):"";
    out.push({ t:t, dur:stars?adv:adv*.92, pos:+m[2],
      orn:m[1]?+m[1]:-1, acc:(m[3]||strong)?1:0,
      syl:(s==="~")?"":s, melis:(s==="~")?1:0,
      type:stars?1:0, need:stars?beats*2:1, strokes:0,
      fdev:0, fn:0, dt:0, grade:null, verse:vi, beat:bi });
    t+=adv;
    return beats;
  }
  for(let i=0;i<toks.length;i++){
    const slot=toks[i];
    /* Die schweren Schläge des Metrums: im Kolo tragen sie die Figur.   */
    const strong=acc?(acc[bi%acc.length]>=1?1:0):0;
    gridPush(out,t,beat,bi,meter,slot==="."||slot==="");
    if(slot===""||slot==="."){ t+=beat; bi++; continue; }
    if(slot==="-"){ if(out.length) out[out.length-1].dur+=beat; t+=beat; bi++; continue; }
    if(slot.indexOf("+")>0){
      // Achtel und Triolen: der Schlag wird gleichmäßig geteilt
      const sub=slot.split("+"), d=beat/sub.length;
      for(let k=0;k<sub.length;k++){
        if(sub[k]==="."){ t+=d; continue; }
        if(sub[k]==="-"){ if(out.length) out[out.length-1].dur+=d; t+=d; continue; }
        put(sub[k], d, k===0?strong:0);
      }
      bi++; continue;
    }
    bi+=put(slot, beat, strong);
  }
  return t;
}
/* Die Zeilen schließen im Takt aneinander an — vorher lagen 1,6 Schläge
   Stille dazwischen, die jede Zeile aus dem Raster geschoben haben. Atem
   steht schon in den Zeilen selbst (". ." am Zeilenende). Ein Kolo zieht
   über das ganze Stück gleichmäßig an (song.accel).                      */
function buildSong(song,onlyVerse,rounds){
  const out=[]; out.grid=[]; let t=1800;
  const R=onlyVerse?1:Math.max(1,rounds||1);
  const src=onlyVerse?[song.verses[onlyVerse-1]]:song.verses;
  const total=R*src.length; let n=0;
  for(let r=0;r<R;r++){
    src.forEach(function(v,vi0){
      const vi=onlyVerse?onlyVerse:(vi0+1);
      const p=total>1?n/(total-1):0; n++;
      const beat=song.beat/(1+(song.accel||0)*p);
      t=parseVerse(v,beat,t,vi,out,song.meter);
    });
  }
  // ein Takt Nachlauf, damit das Raster nicht mit dem letzten Ton abreißt
  const last=out.grid.length?out.grid[out.grid.length-1].b:song.beat;
  for(let k=0;k<song.meter;k++){ gridPush(out,t,last,k,song.meter,1); t+=last; }
  out.grid.end=t;
  return out;
}
/* Das Tempo, das gerade gilt: der Rasterabstand an der Stelle now.       */
function beatAt(now){
  const g=S.notes&&S.notes.grid;
  if(!g||!g.length) return S.song?S.song.beat:440;
  let lo=0, hi=g.length-1;
  while(lo<hi){ const m=(lo+hi+1)>>1; if(g[m].t<=now) lo=m; else hi=m-1; }
  return g[lo].b;
}
/* Übung: dieselbe Figur läuft ohne Pause durch, bis die Zeit voll ist.   */
const DRILL_MS=30000;
function buildDrill(d,ms){
  const out=[]; let t=1600, rep=0;
  while(t<1600+(ms||DRILL_MS)&&rep<200){
    t=parseVerse(d.pat,d.beat,t,++rep,out,d.meter);
    if(d.gap) t+=d.beat*d.gap;
  }
  return out;
}
const judgeEl=document.getElementById("judge");
function flash(txt,col){
  judgeEl.textContent=txt; judgeEl.style.color=col; judgeEl.style.opacity=1;
  clearTimeout(S.judgeTimer);
  S.judgeTimer=setTimeout(function(){ judgeEl.style.opacity=0; },420);
}
const burstEl=document.getElementById("burst");
let burstT=0;
function burst(txt){ burstEl.textContent=txt; burstT=performance.now(); }
const flareEl=document.getElementById("flare");
let flareT=0;
function flareSweep(){ if(!reduce) flareT=performance.now(); }

/* Woran es lag: Timing und Bund können beide falsch gewesen sein — dann
   stehen beide da (KASNO · PRAG III). Der Hinweis kommt nur nach BLIZU
   und PROMAŠAJ; bei ČISTO gibt es nichts zu lernen.                       */
function reason(n,dt,fd){
  if(fd>=9) return "";                                  // gar nicht geschlagen
  const parts=[];
  if(Math.abs(dt)>=12) parts.push(dt<0?TR("rEarly"):TR("rLate"));
  if(fd>0) parts.push(TR("rFret",ROMAN[n.pos]));
  return parts.length?" · "+parts.join(" · "):"";
}
function applyGrade(n,grade,dt,fd){
  const mult=S.bec?2:1, tNow=performance.now(), lvl=LVL();
  n.grade=grade; n.dt=dt;
  S.total++;
  S.fretSum+=(fd===0?1:(fd<=1?.4:0)); S.fretN++;
  if(grade>0){ S.devSum+=Math.abs(dt); S.devN++; }
  if(grade===2){
    S.score+=(100+S.combo*4)*mult; S.combo++; S.clean++; S.verseClean++;
    if(n.type===1){ S.score+=60*mult; S.prebirDone++; flash(TR("techPrebir")+"!","#f0a83c"); }
    /* Wer sauber spielt, soll spielen, nicht lesen: nach den ersten zehn
       sauberen Treffern trägt der Goldblitz die Meldung allein.          */
    else if(S.clean<=10) flash(TR("jClean"),"#f0a83c");
    S.flash=1; S.edgeFlash=1; S.sheenT=tNow;
    S.sparks.push({t:tNow,pos:n.pos});
    BEAMS.forEach(function(b){ b.snap=tNow; });
  }else if(grade===1){
    S.score+=40*mult; S.near++;
    S.combo=Math.floor(S.combo*lvl.nearKeep);
    flash(TR("jNear")+reason(n,dt,fd),"rgba(244,234,214,.85)");
  }else{
    S.combo=0; S.miss++; flash(TR("jMiss")+reason(n,dt,fd),"#d43a2a");
    S.dim=1; S.energy*=.35;
  }
  S.maxCombo=Math.max(S.maxCombo,S.combo);
  document.getElementById("scoreOut").textContent=S.score;

  while(S.nextCall<S.calls.length&&S.combo>=S.calls[S.nextCall][0]){
    const c=S.calls[S.nextCall];
    burst(c[1]); S.shake=Math.max(S.shake,.45);
    if(c[0]>=S.soloAt){
      // Der Bećar beginnt: das Publikum geht nur hier mit, nicht bei jedem Zuruf
      if(S.soloEnd<tNow) S.soloStart=tNow;
      S.soloEnd=Math.max(S.soloEnd,tNow+SOLO_MS);
      flareSweep(); roar(1); S.shake=Math.max(S.shake,.7);
    }
    S.nextCall++;
  }
  if(S.combo===0) S.nextCall=0;
  else while(S.nextCall>0&&S.combo<S.calls[S.nextCall-1][0]) S.nextCall--;
}
function judgeStroke(now){
  const lvl=LVL();
  /* Die zeitlich nächste offene Note bekommt den Schlag. Ein laufender
     Prebir hat Abstand null und gewinnt damit von selbst — ohne dass er
     dem Schlag davor die Wertung wegnimmt.                              */
  let best=null, bd=1e9;
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.grade!==null) continue;
    let d;
    if(n.type===1) d=(now<n.t)?(n.t-now):((now>n.t+n.dur)?(now-n.t-n.dur):0);
    else d=Math.abs(now-n.t);
    if(d<bd&&d<=lvl.nearMs+45){ bd=d; best=n; }
  }
  if(!best){ S.stray++; return; }
  if(best.type===1){
    const wasFull=best.strokes>=best.need;
    best.strokes++; best.fdev+=Math.abs(S.fret-best.pos); best.fn++;
    best.fillT=performance.now();
    if(!wasFull&&best.strokes>=best.need&&S.fret===best.pos) best.fullT=performance.now();
    S.sparks.push({t:performance.now(),pos:S.fret});
    return;
  }
  /* Bei einem Vorschlag ist beides richtig: wer auf dem Nebenbund
     anschlägt und auf den Zielbund zieht, spielt die Figur so, wie sie
     gemeint ist — und wer gleich den Zielbund greift, auch.            */
  const fd=(best.orn>=0)
    ? Math.min(Math.abs(S.fret-best.pos),Math.abs(S.fret-best.orn))
    : Math.abs(S.fret-best.pos);
  let grade;
  if(bd<=lvl.cleanMs&&fd===0) grade=2;
  else if(bd<=lvl.nearMs&&fd<=lvl.slack) grade=1;
  else grade=0;
  applyGrade(best,grade,now-best.t,fd);
  S.sparks.push({t:performance.now(),pos:S.fret});
}
function judgeFrame(now){
  const lvl=LVL(), grading=(S.mode==="song");
  while(S.head<S.notes.length&&S.notes[S.head].grade!==null) S.head++;
  for(let i=S.head;i<S.notes.length&&grading;i++){
    const n=S.notes[i];
    if(n.t-now>lvl.nearMs+120) break;            // alles Weitere ist noch fern
    if(n.grade!==null) continue;
    if(n.type===1){
      if(now>=n.t+n.dur){
        const r=n.strokes/n.need, fdAvg=n.fn?n.fdev/n.fn:9;
        let grade;
        if(r>=.8&&fdAvg<=.25) grade=2;
        else if(r>=.45&&fdAvg<=lvl.slack+.4) grade=1;
        else grade=0;
        applyGrade(n,grade,0,fdAvg<=.25?0:(fdAvg<=1.2?1:2));
      }else if(now>=n.t&&now<n.t+n.dur){
        n.fn++; n.fdev+=Math.abs(S.fret-n.pos);
      }
      continue;
    }
    if(now>n.t+lvl.nearMs+45) applyGrade(n,0,lvl.nearMs+50,9);
  }
  // Zielbund anzeigen — die Note wird einmal bestimmt und weitergereicht
  let cur=null;
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.t-now>420) break;
    if(n.grade===null&&now>=n.t-420&&now<n.t+n.dur){ cur=n; break; }
  }
  S.curNote=cur;
  /* Band und Marken hängen nur an der Zielnote — die wechselt ein paarmal
     pro Sekunde, nicht sechzigmal. Nur dann wird geschrieben.            */
  const curKey=(cur?cur.pos:-1)*10+lvl.show;
  if(curKey!==judgeFrame._k){
    judgeFrame._k=curKey;
    if(targetBand){
      if(cur&&lvl.show===2){
        const i=cur.pos, x0=(i===0?FX[0]-16:(FX[i]+FX[i-1])/2);
        const x1=(i<FX.length-1?(FX[i]+FX[i+1])/2:FX[i]+18);
        targetBand.setAttribute("x",x0.toFixed(1));
        targetBand.setAttribute("width",Math.max(10,x1-x0).toFixed(1));
        targetBand.setAttribute("opacity","1");
      }else targetBand.setAttribute("opacity","0");
    }
    for(let i=0;i<markGs.length;i++){
      const on=cur&&lvl.show>0&&i===cur.pos;
      markGs[i].pip.setAttribute("fill",on?"#f0a83c":"#8a7a5c");
      markGs[i].pip.setAttribute("opacity",on?"1":".55");
      markGs[i].tx.setAttribute("fill",on?"rgba(240,168,60,.95)":"rgba(244,234,214,.28)");
    }
  }
  if(cur&&cur.verse!==S.lastVerse){ S.lastVerse=cur.verse; }
  const last=S.notes[S.notes.length-1];
  /* Der letzte Ton ist ein kleiner Höhepunkt, kein mathematisches Ende:
     bei guter Vorstellung bleibt das Licht kurz stehen, das Publikum geht
     mit, ein Akkord hallt nach — erst dann kommt der Ergebnisschirm.     */
  if(last&&S.mode==="song"&&!S.drill&&!S.finale&&last.grade!==null&&now>last.t+last.dur+120){
    S.finale=1;
    const q=S.total?(S.clean+S.near*.5)/S.total:0;
    if(q>=.6){
      S.finaleGood=1;
      const tn=performance.now();
      S.energy=Math.max(S.energy,.6+q*.35); S.pulse=1;
      BEAMS.forEach(function(b){ b.snap=tn; });
      flareSweep(); roar(.35+q*.6);
      if(AC){ const keep=S.fret, kh=S.holding;
        S.fret=0; S.holding=false; pluck(1,.7); S.ring=1;
        S.fret=keep; S.holding=kh; }
    }
  }
  if(last&&now>last.t+last.dur+(S.finaleGood?2500:1600)){
    if(S.mode==="demo") endDemo(); else finish();
  }
}

/* ═══════════ Intro ═══════════ */
let introSkipWired=false;
const introEl=document.getElementById("intro"),
      iTitle=introEl.querySelector(".ititle"),
      iSubBox=introEl.querySelector(".isub"),
      iSub=introEl.querySelector(".isub span"),
      iTag=introEl.querySelector(".itag"),
      iCopy=introEl.querySelector(".icopy"),
      iSkip=introEl.querySelector(".iskip");
let introT=0;
/* Zwei Phrasen im Hidžaz, wie sie ein Spieler zum Einstimmen greift.
   Erste Phrase: Umspielung um die Quinte, Sprung in die Oktave, Abstieg.
   Nach einem Atemzug die Antwort, die zur leeren Saite hinunterführt.
   [Versatz in ms, Bund, Anschlagstärke]                                  */
const INTRO_MEL = [
  [   0, 4, 1.00 ], [ 145, 5, .65 ], [ 290, 4, .70 ], [ 435, 3, .80 ],
  [ 580, 2, .70 ], [ 725, 4, 1.00 ],
  [1000, 7, .90 ], [1145, 6, .65 ], [1290, 5, .70 ], [1435, 4, .90 ],
  [1980, 3, .85 ], [2125, 4, .60 ], [2270, 3, .70 ], [2415, 2, .75 ],
  [2560, 1, .60 ], [2705, 2, .70 ], [2850, 1, .65 ], [3050, 0, .95 ]
];
/* Nach dem Akkord noch ein kurzer Puls im Kolo-Takt, während die
   Scheinwerfer schneiden.                                                */
const INTRO_PULS = [
  [0, 4, .55 ], [150, 4, .40 ], [300, 5, .55 ], [450, 4, .40 ],
  [600, 3, .55 ], [750, 4, .45 ]
];
const MEL_T0=2900, MEL_END=MEL_T0+3450, PULS_T0=7480;
const IN_END=12200;
function ease(x){ return 1-Math.pow(1-x,3); }
function easeBack(x){ const c=2.0; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); }
function seg(e,a,b){ return Math.max(0,Math.min(1,(e-a)/(b-a))); }

function startIntro(){
  applyScaleOf(null);                       // das Vorspiel steht in Hidžaz
  introT=performance.now();
  if(!introSkipWired){
    introSkipWired=true;
    introEl.addEventListener("pointerdown",function(ev){
      begin(); endIntro(); ev.preventDefault(); ev.stopPropagation();
    });
  }
  document.body.classList.add("intro");
  fit();                                   // Bühne ist jetzt bildschirmfüllend
  introEl.classList.remove("done");
  introEl.style.display="flex";
  introEl.style.pointerEvents="auto";
  iTitle.style.opacity=0; iSubBox.style.height="0px";
  iSub.style.transform="translateY(100%)"; iSkip.style.opacity=0;
  iCopy.style.opacity=0; iSubBox.style.opacity=1;
  if(iTag){ iTag.style.opacity=0; iTag.style.transform="translateY(8px)"; }
  S.introSound={};
}
function endIntro(){
  if(!introT) return;
  introT=0;
  document.body.classList.remove("intro");
  fit();                                   // Kopfzeile und Notenbahn sind zurück
  introEl.classList.add("done");
  introEl.style.display="none";
  introEl.style.pointerEvents="none";
  blackoutEl.style.opacity=0;
  S.energy=0; S.fret=0; S.holding=false; S.pickY=0;
  camG.setAttribute("transform","");
  showMenu();
}
function driveIntro(t){
  const e=t-introT;
  if(e>=IN_END){ endIntro(); return false; }
  const snd=S.introSound;

  blackoutEl.style.opacity=(1-seg(e,150,900)*.92).toFixed(3);
  iSkip.style.opacity=(seg(e,900,1500)*(1-seg(e,8200,8800))).toFixed(3);

  // Die Lichterkette geht Birne für Birne an
  S.energy=seg(e,600,2700)*.38+seg(e,MEL_T0,MEL_END)*.32+seg(e,6350,7500)*.30;

  const s1=ease(seg(e,500,1800)), s2=ease(seg(e,1000,2300));
  BEAMS[0].el.style.transform="rotate("+(-58+46*s1).toFixed(2)+"deg)";
  BEAMS[0].el.style.opacity=(s1*.9).toFixed(3);
  BEAMS[1].el.style.transform="rotate("+(58-46*s2).toFixed(2)+"deg)";
  BEAMS[1].el.style.opacity=(s2*.9).toFixed(3);
  BEAMS[2].el.style.opacity=(seg(e,6200,6800)*.75).toFixed(3);
  BEAMS[2].el.style.transform="rotate("+(Math.sin(e*.004)*18).toFixed(2)+"deg)";

  // Die Šargija wird ins Bild gehoben und aufgesetzt
  const drop=seg(e,1900,2700);
  const dy=drop<1?(1-easeBack(drop))*-520:0;
  const dx=drop<1?(1-easeBack(drop))*-180:0;
  if(drop>=1&&!snd.thump){ snd.thump=1; thumpSnd(); S.shake=1; }
  const sh=reduce?0:(Math.random()-.5)*S.shake*7;
  camG.setAttribute("transform","translate("+(dx+sh).toFixed(2)+","+(dy+sh).toFixed(2)+")");

  // Die Melodie, Ton für Ton — die greifende Hand wandert sichtbar mit
  if(snd.mel===undefined) snd.mel=0;
  while(snd.mel<INTRO_MEL.length&&e>=MEL_T0+INTRO_MEL[snd.mel][0]){
    const n=INTRO_MEL[snd.mel], dir=(snd.mel%2)?-1:1;
    S.fret=n[1]; S.holding=n[1]>0;
    if(AC) pluck(dir,n[2]);
    S.ring=1; S.pickVel+=dir*6.5;
    S.pulse=Math.min(1,Math.max(S.pulse,.35+n[2]*.35));
    snd.mel++;
  }
  // Zum Schluss der volle Akkord auf der leeren Saite
  if(e>=MEL_END&&!snd.chord){
    snd.chord=1; S.fret=0; S.holding=false;
    if(AC) pluck(1,1.35);
    S.ring=1; roar(.9); S.shake=Math.max(S.shake,.6); throwBills(5);
  }
  // Der Puls unter den Lichtschnitten
  if(snd.puls===undefined) snd.puls=0;
  while(snd.puls<INTRO_PULS.length&&e>=PULS_T0+INTRO_PULS[snd.puls][0]){
    const n=INTRO_PULS[snd.puls], dir=(snd.puls%2)?-1:1;
    S.fret=n[1]; S.holding=n[1]>0;
    if(AC) pluck(dir,n[2]);
    S.ring=Math.max(S.ring,.8); S.pickVel+=dir*4;
    snd.puls++;
  }

  const ti=seg(e,6400,6950);
  iTitle.style.opacity=Math.min(1,ti*1.6).toFixed(3);
  iTitle.style.letterSpacing=(0.5-0.535*ease(ti)).toFixed(3)+"em";
  iTitle.style.transform="scaleX(.82) scale("+(1.2-.2*ease(ti)).toFixed(3)+")";
  if(ti>=1&&!snd.flare){ snd.flare=1; flareSweep(); }
  iCopy.style.opacity=(seg(e,9700,10200)).toFixed(3);
  const su=seg(e,6850,7300);
  iSubBox.style.height=(su*24).toFixed(1)+"px";
  iSub.style.transform="translateY("+((1-ease(su))*100).toFixed(1)+"%)";

  // Die Signatur kommt zuletzt, auf einem einzelnen leisen Oberton
  const tg=seg(e,8600,9300);
  if(iTag){
    iTag.style.opacity=tg.toFixed(3);
    iTag.style.transform="translateY("+((1-ease(tg))*8).toFixed(2)+"px)";
  }
  if(tg>0&&!snd.tag){
    snd.tag=1;
    if(AC){ S.fret=7; pluck(1,.45); S.fret=0; }
    S.ring=Math.max(S.ring,.6);
  }

  if(e>7450&&e<8600){
    const cut=Math.floor(e/250);
    if(cut!==S.lastCut){
      S.lastCut=cut;
      BEAMS.forEach(function(b,i){
        b.el.style.transform="rotate("+((i-1)*24+((cut*41+i*17)%29)-14)+"deg)";
        b.el.style.opacity=((cut+i)%2?.35:1).toFixed(2);
      });
      S.pulse=1;
    }
  }
  const out=seg(e,10800,12200);
  if(out>0){
    iTitle.style.opacity=(1-out).toFixed(3);
    iSubBox.style.opacity=(1-out).toFixed(3);
    iCopy.style.opacity=(1-out).toFixed(3);
    if(iTag) iTag.style.opacity=(1-out).toFixed(3);
    BEAMS.forEach(function(b){ b.el.style.opacity=(.85*(1-out)+.2).toFixed(3); });
  }
  return true;
}

/* ═══════════ Demo: die Šargija spielt selbst ═══════════ */
/* Die Demo spielt wie ein Mensch, nicht wie ein Metronom: betonte
   Schläge kommen kräftiger, unbetonte leichter, und jeder Ton liegt ein
   paar Millisekunden neben dem Raster. Am Zeilenende atmet sie kurz.
   Ohne das klingt auch die beste Melodie nach Tastatur.                  */
function demoDrive(now){
  if(!S.song) return;
  /* Im Kolo hört die rechte Hand bei einer Pause nicht auf: ein leichter
     Schlag auf dem gehaltenen Bund hält den Tanz in Gang.               */
  const G=S.notes.grid;
  if(S.song.dance&&G){
    while(S.fillI<G.length&&G[S.fillI].t<=now-14){
      const g=G[S.fillI++];
      if(g.rest&&now-g.t<60&&S.fillI<G.length-S.song.meter) doStroke(-1,.42+Math.random()*.08);
    }
  }
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.done) continue;
    if(now>=n.t+(n.hum||0)-14){
      if(n.type===1){
        const k=Math.floor((now-n.t)/(n.dur/n.need));
        if(k>=n.sub){
          n.sub=(n.sub||0)+1;
          S.fret=n.pos; S.holding=n.pos>0;
          // Prebir: der erste Anschlag trägt, die folgenden tragen nach
          doStroke(n.sub%2?1:-1,(n.sub===1?1.05:.72)+Math.random()*.1);
          if(n.sub>=n.need) n.done=1;
        }
        break;
      }
      n.done=1;
      const p=(n.acc?1.18:.8)+Math.random()*.13;
      const dir=(i%2?1:-1);
      if(n.orn>=0){
        /* Vorschlag: angeschlagen wird auf dem Nebenton, gezogen wird
           auf den Zielton. Ein Anschlag, zwei Tonhöhen.                 */
        S.fret=n.orn; S.holding=true;
        doStroke(dir,p);
        const to=n.pos;
        setTimeout(function(){
          if(S.mode==="demo"&&!S.paused) setFret(to);
        },Math.max(45,Math.min(120,n.dur*.26)));
      }else{
        S.fret=n.pos; S.holding=n.pos>0;
        doStroke(dir,p);
      }
      break;
    }
    break;
  }
}
function startDemo(i,verse){
  begin(); resetRun();
  const s=SONGS[i];
  S.songIdx=i; S.verse=verse||0; S.drill=null;
  applyScaleOf(s);
  S.mode="demo"; S.song=s; S.notes=buildSong(s,S.verse,s.rounds); setSylLane(s);
  S.t0=performance.now(); S.paused=false;
  /* Menschliches Timing: ein leichter Zufall auf jedem Ton, dazu ein
     Zögern vor dem ersten Ton jeder Zeile — so atmet die Melodie.      */
  let lastV=-1;
  S.notes.forEach(function(n){
    n.done=0; n.sub=0;
    n.hum=(Math.random()-.45)*16;
    // Zögern vor jeder Zeile nur im Sevdah — ein Kolo stolpert davon.
    if(n.verse!==lastV){ lastV=n.verse; if(!s.dance) n.hum+=22; }
  });
  S.fillI=0;
  document.getElementById("modeLabel").textContent="DEMO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=TR("hintDemo",s.title.toUpperCase());
  stopBtn.style.display="block";
  setVeil(false); fit();
}
function endDemo(){
  S.mode="idle"; S.soloEnd=0; S.fret=0; S.holding=false;
  stopBtn.style.display="none";
  multEl.style.opacity=0; hintEl.className="";
  showMenu();
}
/* Der Ausstieg aus der Demo darf nicht versteckt sein: ein eigener Knopf
   auf der Bühne, zusätzlich zum Kopfzeilen-MENU und zum Tippen.          */
const stopBtn=document.getElementById("stopBtn");
stopBtn.addEventListener("pointerdown",function(e){
  e.preventDefault(); e.stopPropagation();
  if(S.mode==="demo") endDemo();
});

/* ═══════════ Schleife ═══════════ */
const strumFx=document.getElementById("strumFx");
const fretHandG=document.getElementById("fretHand"),
      pickHandG=document.getElementById("pickHand"),
      camG=document.getElementById("cam"),
      scaleG=document.getElementById("scaleG"),
      multEl=document.getElementById("mult"),
      hintEl=document.getElementById("hint");
let prev=performance.now(), hintT=0, wasSolo=false;
let veilOpen=false;
function setVeil(on){
  veilOpen=on;
  if(on){ veil.classList.remove("hidden"); requestAnimationFrame(fitVeil); }
  else veil.classList.add("hidden");
}
/* Kein Scrollen, nirgends: passt ein Bildschirm nicht in die Höhe, wird
   sein gesamter Inhalt gleichmäßig verkleinert. Die Media-Query macht die
   Karten vorher schon kompakter, das hier ist das Sicherheitsnetz.       */
function fitVeil(){
  if(!veilOpen||!inner) return;
  inner.style.transform="";
  const need=inner.scrollHeight, have=inner.clientHeight;
  if(need>have+2){
    const k=Math.max(.55,have/need);
    inner.style.transform="scale("+k.toFixed(3)+")";
  }
}
/* Das Spiel läuft mit voller Bildrate, die Dekoration in einem eigenen,
   langsameren Takt. decoF ist der auf 16.7 ms normierte Faktor für genau
   diesen Takt, damit Physik und Bewegung gleich schnell bleiben.          */
let decoT=0, decoF=2, liveBills=0, staffT=0;
let frameSum=0, frameN=0, gfxHold=0, spikeN=0, hotWins=0, coolWins=0;

/* Nicht nur der Durchschnitt zählt: einzelne 35–60-ms-Aussetzer fühlen
   sich am Handy schlimmer an als ein etwas müder Schnitt. Darum: schon
   ab ~17,5 ms über zwei Fenster herunterregeln, bei echten Spikes sofort
   — und erst nach mehreren ruhigen Fenstern wieder hoch, damit die
   Qualität nicht hin- und herspringt.                                     */
function measure(dt){
  frameSum+=dt; frameN++;
  if(dt>34) spikeN++;
  if(frameN<48) return;
  const avg=frameSum/frameN, spikes=spikeN;
  /* Auch außerhalb von AUTO wird gemessen: der Wert kostet nichts und
     sagt beim Nachstellen sofort, ob eine Änderung Zeit gekostet hat.  */
  GFX.avgMs=Math.round(avg*10)/10; GFX.spikes=spikes;
  frameSum=0; frameN=0; spikeN=0;
  if(GFX.mode!=="auto") return;
  if(gfxHold>0){ gfxHold--; return; }
  if(!GFX.low){
    if(avg>21||spikes>=4){ GFX.low=true; applyGfx(); gfxHold=6; hotWins=0; }
    else if(avg>17.5){ if(++hotWins>=2){ GFX.low=true; applyGfx(); gfxHold=6; hotWins=0; } }
    else hotWins=0;
  }else{
    if(avg<12.5&&spikes===0){
      if(++coolWins>=6){ GFX.low=false; applyGfx(); gfxHold=10; coolWins=0; }
    }else coolWins=0;
  }
}
/* SVG- und Style-Schreibzugriffe nur, wenn sich der Wert wirklich ändert —
   der Browser invalidiert sonst auch bei identischem Wert.                */
function sattr(el,k,v){ const c=el.__a||(el.__a={}); if(c[k]!==v){ c[k]=v; el.setAttribute(k,v); } }
function sstyle(el,k,v){ const c=el.__s||(el.__s={}); if(c[k]!==v){ c[k]=v; el.style[k]=v; } }

/* Ein einziger laufender Bildtakt. Ohne diese Klammer könnten nach einem
   Wechsel in den Vordergrund zwei Schleifen nebeneinander laufen — das
   sieht man sofort an der doppelten Geschwindigkeit.                     */
let rafId=0;
function schedule(){
  if(rafId||hidden) return;
  rafId=requestAnimationFrame(function(t){ rafId=0; loop(t); });
}
function loop(t){
  if(hidden) return;                    // im Hintergrund wird nicht gemalt
  const dt=Math.min(60,t-prev); prev=t;
  const f=dt/16.7;
  const songNow=(S.mode==="song"||S.mode==="demo")?t-S.t0:0;

  // Startschirm und Menü decken die Bühne vollständig ab — dann ist jede
  // Animation dahinter verschenkte Rechenzeit.
  if(gateOpen||(!introT&&veilOpen)){ schedule(); return; }
  measure(dt);

  const deco=(t-decoT)>=GFX.decoMs;
  if(deco){ decoF=Math.min(4.5,(t-decoT)/16.7); decoT=t; }

  if(!S.paused&&S.mode==="demo") demoDrive(songNow);

  S.visFret+=(S.fret-S.visFret)*Math.min(1,dt/58);
  if(Math.abs(S.fret-S.visFret)<.003) S.visFret=S.fret;
  S.ring*=Math.pow(.955,f);
  if(S.ring<.004) S.ring=0;

  /* Der Bećar läuft als Bogen ab: knapp drei Sekunden Aufbau, dann die
     volle Bühne, in den letzten zwei Sekunden beruhigt sich das Licht
     wieder. Erst dadurch wirkt er wie ein Höhepunkt und nicht wie ein
     Schalter, der Effekte anwirft.                                        */
  const soloOn=t<S.soloEnd&&S.mode!=="idle";
  S.bec=soloOn;
  let env=0, su=0;
  if(soloOn&&S.soloStart){
    su=Math.min(1,Math.max(0,(t-S.soloStart)/Math.max(1,S.soloEnd-S.soloStart)));
    const rise=Math.min(1,su/.26), fall=Math.min(1,(1-su)/.20);
    env=Math.pow(rise,.7)*(.42+.58*Math.pow(fall,.9));
  }else if(soloOn) env=1;
  S.solo+=(env-S.solo)*(env>S.solo?.10:.05)*f;
  if(S.solo<.004&&!soloOn) S.solo=0;
  S.pulse*=Math.pow(.9,f);

  /* Slobodno bekommt einen Bogen: je sauberer und regelmäßiger der Spieler
     spielt, desto weiter geht die Bühne mit — erst ruhig, dann Lampions
     und Kolo, hält er das Gleichmaß lange genug, kommt der Bećar von
     selbst. Hört er auf, beruhigt sich alles wieder.                     */
  if(S.mode==="free"&&deco){
    let g=0;
    if(S.freeGaps.length>=5&&t-S.lastStroke<1500){
      let m=0;
      for(let i=0;i<S.freeGaps.length;i++) m+=S.freeGaps[i];
      m/=S.freeGaps.length;
      let dv=0;
      for(let i=0;i<S.freeGaps.length;i++) dv+=Math.abs(S.freeGaps[i]-m);
      dv/=S.freeGaps.length;
      if(m>0) g=Math.max(0,Math.min(1,1-2.2*(dv/m)));
    }else if(t-S.lastStroke>1500) S.freeGaps.length=0;
    S.freeG+=(g-S.freeG)*(g>S.freeG?.14:.06);
    if(S.freeG>.7&&t-S.lastStroke<900){
      S.freeHot+=decoF*16.7;
      if(S.freeHot>6500&&t>S.soloEnd+9000){
        S.freeHot=0; S.soloStart=t; S.soloEnd=t+9000;
        burst("BEĆAR"); roar(.8); flareSweep();
      }
    }else S.freeHot=Math.max(0,S.freeHot-decoF*33);
  }

  let drive=Math.max(S.ring*.5,Math.min(1,S.combo/10),S.solo);
  if(S.mode==="free") drive=Math.max(drive,S.freeG*.85);
  if(S.drill) drive=Math.min(drive,.4);          // Übung bleibt ruhig
  S.energy+=(drive-S.energy)*(drive>S.energy?.12:.03)*f;
  S.dim*=Math.pow(.9,f); S.flash*=Math.pow(.88,f); S.edgeFlash*=Math.pow(.9,f);
  S.shake*=Math.pow(.86,f);
  if(soloOn!==wasSolo){
    wasSolo=soloOn;
    multEl.style.opacity=soloOn?1:0;
    hintEl.textContent=soloOn?"BEĆAR":
      (S.drill?TR("dh"+S.drill.i).toUpperCase():
       (S.mode==="song"?TR("hintSong"):TR("hintFree")));
    hintEl.className=soloOn?"solo":"";
  }
  if(soloOn){
    // Bakšiš fliegt erst, wenn die Bühne oben ist, und hört vor dem Ende auf
    if(su>.22&&su<.78){
      if(!S.billsOpen){ S.billsOpen=1; throwBills(6); }
      else if(Math.random()<.03*f) throwBills(1);
    }
    // letzte zwei Sekunden: der Zähler blinkt, dann sauberer Ausstieg
    if(S.soloEnd-t<2000) multEl.style.opacity=(.35+.65*Math.abs(Math.sin(t*.009))).toFixed(2);
    else multEl.style.opacity=1;
  }else S.billsOpen=0;

  /* ── Physik ── */
  S.swingVel+=(-S.swing*.075-S.swingVel*.14)*f;  S.swing+=S.swingVel*f;
  S.thumpVel+=(-S.thump*.09-S.thumpVel*.16)*f;   S.thump+=S.thumpVel*f;
  if(pickPid===null&&S.mode!=="demo"){
    S.pickVel+=(-S.pickY*.055-S.pickVel*.17)*f;
    S.pickY+=S.pickVel*f;
  }else if(S.mode==="demo"){
    S.pickVel+=(-S.pickY*.06-S.pickVel*.2)*f;
    S.pickY+=S.pickVel*f;
  }
  S.pickY=Math.max(-58,Math.min(58,S.pickY));

  S.zoomVel+=((S.solo-S.zoom)*.085-S.zoomVel*.115)*f;
  S.zoom+=S.zoomVel*f;
  if(Math.abs(S.thump)<.004&&Math.abs(S.thumpVel)<.004){ S.thump=0; S.thumpVel=0; }
  if(!S.solo&&Math.abs(S.zoom)<.002&&Math.abs(S.zoomVel)<.002){ S.zoom=0; S.zoomVel=0; }
  /* Die Kamera bewegt sich nur noch zu einem Grund: kurzer Thump beim
     kräftigen Anschlag, Zoom im Bećar, Wackeln allein bei den großen
     Momenten (Zurufe, Bećar-Start). Das wirkt hochwertiger und spart
     Rendering — im Sparsam-Modus steht sie ganz still.                   */
  const shk=(reduce||GFX.thrift||S.shake<.12)?0:(Math.random()-.5)*S.shake*4;
  const sx=shk+S.thump*.6;
  const sy=shk-S.zoom*22+S.thump;
  const rot=reduce?0:S.zoom*1.2;
  const sc=1+S.zoom*.16+S.flash*.01;
  if(!introT) sattr(camG,"transform",
    "translate("+sx.toFixed(1)+","+sy.toFixed(1)+")");
  sattr(scaleG,"transform",
    "translate(500,240) scale("+sc.toFixed(3)+") rotate("+rot.toFixed(2)+") translate(-500,-240)");

  /* ── Saiten, Hände ── */
  if(Math.abs(S.pickY)<.05&&Math.abs(S.pickVel)<.02&&pickPid===null){ S.pickY=0; S.pickVel=0; }
  /* Je höher gegriffen, desto kürzer und schneller zittert die Saite.  */
  const fx=(function(){
    const i=Math.max(0,Math.min(FX.length-1,Math.floor(S.visFret)));
    const j=Math.min(FX.length-1,i+1);
    return FX[i]+(FX[j]-FX[i])*(S.visFret-i);
  })();
  const rate=.085*(1+S.visFret*.085);
  const wob=reduce?0:Math.round(Math.sin(t*rate)*S.ring*130*(1-S.visFret*.045))/10;
  const fxq=Math.round(fx);
  if(wob!==updateStrings._w||fxq!==updateStrings._f){
    updateStrings._w=wob; updateStrings._f=fxq; updateStrings(wob,t,fxq);
  }
  const melCol=(S.ring>.5||S.solo>.4)?"#ffe9a8":"#e6dcc4";
  for(let i=0;i<melEls.length;i++) sattr(melEls[i],"stroke",melCol);

  let hx=0;
  { const i=Math.max(0,Math.min(FX.length-1,Math.floor(S.visFret)));
    const j=Math.min(FX.length-1,i+1);
    hx=FX[i]+(FX[j]-FX[i])*(S.visFret-i); }
  sattr(fretHandG,"transform","translate("+hx.toFixed(1)+",0)");
  sattr(fretHandG,"opacity",S.holding?"1":(S.visFret>.06?".5":"0"));
  sattr(pickHandG,"transform","translate(0,"+S.pickY.toFixed(1)+")");

  /* Die Trzalica hinterlässt einen kurzen Streifen über den Saiten —
     das ist der einzige sichtbare Beleg dafür, dass gerade angeschlagen
     wurde, und macht schnelle Läufe erst lesbar.                        */
  if(strumFx){
    const e=S.strumT?(t-S.strumT)/165:2;
    if(e<1){
      const R=stringRows(), n=R.nut.length;
      const x=548, u=x/SLEN;
      const y0=R.nut[0]+(R.br[0]-R.nut[0])*u;
      const y1=R.nut[n-1]+(R.br[n-1]-R.nut[n-1])*u;
      const lean=S.strumDir*7*(1-e);
      const gr=(y1-y0)*.5, cy=(y0+y1)*.5;
      const a0=(x-lean).toFixed(1), a1=(x+lean*1.6).toFixed(1);
      sattr(strumFx,"d","M"+a0+" "+(cy-gr*1.25).toFixed(1)+
        " Q"+a1+" "+cy.toFixed(1)+" "+a0+" "+(cy+gr*1.25).toFixed(1));
      sattr(strumFx,"opacity",((1-e)*(1-e)*.75*S.strumP).toFixed(3));
      sattr(strumFx,"stroke-width",(1.6+S.strumP*1.6).toFixed(1));
    }else if(strumFx.__a&&strumFx.__a.opacity!=="0") sattr(strumFx,"opacity","0");
  }
  if(edgeFlashEl){
    // Ein Element mit Weichzeichner wird auch bei opacity 0 gefiltert —
    // darum wird es ganz ausgeblendet, sobald der Blitz verklungen ist.
    if(S.edgeFlash>.012){
      if(edgeFlashEl.style.display==="none") edgeFlashEl.style.display="";
      edgeFlashEl.setAttribute("opacity",(S.edgeFlash*.8).toFixed(3));
    }else if(edgeFlashEl.style.display!=="none"){
      edgeFlashEl.style.display="none"; edgeFlashEl.setAttribute("opacity","0");
    }
  }
  if(topSheen){
    if(S.sheenT){
      const e=(t-S.sheenT)/600;
      if(e>=1){ S.sheenT=0; topSheen.setAttribute("opacity","0"); }
      else{
        topSheen.setAttribute("opacity",(Math.sin(e*Math.PI)*.7).toFixed(3));
        topSheen.setAttribute("transform","translate("+((e-.5)*420).toFixed(1)+",0)");
      }
    }
  }

  /* ── Lichterkette ── */
  if(deco){
    const lvlNow=Math.max(S.energy,S.ring*.7);
    for(let r=0;r<bulbRows.length;r++){
      let on=.24+lvlNow*.62+S.pulse*.3;
      if(S.solo>.62) on*=((Math.floor(t/170)+r)%2)?1.25:.4;
      sattr(bulbRows[r],"opacity",Math.min(1,on).toFixed(2));
      sattr(haloRows[r],"opacity",Math.min(.9,on*.55).toFixed(2));
    }
  }

  /* ── Kolo ── */
  if(koloG&&deco){
    /* Ein Tanzschritt je Schlaggruppe: im 7/8 drei Schritte pro Takt
       (3+2+2), im 2/4 einer je Viertel, sonst einer je Schlag; zum Sevdah
       wiegen sie nur, halb so schnell. Die Phase
       wird aufsummiert — zieht das Tempo an, tanzen sie schneller, ohne
       zu springen.                                                      */
    let rate=.0011;
    if(S.song&&(S.mode==="song"||S.mode==="demo")){
      const m=S.song.meter, step=beatAt(songNow)*(m===7?7/3:m===2?2:1)*(S.song.dance?1:2);
      rate=Math.PI/(step*2);
    }
    const dtK=Math.min(100,Math.max(0,t-(S.koloT||t))); S.koloT=t;
    S.koloPh=(S.koloPh||0)+dtK*rate;
    const ph=S.koloPh;
    const act=.25+S.energy*1.0+S.solo*.6+S.pulse*.3;
    sattr(koloG,"transform","translate("+(Math.sin(ph)*20*act).toFixed(1)+
      ","+(Math.abs(Math.sin(ph*2))*-5*act).toFixed(1)+")");
    for(let i=0;i<dancers.length;i++){
      const d=dancers[i], s=Math.sin(ph*2+d.ph);
      sattr(d.legs,"transform","rotate("+(s*7*act).toFixed(1)+" 0 0)");
      sattr(d.bob,"transform","rotate("+(Math.sin(ph+d.ph)*3*act).toFixed(1)+" 0 0)");
    }
  }
  if(liveBills&&deco) driveBills(decoF);

  /* ── Scheinwerfer ── */
  const speedK=.9+S.energy*2.2+S.solo*2;
  if(S.solo>.62&&!introT){
    const bt=S.song?beatAt(songNow):440;
    const cut=Math.floor((t-(S.song?S.t0:0))/(bt*.5));
    if(cut!==S.lastCut){
      S.lastCut=cut; S.cutFlip=cut%2;
      BEAMS.forEach(function(b,i){ b.cut=(i-1)*20+((cut*37+i*53)%27)-13; b.snap=0; });
      S.pulse=Math.min(1,S.pulse+.4);
    }
  }else if(!introT) S.lastCut=-1;
  if(!introT&&deco) BEAMS.forEach(function(b,i){
    let want=b.base+Math.sin(t*b.rate*speedK+b.ph)*b.amp*(.8+S.energy*1.1+S.solo*.9);
    if(S.solo>.62&&b.cut!==undefined) want=b.cut;
    if(b.snap&&t-b.snap<320) want=b.aimAt;
    const ez=(b.snap&&t-b.snap<320)?.24:(S.solo>.62?.34:.06);
    b.cur+=(want-b.cur)*ez*decoF;
    let on=(i===2?(S.energy*.6+S.solo*.85):(.19+S.energy*.66+S.solo*.62))+S.pulse*.2;
    if(S.solo>.62) on*=(i===2?(S.cutFlip?1.2:.35):(S.cutFlip?.45:1.15));
    sstyle(b.el,"transform","rotate("+b.cur.toFixed(1)+"deg)");
    sstyle(b.el,"opacity",Math.min(1,on).toFixed(2));
  });
  if(deco){
    sstyle(warmEl,"opacity",(.28+S.energy*.62+S.solo*.55+S.pulse*.16).toFixed(2));
    if(!GFX.thrift){
      sstyle(haze1,"opacity",(.05+S.energy*.17+S.solo*.13).toFixed(2));
      sstyle(haze2,"opacity",(.03+S.energy*.13+S.solo*.11).toFixed(2));
    }
  }
  sstyle(blackoutEl,"opacity",(S.dim*.34+S.solo*.12).toFixed(2));

  /* ── Spiegelbilder ── */
  if(ghostL&&GFX.ghosts){
    if(S.solo>.02){
      ghostsG.style.display="block";
      const sp=1.12+S.solo*.34, sway=Math.sin(t*.0016)*54*S.solo;
      const gx=INST_CX, gy=INST_CY;
      ghostL.setAttribute("transform","translate("+(gx-sway)+","+gy+") scale("+
        (-sp).toFixed(3)+","+sp.toFixed(3)+") translate(-"+gx+",-"+gy+")");
      ghostR.setAttribute("transform","translate("+(gx+sway)+","+gy+") scale("+
        sp.toFixed(3)+","+sp.toFixed(3)+") translate(-"+gx+",-"+gy+")");
      ghostsG.setAttribute("opacity",(S.solo*(.16+Math.sin(t*.003)*.07)).toFixed(3));
    }else if(ghostsG.style.display!=="none"){
      ghostsG.style.display="none"; ghostsG.setAttribute("opacity","0");
    }
  }

  if(zoneHint){
    const e=hintT?(t-hintT)/4200:1;
    sattr(zoneHint,"opacity",e>=1?"0":(Math.min(1,(1-e)*2.6)*.7).toFixed(2));
  }
  if(burstT){
    const e=(t-burstT)/900;
    if(e>=1){ burstT=0; burstEl.style.opacity=0; }
    else{
      burstEl.style.opacity=(Math.sin(Math.min(1,e*3)*Math.PI*.5)*(1-e)*1.25).toFixed(3);
      burstEl.style.transform="scaleX(.8) scale("+(1+e*.16).toFixed(3)+")";
    }
  }
  if(flareT){
    const e=(t-flareT)/620;
    if(e>=1){ flareT=0; flareEl.style.opacity=0; }
    else{
      flareEl.style.opacity=(Math.sin(e*Math.PI)*.75).toFixed(3);
      flareEl.style.transform="translateX("+((e-.5)*70).toFixed(1)+"%)";
    }
  }

  if(introT&&driveIntro(t)){ schedule(); return; }

  /* Die Wertung braucht jede Millisekunde, die Notenbahn nicht: gezeichnet
     wird sie mit ~30 FPS (Sparsam: 25) — visuell nicht zu unterscheiden,
     Rechenzeit für Instrument und Ton bleibt frei.                        */
  const staffDue=(t-staffT)>=GFX.staffMs;
  if((S.mode==="song"||S.mode==="demo")&&!S.paused){
    judgeFrame(songNow);
    if(staffDue){ staffT=t; drawStaff(songNow); }
  }else if(S.mode==="free"){
    if(staffDue){ staffT=t; drawStaff(t); }
  }else if(S.mode==="song"&&S.paused&&staffDue){
    staffT=t; drawStaff(S.pauseAt-S.t0);
  }

  schedule();
}

/* Der kleine Genre-Hinweis auf der Karte: Eigennamen bleiben, Technik-
   und Tempoangaben sprechen die Sprache der Oberfläche.                  */
function glossOf(sg){
  /* Moj dilbere hatte in der alten, frei gesetzten Fassung einen Prebir.
     Die Abschrift hat keinen — also steht dort auch keiner mehr.        */
  if(sg.id==="kol") return "7/8 · "+TR("fast");
  return sg.gloss;
}
/* Die erste Textzeile auf der Karte: man weiß sofort, welches Lied das
   ist — und beim Spielen weiß man, wo man im Text steht.                */
function firstLine(sg){
  if(sg.line) return sg.line;
  for(let i=0;i<sg.verses.length;i++){
    const t=verseS(sg.verses[i]);
    if(!t) continue;
    // aus "Sej-de-fu maj-ka ~ bu-đa-še" wird "Sejdefu majka buđaše"
    return t.split(/\s+/).map(function(w){
      return w.replace(/~/g,"").replace(/-/g,"");
    }).filter(function(w){ return w.length; }).join(" ");
  }
  return "";
}
function scrSongs(){
  let h=shead(TR("mSongs"),TR("noteSongs"))+'<div class="cards" id="cards"></div>'+
    '<p class="howto" style="color:rgba(244,234,214,.3);margin-top:10px;font-size:8px">'+
    TR("srcNote")+'</p>';
  inner.innerHTML=h;
  wireBack("main");
  const c=inner.querySelector("#cards");
  SONGS.forEach(function(sg,i){
    const best=DB.best[sg.id]||0, acc=DB.bestAcc[sg.id];
    const card=document.createElement("div"); card.className="card";
    card.innerHTML='<div class="ct">'+sg.title+'</div>'+
      '<div class="cg">'+glossOf(sg)+' · '+TR("versesN",sg.verses.length)+'<br>'+
      (best?('<em>'+best+'</em>'+(acc?' · '+acc+'%':'')):TR("unplayed"))+'</div>'+
      (firstLine(sg)?'<div class="clyr">'+firstLine(sg)+'</div>':'')+
      '<div class="kits"></div>'+
      '<div class="crow"><button class="p">'+TR("play")+'</button>'+
      '<button class="d" aria-label="'+TR("demo")+'"><svg viewBox="0 0 24 24" width="12" height="12" '+
      'aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/></svg></button></div>';
    const kits=card.querySelector(".kits");
    let sel=0;                                   // 0 = ganzes Lied
    function mkKit(label,v){
      const b=document.createElement("button");
      b.textContent=label; b.setAttribute("aria-pressed",v===sel);
      b.onclick=function(){
        sel=v;
        kits.querySelectorAll("button").forEach(function(x,k){
          x.setAttribute("aria-pressed",k===v);
        });
      };
      kits.appendChild(b);
    }
    mkKit(TR("all"),0);
    for(let v=1;v<=sg.verses.length;v++) mkKit(String(v),v);
    card.querySelector(".p").onclick=function(){ startSong(i,sel); };
    card.querySelector(".d").onclick=function(ev){ ev.stopPropagation(); startDemo(i,sel); };
    c.appendChild(card);
  });
}

/* GROOVE: nicht wie weit ein einzelner Schlag daneben lag, sondern wie
   gleichmäßig die Schläge zueinander standen. Wer konstant 60 ms spät ist,
   groovt — wer wild streut, nicht. gapSum/gapDev liegen schon vor.        */
function grooveVal(){
  if(S.gapN<6) return null;
  const avg=S.gapSum/S.gapN, dev=S.gapDev/Math.max(1,S.gapN-1);
  if(avg<=0) return null;
  return Math.max(0,Math.min(1,1-1.7*(dev/avg)));
}
/* Schwache Stellen: die Kitica mit den meisten Fehlern wird zur kurzen
   Übung — 15–20 Sekunden, leicht entschleunigt, ohne Feuerwerk.           */
const WEAK={si:0,vi:0,hint:2};
function weakSpot(){
  if(!S.song||S.drill||S.total<6) return null;
  const vb={};
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    const bad=(n.grade===0)?2:((n.grade===1)?1:0);
    if(bad) vb[n.verse]=(vb[n.verse]||0)+bad;
  }
  let wv=0, wb=0;
  for(const k in vb) if(vb[k]>wb){ wb=vb[k]; wv=+k; }
  if(wb<2||!SONGS[S.songIdx]||!SONGS[S.songIdx].verses[wv-1]) return null;
  return wv;
}
function startWeakDrill(si,vi,hint){
  const s=SONGS[si]; if(!s||!s.verses[vi-1]) return;
  WEAK.si=si; WEAK.vi=vi; WEAK.hint=hint;
  begin(); resetRun();
  const d={ i:hint, id:"slaba:"+s.id, name:TR("weakName"),
            beat:Math.round(s.beat*1.05), meter:s.meter,
            pat:s.verses[vi-1], gap:1, custom:1 };
  applyScaleOf(s);                          // dieselben Bünde wie im Lied
  S.drill=d; S.songIdx=si; S.verse=0;
  S.song={ id:d.id, title:s.title+" · "+TR("verseWord",vi), gloss:TR("weakName"),
           beat:d.beat, meter:d.meter, scale:s.scale, tonic:s.tonic,
           verses:[d.pat] };
  S.notes=buildDrill(d,18000); setSylLane(S.song);
  S.calls=[];
  S.t0=performance.now(); S.paused=false;
  S.mode="song";
  document.getElementById("modeLabel").textContent=TR("weakName");
  document.getElementById("scoreOut").textContent="0";
  hintEl.textContent=TR("dh"+d.i).toUpperCase();
  setVeil(false); fit();
}

function finish(){
  const s=S.song; S.mode="idle"; S.soloEnd=0; S.bec=false;
  multEl.style.opacity=0; hintEl.className="";
  const lvl=LVL();
  if(S.drill){ finishDrill(); return; }
  const prsti=S.fretN?S.fretSum/S.fretN:0;
  const trz=S.devN?Math.max(0,1-(S.devSum/S.devN)/lvl.nearMs):0;
  const hitRate=S.total?(S.clean+S.near*.5)/S.total:0;
  const strayPen=S.total?Math.min(.5,S.stray/(S.total+1)*.7):0;
  const ritam=Math.max(0,hitRate-strayPen);
  const acc=S.total?Math.round(S.clean/S.total*100):0;
  const groove=grooveVal();
  const weakV=weakSpot();
  /* Die schwächste der drei Wertungen bestimmt den Übungshinweis. */
  let weakHint=2;
  if(prsti<=trz&&prsti<=ritam) weakHint=0;
  else if(ritam<=trz) weakHint=1;

  const prevBest=DB.best[s.id]||0, isBest=S.score>prevBest;
  if(isBest) DB.best[s.id]=S.score;
  if(acc>(DB.bestAcc[s.id]||0)) DB.bestAcc[s.id]=acc;
  if(S.maxCombo>DB.bestCombo) DB.bestCombo=S.maxCombo;
  DB.totalScore+=S.score;
  dbSave();

  const perfect=S.miss===0&&S.near===0;
  let h='<div class="shead"><h2>'+TR("done")+'</h2><span class="note">'+
    s.title.toUpperCase()+(S.verse?("  ·  "+TR("verseWord",S.verse)):"")+
    '</span><button class="back" id="backTo">MENU</button></div>';
  h+='<div class="cols"><div>';
  h+='<p class="tally">'+TR("scoreW")+' <b>'+S.score+'</b>'+(isBest?' <span class="hot">· '+TR("newBest")+'</span>':'')+
     '<br>'+TR("jClean")+' <b>'+S.clean+'</b> · '+TR("jNear")+' <b>'+S.near+'</b> · '+TR("jMiss")+' <b>'+S.miss+'</b>'+
     '<br>'+TR("runW")+' <b>'+S.maxCombo+'</b> · '+TR("strokesW")+' <b>'+S.strokes+'</b>'+
     (S.prebirDone?' · '+TR("techPrebir")+' <b>'+S.prebirDone+'</b>':'')+
     '<br>'+TR("totalW")+' <b>'+DB.totalScore+'</b>'+
     (perfect?'<br><span class="hot">'+TR("perfect")+'</span>':'')+'</p>';
  h+='<div class="rule"></div>';
  const meters=[[TR("m0"),prsti],[TR("m1"),trz],[TR("m2"),ritam]];
  if(groove!==null) meters.push(["GROOVE",groove]);
  meters.forEach(function(m){
    h+='<div class="meter"><span>'+m[0]+'</span><i><b style="width:'+pct(m[1])+
       '%"></b></i><em>'+pct(m[1])+'</em></div>';
  });
  h+='</div><div>';
  h+='<p class="eyebrow">'+TR("resAgain")+'</p>';
  if(weakV) h+='<button class="big" id="weakBtn" style="border-color:var(--amber);'+
    'background:rgba(240,168,60,.12)">'+TR("weakBtn")+'<span style="font-weight:400;'+
    'letter-spacing:.12em"> · '+TR("verseWord",weakV)+'</span></button>';
  h+='<button class="big'+(weakV?' q':'')+'" id="againBtn">'+
     (S.verse?TR("btnRepeatVerse",S.verse):TR("btnRepeatSong"))+'</button>';
  if(S.verse) h+='<button class="big q" id="wholeBtn">'+TR("btnWhole")+'</button>';
  h+='<button class="big q" id="songsBtn">'+TR("btnOther")+'</button>';
  h+='<button class="big q" id="freeBtn">'+TR("btnFree")+'</button>';
  h+='</div></div>';
  inner.innerHTML=h;
  const idx=S.songIdx, vs=S.verse;
  const bk=inner.querySelector("#backTo"); if(bk) bk.onclick=showMenu;
  const wk=inner.querySelector("#weakBtn");
  if(wk) wk.onclick=function(){ startWeakDrill(idx,weakV,weakHint); };
  inner.querySelector("#againBtn").onclick=function(){ startSong(idx,vs); };
  const wb=inner.querySelector("#wholeBtn");
  if(wb) wb.onclick=function(){ startSong(idx,0); };
  inner.querySelector("#songsBtn").onclick=function(){ showScreen("songs"); };
  inner.querySelector("#freeBtn").onclick=startFree;
  setVeil(true);
}

/* Übung: keine Bestenliste, keine Feier — nur die drei Zahlen, an denen
   man tatsächlich ablesen kann, ob es besser geworden ist.               */
function finishDrill(){
  const d=S.drill, lvl=LVL();
  const prsti=S.fretN?S.fretSum/S.fretN:0;
  const trz=S.devN?Math.max(0,1-(S.devSum/S.devN)/lvl.nearMs):0;
  const hitRate=S.total?(S.clean+S.near*.5)/S.total:0;
  const strayPen=S.total?Math.min(.5,S.stray/(S.total+1)*.7):0;
  const ritam=Math.max(0,hitRate-strayPen);
  const acc=S.total?Math.round(S.clean/S.total*100):0;
  const groove=grooveVal();
  if(!DB.drill) DB.drill={};
  const prev=DB.drill[d.id]||0, isBest=acc>prev;
  if(isBest) DB.drill[d.id]=acc;
  dbSave();
  S.drill=null;

  let h='<div class="shead"><h2>'+(d.custom?TR("weakName"):TR("mDrill"))+'</h2><span class="note">'+
    (S.song?S.song.title.toUpperCase():d.name)+
    '</span><button class="back" id="backTo">MENU</button></div>';
  h+='<div class="cols"><div>';
  h+='<p class="tally">'+TR("acc")+' <b>'+acc+'%</b>'+(isBest?' <span class="hot">· '+TR("betterBefore")+'</span>':
     (prev?' <span style="color:rgba(244,234,214,.4)">· '+TR("before",prev)+'</span>':''))+
     '<br>'+TR("jClean")+' <b>'+S.clean+'</b> · '+TR("jNear")+' <b>'+S.near+'</b> · '+TR("jMiss")+' <b>'+S.miss+'</b>'+
     '<br>'+TR("strokesW")+' <b>'+S.strokes+'</b> · '+TR("strayW")+' <b>'+S.stray+'</b></p>';
  h+='<div class="rule"></div>';
  const meters=[[TR("m0"),prsti],[TR("m1"),trz],[TR("m2"),ritam]];
  if(groove!==null) meters.push(["GROOVE",groove]);
  meters.forEach(function(m){
    h+='<div class="meter"><span>'+m[0]+'</span><i><b style="width:'+pct(m[1])+
       '%"></b></i><em>'+pct(m[1])+'</em></div>';
  });
  h+='</div><div>';
  h+='<p class="howto" style="color:rgba(244,234,214,.45)">'+TR("dh"+d.i)+'</p>';
  h+='<button class="big" id="againBtn">'+TR("resAgain")+'</button>';
  if(d.custom) h+='<button class="big q" id="wholeBtn">'+TR("btnRepeatSong")+'</button>';
  h+='<button class="big q" id="otherBtn">'+TR("otherDrill")+'</button>';
  h+='</div></div>';
  inner.innerHTML=h;
  const idx=S.songIdx;
  const bk=inner.querySelector("#backTo"); if(bk) bk.onclick=showMenu;
  inner.querySelector("#againBtn").onclick=d.custom?
    function(){ startWeakDrill(WEAK.si,WEAK.vi,WEAK.hint); }:
    function(){ startDrill(idx); };
  const wb=inner.querySelector("#wholeBtn");
  if(wb) wb.onclick=function(){ startSong(WEAK.si,0); };
  inner.querySelector("#otherBtn").onclick=function(){ showScreen("drill"); };
  setVeil(true);
}

   Ton keinen Zuhörer — beides wird angehalten. Auf dem Handy ist das der

/* Bewusst wird nur auf den Wechsel gehört, nicht auf den Anfangswert:
   manche eingebettete Ansichten melden von Beginn an "verborgen", obwohl
   sie sichtbar sind. Und falls doch einmal falsch gemeldet wird, holt
   jede Berührung das Bild zurück.                                        */
let hidden=false;
addEventListener("pointerdown",function(){
  if(hidden){ hidden=false; prev=performance.now(); schedule(); }
},{passive:true,capture:true});
document.addEventListener("visibilitychange",function(){
  hidden=document.hidden;
  if(hidden){
    if(AC&&AC.state==="running"&&AC.suspend) try{ AC.suspend(); }catch(e){}
    if(S.mode==="song"&&!S.paused) goPause();
  }else{
    if(S.started&&AC&&AC.state!=="running"&&AC.resume) try{ AC.resume(); }catch(e){}
    prev=performance.now();
    schedule();
  }
});

/* Werkbank: nur mit #dev in der Adresse. Damit lässt sich der Klang von
   außen anstoßen und offline ausrechnen, ohne dass im normalen Betrieb
   etwas nach außen sichtbar wird.                                       */
function devRender(secs,events,instIdx){
  const SR=48000;
  const OC=new OfflineAudioContext(2,Math.round(SR*secs),SR);
  const url=URL.createObjectURL(new Blob([STRING_DSP],{type:"text/javascript"}));
  const keep={AC:AC,master:master,bodyIn:bodyIn,roomGain:roomGain,
              noiseBuf:noiseBuf,strNode:strNode,strGain:strGain,
              workletOn:workletOn,STRSET:STRSET,inst:S.inst,fret:S.fret};
  return OC.audioWorklet.addModule(url).then(function(){
    AC=OC;
    const g=buildGraph(OC);
    master=g.master; bodyIn=g.bodyIn; roomGain=g.room;
    noiseBuf=g.noise; strGain=g.str;
    strNode=new AudioWorkletNode(OC,"sargija-zice",
      {numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
    strNode.connect(strGain);
    workletOn=true;
    if(instIdx!==undefined) S.inst=instIdx;
    applyInstrument();
    events.forEach(function(e){
      if(e.tie){ S.fret=e.f; fretChange(false,e.t); return; }
      S.fret=e.f; S.lastFretT=performance.now()-(e.fresh?0:500);
      pluck(e.d||1, e.p===undefined?1:e.p, e.t);
    });
    return OC.startRendering();
  }).then(function(buf){
    AC=keep.AC; master=keep.master; bodyIn=keep.bodyIn; roomGain=keep.roomGain;
    noiseBuf=keep.noiseBuf; strNode=keep.strNode; strGain=keep.strGain;
    workletOn=keep.workletOn; STRSET=keep.STRSET; S.inst=keep.inst; S.fret=keep.fret;
    try{ URL.revokeObjectURL(url); }catch(e){}
    return buf;
  });
}

};
