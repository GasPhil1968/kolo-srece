<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e0a">
<meta name="color-scheme" content="light">
<title>APARAT — Nacional detektor</title>
<meta name="description" content="Samo aparat i jedno dugme. Drži dugme: aparat mjeri. Pusti: nauka presudi. Model ND-84, TLN Elektronika.">

<style>
  :root{
    color-scheme:light;
    --night:#120e0a; --cream:#f2e8d2; --amber:#f0a83c; --ember:#d43a2a; --green:#7dff9a;
    --cond:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow",Impact,sans-serif;
    --epic:"Palatino Linotype",Palatino,"Iowan Old Style","Times New Roman",Georgia,serif;
    --mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 22%,#b3a189,#8f7d67 55%,#6b5a49 100%);color:#2a2118;
    font-family:var(--cond);overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:fixed;width:100%}

  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}

  h1{margin:34px 0 0;font-family:var(--epic);font-size:clamp(22px,6.6vw,32px);font-weight:700;
    letter-spacing:.04em;white-space:nowrap;color:#2b1e10;
    text-shadow:0 1px 0 rgba(255,246,224,.5),0 -1px 1px rgba(20,12,4,.5)}
  .sub{font-family:var(--epic);font-size:clamp(10px,2.9vw,13px);letter-spacing:.16em;white-space:nowrap;
    color:#7c4a10;margin-top:6px;text-shadow:0 1px 0 rgba(255,246,224,.35)}

  #device{flex:1 1 auto;min-height:0;width:100%;max-width:430px;display:block}

  #verdict{height:26px;line-height:26px;padding:0 14px;border-radius:4px;
    font:700 15px var(--mono);letter-spacing:.12em;color:#ff6650;background:#171009;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
    text-shadow:0 0 10px rgba(255,80,50,.8);opacity:0;transition:opacity .25s}
  #verdict.show{opacity:1;animation:blinkV .4s steps(2) 5}
  @keyframes blinkV{50%{opacity:.3}}
  #komentar{height:15px;margin-top:5px;font-size:9.5px;letter-spacing:.2em;
    color:rgba(36,26,16,.65);opacity:0;transition:opacity .3s .25s}
  #komentar.show{opacity:1}

  #btn{margin-top:6px;width:118px;height:118px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 38% 32%,#f16a54,var(--ember) 55%,#7c1c12 100%);
    box-shadow:0 8px 0 #4a0f08,0 14px 30px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.35);
    color:#2a0a05;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.18em;line-height:1.4}
  #btn:active,#btn.down{transform:translateY(6px);box-shadow:0 2px 0 #4a0f08,0 6px 14px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.25)}
  .hint{margin-top:12px;font-size:9.5px;letter-spacing:.22em;color:rgba(36,26,16,.6)}

  /* Geraete-Animationen */
  @keyframes blinkR{50%{opacity:.15}}
  @keyframes blinkF{50%{opacity:.25}}
  .measuring #lampTop{animation:blinkR .18s steps(2) infinite}
  .measuring .lampSm{animation:blinkF .3s steps(2) infinite}
  @keyframes badgePulse{50%{filter:drop-shadow(0 0 3px rgba(255,215,106,.5))}}
  .measuring #badge{fill:url(#lensGlow);filter:drop-shadow(0 0 9px rgba(255,215,106,.95));
    animation:badgePulse .3s ease-in-out infinite}
  #lampTop,.lampSm{opacity:.15}
  .done #lampTop{opacity:1}

  /* Mehr Leben: Schweben, Zittern, Rueckstoss, Funken, Blitz */
  #dryerAnim,#cable,#grill,#sparks{transform-box:fill-box;transform-origin:50% 50%}
  #cable{transform-origin:50% 0%}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  body:not(.measuring):not(.done) #dryerAnim{animation:floaty 3.6s ease-in-out infinite}
  @keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(.9px,-.6px) rotate(1deg)}
    50%{transform:translate(-.8px,.5px) rotate(-.9deg)}75%{transform:translate(.5px,.8px) rotate(.7deg)}
    100%{transform:translate(-.6px,-.5px) rotate(-.6deg)}}
  .measuring #dryerAnim{animation:shake .1s linear infinite}
  @keyframes recoil{0%{transform:rotate(0)}25%{transform:translateY(-8px) rotate(-5deg)}
    60%{transform:translateY(2px) rotate(2deg)}100%{transform:none}}
  .done #dryerAnim{animation:recoil .55s cubic-bezier(.2,.9,.3,1.2) 1}
  @keyframes cableWag{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  .measuring #cable{animation:cableWag .22s ease-in-out infinite alternate}
  @keyframes grillBuzz{from{transform:translateY(-.7px)}to{transform:translateY(.7px)}}
  .measuring #grill{animation:grillBuzz .07s linear infinite}
  @keyframes standby{0%,70%,100%{opacity:.15}82%{opacity:.7}}
  body:not(.measuring) #lampReady{animation:standby 2.8s infinite}
  #sparks{opacity:0;pointer-events:none}
  @keyframes spark{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
  .done #sparks{animation:spark .6s ease-out 1}
  @keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  body:not(.measuring):not(.done) #btn:not(.down):not(:active){animation:btnPulse 2.8s ease-in-out infinite}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 35%,rgba(255,70,40,.85),rgba(255,70,40,0) 70%)}
  @keyframes flashK{0%{opacity:.55}100%{opacity:0}}
  .done #flash{animation:flashK .5s ease-out 1}
  @keyframes appShake{0%,100%{transform:none}20%{transform:translate(3px,-2px)}
    40%{transform:translate(-3px,2px)}60%{transform:translate(2px,1px)}80%{transform:translate(-2px,-1px)}}
  .done #app{animation:appShake .4s linear 1}
  /* Rauch, wenn der Aparat verrueckt spielt */
  .puff{opacity:0;fill:rgba(120,110,100,.6);transform-box:fill-box;transform-origin:50% 50%}
  @keyframes puffUp{0%{opacity:.85;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-36px) scale(1.9)}}
  .mad .puff{animation:puffUp 1.4s ease-out 1}
  .mad .puff:nth-child(2){animation-delay:.18s}
  .mad .puff:nth-child(3){animation-delay:.36s}
  @media (prefers-reduced-motion:reduce){
    #dryerAnim,#cable,#grill,#sparks,#btn,#app,#flash,#lampReady,.puff{animation:none!important}
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">
  <h1>NACIONAL DETEKTOR</h1>
  <div class="sub">MODEL ND-84 · TLN ELEKTRONIKA · SARAJEVO</div>

  <!-- Der Apparat: Feldstecher mit Kabel zum Bakelitkasten mit Zeiger und Lampen -->
  <svg id="device" viewBox="0 0 300 330" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <radialGradient id="drum" cx="32%" cy="26%">
        <stop offset="0%" stop-color="#6e6a63"/><stop offset="55%" stop-color="#2b2926"/><stop offset="100%" stop-color="#0f0d0b"/>
      </radialGradient>
      <radialGradient id="badgeIdle" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#e8d48a"/><stop offset="60%" stop-color="#b08f3c"/><stop offset="100%" stop-color="#6e5316"/>
      </radialGradient>
      <radialGradient id="lensGlow" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#ffe6a8"/><stop offset="55%" stop-color="#f0a83c"/><stop offset="100%" stop-color="#7c4a10"/>
      </radialGradient>
      <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6e6a63"/><stop offset="35%" stop-color="#2b2926"/><stop offset="75%" stop-color="#3d3a35"/><stop offset="100%" stop-color="#15130f"/>
      </linearGradient>
      <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6e5335"/><stop offset="20%" stop-color="#3d2d20"/><stop offset="100%" stop-color="#221709"/>
      </linearGradient>
      <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2a1e12" flood-opacity="0.55"/>
      </filter>
    </defs>

    <!-- Der Apparat: ein schwarzer Foehn, Trommel mit Gold-Emblem, Griff nach unten -->
    <g transform="translate(148 102) rotate(-8)" filter="url(#drop)">
      <g id="dryerAnim">
      <!-- Griff -->
      <path d="M -20 24 L -32 86 Q -34 98 -21 99 L -1 99 Q 9 98 8 87 L 6 26 Z"
            fill="url(#tube)" stroke="#000" stroke-width="2"/>
      <!-- Daumenschalter -->
      <rect x="-30" y="42" width="9" height="20" rx="4.5" fill="#c9a24a" stroke="#000" stroke-width="1.5"/>
      <!-- Gehaeuse: Uebergang von der Trommel in den Griff -->
      <path d="M -36 -10 Q -42 18 -18 30 L 8 30 Q 24 22 22 -2 Z"
            fill="url(#tube)" stroke="#000" stroke-width="2"/>
      <!-- Trommel -->
      <circle cx="0" cy="-34" r="52" fill="url(#drum)" stroke="#000" stroke-width="2.5"/>
      <circle cx="0" cy="-34" r="41" fill="none" stroke="#0c0a09" stroke-width="6" opacity=".85"/>
      <circle cx="0" cy="-34" r="29" fill="#191612" stroke="#000" stroke-width="1.5"/>
      <!-- Gold-Emblem -->
      <g transform="rotate(-16 0 -34)">
        <ellipse id="badge" cx="0" cy="-34" rx="21" ry="12.5" fill="url(#badgeIdle)" stroke="#3a2c0e" stroke-width="1.5"/>
        <ellipse cx="0" cy="-34" rx="16" ry="8.5" fill="none" stroke="rgba(30,22,6,.55)" stroke-width="1"/>
        <text x="0" y="-31.5" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="6.5" font-weight="700" letter-spacing="1" fill="#241a06">ND·84</text>
      </g>
      <!-- Glanz auf Plastik -->
      <path d="M -40 -62 Q -14 -82 16 -70" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/>
      <path d="M -26 8 Q -30 40 -26 70" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4" stroke-linecap="round"/>
      <!-- Kontrolllampe -->
      <circle id="lampTop" cx="15" cy="14" r="5" fill="#ff4433" stroke="#000" stroke-width="1"/>
      </g>
      <!-- Rauch aus der Trommel, wenn der Aparat verrueckt spielt -->
      <g transform="translate(0 -92)">
        <circle class="puff" cx="-10" cy="0" r="7"/>
        <circle class="puff" cx="4" cy="-4" r="9"/>
        <circle class="puff" cx="14" cy="2" r="6"/>
      </g>
      <!-- Funken beim Urteil, um die Trommel herum -->
      <g transform="translate(0 -34)">
        <g id="sparks" stroke="#f0a83c" stroke-width="3.5" stroke-linecap="round">
          <line x1="0" y1="-58" x2="0" y2="-74"/><line x1="41" y1="-41" x2="52" y2="-52"/>
          <line x1="58" y1="0" x2="74" y2="0"/><line x1="41" y1="41" x2="52" y2="52"/>
          <line x1="0" y1="58" x2="0" y2="74"/><line x1="-41" y1="41" x2="-52" y2="52"/>
          <line x1="-58" y1="0" x2="-74" y2="0"/><line x1="-41" y1="-41" x2="-52" y2="-52"/>
        </g>
      </g>
    </g>

    <!-- Spiralkabel vom Griff zum Kasten -->
    <g id="cable">
      <path d="M138 196 q -22 10 0 20 q 22 10 0 20"
            fill="none" stroke="#2b241c" stroke-width="7" stroke-linecap="round"/>
      <path d="M138 196 q -22 10 0 20 q 22 10 0 20"
            fill="none" stroke="#8a8175" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Bakelitkasten -->
    <g transform="translate(150 272)" filter="url(#drop)">
      <rect x="-92" y="-52" width="184" height="104" rx="10" fill="url(#box)" stroke="#000" stroke-width="2.5"/>
      <rect x="-92" y="-52" width="184" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <!-- Skala -->
      <g transform="translate(-38 6)">
        <path d="M-40 24 a40 40 0 0 1 80 0 z" fill="#f5ecd8" stroke="#000" stroke-width="2"/>
        <path d="M14 -6 A40 40 0 0 1 38 22 L 0 24 z" fill="rgba(212,58,42,.5)"/>
        <g stroke="#5a4c33"><line x1="-28" y1="-4" x2="-24" y2="0"/><line x1="0" y1="-15" x2="0" y2="-10"/><line x1="28" y1="-4" x2="24" y2="0"/></g>
        <line id="needle" x1="0" y1="24" x2="-30" y2="-2" stroke="#7c1f1f" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="24" r="5" fill="#171009"/>
        <text y="38" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-size="7" letter-spacing="2" fill="rgba(242,232,210,.5)">NACIOMETAR</text>
      </g>
      <!-- Lautsprechergrill -->
      <g id="grill" stroke="#000" stroke-width="2" opacity=".8">
        <line x1="30" y1="-38" x2="82" y2="-38"/><line x1="30" y1="-31" x2="82" y2="-31"/>
        <line x1="30" y1="-24" x2="82" y2="-24"/><line x1="30" y1="-17" x2="82" y2="-17"/>
      </g>
      <!-- Laempchen -->
      <circle class="lampSm" cx="40" cy="8" r="5" fill="#f0a83c"/>
      <circle class="lampSm" id="lampReady" cx="58" cy="8" r="5" fill="#7dff9a"/>
      <circle class="lampSm" cx="76" cy="8" r="5" fill="#ff4433"/>
      <text x="58" y="26" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-size="6.5" letter-spacing="1.5" fill="rgba(242,232,210,.45)">MJERENJE U TOKU</text>
      <!-- Typenschild -->
      <text x="-84" y="-38" text-anchor="start" font-family="Courier New,monospace" font-size="7" letter-spacing="1" fill="rgba(242,232,210,.35)">ND-84 · SL. GLASNIK BR. 7/84</text>
    </g>
  </svg>

  <div id="verdict">NALAZ: NACIONALISTA!</div>
  <div id="komentar">NAUKA JE REKLA SVOJE.</div>
  <button id="btn">PRITISNI<br>I DRŽI</button>
  <div class="hint">DRŽI: MJERI · PUSTI: PRESUDA · ZAMAHNI: SAM SE PALI</div>
</div>

<script>
'use strict';
/* Nur das Geraet und ein Knopf. Halten laesst den Apparat messen
   (steigendes Wabern + Geigerknacken), Loslassen liefert das Urteil. */

const btn = document.getElementById('btn');
const verdict = document.getElementById('verdict');
const komentar = document.getElementById('komentar');
const device = document.getElementById('device');
const needle = document.getElementById('needle');
const body = document.body;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Befunde aus dem Labor: der erste ist immer NACIONALISTA, danach wuerfelt die Nauka */
const VERDICTS = [
  { t: 'NALAZ: NACIONALISTA!',            c: '#ff6650', w: 5 },
  { t: 'NALAZ: DVOSTRUKI NACIONALISTA!!', c: '#ff4433', w: 1 },
  { t: 'NALAZ: ČIST KO SUZA',             c: '#7dff9a', w: 2 },
  { t: 'NALAZ: SUMNJIVO ČIST…',           c: '#f0a83c', w: 2 },
  { t: 'APARAT JE POLUDIO!',              c: '#ff6650', w: 1, mad: true },
];
const KOMENTARI = [
  'NAUKA JE REKLA SVOJE.', 'REZULTAT JE NEPOBITAN.', 'APARAT NE GRIJEŠI. NIKAD.',
  'PONOVITI POSLIJE KAFE.', 'MOLIM MIRNO STAJATI.', 'SLIJEDI STRUČNI KONSILIJ.',
];
let measureCount = 0;
function pickVerdict(){
  if(measureCount === 1) return VERDICTS[0];
  let sum = 0; for(const v of VERDICTS) sum += v.w;
  let r = Math.random() * sum;
  for(const v of VERDICTS){ if((r -= v.w) < 0) return v; }
  return VERDICTS[0];
}

let ac = null, noiseBuf = null;
function ctx(){
  if(!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 0.5;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if(ac.state === 'suspended') ac.resume();
  return ac;
}

const SWEEP = 0.9;             // Sekunden bis zum oberen Ende des Kreischens
const MIN_MS = 950;            // so lange laeuft eine Messung mindestens (auch bei kurzem Tipp)
let warble = null;             // laufende Messklang-Knoten
let pressT0 = 0, clickTimer = 0, needleRAF = 0;

function startMeasure(){
  const a = ctx(), t = a.currentTime;
  stopWarble();

  // Traeger: Rechteck, sofort schrill, jault schnell noch hoeher
  const osc = a.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1600, t);
  osc.frequency.exponentialRampToValueAtTime(2600, t + SWEEP);

  // Sirenen-Vibrato: von Anfang an schnell und tief in der Tonhoehe
  const lfo = a.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(14, t);
  lfo.frequency.linearRampToValueAtTime(22, t + SWEEP);
  const lfoGain = a.createGain();
  lfoGain.gain.setValueAtTime(280, t);
  lfoGain.gain.linearRampToValueAtTime(400, t + SWEEP);

  // Bandpass hoch angesetzt: nimmt dem Rechteck den Bass, laesst das Kreischen durch
  const bp = a.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(2400, t);
  bp.frequency.exponentialRampToValueAtTime(3600, t + SWEEP);

  const amp = a.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.075, t + 0.03);

  lfo.connect(lfoGain).connect(osc.frequency);
  osc.connect(bp).connect(amp).connect(a.destination);
  osc.start(t); lfo.start(t);
  warble = { osc, lfo, amp };

  // Geigerknacken, immer dichter
  const click = () => {
    if(!warble) return;
    const tt = a.currentTime;
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3600; f.Q.value = 6;
    const g = a.createGain();
    g.gain.setValueAtTime(0.14, tt);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
    s.connect(f).connect(g).connect(a.destination);
    s.start(tt); s.stop(tt + 0.05);
    const p = Math.min(1, (performance.now() - pressT0) / (SWEEP * 1000));
    clickTimer = setTimeout(click, 200 - 160 * p);
  };
  click();
}

function stopWarble(){
  clearTimeout(clickTimer);
  if(!warble) return;
  const a = ctx(), t = a.currentTime;
  warble.amp.gain.cancelScheduledValues(t);
  warble.amp.gain.setValueAtTime(warble.amp.gain.value || 0.1, t);
  warble.amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  warble.osc.stop(t + 0.12); warble.lfo.stop(t + 0.12);
  warble = null;
}

function alarm(){
  // Urteil: drei scharfe Pfiffe, ganz oben im Register
  const a = ctx(), t = a.currentTime;
  [[1760, 0], [2217, 0.12], [2794, 0.24]].forEach(([f, dt]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + dt);
    g.gain.linearRampToValueAtTime(0.09, t + dt + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.28);
    o.connect(g).connect(a.destination);
    o.start(t + dt); o.stop(t + dt + 0.35);
  });
}

function crazy(){
  // Der Aparat spielt verrueckt: wildes Gepiepe kreuz und quer
  const a = ctx(), t = a.currentTime;
  for(let i = 0; i < 14; i++){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square';
    o.frequency.value = 350 + Math.random() * 2800 * (1 - i / 18);
    const st = t + i * 0.085;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(0.08, st + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.07);
    o.connect(g).connect(a.destination);
    o.start(st); o.stop(st + 0.1);
  }
}

/* Zeiger: waehrend der Messung zittrig nach rechts, danach zurueck */
function animateNeedle(){
  cancelAnimationFrame(needleRAF);
  const step = () => {
    let ang;
    if(pressT0){
      const p = Math.min(1, (performance.now() - pressT0) / (SWEEP * 1000));
      ang = -50 + p * 100 + (Math.random() - 0.5) * 12 * (0.3 + p);
      needleRAF = requestAnimationFrame(step);
    } else {
      ang = -50;
    }
    // Linie von der Achse (0,24) aus drehen
    const r = 34, rad = (ang - 90) * Math.PI / 180;
    needle.setAttribute('x2', (Math.cos(rad) * r).toFixed(1));
    needle.setAttribute('y2', (24 + Math.sin(rad) * r).toFixed(1));
  };
  step();
}

let pressed = false, finishTimer = 0, verdictTimer = 0;
function beginMeasure(){
  clearTimeout(finishTimer);
  clearTimeout(verdictTimer);
  pressT0 = performance.now();
  body.classList.add('measuring');
  body.classList.remove('done');
  verdict.classList.remove('show');
  komentar.classList.remove('show');
  startMeasure();
  animateNeedle();
}
function down(e){
  if(pressed) return;
  pressed = true;
  e.preventDefault();
  askMotion();
  btn.classList.add('down');
  beginMeasure();
}
function finish(){
  pressT0 = 0;
  measureCount++;
  body.classList.remove('measuring');
  stopWarble();
  alarm();
  const v = pickVerdict();
  verdict.textContent = v.t;
  verdict.style.color = v.c;
  verdict.style.textShadow = '0 0 10px ' + v.c;
  komentar.textContent = v.mad ? 'NAUKA MOLI ZA STRPLJENJE.' : KOMENTARI[(Math.random() * KOMENTARI.length) | 0];
  if(v.mad){
    body.classList.add('mad');
    setTimeout(crazy, 250);
    setTimeout(() => body.classList.remove('mad'), 1700);
  }
  body.classList.add('done');
  verdict.classList.add('show');
  komentar.classList.add('show');
  verdictTimer = setTimeout(() => {
    verdict.classList.remove('show');
    komentar.classList.remove('show');
    body.classList.remove('done');
  }, 2600);
  animateNeedle();
}
function up(){
  if(!pressed) return;
  pressed = false;
  btn.classList.remove('down');
  const held = performance.now() - pressT0;
  // Kurzer Tipp: die Messung laeuft von selbst zu Ende, dann kommt das Urteil
  if(held < MIN_MS) finishTimer = setTimeout(finish, MIN_MS - held);
  else finish();
}
btn.addEventListener('pointerdown', down);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
addEventListener('keydown', e => { if(e.code === 'Space' && !e.repeat) down(e); });
addEventListener('keyup', e => { if(e.code === 'Space') up(); });

/* ---- Bewegungssensoren: Neigen lehnt den Apparat mit, Schwenken loest die Messung aus ---- */
let motionAsked = false;
function askMotion(){
  // iOS verlangt eine Freigabe, und zwar aus einer Beruehrung heraus
  if(motionAsked) return;
  motionAsked = true;
  try{
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
      DeviceOrientationEvent.requestPermission().catch(() => {});
    if(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function')
      DeviceMotionEvent.requestPermission().catch(() => {});
  }catch(err){}
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let tiltActive = false, tgtG = 0, tgtB = 0, curG = 0, curB = 0;
addEventListener('deviceorientation', e => {
  if(e.gamma == null && e.beta == null) return;
  tiltActive = true;
  tgtG = clamp(e.gamma || 0, -28, 28);
  tgtB = clamp((e.beta == null ? 45 : e.beta) - 45, -28, 28); // 45°: typische Haltung
});
(function tiltLoop(){
  requestAnimationFrame(tiltLoop);
  if(!tiltActive || reduceMotion) return;
  curG += (tgtG - curG) * 0.12;
  curB += (tgtB - curB) * 0.12;
  device.style.transform =
    `translate(${(curG * 0.9).toFixed(1)}px,${(curB * 0.7).toFixed(1)}px) rotate(${(curG * 0.25).toFixed(2)}deg)`;
})();

let lastShake = 0;
addEventListener('devicemotion', e => {
  const a = e.acceleration;
  if(!a) return;
  const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  if(m < 17) return;
  const now = performance.now();
  // Zamah! Der Apparat schlaegt von selbst an, wie beim Herumfuchteln im Sketch
  if(pressed || pressT0 || now - lastShake < 2200) return;
  lastShake = now;
  beginMeasure();
  finishTimer = setTimeout(finish, MIN_MS + 250);
});
</script>
