<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e0a">
<meta name="color-scheme" content="light">
<title>APARAT — Nacional detektor</title>
<meta name="description" content="Samo aparat i jedno dugme. Drži dugme: aparat mjeri. Pusti: nauka presudi. Model ND-84, TLN Elektronika.">

<style>
  :root{
    color-scheme:light;
    --night:#120e0a; --cream:#f2e8d2; --amber:#f0a83c; --ember:#d43a2a; --green:#7dff9a;
    --cond:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow",Impact,sans-serif;
    --epic:"Palatino Linotype",Palatino,"Iowan Old Style","Times New Roman",Georgia,serif;
    --mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 22%,#b3a189,#8f7d67 55%,#6b5a49 100%);color:#2a2118;
    font-family:var(--cond);overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:fixed;width:100%}

  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}

  h1{margin:34px 0 0;font-family:var(--epic);font-size:clamp(22px,6.6vw,32px);font-weight:700;
    letter-spacing:.04em;white-space:nowrap;color:#2b1e10;
    text-shadow:0 1px 0 rgba(255,246,224,.5),0 -1px 1px rgba(20,12,4,.5)}
  .sub{font-family:var(--epic);font-size:clamp(10px,2.9vw,13px);letter-spacing:.16em;white-space:nowrap;
    color:#7c4a10;margin-top:6px;text-shadow:0 1px 0 rgba(255,246,224,.35)}

  #device{flex:1 1 auto;min-height:0;width:100%;max-width:430px;display:block}

  #verdict{height:26px;line-height:26px;padding:0 14px;border-radius:4px;
    font:700 14px var(--mono);letter-spacing:.12em;color:var(--green);background:#171009;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
    text-shadow:0 0 8px rgba(125,255,154,.6);opacity:0;transition:opacity .25s}
  #verdict.show{opacity:1}

  #btn{margin-top:6px;width:118px;height:118px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 38% 32%,#f16a54,var(--ember) 55%,#7c1c12 100%);
    box-shadow:0 8px 0 #4a0f08,0 14px 30px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.35);
    color:#2a0a05;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.18em;line-height:1.4}
  #btn:active,#btn.down{transform:translateY(6px);box-shadow:0 2px 0 #4a0f08,0 6px 14px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.25)}
  .hint{margin-top:12px;font-size:9.5px;letter-spacing:.22em;color:rgba(36,26,16,.6)}

  /* Geraete-Animationen */
  @keyframes blinkR{50%{opacity:.15}}
  @keyframes blinkF{50%{opacity:.25}}
  .measuring #lampTop{animation:blinkR .18s steps(2) infinite}
  .measuring .lampSm{animation:blinkF .3s steps(2) infinite}
  @keyframes badgePulse{50%{filter:drop-shadow(0 0 3px rgba(255,215,106,.5))}}
  .measuring #badge{fill:url(#lensGlow);filter:drop-shadow(0 0 9px rgba(255,215,106,.95));
    animation:badgePulse .3s ease-in-out infinite}
  #lampTop,.lampSm{opacity:.15}
  .done #lampTop{opacity:1}
</style>
</head>
<body>
<div id="app">
  <h1>NACIONAL DETEKTOR</h1>
  <div class="sub">MODEL ND-84 · TLN ELEKTRONIKA · SARAJEVO</div>

  <!-- Der Apparat: Feldstecher mit Kabel zum Bakelitkasten mit Zeiger und Lampen -->
  <svg id="device" viewBox="0 0 300 330" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <radialGradient id="drum" cx="32%" cy="26%">
        <stop offset="0%" stop-color="#6e6a63"/><stop offset="55%" stop-color="#2b2926"/><stop offset="100%" stop-color="#0f0d0b"/>
      </radialGradient>
      <radialGradient id="badgeIdle" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#e8d48a"/><stop offset="60%" stop-color="#b08f3c"/><stop offset="100%" stop-color="#6e5316"/>
      </radialGradient>
      <radialGradient id="lensGlow" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#ffe6a8"/><stop offset="55%" stop-color="#f0a83c"/><stop offset="100%" stop-color="#7c4a10"/>
      </radialGradient>
      <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6e6a63"/><stop offset="35%" stop-color="#2b2926"/><stop offset="75%" stop-color="#3d3a35"/><stop offset="100%" stop-color="#15130f"/>
      </linearGradient>
      <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6e5335"/><stop offset="20%" stop-color="#3d2d20"/><stop offset="100%" stop-color="#221709"/>
      </linearGradient>
      <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2a1e12" flood-opacity="0.55"/>
      </filter>
    </defs>

    <!-- Der Apparat: ein schwarzer Foehn, Trommel mit Gold-Emblem, Griff nach unten -->
    <g transform="translate(148 102) rotate(-8)" filter="url(#drop)">
      <!-- Griff -->
      <path d="M -20 24 L -32 86 Q -34 98 -21 99 L -1 99 Q 9 98 8 87 L 6 26 Z"
            fill="url(#tube)" stroke="#000" stroke-width="2"/>
      <!-- Daumenschalter -->
      <rect x="-30" y="42" width="9" height="20" rx="4.5" fill="#c9a24a" stroke="#000" stroke-width="1.5"/>
      <!-- Gehaeuse: Uebergang von der Trommel in den Griff -->
      <path d="M -36 -10 Q -42 18 -18 30 L 8 30 Q 24 22 22 -2 Z"
            fill="url(#tube)" stroke="#000" stroke-width="2"/>
      <!-- Trommel -->
      <circle cx="0" cy="-34" r="52" fill="url(#drum)" stroke="#000" stroke-width="2.5"/>
      <circle cx="0" cy="-34" r="41" fill="none" stroke="#0c0a09" stroke-width="6" opacity=".85"/>
      <circle cx="0" cy="-34" r="29" fill="#191612" stroke="#000" stroke-width="1.5"/>
      <!-- Gold-Emblem -->
      <g transform="rotate(-16 0 -34)">
        <ellipse id="badge" cx="0" cy="-34" rx="21" ry="12.5" fill="url(#badgeIdle)" stroke="#3a2c0e" stroke-width="1.5"/>
        <ellipse cx="0" cy="-34" rx="16" ry="8.5" fill="none" stroke="rgba(30,22,6,.55)" stroke-width="1"/>
        <text x="0" y="-31.5" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="6.5" font-weight="700" letter-spacing="1" fill="#241a06">ND·84</text>
      </g>
      <!-- Glanz auf Plastik -->
      <path d="M -40 -62 Q -14 -82 16 -70" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/>
      <path d="M -26 8 Q -30 40 -26 70" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4" stroke-linecap="round"/>
      <!-- Kontrolllampe -->
      <circle id="lampTop" cx="15" cy="14" r="5" fill="#ff4433" stroke="#000" stroke-width="1"/>
    </g>

    <!-- Spiralkabel vom Griff zum Kasten -->
    <path d="M138 196 q -22 10 0 20 q 22 10 0 20"
          fill="none" stroke="#2b241c" stroke-width="7" stroke-linecap="round"/>
    <path d="M138 196 q -22 10 0 20 q 22 10 0 20"
          fill="none" stroke="#8a8175" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bakelitkasten -->
    <g transform="translate(150 272)" filter="url(#drop)">
      <rect x="-92" y="-52" width="184" height="104" rx="10" fill="url(#box)" stroke="#000" stroke-width="2.5"/>
      <rect x="-92" y="-52" width="184" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <!-- Skala -->
      <g transform="translate(-38 6)">
        <path d="M-40 24 a40 40 0 0 1 80 0 z" fill="#f5ecd8" stroke="#000" stroke-width="2"/>
        <path d="M14 -6 A40 40 0 0 1 38 22 L 0 24 z" fill="rgba(212,58,42,.5)"/>
        <g stroke="#5a4c33"><line x1="-28" y1="-4" x2="-24" y2="0"/><line x1="0" y1="-15" x2="0" y2="-10"/><line x1="28" y1="-4" x2="24" y2="0"/></g>
        <line id="needle" x1="0" y1="24" x2="-30" y2="-2" stroke="#7c1f1f" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="24" r="5" fill="#171009"/>
        <text y="38" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-size="7" letter-spacing="2" fill="rgba(242,232,210,.5)">NACIOMETAR</text>
      </g>
      <!-- Lautsprechergrill -->
      <g stroke="#000" stroke-width="2" opacity=".8">
        <line x1="30" y1="-38" x2="82" y2="-38"/><line x1="30" y1="-31" x2="82" y2="-31"/>
        <line x1="30" y1="-24" x2="82" y2="-24"/><line x1="30" y1="-17" x2="82" y2="-17"/>
      </g>
      <!-- Laempchen -->
      <circle class="lampSm" cx="40" cy="8" r="5" fill="#f0a83c"/>
      <circle class="lampSm" cx="58" cy="8" r="5" fill="#7dff9a"/>
      <circle class="lampSm" cx="76" cy="8" r="5" fill="#ff4433"/>
      <text x="58" y="26" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-size="6.5" letter-spacing="1.5" fill="rgba(242,232,210,.45)">MJERENJE U TOKU</text>
      <!-- Typenschild -->
      <text x="-84" y="-38" text-anchor="start" font-family="Courier New,monospace" font-size="7" letter-spacing="1" fill="rgba(242,232,210,.35)">ND-84 · SL. GLASNIK BR. 7/84</text>
    </g>
  </svg>

  <div id="verdict">NALAZ: ČOVJEK · 100%</div>
  <button id="btn">PRITISNI<br>I DRŽI</button>
  <div class="hint">DRŽI: APARAT MJERI · PUSTI: NAUKA PRESUDI</div>
</div>

<script>
'use strict';
/* Nur das Geraet und ein Knopf. Halten laesst den Apparat messen
   (steigendes Wabern + Geigerknacken), Loslassen liefert das Urteil. */

const btn = document.getElementById('btn');
const verdict = document.getElementById('verdict');
const needle = document.getElementById('needle');
const body = document.body;

let ac = null, noiseBuf = null;
function ctx(){
  if(!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 0.5;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if(ac.state === 'suspended') ac.resume();
  return ac;
}

const SWEEP = 2.6;             // Sekunden bis zum oberen Ende des Waberns
let warble = null;             // laufende Messklang-Knoten
let pressT0 = 0, clickTimer = 0, needleRAF = 0;

function startMeasure(){
  const a = ctx(), t = a.currentTime;
  stopWarble();

  // Traeger: Rechteck, hoch und schrill, jault nach oben
  const osc = a.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(950, t);
  osc.frequency.exponentialRampToValueAtTime(2300, t + SWEEP);

  // Sirenen-Vibrato: LFO moduliert die TONHOEHE, wird schneller und tiefer
  const lfo = a.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(9, t);
  lfo.frequency.linearRampToValueAtTime(19, t + SWEEP);
  const lfoGain = a.createGain();
  lfoGain.gain.setValueAtTime(140, t);
  lfoGain.gain.linearRampToValueAtTime(320, t + SWEEP);

  // Bandpass hoch angesetzt: nimmt dem Rechteck den Bass, laesst das Kreischen durch
  const bp = a.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(1600, t);
  bp.frequency.exponentialRampToValueAtTime(3200, t + SWEEP);

  const amp = a.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.075, t + 0.06);

  lfo.connect(lfoGain).connect(osc.frequency);
  osc.connect(bp).connect(amp).connect(a.destination);
  osc.start(t); lfo.start(t);
  warble = { osc, lfo, amp };

  // Geigerknacken, immer dichter
  const click = () => {
    if(!warble) return;
    const tt = a.currentTime;
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3600; f.Q.value = 6;
    const g = a.createGain();
    g.gain.setValueAtTime(0.14, tt);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
    s.connect(f).connect(g).connect(a.destination);
    s.start(tt); s.stop(tt + 0.05);
    const p = Math.min(1, (performance.now() - pressT0) / (SWEEP * 1000));
    clickTimer = setTimeout(click, 200 - 160 * p);
  };
  click();
}

function stopWarble(){
  clearTimeout(clickTimer);
  if(!warble) return;
  const a = ctx(), t = a.currentTime;
  warble.amp.gain.cancelScheduledValues(t);
  warble.amp.gain.setValueAtTime(warble.amp.gain.value || 0.1, t);
  warble.amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  warble.osc.stop(t + 0.12); warble.lfo.stop(t + 0.12);
  warble = null;
}

function ding(){
  const a = ctx(), t = a.currentTime;
  [[660, 0], [880, 0.09], [1320, 0.18]].forEach(([f, dt]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + dt);
    g.gain.linearRampToValueAtTime(0.12, t + dt + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.5);
    o.connect(g).connect(a.destination);
    o.start(t + dt); o.stop(t + dt + 0.6);
  });
}

/* Zeiger: waehrend der Messung zittrig nach rechts, danach zurueck */
function animateNeedle(){
  cancelAnimationFrame(needleRAF);
  const step = () => {
    let ang;
    if(pressT0){
      const p = Math.min(1, (performance.now() - pressT0) / (SWEEP * 1000));
      ang = -50 + p * 100 + (Math.random() - 0.5) * 12 * (0.3 + p);
      needleRAF = requestAnimationFrame(step);
    } else {
      ang = -50;
    }
    // Linie von der Achse (0,24) aus drehen
    const r = 34, rad = (ang - 90) * Math.PI / 180;
    needle.setAttribute('x2', (Math.cos(rad) * r).toFixed(1));
    needle.setAttribute('y2', (24 + Math.sin(rad) * r).toFixed(1));
  };
  step();
}

let pressed = false;
function down(e){
  if(pressed) return;
  pressed = true;
  e.preventDefault();
  pressT0 = performance.now();
  body.classList.add('measuring');
  body.classList.remove('done');
  verdict.classList.remove('show');
  btn.classList.add('down');
  startMeasure();
  animateNeedle();
}
function up(){
  if(!pressed) return;
  pressed = false;
  const held = performance.now() - pressT0;
  pressT0 = 0;
  body.classList.remove('measuring');
  btn.classList.remove('down');
  stopWarble();
  // Urteil nur nach ernsthafter Messung (sonst war es ein Wackelkontakt)
  if(held > 350){
    ding();
    body.classList.add('done');
    verdict.classList.add('show');
    setTimeout(() => { verdict.classList.remove('show'); body.classList.remove('done'); }, 2200);
  }
  animateNeedle();
}
btn.addEventListener('pointerdown', down);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
addEventListener('keydown', e => { if(e.code === 'Space' && !e.repeat) down(e); });
addEventListener('keyup', e => { if(e.code === 'Space') up(); });
</script>
</body>
</html>
