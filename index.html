function drawSmoke(){
  /* tanka nit dima odmah iznad žara */
  if(!G.silvester && G.st !== S.BJEG && G.st !== S.POBJEDA && G.st !== S.INTRO){
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = 'rgba(236,232,220,0.9)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(143, TABLEY+44);
    for(var n=1;n<=6;n++){
      var ny = TABLEY+44 - n*13;
      ctx.lineTo(143 + Math.sin(G.gt*1.7 + n*0.8)*(3+n*1.6), ny);
    }
    ctx.stroke();
    ctx.restore();
  }
  /* jedan sprite umjesto novog radijalnog gradijenta za svaku kuglu dima */
  var spr = smokeSprite();
  for(var i=0;i<G.smoke.length;i++){
    var q = G.smoke[i];
    ctx.globalAlpha = clamp(q.life,0,1)*(q.bomba ? 0.5 : 0.34);
    ctx.drawImage(spr, q.x-q.r, q.y-q.r, q.r*2, q.r*2);
  }
  ctx.globalAlpha = 1;
}

var SMOKE_SPR = null;
function smokeSprite(){
  if(SMOKE_SPR) return SMOKE_SPR;
  var c = document.createElement('canvas');
  c.width = c.height = 128;
  var g2 = c.getContext('2d');
  var sg = g2.createRadialGradient(64, 64, 1, 64, 64, 64);
  sg.addColorStop(0, 'rgba(232,228,216,0.9)');
  sg.addColorStop(1, 'rgba(232,228,216,0)');
  g2.fillStyle = sg;
  g2.fillRect(0, 0, 128, 128);
  SMOKE_SPR = c;
  return c;
}

/* mušema se ne mijenja — jednom nacrtana (u dvostrukoj rezoluciji), poslije samo drawImage.
   Druga varijanta: pokrpana selotejpom, uspomena na prevrnuti sto. */
var CLOTH_SPR = [null, null];
function clothSprite(){
  var pk = G.stoPokrpan ? 1 : 0;
  if(CLOTH_SPR[pk]) return CLOTH_SPR[pk];
  var c = document.createElement('canvas');
  c.width = W*2; c.height = 264;
  var g2 = c.getContext('2d');
  g2.scale(2, 2);
  g2.translate(0, -(TABLEY-16));
  /* mušema iz kafane */
  g2.fillStyle = '#e0d6c2';
  rr(g2, 26, TABLEY-16, W-52, 118, 10); g2.fill();
  g2.save();
  rr(g2, 26, TABLEY-16, W-52, 118, 10); g2.clip();
  g2.fillStyle = 'rgba(168,54,44,0.55)';
  for(var i=0;i<19;i++){
    for(var j=0;j<4;j++){
      if((i+j) % 2) continue;
      g2.fillRect(26 + i*36, TABLEY-16 + j*32, 36, 32);
    }
  }
  g2.strokeStyle = 'rgba(120,40,32,0.35)'; g2.lineWidth = 1.5;
  for(i=0;i<19;i++){ g2.beginPath(); g2.moveTo(26+i*36, TABLEY-16); g2.lineTo(26+i*36, TABLEY+102); g2.stroke(); }
  for(j=0;j<5;j++){ g2.beginPath(); g2.moveTo(26, TABLEY-16+j*32); g2.lineTo(W-26, TABLEY-16+j*32); g2.stroke(); }
  /* fleke od kafe */
  g2.strokeStyle = 'rgba(86,52,26,0.28)'; g2.lineWidth = 4;
  g2.beginPath(); g2.arc(628, TABLEY+30, 24, 0, 6.284); g2.stroke();
  g2.beginPath(); g2.arc(492, TABLEY+82, 17, 0, 6.284); g2.stroke();
  g2.restore();
  /* prednji rub */
  g2.fillStyle = '#b9a98f';
  rr(g2, 26, TABLEY+90, W-52, 24, 8); g2.fill();
  g2.fillStyle = 'rgba(20,10,8,0.30)';
  g2.fillRect(26, TABLEY-16, W-52, 6);
  if(pk){
    /* pukotina od pada */
    g2.strokeStyle = 'rgba(40,20,14,0.5)'; g2.lineWidth = 3; g2.lineCap = 'round';
    g2.beginPath();
    g2.moveTo(300, TABLEY-10); g2.lineTo(330, TABLEY+24);
    g2.lineTo(312, TABLEY+52); g2.lineTo(348, TABLEY+86);
    g2.stroke();
    /* selotejp */
    var tejp = function(x, y, w, ang){
      g2.save();
      g2.translate(x, y); g2.rotate(ang);
      g2.fillStyle = 'rgba(214,204,178,0.85)';
      g2.fillRect(-w/2, -11, w, 22);
      g2.strokeStyle = 'rgba(120,105,80,0.5)'; g2.lineWidth = 1.5;
      g2.strokeRect(-w/2, -11, w, 22);
      g2.restore();
    };
    tejp(318, TABLEY+18, 74, 0.5);
    tejp(322, TABLEY+62, 74, -0.35);
    tejp(120, TABLEY+96, 90, 0.08);
    tejp(586, TABLEY-8, 84, -0.06);
  }
  CLOTH_SPR[pk] = c;
  return c;
}

function drawTable(){
  var fly = G.clothFly || 0, flip = G.tableFlip || 0;
  ctx.save();
  if(flip > 0){
    /* prevrnut sto: rotira oko lijevog donjeg ugla, pada i blijedi */
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, flip-0.55)/0.45);
    ctx.translate(96, TABLEY+214);
    ctx.rotate(-flip*1.9);
    ctx.translate(-96, -(TABLEY+214));
    ctx.translate(0, flip*46);
  }
  /* ćilim */
  ctx.save();
  if(fly > 0){
    ctx.globalAlpha = 1-fly;
    ctx.translate(360, TABLEY+40);
    ctx.rotate(-fly*0.42);
    ctx.translate(-360, -(TABLEY+40) - fly*300);
    ctx.scale(1-fly*0.15, 1-fly*0.25);
  }
  ctx.drawImage(clothSprite(), 0, TABLEY-16, W, 132);
  drawPepeljara(94, TABLEY+62);
  ctx.restore();

  if(fly > 0) ctx.translate(0, fly*10);
  ctx.fillStyle = '#4a3122';
  ctx.fillRect(70, TABLEY+100, W-140, 120);
  ctx.fillStyle = '#3a2519';
  for(var k=0;k<5;k++) ctx.fillRect(70, TABLEY+104+k*24, W-140, 4);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(70, TABLEY+210, W-140, 12);
  ctx.restore();
  ctx.restore();
}

function drawKugla(x,y,sc,alpha){

  var R = 18;

  ctx.translate(x,y); ctx.scale(sc,sc);

  /* kontaktna sjena — da kuglica ne lebdi */

  ctx.beginPath(); ctx.ellipse(0, R*0.94, R*1.0, R*0.30, 0, 0, 6.284); ctx.fill();

  /* plavi sjaj, da se vidi i na muševi */
  var pulse = 0.72 + 0.28*Math.sin(G.gt*4.2);

  var g = ctx.createRadialGradient(-R*0.36, -R*0.44, R*0.12, 0, 0, R);

  g.addColorStop(0.30, '#5cb4f2');
  g.addColorStop(0.72, '#1b62c4');
  g.addColorStop(1, '#0c2f6d');

  ctx.beginPath(); ctx.ellipse(-R*0.33, -R*0.40, R*0.26, R*0.17, -0.6, 0, 6.284); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.arc(R*0.30, R*0.34, R*0.11, 0, 6.284); ctx.fill();

  ctx.restore();
}

function drawFildzan(c, idx){
  var ca = (c.a===undefined) ? 1 : c.a;
  if(ca <= 0.01) return;
  var csc = (c.sc===undefined) ? 1 : c.sc;
  var x = c.x, base = TABLEY - c.lift*LIFTH;
  var w = CUPW, h = CUPH;
  ctx.save();
  /* sjena na ćilimu */
  ctx.globalAlpha = clamp(0.42 - c.lift*0.26, 0, 1)*ca;   /* leteći fildžan (prevrnut sto) izlazi iz [0,1] */
  ctx.fillStyle = '#2b0a0c';
  ctx.beginPath(); ctx.ellipse(c.x, TABLEY+3, Math.max(0, (w*0.5+c.lift*20)*csc), 11, 0,0,6.284); ctx.fill();
  ctx.globalAlpha = ca;

  ctx.translate(x, base);
  ctx.rotate(c.tilt + Math.sin(G.gt*30)*0.02*c.wob);
  var sq = c.sq + Math.sin(G.gt*26)*0.05*c.wob;
  ctx.scale((2-sq)*csc, sq*csc);
  ctx.translate(0, -h);

  /* highlight prsten (OKO) */
  if(c.hi>0.01){
    ctx.save();
    ctx.globalAlpha = c.hi;
    var rg = ctx.createRadialGradient(0,h,6,0,h,88);
    rg.addColorStop(0,'rgba(255,214,120,0.85)');
    rg.addColorStop(1,'rgba(255,214,120,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(0,h,88,36,0,0,6.284); ctx.fill();
    ctx.restore();
  }

  /* tijelo fildžana – obrnuta krnja kupa */
  var topW = w*0.36, botW = w*0.5;
  var g = ctx.createLinearGradient(-botW,0,botW,0);
  g.addColorStop(0,'#8d5a3a');
  g.addColorStop(0.28,'#d9a273');
  g.addColorStop(0.5,'#f3d9bd');
  g.addColorStop(0.75,'#c98f60');
  g.addColorStop(1,'#7a4a2e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-topW, 4);
  ctx.quadraticCurveTo(-topW-3, h*0.5, -botW, h-6);
  ctx.quadraticCurveTo(0, h+14, botW, h-6);
  ctx.quadraticCurveTo(topW+3, h*0.5, topW, 4);
  ctx.quadraticCurveTo(0, -10, -topW, 4);
  ctx.closePath(); ctx.fill();

  /* zlatni obod (dno fildžana, gore) */
  ctx.fillStyle = '#e8bd6d';
  ctx.beginPath(); ctx.ellipse(0, 2, topW, 7.5, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#b98c40';
  ctx.beginPath(); ctx.ellipse(0, 2, topW*0.70, 5, 0, 0, 6.284); ctx.fill();

  /* ornament – dva zlatna prstena + rombovi */
  ctx.strokeStyle = 'rgba(233,190,110,0.95)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, h*0.30, lerp(topW,botW,0.30)+1, 7, 0, 0, Math.PI); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, h*0.74, lerp(topW,botW,0.74)+1, 8, 0, 0, Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(46,74,92,0.9)';
  for(var i=-1;i<=1;i++){
    var ox2 = i*18, oy2 = h*0.52;
    ctx.beginPath();
    ctx.moveTo(ox2, oy2-7); ctx.lineTo(ox2+5.5, oy2); ctx.lineTo(ox2, oy2+7); ctx.lineTo(ox2-5.5, oy2);
    ctx.closePath(); ctx.fill();
  }

  /* rub na tlu */
  ctx.fillStyle = 'rgba(60,32,18,0.5)';
  ctx.beginPath(); ctx.ellipse(0, h-3, botW*0.96, 8, 0, 0, Math.PI); ctx.fill();

  /* sjaj */
  ctx.globalAlpha = 0.35*ca;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-topW*0.5, 10);
  ctx.quadraticCurveTo(-botW*0.55, h*0.6, -botW*0.36, h-14);
  ctx.lineTo(-botW*0.14, h-16);
  ctx.quadraticCurveTo(-topW*0.36, h*0.55, -topW*0.16, 10);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}


function drawOnom(){

  var sc = (k < 0.18) ? eob(k/0.18) : 1 + (k-0.18)*0.16;

  ctx.beginPath(); ctx.ellipse(0,0,21,14,-0.14,0,6.284); ctx.fill();
  /* vrat sa prelivom */

  ctx.beginPath(); ctx.ellipse(10,-7,8,7,0,0,6.284); ctx.fill();
  /* glava */
  ctx.fillStyle = '#8794a3';
  ctx.beginPath(); ctx.arc(15,-14,10,0,6.284); ctx.fill();
  /* kljun */
  ctx.fillStyle = '#e0b070';
  ctx.beginPath(); ctx.moveTo(24,-15); ctx.lineTo(34,-12); ctx.lineTo(24,-9); ctx.closePath(); ctx.fill();
  /* oko */
  ctx.fillStyle = '#1b1410';
  ctx.beginPath(); ctx.arc(19,-17,2.4,0,6.284); ctx.fill();

/* Silvestrovo — konfete padaju preko cijele scene */
function drawKonfeti(){
  if(!G.konf.length) return;
  ctx.save();
  ctx.globalAlpha = 0.9;
  for(var i=0;i<G.konf.length;i++){
    var k = G.konf[i];
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    ctx.fillStyle = k.c;
    ctx.fillRect(-k.r, -k.r*0.6, k.r*2, k.r*1.2);
    ctx.restore();
  }
  ctx.restore();
}

/* Hakala — dođe za sto kad on miješa: klimav, s flašom, pošten */
function drawHakala(){
  if(G.hakalaAnim < 0.02) return;
  var k = eoc(G.hakalaAnim);
  var fx = lerp(-150, 118, k);
  var sway = Math.sin(G.gt*1.3)*0.055 + Math.sin(G.gt*3.7)*0.02;
  ctx.save();
  ctx.globalAlpha = clamp(G.hakalaAnim*1.6, 0, 1);
  ctx.translate(fx, 900); ctx.rotate(sway); ctx.translate(-fx, -900);
  /* iznošen sako */
  ctx.fillStyle = '#5a5648';
  ctx.beginPath();
  ctx.moveTo(fx-58, 900);
  ctx.quadraticCurveTo(fx-60, 730, fx-44, 690);
  ctx.quadraticCurveTo(fx-20, 668, fx, 668);
  ctx.quadraticCurveTo(fx+20, 668, fx+44, 690);
  ctx.quadraticCurveTo(fx+60, 730, fx+58, 900);
  ctx.closePath(); ctx.fill();
  /* košulja koja je nekad bila bijela */
  ctx.fillStyle = '#8a8070';
  ctx.fillRect(fx-12, 690, 24, 74);
  /* ruka s flašom */
  var hbob = Math.sin(G.gt*2.1)*6;
  ctx.strokeStyle = '#5a5648'; ctx.lineWidth = 20; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(fx-40, 710); ctx.lineTo(fx-66, 792+hbob); ctx.stroke();
  ctx.save();
  ctx.translate(fx-66, 792+hbob); ctx.rotate(-0.5 + Math.sin(G.gt*2.1)*0.1);
  ctx.fillStyle = '#3f6b3a';
  ctx.fillRect(-7, -34, 14, 40);
  ctx.fillRect(-3, -50, 6, 18);
  ctx.restore();
  /* druga ruka — prema fildžanima dok radi */
  var toX = fx+72, toY = 760;
  if(G.st === S.MIX && G.swActive){
    for(var mi=0; mi<G.nc; mi++){
      if(G.cups[mi].from !== G.cups[mi].to){
        toX = G.cups[mi].x - 30;
        toY = TABLEY - 90 - G.cups[mi].lift*LIFTH;
        break;
      }
    }
  } else if(G.hakalaCheckT > 0){
    var hkc = G.cups[G.cube];
    toX = hkc.x - 26; toY = TABLEY - 100 - hkc.lift*LIFTH;
  }
  ctx.strokeStyle = '#5a5648'; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.moveTo(fx+40, 706); ctx.lineTo(toX, toY); ctx.stroke();
  ctx.fillStyle = '#b98a5e';
  ctx.beginPath(); ctx.arc(toX, toY, 13, 0, 6.284); ctx.fill();
  /* glava */
  ctx.fillStyle = '#c08a5e';
  ctx.beginPath(); ctx.ellipse(fx, 618, 44, 50, 0, 0, 6.284); ctx.fill();
  /* čekinje */
  ctx.fillStyle = 'rgba(70,60,50,0.35)';
  ctx.beginPath(); ctx.ellipse(fx, 648, 30, 18, 0, 0, 6.284); ctx.fill();
  /* crven nos */
  ctx.fillStyle = '#c05a4a';
  ctx.beginPath(); ctx.arc(fx, 628, 10, 0, 6.284); ctx.fill();
  /* poluzatvorene oči */
  ctx.strokeStyle = '#241a10'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(fx-22, 610); ctx.lineTo(fx-8, 613); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx+8, 613); ctx.lineTo(fx+22, 610); ctx.stroke();
  /* blažen osmijeh */
  ctx.strokeStyle = '#5a2f22'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(fx+2, 638, 14, 0.4, 2.5); ctx.stroke();
  /* kačket */
  ctx.fillStyle = '#3d3a33';
  ctx.beginPath(); ctx.ellipse(fx, 584, 46, 22, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(fx-46, 578, 92, 10);
  ctx.beginPath(); ctx.ellipse(fx+40, 586, 22, 7, 0.1, 0, 6.284); ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawSky();
  drawSkyline();
  var fleeing = (G.st === S.BJEG || G.st === S.POBJEDA);
  drawLevat();
  drawMinka();
  drawHakala();
  if(fleeing){ drawTable(); drawSaner(); }
  else { drawSaner(); drawTable(); }

  /* kuglica: vidljiva kad je fildžan iznad nje dovoljno podignut */
  var cubeCup = G.cups[G.cube];
  var showCube = cubeCup.lift > 0.22 &&
      (G.st===S.SHOW || G.st===S.REVEAL || G.st===S.RESULT ||
       G.nakrivT > 0 || G.hakalaCheckT > 0 ||
       (G.st===S.INTRO && G.t > 3.98));
  if(showCube){
    drawKugla(cubeCup.x, TABLEY-18, 1, clamp((cubeCup.lift-0.20)*3.2,0,1));
  }

  /* čaše: prvo one "ispod", pa one "iznad" */
  var order = G.cups.slice().sort(function(a,b){
    return (a.lift - b.lift);
  });
  for(var i=0;i<order.length;i++) drawFildzan(order[i], i);

  drawSmoke();
  drawKonfeti();
  drawRacija();
  drawBird();
  drawLevatTip();
  drawCiroTip();
  drawOnom();

  /* Šanerova podvala – bljesak */
  if(G.tell>0){
    ctx.save();
    ctx.globalAlpha = G.tell;
    ctx.translate(G.tellX, G.tellY);
    ctx.rotate((1-G.tell)*1.2);
    var rr2 = 16 + (1-G.tell)*30;
    ctx.strokeStyle = '#fff6d0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for(var k=0;k<4;k++){
      var an = k*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(an)*rr2, -Math.sin(an)*rr2);
      ctx.lineTo(Math.cos(an)*rr2, Math.sin(an)*rr2);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* particles */
  for(i=0;i<G.rings.length;i++){
    var r = G.rings[i];
    ctx.save(); ctx.globalAlpha = clamp(r.life,0,1)*0.6;
    ctx.strokeStyle = r.c; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r*0.42, 0,0,6.284); ctx.stroke();
    ctx.restore();
  }
  for(i=0;i<G.parts.length;i++){
    var p = G.parts[i];
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for(i=0;i<G.coins.length;i++){
    var co = G.coins[i];
    var vid = clamp(co.life,0,1);
    /* sjena na stolu — raste kako novčić pada */
    var vis = clamp((TABLEY-30 - co.y)/220, 0, 1);
    ctx.save();
    ctx.globalAlpha = vid*(0.34 - vis*0.22);
    ctx.fillStyle = '#2b0a0c';
    ctx.beginPath();
    ctx.ellipse(co.x, TABLEY-20, co.r*(1.2-vis*0.4), co.r*0.34, 0, 0, 6.284);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = vid;
    ctx.translate(co.x,co.y); ctx.rotate(co.rot);
    var sx = co.kotrlja ? 1 : Math.abs(Math.cos(co.rot*1.6));
    ctx.scale(0.25+sx*0.75, 1);
    ctx.fillStyle = '#e8bd6d';
    ctx.beginPath(); ctx.arc(0,0,co.r,0,6.284); ctx.fill();
    ctx.fillStyle = '#c19340';
    ctx.beginPath(); ctx.arc(0,0,co.r*0.62,0,6.284); ctx.fill();
    ctx.strokeStyle = 'rgba(255,238,190,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,co.r-1.5, -0.9, 0.9); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function streakTitle(n){
  var t = T('titula');
  if(n >= 15) return t[4];
  if(n >= 10) return t[3];
  if(n >= 7)  return t[2];
  if(n >= 5)  return t[1];
  if(n >= 3)  return t[0];
  return '';
}

function speechBubble(s, x, y, maxw, tailX, tailY, small){
  if(!s) return;
  var font = (small?'600 22px':'700 26px')+' system-ui,-apple-system,sans-serif';
  var lines = wrap(s, maxw-44, font);
  var lh = small?28:34;
  var h = lines.length*lh + 30;
  var w = 0;
  ctx.font = font;
  for(var i=0;i<lines.length;i++) w = Math.max(w, ctx.measureText(lines[i]).width);
  w = Math.min(maxw, w+44);
  var bx = clamp(x-w/2, 18, W-w-18), by = y-h;
  ctx.save();
  ctx.fillStyle = small?'rgba(28,24,36,0.92)':'rgba(250,244,232,0.96)';
  rr(ctx,bx,by,w,h,18); ctx.fill();
  ctx.strokeStyle = small?'rgba(255,220,170,0.35)':'rgba(120,80,40,0.55)'; ctx.lineWidth = 3;
  rr(ctx,bx,by,w,h,18); ctx.stroke();
  ctx.fillStyle = small?'rgba(28,24,36,0.92)':'rgba(250,244,232,0.96)';
  ctx.beginPath();
  ctx.moveTo(clamp(tailX-16,bx+14,bx+w-46), by+h-2);
  ctx.lineTo(clamp(tailX+16,bx+46,bx+w-14), by+h-2);
  ctx.lineTo(tailX, tailY);
  ctx.closePath(); ctx.fill();
  for(i=0;i<lines.length;i++){
    txt(lines[i], bx+w/2, by+22+i*lh, font, small?'#f0e2cc':'#2b1a10');
  }
  ctx.restore();
}

function drawMitoUI(){

    ctx.save();
    var a2 = clamp(G.t*2, 0, 1);
    ctx.globalAlpha = a2;
    var ok = (G.mitoDato >= 0 && G.mitoDato >= G.mitoPrag);
    ctx.fillStyle = ok ? 'rgba(40,90,50,0.92)' : 'rgba(90,32,32,0.92)';

    rr(ctx, 60, 1010, 600, 120, 20); ctx.stroke();
    if(G.mitoDato === -2) txt(T('vodeGa'), 360, 1052, '900 38px system-ui,sans-serif', '#ffd0c8');
    else if(ok) txt(T('pustaju'), 360, 1052, '900 38px system-ui,sans-serif', '#c8ffcf');
    else txt(T('umaricu'), 360, 1052, '900 38px system-ui,sans-serif', '#ffd0c8');
    if(G.mitoDato > 0) txt('−'+G.mitoDato+' KM', 360, 1098, '800 28px system-ui,sans-serif', '#ffe9a8');
    ctx.restore();
    return;
  }

  /* odbrojavanje */
  var p = clamp(G.mitoT/12, 0, 1);

function drawKlapa(t){
  ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0,0,W,HH);
  ctx.save();
  ctx.translate(360, 560);
  var zatvorena = (t > 2.38);
  /* gornja letva — otvorena dok se odbrojava, pa tres */
  ctx.save();
  ctx.translate(-190, -84);
  ctx.rotate(zatvorena ? 0 : -0.38);
  ctx.fillStyle = '#15161a';
  rr(ctx, 0, -46, 380, 46, 8); ctx.fill();
  ctx.fillStyle = '#e8e4da';
  for(var s=0;s<5;s++){
    ctx.beginPath();
    ctx.moveTo(24+s*76, -46); ctx.lineTo(24+s*76+34, -46);
    ctx.lineTo(24+s*76+12, 0); ctx.lineTo(24+s*76-22, 0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* tijelo table */
  ctx.fillStyle = '#15161a';
  rr(ctx, -190, -84, 380, 250, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(232,228,218,0.35)'; ctx.lineWidth = 2;
  rr(ctx, -190, -84, 380, 250, 10); ctx.stroke();
  ctx.fillStyle = '#e8e4da';
  for(var s2=0;s2<5;s2++){
    ctx.beginPath();
    ctx.moveTo(-166+s2*76, -84); ctx.lineTo(-166+s2*76+34, -84);
    ctx.lineTo(-166+s2*76+12, -38); ctx.lineTo(-166+s2*76-22, -38);
    ctx.closePath(); ctx.fill();
  }
  txt('TRI FILDŽANA', 0, -4, '900 34px system-ui,sans-serif', '#e8e4da');
  ctx.strokeStyle = 'rgba(232,228,218,0.3)';
  ctx.beginPath(); ctx.moveTo(-170, 22); ctx.lineTo(170, 22); ctx.stroke();
  txt(T('mKlapaScena')+' 1  ·  '+T('mKlapaKadar')+' 1', 0, 62, '700 26px system-ui,sans-serif', 'rgba(232,228,218,0.85)');
  txt(T('mKlapaReditelj'), 0, 116, '600 23px system-ui,sans-serif', 'rgba(232,228,218,0.55)');
  ctx.restore();
  /* odbrojavanje: 3, 2, 1 — pa AKCIJA */
  if(t > 0.95){
    var broj = 3 - Math.floor((t-0.95)/0.48);
    var puls2 = 1 + ((t-0.95) % 0.48)*0.3;
    ctx.save();
    ctx.translate(360, 300);
    ctx.scale(puls2, puls2);

      txt(T('intAkcija'), 0, 0, '900 72px system-ui,sans-serif', '#ffe9b0');
    }
    ctx.restore();
  }
}

function drawIntro(){
  var t = G.t;

  /* 1. televizor se pali */
  if(t < 0.85){
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,HH);
    var k = clamp(t/0.85, 0, 1);
    var lw = (k < 0.40) ? lerp(40, W, eoc(k/0.40)) : W;
    var lh = (k < 0.40) ? 4 : lerp(4, HH, eoc((k-0.40)/0.60));
    var la = (k < 0.40) ? 1 : 1 - eic((k-0.40)/0.60)*0.55;
    ctx.fillStyle = 'rgba(232,255,250,'+la+')';
    ctx.fillRect((W-lw)/2, 640-lh/2, lw, lh);
    return;
  }

  /* 2.–3. otvaranje po uvodu: test slika, klapa ili kratki snijeg */
  if(G.introVar === 1){
    /* filmski set: klapa umjesto test slike */
    if(t < 2.45){ drawKlapa(t); return; }
    if(t < 2.80){ drawKlapa(t); drawSnijeg(1 - (t-2.45)/0.35); }
  }else if(G.introVar === 2){
    /* telefon zvoni već u snijegu — brzi rez na binu */
    if(t < 1.45){
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,HH);
      drawSnijeg(0.85);
      return;
    }
    if(t < 1.75) drawSnijeg(1 - (t-1.45)/0.30);
  }else{
    if(t < 2.45){ drawTestSlika(t); return; }
    if(t < 2.94){ drawTestSlika(t); drawSnijeg(1); return; }
    if(t < 3.22) drawSnijeg(1 - (t-2.94)/0.28);
  }

  /* Šanerove replike prije naslova */
  if(G.sayT > 0 && t < 7.26) speechBubble(G.say, 372, 404, 540, 372, 442, false);
  /* Levatova najava (uvod #4) */
  if(G.introVar === 3 && G.levatT > 0 && G.levatPeek > 0.35 && t < 7.26){
    speechBubble(G.levat, 196, 588, 344, 78, 622, true);
  }

  /* 4. naslov udara */
  ctx.save();
  var tt = clamp((t-7.30)/0.30, 0, 1);
  if(tt > 0){
    ctx.save();
    ctx.globalAlpha = clamp((t-7.30)*5, 0, 1);
    var sc = lerp(3.2, 1, eoc(tt));
    ctx.fillStyle = 'rgba(10,8,14,0.5)';
    ctx.fillRect(0, 182, W, 232);
    ctx.translate(360, 168);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = '900 88px system-ui,-apple-system,sans-serif';
    ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(18,10,6,0.9)';
    ctx.strokeText('TRI', 0, -50);
    ctx.fillStyle = '#ffd479'; ctx.fillText('TRI', 0, -50);
    ctx.font = '900 84px system-ui,-apple-system,sans-serif';
    ctx.strokeText('FILDŽANA', 0, 44);
    ctx.fillStyle = '#ffe9b0'; ctx.fillText('FILDŽANA', 0, 44);
    ctx.restore();
  }
  if(t > 7.86){
    var a2 = clamp((t-7.86)/0.36, 0, 1);
    ctx.globalAlpha = a2;
    ctx.strokeStyle = 'rgba(255,200,120,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(360-210*a2, 266); ctx.lineTo(360+210*a2, 266); ctx.stroke();
    txt(T('rukaOko'), 360, 294, '600 27px system-ui,sans-serif', 'rgba(255,232,196,0.9)');
    ctx.globalAlpha = 1;
  }
  if(t > 8.35){
    /* poziv na dodir — veliki, u sredini ekrana, da se ne traži */
    var ui = clamp((t-6.45)*3, 0, 1);
    var puls = 1 + Math.sin(G.gt*3.0)*0.035;
    ctx.save();
    ctx.globalAlpha = ui;
    ctx.translate(360, 1000);   /* ispod fildžana, da ne prekriva Šanera */
    ctx.scale(puls, puls);
    /* sjaj iza dugmeta */
    var cg = ctx.createRadialGradient(0, 0, 40, 0, 0, 330);
    cg.addColorStop(0, 'rgba(255,190,90,'+(0.30+0.14*Math.sin(G.gt*3.0))+')');
    cg.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, 330, 0, 6.284); ctx.fill();
    /* tijelo dugmeta */
    ctx.fillStyle = 'rgba(14,10,8,0.84)';
    rr(ctx, -292, -92, 584, 184, 26); ctx.fill();
    var bg3 = ctx.createLinearGradient(0, -92, 0, 92);
    bg3.addColorStop(0, 'rgba(255,212,121,0.22)');
    bg3.addColorStop(1, 'rgba(255,212,121,0.05)');
    ctx.fillStyle = bg3;
    rr(ctx, -292, -92, 584, 184, 26); ctx.fill();
    ctx.strokeStyle = 'rgba(255,212,121,'+(0.65+0.35*Math.sin(G.gt*3.0))+')';
    ctx.lineWidth = 5;
    rr(ctx, -292, -92, 584, 184, 26); ctx.stroke();
    txt(T('dodirniPocetak1'), 0, -42, '900 62px system-ui,-apple-system,sans-serif', '#ffd479');
    txt(T('dodirniPocetak2'), 0, 18, '900 52px system-ui,-apple-system,sans-serif', '#ffe9b0');
    ctx.strokeStyle = 'rgba(255,212,121,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-210, 50); ctx.lineTo(210, 50); ctx.stroke();
    txt(T('cilj').replace('%s', FLEE_LIMIT), 0, 70,
        '600 21px system-ui,sans-serif', 'rgba(255,225,180,0.7)');
    ctx.restore();

    /* fora ide u oblačić iznad Šanera, tamo se i gleda */
    ctx.globalAlpha = ui;
    speechBubble(T('postenaIgra'), 372, 412, 600, 372, 448, false);
    if(G.best>0) txt(T('rekord') + G.best + ' KM   ·   ' + G.bestRound + T('rundiKratko'), 360, 476,
        '600 21px system-ui,sans-serif', 'rgba(255,225,180,0.45)');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ==========================================================================
   Figure za međuigre — isti stil kao na bini (nema više crnih mrlja).
   Ishodište je u struku; glava ide iznad. figura(x, y, scale, tip, opcije)
   ========================================================================== */
function figuraTorzo(tip, dis){
  var kosulja = '#e6d9bf', prsluk = '#6d2530';
  if(tip === 'levat'){ kosulja = '#8fa2ba'; prsluk = '#5d6c80'; }
  else if(tip === 'voditelj'){ kosulja = '#dfe6ee'; prsluk = '#1b2740'; }
  else if(tip === 'gost'){ kosulja = '#cfc3aa'; prsluk = '#3a3a34'; }
  else if(tip === 'reditelj'){ kosulja = '#d8cbb4'; prsluk = '#3f4a3a'; }
  else if(tip === 'kandidat'){ kosulja = '#d9d2c2'; prsluk = '#5a4a6b'; }

  /* košulja */
  ctx.fillStyle = kosulja;
  ctx.beginPath();
  ctx.moveTo(-74, 40);
  ctx.quadraticCurveTo(-76, -70, -60, -110);
  ctx.quadraticCurveTo(-32, -132, 0, -132);
  ctx.quadraticCurveTo(32, -132, 60, -110);
  ctx.quadraticCurveTo(76, -70, 74, 40);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(30,24,18,0.25)'; ctx.lineWidth = 2; ctx.stroke();

  if(tip === 'levat'){
    /* karo */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-74, 40); ctx.quadraticCurveTo(-76, -70, -60, -110);
    ctx.quadraticCurveTo(-32, -132, 0, -132);
    ctx.quadraticCurveTo(32, -132, 60, -110);
    ctx.quadraticCurveTo(76, -70, 74, 40);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = 'rgba(46,60,84,0.5)';
    for(var i=0;i<7;i++) ctx.fillRect(-78+i*24, -136, 11, 190);
    for(var j=0;j<8;j++) ctx.fillRect(-78, -136+j*24, 156, 11);
    ctx.restore();
  }else{
    /* prsluk / sako u dva panela */
    ctx.fillStyle = prsluk;
    ctx.beginPath();
    ctx.moveTo(-62, -114); ctx.quadraticCurveTo(-74, -50, -72, 40);
    ctx.lineTo(-16, 40); ctx.lineTo(-8, -32); ctx.lineTo(-22, -96);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(62, -114); ctx.quadraticCurveTo(74, -50, 72, 40);
    ctx.lineTo(16, 40); ctx.lineTo(8, -32); ctx.lineTo(22, -96);
    ctx.closePath(); ctx.fill();
    if(tip === 'saner'){
      ctx.strokeStyle = 'rgba(230,186,112,0.55)'; ctx.lineWidth = 3;

      ctx.beginPath(); ctx.moveTo(22,-96); ctx.lineTo(8,-32); ctx.lineTo(16,40); ctx.stroke();
    }
    if(tip === 'voditelj' || tip === 'gost'){
      /* kravata */
      ctx.fillStyle = (tip === 'voditelj') ? '#a8323c' : '#6b5a3a';
      ctx.beginPath();
      ctx.moveTo(0,-104); ctx.lineTo(11,-88); ctx.lineTo(6,-20); ctx.lineTo(-6,-20);
      ctx.lineTo(-11,-88); ctx.closePath(); ctx.fill();
    }
    if(tip === 'gost'){
      /* zakrpe na iznošenom odijelu */
      ctx.fillStyle = 'rgba(120,108,88,0.6)';
      ctx.fillRect(-52, -80, 24, 20);
      ctx.fillRect(28, -40, 20, 17);
    }
  }
  if(dis){
    ctx.fillStyle = 'rgba(10,12,16,0.45)';
    ctx.beginPath();
    ctx.moveTo(-74, 40);
    ctx.quadraticCurveTo(-76, -70, -60, -110);
    ctx.quadraticCurveTo(-32, -132, 0, -132);
    ctx.quadraticCurveTo(32, -132, 60, -110);
    ctx.quadraticCurveTo(76, -70, 74, 40);
    ctx.closePath(); ctx.fill();
  }
}

function figuraGlava(tip, raspolozenje, gt){
  var koza = (tip === 'levat') ? '#c08a5e' : '#c9946a';
  if(tip === 'gost') koza = '#b98a62';
  var hy = -196;
  /* vrat */
  ctx.fillStyle = (tip === 'levat') ? '#b07d52' : koza;
  rr(ctx, -17, hy+38, 34, 62, 9); ctx.fill();
  /* glava */
  ctx.fillStyle = koza;
  ctx.beginPath(); ctx.ellipse(0, hy, 46, 50, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-46, hy+8, 8, 12, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(46, hy+8, 8, 12, 0, 0, 6.284); ctx.fill();

  var gy = hy - 8;
  if(tip === 'levat'){
    /* vijenac kose i debele naočale */
    ctx.fillStyle = '#4a4038';
    ctx.beginPath(); ctx.ellipse(-42, hy-4, 10, 20, 0.25, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, hy-4, 10, 20, -0.25, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, hy-46, 28, 9, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#241d18'; ctx.lineWidth = 5;
    ctx.fillStyle = 'rgba(190,225,240,0.45)';
    ctx.beginPath(); ctx.ellipse(-18, gy, 15, 13, 0, 0, 6.284); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(18, gy, 15, 13, 0, 0, 6.284); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-3, gy-2); ctx.lineTo(3, gy-2); ctx.stroke();
  }else if(tip === 'saner'){
    /* kačket */
    ctx.fillStyle = '#3b3145';
    ctx.beginPath(); ctx.ellipse(0, hy-44, 50, 28, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-50, hy-46, 100, 8);
    ctx.beginPath(); ctx.ellipse(-12, hy-38, 54, 11, -0.06, 0, 6.284); ctx.fill();
  }else if(tip === 'voditelj'){
    ctx.fillStyle = '#2e2822';
    ctx.beginPath(); ctx.ellipse(0, hy-30, 47, 26, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-30, hy-18, 18, 16, 0, 0, 6.284); ctx.fill();
  }else if(tip === 'gost'){
    /* šešir */
    ctx.fillStyle = '#2a2620';
    ctx.beginPath(); ctx.ellipse(0, hy-40, 40, 26, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, hy-38, 62, 12, 0, 0, 6.284); ctx.fill();
  }else if(tip === 'reditelj'){
    /* slušalice i brada */
    ctx.fillStyle = '#3a3f36';
    ctx.beginPath(); ctx.ellipse(0, hy-42, 46, 20, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#20241e';
    ctx.beginPath(); ctx.ellipse(-50, hy+2, 14, 20, 0, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(50, hy+2, 14, 20, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = '#20241e'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, hy-6, 50, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ctx.fillStyle = 'rgba(60,48,38,0.55)';
    ctx.beginPath(); ctx.ellipse(0, gy+34, 30, 22, 0, 0, 6.284); ctx.fill();
  }else{
    /* kandidat: obična frizura */
    ctx.fillStyle = '#3a2f28';
    ctx.beginPath(); ctx.ellipse(0, hy-34, 46, 24, 0, Math.PI, 0); ctx.fill();
  }

  /* obrve */
  ctx.strokeStyle = (tip === 'levat') ? '#4a4038' : '#3a2418';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  var br = (raspolozenje === 'ljut') ? 6 : (raspolozenje === 'tuzan' ? -5 : 0);
  ctx.beginPath(); ctx.moveTo(-34, gy-24+br); ctx.lineTo(-9, gy-19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(34, gy-24+br); ctx.lineTo(9, gy-19); ctx.stroke();

  /* oči */
  if(tip !== 'levat'){
    ctx.fillStyle = '#fdf6ec';
    ctx.beginPath(); ctx.ellipse(-20, gy, 13, 10, 0, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, gy, 13, 10, 0, 0, 6.284); ctx.fill();
  }
  ctx.fillStyle = '#241a14';
  var pog = (raspolozenje === 'gleda') ? 4 : 0;
  ctx.beginPath(); ctx.arc(-20+pog, gy+1, 5.4, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(20+pog, gy+1, 5.4, 0, 6.284); ctx.fill();

  /* nos */
  ctx.strokeStyle = 'rgba(150,100,64,0.9)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, gy+8); ctx.lineTo(-4, gy+22); ctx.lineTo(5, gy+23); ctx.stroke();

  /* brkovi samo Šaner */
  if(tip === 'saner'){
    ctx.fillStyle = '#2b1b12';
    ctx.beginPath();
    ctx.moveTo(0, gy+30);
    ctx.quadraticCurveTo(-28, gy+24, -38, gy+38);
    ctx.quadraticCurveTo(-22, gy+38, 0, gy+38);
    ctx.quadraticCurveTo(22, gy+38, 38, gy+38);
    ctx.quadraticCurveTo(28, gy+24, 0, gy+30);
    ctx.closePath(); ctx.fill();
  }
  if(tip === 'gost'){
    ctx.fillStyle = 'rgba(60,48,38,0.35)';
    ctx.beginPath(); ctx.ellipse(0, gy+34, 28, 20, 0, 0, 6.284); ctx.fill();
  }

  /* usta */
  ctx.strokeStyle = '#6b3a2a'; ctx.lineWidth = 3.5;
  if(raspolozenje === 'vice'){
    ctx.fillStyle = '#6b3a2a';
    ctx.beginPath(); ctx.ellipse(0, gy+44, 14, 12+Math.abs(Math.sin(gt*11))*5, 0, 0, 6.284); ctx.fill();
  }else if(raspolozenje === 'tuzan'){
    ctx.beginPath(); ctx.arc(0, gy+54, 16, 3.5, 6.0); ctx.stroke();
  }else if(raspolozenje === 'smije'){
    ctx.beginPath(); ctx.arc(0, gy+34, 18, 0.35, Math.PI-0.35); ctx.stroke();
  }else{
    ctx.beginPath(); ctx.moveTo(-13, gy+42); ctx.lineTo(13, gy+41); ctx.stroke();
  }
}

function figura(x, y, sc, tip, raspolozenje, dis){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  figuraTorzo(tip, dis);
  figuraGlava(tip, raspolozenje || '', G.gt);
  if(dis){
    ctx.fillStyle = 'rgba(10,12,16,0.45)';
    ctx.beginPath(); ctx.ellipse(0, -196, 52, 56, 0, 0, 6.284); ctx.fill();
  }
  ctx.restore();
}

}

/* 1 — Šaner se seli */
function mSelidba(t, m){
  var pan = t*150;
  var g = ctx.createLinearGradient(0,0,0,HH);
  g.addColorStop(0,'#0d1220'); g.addColorStop(0.6,'#1c2130'); g.addColorStop(1,'#3a3226');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HH);
  /* zgrade koje promiču */
  for(var i=0;i<9;i++){
    var bx = ((i*200 - pan) % 1800 + 1800) % 1800 - 400;
    var bh = 180 + (i%4)*90;
    ctx.fillStyle = '#12161e';
    ctx.fillRect(bx, 700-bh, 160, bh);
    for(var w2=0; w2<3; w2++){
      for(var h2=0; h2<Math.floor(bh/60); h2++){
        if(((i*7+w2*3+h2*5) % 11) > 5) continue;
        ctx.fillStyle = 'rgba(255,206,124,0.45)';
        ctx.fillRect(bx+22+w2*48, 700-bh+30+h2*60, 18, 24);
      }
    }
  }
  /* ulična rasvjeta */
  for(i=0;i<5;i++){
    var lx2 = ((i*300 - pan*1.4) % 1500 + 1500) % 1500 - 200;
    ctx.strokeStyle = '#0e1218'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(lx2, 760); ctx.lineTo(lx2, 380); ctx.stroke();
    var lg2 = ctx.createRadialGradient(lx2, 380, 6, lx2, 380, 150);
    lg2.addColorStop(0,'rgba(255,214,140,0.45)');
    lg2.addColorStop(1,'rgba(255,214,140,0)');
    ctx.fillStyle = lg2; ctx.beginPath(); ctx.arc(lx2, 380, 150, 0, 6.284); ctx.fill();
  }
  ctx.fillStyle = '#241c14'; ctx.fillRect(0, 758, W, HH-758);

  /* Šaner u siluети s kutijom */
  var walk = Math.min(t, m.cut);
  var sx = lerp(-140, 360, clamp(walk/m.cut, 0, 1));
  var bobY = Math.abs(Math.sin(G.gt*7))*7;
  /* noge u hodu */
  ctx.save();
  ctx.translate(sx, 758 - bobY);
  ctx.strokeStyle = '#1a140f'; ctx.lineWidth = 22; ctx.lineCap = 'round';
  for(var L=0;L<2;L++){
    var an = G.gt*7 + L*Math.PI;
    ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(Math.cos(an)*34, 44); ctx.stroke();
  }
  ctx.restore();
  /* Šaner kakvog i inače vidimo, samo u noćnom svjetlu */
  figura(sx, 758 - bobY - 34, 0.92, 'saner', 'ljut');
  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = '#0a0d14';
  ctx.beginPath(); ctx.ellipse(sx, 640 - bobY, 96, 190, 0, 0, 6.284); ctx.fill();
  ctx.restore();
  /* sanduk na ramenu */
  ctx.save();
  ctx.translate(sx + 62, 758 - bobY - 244);
  ctx.rotate(-0.16 + Math.sin(G.gt*7)*0.03);
  ctx.fillStyle = '#2a1d13';
  rr(ctx, -60, -46, 130, 92, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(180,150,110,0.35)'; ctx.lineWidth = 3;
  for(var k2=0;k2<3;k2++){ ctx.beginPath(); ctx.moveTo(-60, -30+k2*30); ctx.lineTo(70, -30+k2*30); ctx.stroke(); }
  ctx.restore();

  if(t < m.cut){
    ctx.globalAlpha = clamp(t*2, 0, 1)*clamp((m.cut-t)*3, 0, 1);
    txt(T('mSelidba'), 360, 250, '900 42px system-ui,sans-serif', '#ffd479');
    txt(T('mSelidbaSub'), 360, 300, '600 24px system-ui,sans-serif', 'rgba(255,225,180,0.7)');
    ctx.globalAlpha = 1;
  } else {
    najavaKarta(t - m.cut);
  }
}

/* 2 — reklamna pauza */
function mReklama(t, m){
  ctx.fillStyle = '#7c1f22'; ctx.fillRect(0,0,W,HH);
  ctx.save();
  ctx.translate(360, 520); ctx.rotate(t*0.35);
  for(var z=0;z<14;z++){
    ctx.rotate(Math.PI*2/14);
    ctx.fillStyle = (z%2) ? 'rgba(255,190,90,0.16)' : 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(700,-70); ctx.lineTo(700,70); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  var pop = (t < 0.35) ? eob(t/0.35) : 1 + Math.sin((t-0.35)*4)*0.02;
  ctx.save();
  ctx.translate(360, 480); ctx.scale(pop, pop);
  ctx.fillStyle = '#f2e6cc';
  rr(ctx, -280, -190, 560, 380, 20); ctx.fill();
  ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 6;
  rr(ctx, -280, -190, 560, 380, 20); ctx.stroke();
  txt(T('mReklama'), 0, -136, '900 44px system-ui,sans-serif', '#7c1f22');
  txt(T('mReklamaSub'), 0, -96, '600 21px system-ui,sans-serif', 'rgba(60,40,26,0.75)');
  ctx.restore();

  /* tri fildžana kao proizvod */
  ctx.save();
  ctx.translate(360, 520);
  for(var i=-1;i<=1;i++){
    var fake = {x:360+i*118, lift:0.5+Math.sin(G.gt*3+i)*0.06, tilt:i*0.06, sq:1, wob:0, hi:0, a:1, sc:1};
    ctx.save();
    ctx.translate(-360, -TABLEY+120);
    drawFildzan(fake, 0);
    ctx.restore();
  }
  ctx.restore();

  /* akcijska zvijezda */
  var st2 = 1 + Math.sin(G.gt*7)*0.06;
  ctx.save();
  ctx.translate(574, 300); ctx.rotate(0.28); ctx.scale(st2, st2);
  ctx.fillStyle = '#e8bd6d';
  ctx.beginPath();
  for(var p2=0;p2<20;p2++){
    var r2 = (p2%2) ? 44 : 86, an2 = p2*Math.PI/10;
    ctx.lineTo(Math.cos(an2)*r2, Math.sin(an2)*r2);
  }
  ctx.closePath(); ctx.fill();
  txt(T('mReklamaAkcija'), 0, -6, '900 26px system-ui,sans-serif', '#7c1f22');
  txt('3 + 1', 0, 22, '800 22px system-ui,sans-serif', '#7c1f22');
  ctx.restore();

  txt(T('mReklamaOglas'), 360, 806, '700 20px system-ui,sans-serif', 'rgba(255,225,180,0.55)');

  if(t > m.cut){
    ctx.fillStyle = 'rgba(10,8,12,'+clamp((t-m.cut)*2.2,0,0.82)+')';
    ctx.fillRect(0,0,W,HH);
    ctx.save();
    ctx.globalAlpha = clamp((t-m.cut)*2.2,0,1);
    txt(T('mReklamaDalje'), 360, 320, '900 40px system-ui,sans-serif', '#ffd479');
    ctx.restore();
    najavaKarta(t - m.cut);
  }
}

/* 4 — gledalac zove */
function mTelefon(t, m){
  ctx.fillStyle = '#0c0e12'; ctx.fillRect(0,0,W,HH);
  var pulse = 0.5 + 0.5*Math.abs(Math.sin(t*6));
  var rg = ctx.createRadialGradient(360, 520, 20, 360, 520, 420);
  rg.addColorStop(0,'rgba(120,200,255,'+(0.16*pulse)+')');
  rg.addColorStop(1,'rgba(120,200,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,HH);

  /* brojčanik */
  var dial = (t < m.cut*0.5) ? 0 : clamp((t - m.cut*0.5)/0.5, 0, 1);
  var rot = Math.sin(dial*Math.PI)*1.1;
  ctx.save();
  ctx.translate(360, 520);
  ctx.fillStyle = '#1b2029';
  ctx.beginPath(); ctx.arc(0, 0, 160, 0, 6.284); ctx.fill();
  ctx.strokeStyle = '#39414d'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, 0, 160, 0, 6.284); ctx.stroke();
  ctx.save();
  ctx.rotate(rot);
  ctx.fillStyle = '#0d1116';
  for(var d3=0; d3<10; d3++){
    var a3 = -2.2 + d3*0.42;
    ctx.beginPath(); ctx.arc(Math.cos(a3)*112, Math.sin(a3)*112, 20, 0, 6.284); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#2b3138';
  ctx.beginPath(); ctx.arc(0, 0, 56, 0, 6.284); ctx.fill();
  ctx.fillStyle = 'rgba(255,214,140,'+pulse+')';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.284); ctx.fill();
  ctx.restore();

  ctx.globalAlpha = clamp(t*2, 0, 1);
  txt(T('mTelefon'), 360, 250, '900 40px system-ui,sans-serif', '#ffd479');
  var rep = wrap(T('mTelefonSub'), 540, '600 24px system-ui,sans-serif');
  for(var i=0;i<rep.length;i++)
    txt(rep[i], 360, 306+i*32, '600 24px system-ui,sans-serif', 'rgba(255,225,180,0.8)');
  ctx.globalAlpha = 1;

  if(t > m.cut) najavaKarta(t - m.cut, 'rgba(160,210,255,0.6)');
}

/* 5 — karta puta */
function mKarta(t, m){
  ctx.fillStyle = '#1a1610'; ctx.fillRect(0,0,W,HH);
  /* papir */
  ctx.fillStyle = '#e6dcc0';
  rr(ctx, 40, 240, W-80, 560, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(120,96,60,0.5)'; ctx.lineWidth = 4;
  rr(ctx, 40, 240, W-80, 560, 14); ctx.stroke();
  ctx.save();
  rr(ctx, 40, 240, W-80, 560, 14); ctx.clip();
  ctx.strokeStyle = 'rgba(120,96,60,0.14)'; ctx.lineWidth = 2;
  for(var i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo(40, 268+i*46); ctx.lineTo(W-40, 268+i*46); ctx.stroke(); }
  for(i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo(76+i*54, 240); ctx.lineTo(76+i*54, 800); ctx.stroke(); }
  /* rijeka */
  ctx.strokeStyle = 'rgba(90,140,160,0.4)'; ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(40, 700); ctx.bezierCurveTo(220, 640, 380, 760, 680, 660); ctx.stroke();
  ctx.restore();

  var ax = 168, ay = 620, bx = 566, by = 380;
  /* isprekidana ruta */
  var prog = clamp(t/m.cut, 0, 1);
  ctx.strokeStyle = 'rgba(150,60,40,0.85)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for(var d4=0; d4<26; d4++){
    var p1 = d4/26, p2 = p1 + 0.022;
    if(p1 > prog) break;
    var mx1 = lerp(ax,bx,p1), my1 = lerp(ay,by,p1) - Math.sin(p1*Math.PI)*90;
    var mx2 = lerp(ax,bx,p2), my2 = lerp(ay,by,p2) - Math.sin(p2*Math.PI)*90;
    ctx.beginPath(); ctx.moveTo(mx1,my1); ctx.lineTo(mx2,my2); ctx.stroke();
  }
  /* fildžan putuje */
  var px = lerp(ax,bx,prog), py = lerp(ay,by,prog) - Math.sin(prog*Math.PI)*90;
  ctx.save();
  ctx.translate(px - 360, py - TABLEY + 30);
  drawFildzan({x:360, lift:0, tilt:Math.sin(G.gt*4)*0.12, sq:1, wob:0, hi:0, a:1, sc:0.55}, 0);
  ctx.restore();

  /* tačke */
  ctx.fillStyle = '#3a2418';
  ctx.beginPath(); ctx.arc(ax, ay, 11, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, 11, 0, 6.284); ctx.fill();
  txt(MJ(G.levelPrev), ax, ay+40, '700 19px system-ui,sans-serif', '#5a3a22');
  txt(MJ(G.level), bx, by-36, '800 21px system-ui,sans-serif', '#7c1f22');
  txt(T('mKarta'), 360, 300, '900 34px system-ui,sans-serif', '#5a3a22');

  /* pečat */
  if(t > m.cut){
    var stp = clamp((t-m.cut)/0.22, 0, 1);
    ctx.save();
    ctx.globalAlpha = stp;
    ctx.translate(bx, by);
    ctx.rotate(-0.3);
    ctx.scale(lerp(2.4, 1, eoc(stp)), lerp(2.4, 1, eoc(stp)));
    ctx.strokeStyle = 'rgba(150,40,30,0.85)'; ctx.lineWidth = 6;
    rr(ctx, -104, -34, 208, 68, 8); ctx.stroke();
    txt(T('mKartaPecat'), 0, 0, '900 30px system-ui,sans-serif', 'rgba(150,40,30,0.9)');
    ctx.restore();
    najavaKarta(t - m.cut, 'rgba(200,120,80,0.6)');
  }
}

/* 6 — vanredna sjednica redakcije */
function mSjednica(t, m){
  var g = ctx.createLinearGradient(0,0,0,HH);
  g.addColorStop(0,'#1b2026'); g.addColorStop(1,'#2e2a22');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HH);
  /* neonska cijev */
  ctx.fillStyle = 'rgba(226,240,246,0.55)';
  rr(ctx, 210, 120, 300, 14, 7); ctx.fill();
  var ng = ctx.createRadialGradient(360, 140, 20, 360, 140, 380);
  ng.addColorStop(0,'rgba(210,235,255,0.16)'); ng.addColorStop(1,'rgba(210,235,255,0)');
  ctx.fillStyle = ng; ctx.fillRect(0,0,W,700);

  /* sto */
  ctx.fillStyle = '#3a2a1c';
  rr(ctx, 60, 700, 600, 150, 14); ctx.fill();
  ctx.fillStyle = 'rgba(20,14,10,0.4)';
  rr(ctx, 60, 700, 600, 16, 8); ctx.fill();

  /* reditelj, Levat i Šaner se svađaju */
  var ucesnici = [[150,'reditelj'], [268,'levat'], [566,'saner']];
  for(var i=0;i<ucesnici.length;i++){
    var vic = Math.sin(G.gt*(6+i*1.7) + i)*7;
    var prica = (Math.floor(G.gt*1.6) % 3 === i);
    figura(ucesnici[i][0], 716 + vic, 0.78, ucesnici[i][1],
           prica ? 'vice' : 'ljut');
  }
  /* mahanje rukama = svađa */
  if(t < m.cut){
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.5*Math.abs(Math.sin(G.gt*5));
    txt(T('sjSvadja'), 360, 320, '700 30px system-ui,sans-serif', 'rgba(255,225,180,0.9)');
    ctx.restore();
  }

  /* prazna stolica s natpisom */
  var strgnuto = (t > m.cut*0.62);
  ctx.save();
  ctx.translate(420, 640);
  ctx.fillStyle = '#241a12';
  rr(ctx, -46, -110, 92, 110, 8); ctx.fill();
  rr(ctx, -46, 0, 92, 22, 6); ctx.fill();
  ctx.restore();
  if(!strgnuto){
    ctx.fillStyle = '#e6dcc4';
    rr(ctx, 336, 656, 168, 46, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,44,0.6)'; ctx.lineWidth = 2;
    rr(ctx, 336, 656, 168, 46, 6); ctx.stroke();
    txt(T('sjIstina'), 420, 680, '800 24px system-ui,sans-serif', '#3a2a18');
  }else{
    /* natpis leti u stranu, novi je napisan flomasterom */
    var fl = clamp((t - m.cut*0.62)/0.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1-fl;
    ctx.translate(336 + fl*260, 656 + fl*200);
    ctx.rotate(fl*1.4);
    ctx.fillStyle = '#e6dcc4';
    rr(ctx, 0, 0, 168, 46, 6); ctx.fill();
    txt(T('sjIstina'), 84, 24, '800 24px system-ui,sans-serif', '#3a2a18');
    ctx.restore();
    ctx.fillStyle = '#e6dcc4';
    rr(ctx, 316, 656, 208, 46, 6); ctx.fill();
    ctx.save();
    ctx.translate(420, 680); ctx.rotate(-0.03);
    txt(T('sjNovi'), 0, 0, '800 22px system-ui,-apple-system,sans-serif', '#1f3f7a');
    ctx.restore();
  }

  txt(T('sjTitle'), 360, 240, '800 26px system-ui,sans-serif', 'rgba(255,225,180,0.8)');

  if(t > m.cut){
    var a = clamp((t-m.cut)*2.4, 0, 1);
    ctx.fillStyle = 'rgba(6,6,8,'+a+')';
    ctx.fillRect(0,0,W,HH);
    ctx.save();
    ctx.globalAlpha = a;
    txt(T('sjOdobren'), 360, 560, '900 40px system-ui,sans-serif', '#ffd479');
    txt(T('sjOstalo'), 360, 616, '700 30px system-ui,sans-serif', 'rgba(255,225,180,0.7)');
    ctx.restore();
    najavaKarta(t - m.cut);
  }
}

/* 7 — dnevnik, posljednje izdanje */
function mDnevnik2(t, m){
  var g = ctx.createLinearGradient(0,0,0,HH);
  g.addColorStop(0,'#12141a'); g.addColorStop(1,'#1b2230');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HH);

  /* voditelj */
  figura(360, 700, 0.98, 'voditelj', (Math.floor(t*2) % 2) ? 'vice' : '');
  ctx.fillStyle = '#0b1622'; rr(ctx, 120, 712, 480, 120, 10); ctx.fill();
  ctx.fillStyle = 'rgba(127,198,228,0.2)'; rr(ctx, 120, 712, 480, 10, 5); ctx.fill();

  txt(T('d2Title'), 360, 250, '800 28px system-ui,sans-serif', '#e8f2f8');

  /* vijesti se pojavljuju jedna po jedna */
  var linije = [T('d2L1'), T('d2L2'), T('d2L3'), T('d2L4'), T('d2L5')];
  for(var i=0;i<linije.length;i++){
    var tp = 0.35 + i*0.52;
    if(t < tp) break;
    var a = clamp((t-tp)*3, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(12,30,48,0.85)';
    rr(ctx, 70, 300+i*54, 580, 46, 8); ctx.fill();
    txt(linije[i], 92, 323+i*54, '600 23px system-ui,sans-serif', '#e8f2f8', 'left');
    ctx.restore();
  }

  /* traka koja ubrzava dok ne ostane samo tri tačke */
  ctx.fillStyle = 'rgba(12,30,48,0.95)';
  ctx.fillRect(0, 850, W, 84);
  ctx.fillStyle = '#c9463c';
  ctx.fillRect(0, 850, 170, 84);
  txt(T('tf1'), 85, 892, '900 34px system-ui,sans-serif', '#f6ece0');
  ctx.save();
  ctx.beginPath(); ctx.rect(170, 850, W-170, 84); ctx.clip();
  var kraj = (t > m.cut*0.86);
  if(kraj){
    txt('. . .', 420, 892, '900 40px system-ui,sans-serif', '#e8f2f8');
  }else{
    var brz = 120 + t*t*260;
    ctx.font = '700 26px system-ui,sans-serif';
    var tekst = linije.join('   ·   ') + '   ·   ';
    var wv = ctx.measureText(tekst).width;
    var off = (t*brz) % wv;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8f2f8';
    ctx.fillText(tekst, 190 - off, 892);
    ctx.fillText(tekst, 190 - off + wv, 892);
  }
  ctx.restore();

  if(t > m.cut) najavaKarta(t - m.cut, 'rgba(127,198,228,0.6)');
}

/* 8 — audicija za novu stvarnost */
function mAudicija(t, m){
  ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,HH);
  var sg = ctx.createRadialGradient(360, 560, 30, 360, 560, 460);
  sg.addColorStop(0,'rgba(255,230,180,0.16)'); sg.addColorStop(1,'rgba(255,230,180,0)');
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,HH);
  txt(T('auTitle'), 360, 220, '800 27px system-ui,sans-serif', 'rgba(255,225,180,0.85)');

  var repl = [T('au1'), T('au2'), T('au3')];
  var faza = Math.min(2, Math.floor(t / (m.cut/3)));
  var lok = (t % (m.cut/3)) / (m.cut/3);

  /* kandidat */
  var ulaz = clamp(lok*3, 0, 1), izlaz = clamp((lok-0.72)/0.28, 0, 1);
  var kx = lerp(-120, 360, eoc(ulaz)) + (faza < 2 ? eic(izlaz)*520 : 0);
  figura(kx, 716 + Math.abs(Math.sin(G.gt*7))*4, 0.86,
         (faza === 2) ? 'levat' : 'kandidat',
         (ulaz >= 1 && izlaz < 0.6) ? 'vice' : 'gleda');
  /* Šaner sjedi sa strane i ocjenjuje */
  figura(636, 726, 0.66, 'saner', (faza === 2) ? 'smije' : 'ljut');

  /* replika */
  if(ulaz >= 1 && izlaz < 0.6){
    speechBubble(repl[faza], clamp(kx, 200, 520), 470, 520, clamp(kx, 200, 520), 506, false);
  }
  /* pečat */
  if(lok > 0.62){
    var pa = clamp((lok-0.62)*6, 0, 1);
    ctx.save();
    ctx.globalAlpha = pa;
    ctx.translate(360, 330); ctx.rotate(-0.2);
    ctx.scale(lerp(2.2, 1, eoc(pa)), lerp(2.2, 1, eoc(pa)));
    var ok = (faza === 2);
    ctx.strokeStyle = ok ? 'rgba(90,180,100,0.9)' : 'rgba(180,50,40,0.9)';
    ctx.lineWidth = 6;
    rr(ctx, -180, -34, 360, 68, 8); ctx.stroke();
    txt(ok ? T('auIn') : T('auOut'), 0, 0, '900 28px system-ui,sans-serif',
        ok ? 'rgba(120,220,130,0.95)' : 'rgba(220,90,70,0.95)');
    ctx.restore();
  }

  if(t > m.cut) najavaKarta(t - m.cut);
}

/* 9 — pauza zbog nestanka smisla */
function mPauza(t, m){
  var siv = clamp(t*1.4, 0, 1) * clamp((m.cut+0.4-t)*1.6, 0, 1);
  drawSky(); drawSkyline();
  /* sve u sivo, osim fildžana */
  ctx.save();
  ctx.globalAlpha = siv*0.92;
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(0, 0, W, HH);
  ctx.restore();
  drawTable();
  ctx.save();
  ctx.globalAlpha = siv*0.86;
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(0, 0, W, HH);
  ctx.restore();
  /* fildžani ostaju u boji */
  for(var i=0;i<3;i++){
    var fake = {x:SLOTX3(i), lift:0, tilt:0, sq:1, wob:0, hi:0, a:1, sc:1};
    drawFildzan(fake, i);
  }
  ctx.save();
  ctx.globalAlpha = siv;
  txt(T('paTitle'), 360, 300, '800 26px system-ui,sans-serif', 'rgba(230,230,230,0.75)');
  ctx.restore();

  if(t > m.cut*0.5){
    var a = clamp((t - m.cut*0.5)*1.6, 0, 1) * clamp((m.cut+0.6-t)*2, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    var l = wrap(T('paSapat'), 540, '600 26px system-ui,sans-serif');
    for(var k=0;k<l.length;k++)
      txt(l[k], 360, 420+k*34, '600 26px system-ui,sans-serif', 'rgba(240,236,226,0.9)');
    ctx.restore();
  }
  /* svjetlo se vraća, ali prljavije */
  if(t > m.cut){
    ctx.save();
    ctx.globalAlpha = clamp((t-m.cut)*1.4, 0, 0.28);
    ctx.fillStyle = '#6a5030';
    ctx.fillRect(0,0,W,HH);
    ctx.restore();
    najavaKarta(t - m.cut);
  }
}

/* 10 — gost iz budućnosti */
function mGost(t, m){
  ctx.fillStyle = '#0e1014'; ctx.fillRect(0,0,W,HH);
  var lg = ctx.createLinearGradient(0, 0, 0, HH);
  lg.addColorStop(0,'rgba(255,230,180,0.05)'); lg.addColorStop(0.6,'rgba(255,230,180,0.14)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0,0,W,HH);
  /* vrata svjetla */
  var otv = clamp(t*1.6, 0, 1) * clamp((m.dur-0.6-t)*1.6, 0, 1);
  ctx.save();
  ctx.globalAlpha = otv*0.5;
  ctx.fillStyle = 'rgba(255,236,196,0.7)';
  ctx.fillRect(40, 300, 150*otv, 520);
  ctx.restore();

  /* gost ulazi, stane, izađe */
  var faza = clamp(t/0.9, 0, 1);
  var odlazak = clamp((t - m.cut - 0.5)/0.9, 0, 1);
  var gx = lerp(60, 300, eoc(faza)) - eic(odlazak)*300;
  figura(gx, 800 + Math.abs(Math.sin(G.gt*5))*3, 0.94, 'gost',
         (t > 1.0 && t < m.cut + 0.4) ? 'vice' : 'tuzan');

  txt(T('goTitle'), 360, 250, '700 24px system-ui,sans-serif', 'rgba(255,225,180,0.55)');

  if(t > 1.0 && t < m.cut + 0.4){
    var a = clamp((t-1.0)*2, 0, 1) * clamp((m.cut+0.4-t)*2, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    speechBubble(T('goLine'), 400, 520, 520, 330, 556, false);
    ctx.restore();
  }
  if(t > m.cut) najavaKarta(t - m.cut, 'rgba(200,200,210,0.5)');
}

/* 11 — reklama za Fildžan Extra 2 */
function mReklama2(t, m){
  ctx.fillStyle = '#123b4a'; ctx.fillRect(0,0,W,HH);
  ctx.save();
  ctx.translate(360, 500); ctx.rotate(-t*0.4);
  for(var z=0;z<16;z++){
    ctx.rotate(Math.PI*2/16);
    ctx.fillStyle = (z%2) ? 'rgba(120,220,255,0.13)' : 'rgba(255,255,255,0.04)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(760,-60); ctx.lineTo(760,60); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  var pop = (t < 0.35) ? eob(t/0.35) : 1 + Math.sin((t-0.35)*4)*0.02;
  ctx.save();
  ctx.translate(360, 470); ctx.scale(pop, pop);
  ctx.fillStyle = '#f2e6cc';
  rr(ctx, -290, -200, 580, 400, 20); ctx.fill();
  ctx.strokeStyle = '#123b4a'; ctx.lineWidth = 6;
  rr(ctx, -290, -200, 580, 400, 20); ctx.stroke();
  txt(T('r2Title'), 0, -148, '900 46px system-ui,sans-serif', '#123b4a');
  var sub = wrap(T('r2Sub'), 520, '700 22px system-ui,sans-serif');
  for(var i=0;i<sub.length;i++)
    txt(sub[i], 0, -104+i*28, '700 22px system-ui,sans-serif', 'rgba(20,50,62,0.8)');
  ctx.restore();

  /* fildžan s antenom i lampicom */
  ctx.save();
  ctx.translate(0, 40);
  var fake = {x:360, lift:0.42+Math.sin(G.gt*3)*0.04, tilt:0, sq:1, wob:0, hi:0, a:1, sc:1.5};
  drawFildzan(fake, 0);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = '#2b3138'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(392, 566); ctx.lineTo(430, 486); ctx.stroke();
  var blink = (Math.sin(G.gt*9) > 0);
  ctx.fillStyle = blink ? 'rgba(255,70,60,0.95)' : 'rgba(90,220,120,0.95)';
  ctx.beginPath(); ctx.arc(430, 478, 11, 0, 6.284); ctx.fill();
  ctx.restore();

  txt(T('r2Note'), 360, 830, '600 19px system-ui,sans-serif', 'rgba(220,240,250,0.6)');
  txt(T('mReklamaOglas'), 360, 866, '700 20px system-ui,sans-serif', 'rgba(220,240,250,0.5)');

  if(t > m.cut){
    ctx.fillStyle = 'rgba(6,14,18,'+clamp((t-m.cut)*2.2,0,0.82)+')';
    ctx.fillRect(0,0,W,HH);
    najavaKarta(t - m.cut, 'rgba(120,220,255,0.6)');
  }
}

function drawMedjuigra(){
  var t = G.levatLeave, m = MEDJU[G.medju];
  if(G.medju === 0) mKlapa(t, m);
  else if(G.medju === 1) mSelidba(t, m);
  else if(G.medju === 2) mReklama(t, m);
  else if(G.medju === 3) mDnevnik(t, m);
  else if(G.medju === 4) mTelefon(t, m);
  else if(G.medju === 5) mKarta(t, m);
  else if(G.medju === 6) mSjednica(t, m);
  else if(G.medju === 7) mDnevnik2(t, m);
  else if(G.medju === 8) mAudicija(t, m);
  else if(G.medju === 9) mPauza(t, m);
  else if(G.medju === 10) mGost(t, m);
  else mReklama2(t, m);
}

function drawKrajEkran(naslov, podnaslov, boja, dugmeBoje){
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,10,0.84)';
  ctx.fillRect(0,0,W,HH);
  var a = clamp(G.t*2,0,1);
  ctx.globalAlpha = a;
  txt(naslov, 360, 296, '900 50px system-ui,sans-serif', boja);
  txt(podnaslov, 360, 344, '600 24px system-ui,sans-serif', 'rgba(255,225,180,0.7)');
  ctx.strokeStyle = 'rgba(255,200,120,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(120, 380); ctx.lineTo(600, 380); ctx.stroke();

  var linije = [
    [T('sPara'), G.peakMoney+' KM'],
    [T('sOstalo'), G.money+' KM'],
    [T('sRundi'), (G.round-1)+''],
    [T('sRekord'), G.best+' KM']

/* Na tabletu ostaje crni okvir okolo — pretvaramo ga u stari televizor. */
function drawOkvir(){
  if(OX < 14 && OY < 14) return;
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var sx = OX, sy = OY, sw = W*SC, sh = HH*SC;

  /* KRITIČNO: crtamo samo po rubu, slika ostaje netaknuta.
     Bez ovog isječka drveni panel prekrije cijelu igru. */
  ctx.beginPath();
  ctx.rect(0, 0, VW, sy);
  ctx.rect(0, sy + sh, VW, VH - (sy + sh));
  ctx.rect(0, sy, sx, sh);
  ctx.rect(sx + sw, sy, VW - (sx + sw), sh);
  ctx.clip();

  /* drveno kućište */
  var wg = ctx.createLinearGradient(0, 0, VW, VH);
  wg.addColorStop(0, '#3d2a1c');
  wg.addColorStop(0.45, '#2a1d13');
  wg.addColorStop(1, '#170f0a');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, VW, VH);
  /* žile u drvetu */
  ctx.strokeStyle = 'rgba(90,62,38,0.30)'; ctx.lineWidth = 1.5;
  for(var i=0;i<22;i++){
    var y = (i*VH/22) + (i%3)*4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(VW*0.3, y+7, VW*0.65, y-9, VW, y+3);
    ctx.stroke();
  }

  /* zvučnik i dugmad ako ima mjesta sa strane */
  if(OX > 96){
    var pw = Math.min(OX-26, 130), px = OX/2 - pw/2;
    ctx.fillStyle = 'rgba(16,11,7,0.55)';
    rr(ctx, px, sy + sh*0.30, pw, sh*0.34, 10); ctx.fill();
    ctx.fillStyle = 'rgba(120,92,60,0.35)';
    for(var g=0; g<14; g++){
      var gy = sy + sh*0.30 + 10 + g*((sh*0.34-20)/14);
      ctx.fillRect(px+8, gy, pw-16, 3);
    }
    /* dugmad desno */
    var kx = VW - OX/2;
    for(var k=0;k<2;k++){
      var ky = sy + sh*(0.34 + k*0.16);
      var kr = Math.min(OX*0.26, 30);
      ctx.fillStyle = '#1b120b';
      ctx.beginPath(); ctx.arc(kx, ky, kr, 0, 6.284); ctx.fill();
      ctx.strokeStyle = 'rgba(200,160,100,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(kx, ky, kr, 0, 6.284); ctx.stroke();
      ctx.strokeStyle = 'rgba(230,196,140,0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      var an = (k === 0) ? -0.9 : 0.5;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx+Math.cos(an)*kr*0.7, ky+Math.sin(an)*kr*0.7); ctx.stroke();
    }
    /* pločica s markom */
    ctx.fillStyle = 'rgba(200,160,100,0.6)';
    txt(T('tf1'), kx, sy + sh*0.72, '800 ' + Math.round(Math.min(OX*0.34, 30)) + 'px system-ui,sans-serif', 'rgba(226,190,132,0.75)');
  }

  /* okvir oko slike */
  var b = Math.max(6, Math.min(OX, OY, 26));
  ctx.strokeStyle = 'rgba(12,8,5,0.9)'; ctx.lineWidth = b*2;
  rr(ctx, sx - b, sy - b, sw + b*2, sh + b*2, b*1.4); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,112,68,0.45)'; ctx.lineWidth = 3;
  rr(ctx, sx - b*0.6, sy - b*0.6, sw + b*1.2, sh + b*1.2, b); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,170,0.10)'; ctx.lineWidth = 2;
  rr(ctx, sx - 2, sy - 2, sw + 4, sh + 4, 6); ctx.stroke();

  ctx.restore();
}

/* ==========================================================================
   PIKSEL-NAČIN — scena se crta u mali buffer, pa se skalira bez zaglađivanja
   ========================================================================== */
var PIX = false;
var PXW = 180, PXH = 320, PXS = PXW / W;   /* 0.25 */
var PXCV = null, PXC = null;
var PIX_STEP = 36;                          /* koraci palete po kanalu */

function pixInit(){
  if(PXC) return true;
  try{
    PXCV = document.createElement('canvas');
    PXCV.width = PXW; PXCV.height = PXH;
    PXC = PXCV.getContext('2d');
    return !!PXC;
  }catch(e){ PXCV = null; PXC = null; return false; }
}

function pixToggle(){
  PIX = !PIX;
  if(PIX && !pixInit()) PIX = false;
  /* gradijenti su vezani za kontekst — očisti keš pri prebacivanju */
  _skyCache = {}; _vigG = null; _stageG = null;
  save();
}

/* paleta + Bayer 4x4 raster */
var BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function pixPaleta(){
  var img = PXC.getImageData(0, 0, PXW, PXH), d = img.data;
  for(var y=0; y<PXH; y++){
    for(var x=0; x<PXW; x++){
      var i = (y*PXW + x) * 4;
      var b = (BAYER[(y & 3)*4 + (x & 3)]/16 - 0.5) * PIX_STEP;
      for(var k=0; k<3; k++){
        var v = d[i+k] + b;
        v = v < 0 ? 0 : (v > 255 ? 255 : v);
        v = Math.round(v / PIX_STEP) * PIX_STEP;
        d[i+k] = v > 255 ? 255 : v;
      }
    }
  }
  PXC.putImageData(img, 0, 0);
}

/* crta scenu u buffer i lijepi je natrag u glavni kontekst */
function pixCrtaj(fn){
  if(!PIX || !pixInit()){ fn(); return; }
  var glavni = ctx;
  ctx = PXC;
  ctx.setTransform(PXS, 0, 0, PXS, 0, 0);
  ctx.clearRect(0, 0, W, HH);
  fn();
  ctx = glavni;
  pixPaleta();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(PXCV, 0, 0, W, HH);
  ctx.imageSmoothingEnabled = true;
}

  t0: Date.now(),

  ev: [],
  rundi: 0,

  uredjaj: function(){
    var w = Math.min(window.innerWidth || 0, window.innerHeight || 0);
    if(w >= 700) return 'tablet';
    if(w >= 380 && (window.innerWidth > window.innerHeight)) return 'desktop';
    return 'phone';
  },

  platforma: function(){
    var u = (navigator.userAgent || '').toLowerCase();
    if(/ipad|iphone|ipod/.test(u)) return 'ios';
    if(/android/.test(u)) return 'android';
    if(/mac os x/.test(u)) return 'mac';
    if(/windows/.test(u)) return 'windows';
    if(/linux/.test(u)) return 'linux';
    return 'other';
  },

  preglednik: function(){
    var u = (navigator.userAgent || '').toLowerCase();
    if(/fban|fbav|instagram/.test(u)) return 'facebook';
    if(/whatsapp/.test(u)) return 'whatsapp';
    if(/crios|chrome/.test(u)) return 'chrome';
    if(/firefox|fxios/.test(u)) return 'firefox';
    if(/safari/.test(u)) return 'safari';
    return 'other';
  },

  izvor: function(){
    try{
      var r = document.referrer;
      if(!r) return 'direct';
      var h = r.split('/')[2] || 'direct';
      return h.replace(/^www\./, '').slice(0, 60);
    }catch(e){ return 'direct'; }
  },

  dogadjaj: function(ime, broj){
    if(!this.on) return;
    if(this.ev.length > 60) return;
    this.ev.push(broj === undefined ? ime : (ime + ':' + broj));
  },

  paket: function(kraj){
    var sek = Math.round((Date.now() - this.t0) / 1000);
    return {
      v: 1,
      sid: this.sid,
      prvi: !this.prvi,
      kraj: !!kraj,
      sek: sek,
      lang: LANG,
      pix: PIX ? 1 : 0,
      zvuk: AU.on ? 1 : 0,
      rundi: this.rundi,

      nivo: G.level | 0,
      rekord: G.best | 0,
      naj: G.peakMoney | 0,
      uredjaj: this.uredjaj(),
      platforma: this.platforma(),
      preglednik: this.preglednik(),
      ekran: (window.innerWidth || 0) + 'x' + (window.innerHeight || 0),
      dpr: Math.round((window.devicePixelRatio || 1) * 10) / 10,
      izvor: this.izvor(),
      tz: (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return ''; } })(),
      ev: this.ev.slice(0)
    };
  },

  posalji: function(kraj){
    if(!this.on) return;
    var sada = Date.now();
    if(!kraj && sada - this.zadnje < 55000) return;
    this.zadnje = sada;
    var telo = JSON.stringify(this.paket(kraj));
    this.prvi = true;
    this.ev = [];
    try{
      if(navigator.sendBeacon){
        navigator.sendBeacon(this.url, new Blob([telo], {type: 'application/json'}));
      }else{
        fetch(this.url, {method: 'POST', body: telo, keepalive: true,
                         headers: {'Content-Type': 'application/json'}});
      }
    }catch(e){ this.on = false; }
  },

  start: function(){
    var self = this;
    self.posalji(false);
    setInterval(function(){ self.posalji(false); }, 60000);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) self.posalji(true);
    });
    window.addEventListener('pagehide', function(){ self.posalji(true); });
  }
};

  start: function(){
    this.on = true; this.i = -1; this.t = 999; this.cekaj = 0;
    G.tut = 0;
    newGame();
    TRK.dogadjaj('demo');
  },

  stop: function(){
    this.on = false;
    if(PIX) pixToggle();
    G.forceCheat = false; G.forceFake = false;
    newGame();
  },

  update: function(dt){
    if(this.cekaj > 0) this.cekaj -= dt;
    this.t += dt;
    var k = this.koraci[this.i];
    if(!k || this.t >= k.d){
      this.i++;
      if(this.i >= this.koraci.length){ this.stop(); return; }
      this.t = 0; this.cekaj = 0.4;
      G.forceCheat = false; G.forceFake = false;
      G.minka = 0; G.minkaAnim = 0; G.bird.on = false;
      if(G.st !== S.BET && G.levatLeavePhase === 0 &&
         G.st !== S.MITO && G.st !== S.RACIJA) toBet();
      k = this.koraci[this.i];
      if(k.pri) k.pri();
      return;
    }
    if(k.tik) k.tik();
    /* ako se zaglavi na nekom ekranu, gurni dalje */
    if((G.st === S.OVER || G.st === S.POBJEDA || G.st === S.UHAPSEN || G.st === S.ODVELI) &&
       this.t > 4 && this.cekaj <= 0){
      this.cekaj = 1.2; this.pozovi('again');
    }
  },

  crtaj: function(){
    var a = clamp(this.t / 0.4, 0, 1) * clamp((this.koraci[this.i] ? this.koraci[this.i].d : 1) - this.t, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(12,10,8,0.82)';
    rr(ctx, 40, 150, W-80, 74, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,212,121,0.5)'; ctx.lineWidth = 2;
    rr(ctx, 40, 150, W-80, 74, 14); ctx.stroke();
    /* traka napretka kroz cijelu demonstraciju */
    var uk = (this.i + clamp(this.t / Math.max(1, this.koraci[this.i] ? this.koraci[this.i].d : 1), 0, 1)) / this.koraci.length;
    ctx.fillStyle = 'rgba(240,196,106,0.85)';
    rr(ctx, 40, 218, (W-80) * clamp(uk, 0, 1), 6, 3); ctx.fill();
    ctx.globalAlpha = 0.55 + 0.45*a;
    txt('DEMO ' + (this.i+1) + '/' + this.koraci.length, 62, 176,
        '800 17px system-ui,sans-serif', 'rgba(255,212,121,0.75)', 'left');
    txt(this.naslov(), 62, 204, '700 25px system-ui,sans-serif', '#f4e6c8', 'left');
    ctx.restore();
  }
};

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0a0605';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(OX,OY); ctx.scale(SC,SC);
  ctx.beginPath(); ctx.rect(0,0,W,HH); ctx.clip();

  var sh = G.shake;
  if(sh>0.3) ctx.translate(rnd(-sh,sh), rnd(-sh,sh));

  BTN = [];

  if(G.levatLeavePhase === 4){
    pixCrtaj(drawMedjuigra);
    drawCRT();
    drawSoundBtn();
    drawLangBtn();
    drawPixBtn();
    drawWatermark();
    ctx.restore();
    drawOkvir();
    return;
  }

  pixCrtaj(function(){
    ctx.save();
    if(scena() === 4 && G.st !== S.INTRO){
      ctx.translate(Math.sin(G.gt*7.5)*2.5, Math.sin(G.gt*11.3)*3);
    }
    /* montaža: slika povremeno poskoči, kao kad traka preskoči */
    if(scena() === 5 && G.st !== S.INTRO){
      var cik = G.gt % 2.6;
      if(cik < 0.22){
        var jak = 1 - cik/0.22;
        ctx.translate(Math.sin(G.gt*70)*3*jak, Math.sin(G.gt*47)*16*jak);
      }
    }
    drawScene();
    ctx.restore();
  });

  /* traka smetnji u montaži */
  if(scena() === 5 && G.st !== S.INTRO){
    var tb = (G.gt*260) % (HH+400) - 200;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(0, tb, W, 26);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, tb+26, W, 6);
    ctx.restore();
  }

  if(G.flash>0){
    ctx.fillStyle = 'rgba(255,230,170,'+(G.flash*0.45)+')';
    ctx.fillRect(0,0,W,HH);
  }

  if(G.st !== S.INTRO && G.st !== S.OVER && G.st !== S.POBJEDA &&
     G.st !== S.UHAPSEN && G.st !== S.ODVELI){
    drawHUD();
    if(G.sayT>0) speechBubble(G.say, 372, 404, 540, 372, 442, false);
    if(G.levatT>0 && G.levatPeek>0.35) speechBubble(G.levat, 196, 588, 344, 78, 622, true);
    if(G.minkaSayT>0 && G.minkaAnim>0.5) speechBubble(G.minkaSay, 600, 540, 300, 640, 566, true);
    if(G.st===S.BET) drawBetUI();
    if(G.st===S.MITO) drawMitoUI();
    if(G.st===S.RESULT) drawResult();
    drawPowerUI();
    if(G.st===S.PICK){
      ctx.save();
      ctx.globalAlpha = 0.55+0.45*Math.sin(G.gt*4);
      txt(T('dodirniFildzan'), 360, 1028, '800 34px system-ui,sans-serif', '#ffd479');
      ctx.restore();
    }
  }
  if(G.st === S.INTRO){
    drawIntro();
    if(G.t >= 8.4){
      /* mali prekidač uz ostale, ne preko dugmeta za start */
      var eN = G.easy ? (LANG==='de'?'LEICHT ✓':LANG==='en'?'EASY ✓':'POLAKO ✓')
                      : (LANG==='de'?'LEICHT':LANG==='en'?'EASY':'POLAKO');
      btn('easy', W-366, HH-96, 86, 76, eN, '',
          G.easy ? ['#b7c8ad','#71866d'] : ['#4a4a42','#33332c'], false);
    }
  }
  if(G.st === S.OVER) drawOver();
  if(G.st === S.POBJEDA) drawPobjeda();
  if(G.st === S.UHAPSEN) drawKrajEkran(T('uhapsen'), T('uhapsenSub'),
      '#ff8a6a', ['#c9463c','#8f2a24']);
  if(G.st === S.ODVELI) drawKrajEkran(T('odveli'), T('odveliSub'),
      '#9fe8a0', ['#8fd48f','#4f9c5a']);

  drawStatsOverlay();
  drawCRT();
  if(DEMO.on) DEMO.crtaj();
  drawSoundBtn();
  drawLangBtn();
  drawPixBtn();
  drawWatermark();
  ctx.restore();
  drawOkvir();
}

/* ---------- input ---------- */
var PRESS = {id:null, t:0};
function hit(x,y){
  for(var i=BTN.length-1;i>=0;i--){
    var b = BTN[i];
    if(x>=b.x-8 && x<=b.x+b.w+8 && y>=b.y-8 && y<=b.y+b.h+10) return b.id;
  }
  return null;
}
function toVirt(cx,cy){
  return {x:(cx-OX)/SC, y:(cy-OY)/SC};
}
function onDown(cx,cy){
  AU.init();
  G.idleT = 0; G.idleStep = 0;
  var v = toVirt(cx,cy);
  var id = hit(v.x, v.y);
  if(id){ PRESS.id = id; return; }
  PRESS.id = null;
  /* Šaner se može bocnuti */
  if(G.st !== S.INTRO && G.st !== S.OVER && G.st !== S.POBJEDA && G.st !== S.BJEG){
    if(Math.abs(v.x-360) < 92 && v.y > 420 && v.y < 600){ pokeSaner(); return; }
  }
  /* čaše */
  if(G.st === S.PICK){
    var half = Math.min(98, (SLOTX.length>1 ? (SLOTX[1]-SLOTX[0])/2 - 5 : 98));
    for(var i=0;i<G.nc;i++){
      if(Math.abs(v.x - SLOTX[i]) < half && v.y > TABLEY-200 && v.y < TABLEY+70){
        doPick(i); return;
      }
    }
  }
}
function onUp(cx,cy){
  AU.init();
  var v = toVirt(cx,cy);
  var id = hit(v.x, v.y);
  var was = PRESS.id; PRESS.id = null;
  if(!id || id!==was){
    if(!id && G.st===S.INTRO){
      if(G.t < 8.4){
        G.t = 8.4; G.introCue = 7;
        for(var q=0;q<G.nc;q++){ G.cups[q].lift = 0; G.cups[q].a = 1; G.cups[q].grab = true; }
        AU.chip();
      }else{ AU.chip(); newGame(); }
    }
    if(!id && G.levatLeavePhase === 4 && G.levatLeave > MEDJU[G.medju].cut + 0.5){
      G.levatLeavePhase = 0; AU.chip(); newGame(); return;
    }
    if(!id && G.st===S.RESULT && G.t>0.7 && G.levatLeavePhase === 0) nextRound();
    if(!id && G.st===S.BJEG && G.t>0.6 && G.levatLeavePhase !== 1 && G.levatLeavePhase !== 2) toPobjeda();
    return;
  }
  handle(id);
}
function handle(id){
  if(DEMO.on && !DEMO.interno){ DEMO.stop(); AU.chip(); return; }
  if(SHOW_STATS && id!=='statsclose') return;
  /* dugmad su zaključana samo dok oproštaj stvarno traje (faza 3 je rep bijega) */
  if(id !== 'snd' && id !== 'lang' && id !== 'pix' && G.st !== S.MITO && G.st !== S.INTRO &&
     (G.levatLeavePhase === 1 || G.levatLeavePhase === 2 || G.levatLeavePhase === 4)) return;
  if(id && id.indexOf('lang_') === 0){
    var nl = id.substr(5);
    if(JEZICI.indexOf(nl) >= 0){ LANG = nl; TRK.dogadjaj('jezik_' + nl); save(); AU.chip(); }
    return;
  }
  if(id==='pix'){ pixToggle(); TRK.dogadjaj('piksel', PIX?1:0); AU.chip(); vib(10); return; }
  if(id==='lang'){
    LANG = JEZICI[(JEZICI.indexOf(LANG)+1) % JEZICI.length];
    TRK.dogadjaj('jezik_' + LANG);
    save(); AU.chip();
    return;
  }
  if(id==='snd'){ AU.on = !AU.on; if(AU.on) AU.chip(); save(); return; }
  if(id==='easy'){ G.easy=!G.easy; save(); AU.chip(); return; }
  if(G.st===S.INTRO && G.t >= 8.4){ AU.chip(); newGame(); return; }
  if(G.st===S.INTRO){
    G.t = 8.4; G.introCue = 7;
    for(var q3=0;q3<G.nc;q3++){ G.cups[q3].lift = 0; G.cups[q3].a = 1; G.cups[q3].grab = true; }
    return;
  }
  if(id==='statsclose'){ SHOW_STATS=false; AU.chip(); return; }
  if(id==='stats'){ SHOW_STATS=true; AU.chip(); return; }
  if(id==='share'){ AU.chip(); shareResult(); return; }
  if(id==='again'){ AU.chip(); pustiMedjuigru(); return; }
  if(G.st===S.BET){
    var kapaH = maxUlog();
    if(id==='betall'){ startRound(maxUlog()); return; }
    if(id && id.indexOf('bet')===0){
      var ulozi = parseInt(id.substr(3), 10);
      if(ulozi > 0 && G.money >= ulozi && kapaH >= ulozi) startRound(ulozi);
    }
    return;
  }
  if(G.st === S.MITO && G.mitoFaza === 0){
    if(id === 'mitone'){
      G.mitoFaza = 1; G.t = 0; G.mitoDato = -2;
      say(T('neDamNiMarke'), 3.0);
      AU.tone(160, 0.3, 'sawtooth', 0.10, 90); vib(30);
      return;
    }
    if(id && id.indexOf('mito') === 0){
      var idx = parseInt(id.substr(4), 10);
      var iznos = G.mitoOpcije[idx];
      if(!(iznos > 0) || G.money < iznos) return;
      G.money -= iznos;
      G.mitoDato = iznos;
      G.mitoFaza = 1; G.t = 0;
      if(iznos >= G.mitoPrag){
        say(pick(LB('MITO_OK')), 3.2);
        AU.coin(4); vib(20);
        for(var ci=0; ci<12; ci++) spawnCoin(360, TABLEY-60);
      }else{
        say(pick(LB('MITO_MALO')), 3.2);
        AU.thunk(); G.shake = 16; vib([60,80,60]);
      }
      return;
    }
    return;
  }
  if(id==='levmito' && G.st===S.PICK && !G.mitoLevata && !G.levatGone &&
     G.money >= 20 && G.levatSaplT <= 0 && G.nakrivT <= 0){
    G.mitoLevata = true; G.money -= 20;
    G.levatSaplT = 1.1;
    levatSay(T('levatMito1'), 2.6);
    AU.coin(2); vib(14);
    return;
  }
  if(id==='kafa' && G.pow.kafa>0 && !G.kafaOn && (G.st===S.MIX)){
    G.pow.kafa--; G.kafaOn = true;
    say(T('kafuPrvo'), 2.4);
    AU.pluck(392,0.5,0.16); vib(14);
    return;
  }
  if(id==='oko' && G.pow.oko>0 && G.okoT<=0 && (G.st===S.MIX || G.st===S.PICK)){
    G.pow.oko--; G.okoT = 1.1;
    AU.glint(); vib(10);
    return;
  }
  if(id==='golub' && G.pow.golub>0 && !G.bird.on && (G.st===S.MIX || G.st===S.PICK)){
    G.pow.golub--;
    var bsx = (Math.random()<0.5) ? -70 : W+70;
    G.bird.on = true; G.bird.phase = 0; G.bird.t = 0;
    G.bird.perch = false; G.bird.leave = false;
    G.bird.sx = bsx; G.bird.x = bsx; G.bird.y = -40;
    G.bird.cupIdx = G.cube;                 /* prati pravi fildžan, i kad se miješa */
    G.bird.slot = G.cups[G.cube].slot;
    levatSay(T('golubPlacen'), 4.0);
    AU.coo(); vib(12);
    return;
  }
}

/* ---------- boot ---------- */
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  /* na velikim ekranima (tablet) manji DPR — puno je piksela za crtanje */
  var maxDpr = (Math.min(w, h) >= 700) ? 2 : 3;
  DPR = Math.min(window.devicePixelRatio||1, maxDpr) * RQ;
  cv.width = Math.floor(w*DPR); cv.height = Math.floor(h*DPR);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  SC = Math.min(w/W, h/HH);
  OX = (w - W*SC)/2; OY = (h - HH*SC)/2;
  VW = w; VH = h;
}

var lastT = 0, PAUSED = false, RQ=1, FPS_T=0, FPS_N=0, FPS_SUM=0, LAST_RQ_CHANGE=0;
function frame(ts){
  if(PAUSED){ lastT=ts; window.requestAnimationFrame(frame); return; }
  var dt = Math.min(0.05, (ts-lastT)/1000 || 0.016);
  lastT = ts;
  update(dt); render();
  /* adaptivna rezolucija: logika ostaje 60 Hz, samo broj piksela pada ako uređaj ne stiže */
  FPS_T += dt; FPS_N++; FPS_SUM += 1/Math.max(0.001,dt);
  if(FPS_T > 2.4){
    var fps=FPS_SUM/FPS_N; FPS_T=0; FPS_N=0; FPS_SUM=0;
    if(ts-LAST_RQ_CHANGE>5000){
      var nr=RQ;
      if(fps<49 && RQ>0.62) nr=Math.max(0.60,RQ-0.12);
      else if(fps>58 && RQ<1) nr=Math.min(1,RQ+0.08);
      if(Math.abs(nr-RQ)>0.01){RQ=nr;LAST_RQ_CHANGE=ts;resize();}
    }
  }
  window.requestAnimationFrame(frame);
}

function boot(){
  cv = document.getElementById('c');
  ctx = cv.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function(){
    PAUSED = !!document.hidden;
    if(PAUSED && AU.ctx){ try{ AU.ctx.suspend(); }catch(e){} }
    else if(AU.ctx){ try{ AU.ctx.resume(); }catch(e){} }
  });
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });

  /* PWA: service worker — igra se instalira i radi bez mreže */
  if('serviceWorker' in navigator &&
     (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* nema veze, igra radi i bez */ });
    });
  }

  var st = load();
  if(!st) LANG = pogodiJezik();     /* prvi put: po uređaju */
  if(st){
    G.best = st.best||0; G.bestRound = st.bestRound||0;
    G.season = st.season||0;
    G.sceneLevel = G.level;
    G.medjuLast = (st.ml === undefined) ? -1 : st.ml;
    if(st.lang) LANG = st.lang; else LANG = pogodiJezik();
    G.carry = st.carry||0;
    if(st.pix === 1 && pixInit()) PIX = true;
    AU.on = st.snd!==0; G.tut = st.tut===1; G.easy = st.easy===1;
    G.stoPokrpan = st.stp===1; metaMerge(st.stats);
  }

  /* svako pokretanje: drugi uvod nego prošli put */
  var lastIv = st ? (st.iv|0) : -1;
  do { G.introVar = ri(0, 3); } while(G.introVar === lastIv);

  /* svako pokretanje igre počinje na drugom mjestu */
  G.level = ri(0, MJESTA.length-1);
  G.levelBag = [];
  G.sceneLevel = G.level;

  initCups();

  cv.addEventListener('touchstart', function(e){
    e.preventDefault();
    var t = e.changedTouches[0];
    onDown(t.clientX, t.clientY);
  }, {passive:false});
  cv.addEventListener('touchend', function(e){
    e.preventDefault();
    var t = e.changedTouches[0];
    onUp(t.clientX, t.clientY);
  }, {passive:false});
  cv.addEventListener('mousedown', function(e){ onDown(e.clientX,e.clientY); });
  cv.addEventListener('mouseup', function(e){ onUp(e.clientX,e.clientY); });
  window.addEventListener('keydown', function(e){
    if(e.key==='1') doPick(0);
    if(e.key==='2') doPick(1);
    if(e.key==='3') doPick(2);
    if(e.key===' '){ if(G.st===S.INTRO){ if(G.t<8.4){ G.t=8.4; G.introCue=7;
      for(var q2=0;q2<G.nc;q2++){ G.cups[q2].lift=0; G.cups[q2].a=1; G.cups[q2].grab=true; } } else newGame(); } }
    if(e.key==='m' || e.key==='M'){ AU.on = !AU.on; if(AU.on) AU.chip(); save(); }
    if(e.key==='p' || e.key==='P'){ pixToggle(); }
    if(e.key==='d' || e.key==='D'){ if(DEMO.on) DEMO.stop(); else DEMO.start(); }
  });

  TRK.start();
  try{
    if(/[?&]demo=1/.test(location.search)) DEMO.start();
  }catch(e){}

  window.requestAnimationFrame(frame);
}

/* test hook – samo kad je izričito uključen */
if(window.__TFTEST) window.TF = {
  G:G, S:S, update:update, render:function(){ try{ render(); }catch(e){ throw e; } },
  startRound:startRound, doPick:doPick, newGame:newGame, handle:handle,
  toFlee:toFlee, nextRound:nextRound, FLEE_LIMIT:FLEE_LIMIT, CUPW:CUPW, CUPH:CUPH,
  toRacija:toRacija, pokreniMito:pokreniMito, toUhapsen:toUhapsen, toOdveli:toOdveli,
  resize:resize, mjere:function(){ return {SC:SC, OX:OX, OY:OY, DPR:DPR, VW:VW, VH:VH}; },
  toBet:toBet, META:META, nervoza:nervoza, pogodiJezik:pogodiJezik, DEMO:DEMO,
  resStanje:function(){ return {rq:RQ, dpr:DPR}; },
  fpsPuls:function(fps, sekundi){
    /* pomoćnik za test: simulira nekoliko sekundi zadanog fps-a */
    var ts = LAST_RQ_CHANGE + 6000;
    for(var i=0;i<sekundi*fps;i++){
      var dt = 1/fps;
      FPS_T += dt; FPS_N++; FPS_SUM += fps;
      if(FPS_T > 2.4){
        var f = FPS_SUM/FPS_N; FPS_T=0; FPS_N=0; FPS_SUM=0;
        if(ts-LAST_RQ_CHANGE>5000){
          var nr=RQ;
          if(f<49 && RQ>0.62) nr=Math.max(0.60,RQ-0.12);
          else if(f>58 && RQ<1) nr=Math.min(1,RQ+0.08);
          if(Math.abs(nr-RQ)>0.01){RQ=nr;LAST_RQ_CHANGE=ts;resize();}
        }
        ts += 6000;
      }
    }
  }, pixToggle:pixToggle, pixStanje:function(){ return PIX; }, TRK:TRK,
  maxUlog:maxUlog,
  pustiMedjuigru:pustiMedjuigru,
  T:T, LB:LB, MJ:MJ, setLang:function(l){ LANG = l; }, getLang:function(){ return LANG; },
  novoMjesto:novoMjesto,
  startLevatLeave:startLevatLeave,
  pokeSaner:pokeSaner, streakTitle:streakTitle, LIFTH:LIFTH,
  load:load, save:save, boom:boom,
  cupAt:cupAt, nSwaps:nSwaps, swapDur:swapDur, cheatChance:cheatChance, SLOTX:SLOTX,
  epizoda:epizoda, scena:scena, toRacija:toRacija, setCups:setCups
};

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
