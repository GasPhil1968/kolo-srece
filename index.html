<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08070a">
<title>GUSLE — Jedna žica</title>
<style>
  :root{
    --black:#15100d; --wine:#7a261f; --wine-hot:#d05a3a;
    --ivory:#f4ead6; --gold:#f0b45a;
    --wood-light:#b77a3f; --wood-mid:#7c4a28;
    --night-blue:#17202a; --stage-brown:#29170f;
    --cond:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow",Impact,sans-serif;
    --epic:"Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--black);color:var(--ivory);font-family:var(--cond);
    overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    position:fixed;width:100%;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
       padding:max(9px,env(safe-area-inset-top)) 12px max(6px,env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
  .wordmark{font-size:20px;font-weight:700;letter-spacing:.16em;margin:0;opacity:.9;
            transform:scaleX(.86);transform-origin:left}
  .readout{display:flex;align-items:center;gap:11px}
  .readout .lab{font-size:9px;letter-spacing:.26em;color:rgba(244,234,214,.4)}
  #mult{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--gold);
        opacity:0;transition:opacity .2s}
  .readout b{font-size:24px;font-weight:700;letter-spacing:-.01em;
             transform:scaleX(.88);display:inline-block;font-variant-numeric:tabular-nums}
  .ghost{background:none;border:1px solid rgba(244,234,214,.2);color:rgba(244,234,214,.55);
    font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.22em;
    padding:6px 10px;cursor:pointer;border-radius:1px}
  .ghost:hover{border-color:var(--wine-hot);color:var(--wine-hot)}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  #staffWrap{flex:0 0 auto;margin-top:6px;position:relative}
  #staff{display:block;width:100%;height:126px}
  #vatra{position:absolute;left:0;right:0;bottom:-3px;height:3px;
    background:rgba(244,234,214,.08)}
  #vatra i{display:block;height:3px;width:0;
    background:linear-gradient(90deg,#d05a3a,#f0b45a);box-shadow:0 0 8px rgba(240,180,90,.6)}
  #stage #call{inset:auto 0 92px 0;text-align:center;font-size:13px;font-weight:700;
    letter-spacing:.2em;color:rgba(240,180,90,.85);opacity:0;pointer-events:none;
    text-shadow:0 2px 12px #000}
  #judge{position:absolute;right:0;top:0;font-size:22px;font-weight:700;letter-spacing:.1em;
    transform:scaleX(.85);transform-origin:right;opacity:0;transition:opacity .28s;pointer-events:none}

  /* ── Bühne ── */
  #stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;
         background:#17131a;isolation:isolate}
  #stage>div{position:absolute;pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #backlight{inset:-22% -32% -12%;
    background:
      radial-gradient(42% 46% at 53% 56%, rgba(240,180,90,.32), rgba(170,80,40,.12) 48%, transparent 74%),
      radial-gradient(74% 50% at 50% 100%, rgba(120,48,25,.28), transparent 72%);
    opacity:.55}
  .beam{top:-16%;height:152%;width:46%;margin-left:-23%;transform-origin:50% 0;
        mix-blend-mode:screen;
        clip-path:polygon(45% 0, 55% 0, 118% 100%, -18% 100%)}
  .beam.w{background:linear-gradient(180deg,rgba(255,238,205,.2),rgba(255,224,170,.05) 40%,transparent 72%)}
  .beam.r{background:linear-gradient(180deg,rgba(208,90,58,.24),rgba(170,60,40,.06) 44%,transparent 74%)}
  #beamA{left:27%} #beamB{left:73%} #beamC{left:50%}
  #smoke1,#smoke2{inset:-25%;
    background:radial-gradient(38% 28% at 30% 62%, #cfc6b4, transparent 70%),
               radial-gradient(30% 22% at 72% 44%, #cfc6b4, transparent 70%)}
  #smoke1{animation:drift1 47s linear infinite;opacity:.045}
  #smoke2{animation:drift2 71s linear infinite;opacity:.025}
  @keyframes drift1{0%{transform:translate(-4%,2%) scale(1)}50%{transform:translate(6%,-3%) scale(1.12)}100%{transform:translate(-4%,2%) scale(1)}}
  @keyframes drift2{0%{transform:translate(5%,-2%)}50%{transform:translate(-6%,3%)}100%{transform:translate(5%,-2%)}}
  #flare{inset:0;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(100deg,transparent 38%,rgba(244,234,214,.5) 49%,rgba(240,180,90,.35) 52%,transparent 62%)}
  #blackout{inset:0;background:#000;opacity:0}
  #burst{inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(64px,26vw,190px);font-weight:700;letter-spacing:-.03em;
    transform:scaleX(.8);color:rgba(244,234,214,.11);opacity:0;white-space:nowrap}
  #crowd{left:-2%;right:-2%;bottom:0;height:92px;opacity:.96}
  #crowd svg{width:100%;height:100%;display:block}
  svg#gusle{position:absolute;inset:0;width:100%;height:100%;display:block}
  .mark{fill:#7a6a52;opacity:.5}
  .mark.lead{fill:var(--gold);opacity:1}
  .roman{font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.1em;
         fill:rgba(244,234,214,.2)}

  #stage #intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:auto;z-index:5}
  #stage #intro.done{display:none;pointer-events:none}
  .ititle{font-size:clamp(56px,23vw,140px);font-weight:700;line-height:.86;
    color:#f4ead6;opacity:0;transform:scaleX(.82);
    text-shadow:0 0 34px rgba(196,28,46,.55),0 0 90px rgba(240,180,90,.28)}
  .isub{overflow:hidden;margin-top:10px;height:0}
  .isub span{display:block;font-size:clamp(12px,4vw,19px);font-weight:700;
    letter-spacing:.44em;color:#d05a3a;white-space:nowrap;transform:translateY(100%)}
  .icopy{margin-top:22px;font-size:10px;font-weight:700;letter-spacing:.42em;
    color:rgba(240,180,90,.7);opacity:0}
  #sig{position:fixed;z-index:30;pointer-events:none;
    right:calc(11px + env(safe-area-inset-right));
    bottom:calc(6px + env(safe-area-inset-bottom));
    font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:.26em;
    color:rgba(244,234,214,.3);transition:opacity .6s}
  body.intro #sig{opacity:0}
  .iskip{position:absolute;bottom:16px;font-size:9px;letter-spacing:.3em;
    color:rgba(244,234,214,.3);opacity:0}
  body.intro header,body.intro #staffWrap,body.intro footer{opacity:0;transition:opacity .5s}
  body.intro #crowd{opacity:0;transition:opacity .8s}

  footer{flex:0 0 auto;text-align:center;font-size:9px;letter-spacing:.24em;
    color:rgba(244,234,214,.24);padding-top:3px}
  footer.solo{color:var(--gold);letter-spacing:.4em}

  /* ── Menü ── */
  #veil{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:
      radial-gradient(70% 52% at 50% 96%, rgba(240,180,90,.18), transparent 72%),
      radial-gradient(74% 54% at 50% 112%, rgba(122,38,31,.32), transparent 74%),
      linear-gradient(180deg,#17202a 0%,#21191a 42%,#352018 82%,#1d120e 100%);
    padding:26px 20px max(26px,env(safe-area-inset-bottom))}
  #veil.hidden{display:none}
  .inner{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
  h1{font-size:clamp(60px,25vw,132px);font-weight:700;letter-spacing:-.035em;line-height:.84;
     margin:0 0 8px;transform:scaleX(.82);transform-origin:left;color:var(--ivory)}
  .sub{font-size:clamp(15px,4.6vw,22px);font-weight:700;letter-spacing:.3em;color:var(--wine-hot);margin:0 0 22px}
  .rule{height:1px;background:linear-gradient(90deg,rgba(196,28,46,.6),rgba(244,234,214,.1),transparent);margin:20px 0}
  .eyebrow{font-size:9.5px;letter-spacing:.32em;color:rgba(244,234,214,.38);margin:0 0 10px}
  .diag{display:block;width:100%;max-width:330px;margin:2px auto 16px;height:auto}
  .diag .dl{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;
    fill:rgba(244,234,214,.85)}
  .diag .ds{font-family:var(--cond);font-size:9.5px;letter-spacing:.14em;
    fill:rgba(244,234,214,.4)}
  .steps{margin:0 0 4px;padding:0;list-style:none;counter-reset:st}
  .steps li{position:relative;padding-left:26px;margin-bottom:9px;font-size:13px;
    line-height:1.6;color:rgba(244,234,214,.62)}
  .steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:1px;
    width:17px;height:17px;border:1px solid rgba(196,28,46,.7);border-radius:50%;
    font-size:9.5px;font-weight:700;color:var(--wine-hot);
    display:flex;align-items:center;justify-content:center}
  .steps b{color:var(--ivory);font-weight:700;letter-spacing:.06em}

  .howto{margin:0 0 4px;font-size:13.5px;line-height:1.7;color:rgba(244,234,214,.62)}
  .howto b{color:var(--ivory);font-weight:700;letter-spacing:.1em}
  .row{display:flex;gap:6px;margin-bottom:16px}
  .chip{flex:1;background:none;border:1px solid rgba(244,234,214,.14);color:rgba(244,234,214,.45);
    padding:9px 3px;cursor:pointer;font-family:var(--cond);font-size:9px;letter-spacing:.16em;border-radius:1px}
  .chip .cn{display:block;font-size:14px;font-weight:700;letter-spacing:.02em;
    color:rgba(244,234,214,.85);margin-bottom:3px;transform:scaleX(.92)}
  .chip[aria-pressed="true"]{border-color:var(--wine-hot);background:rgba(196,28,46,.1);color:var(--wine-hot)}
  .chip[aria-pressed="true"] .cn{color:var(--ivory)}
  .chip[disabled]{opacity:.26;cursor:default}
  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
    border:0;border-bottom:1px solid rgba(244,234,214,.09);padding:13px 2px;color:var(--ivory);cursor:pointer}
  .pick .n{font-size:11px;font-weight:700;color:var(--wine-hot);width:16px;flex:0 0 auto}
  .pick .t{font-family:var(--epic);font-size:17px}
  .pick .g{font-size:9.5px;letter-spacing:.16em;color:rgba(244,234,214,.34);
    margin-left:auto;text-align:right;line-height:1.6}
  .pick .g em{font-style:normal;color:var(--gold)}
  .songrow{display:flex;align-items:stretch;gap:8px;
    border-bottom:1px solid rgba(244,234,214,.09)}
  .songrow .pick{border-bottom:0;flex:1;min-width:0}
  .demoBtn{flex:0 0 auto;align-self:center;width:34px;height:34px;border-radius:50%;
    background:none;border:1px solid rgba(240,180,90,.45);color:var(--gold);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .demoBtn:hover{background:rgba(240,180,90,.14)}
  .demoBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .pick:hover .t,.pick:focus-visible .t{color:#fff}
  .pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #veil{overflow:hidden}
  #veil.scroll{overflow-y:auto}
  .nav{display:flex;align-items:center;width:100%;background:none;cursor:pointer;
    border:0;border-top:1px solid rgba(244,234,214,.1);padding:17px 2px;color:var(--ivory)}
  .nav:last-of-type{border-bottom:1px solid rgba(244,234,214,.1)}
  .nav .nt{font-size:19px;font-weight:700;letter-spacing:.1em;transform:scaleX(.94)}
  .nav .ns{font-size:9.5px;letter-spacing:.16em;color:rgba(244,234,214,.34);
    margin-left:auto;padding-right:12px;text-align:right}
  .nav .na{color:var(--wine-hot);font-size:20px;line-height:1}
  .nav:hover .nt{color:#fff}
  .nav:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .bar2{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .bk{background:none;border:1px solid rgba(244,234,214,.22);color:var(--ivory);
    width:34px;height:34px;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0 3px 3px 0}
  .bk:hover{border-color:var(--wine-hot);color:var(--wine-hot)}
  .bt{font-size:15px;font-weight:700;letter-spacing:.24em;color:rgba(244,234,214,.75)}
  .mini{display:flex;gap:8px;margin-top:18px}
  .msm{flex:1;background:rgba(196,28,46,.1);border:1px solid rgba(196,28,46,.6);
    color:var(--ivory);font-family:var(--cond);font-size:10px;font-weight:700;
    letter-spacing:.2em;padding:13px 4px;cursor:pointer;border-radius:1px}
  .msm:hover{background:rgba(196,28,46,.22)}
  .big{display:block;width:100%;margin-top:18px;padding:15px;background:rgba(196,28,46,.12);
    border:1px solid var(--wine-hot);color:var(--ivory);font-family:var(--cond);
    font-size:12px;font-weight:700;letter-spacing:.34em;cursor:pointer;border-radius:1px}
  .big:hover{background:rgba(196,28,46,.24)}
  .meter{display:flex;align-items:center;gap:10px;margin:8px 0}
  .meter span{font-size:9.5px;letter-spacing:.28em;color:rgba(244,234,214,.42);width:70px}
  .meter i{flex:1;height:3px;background:rgba(244,234,214,.09)}
  .meter i b{display:block;height:3px;background:linear-gradient(90deg,var(--wine-hot),var(--gold))}
  .meter em{font-style:normal;font-size:17px;font-weight:700;width:48px;text-align:right;
    transform:scaleX(.86);display:inline-block;font-variant-numeric:tabular-nums}
  .tally{font-size:15px;line-height:2;color:rgba(244,234,214,.6);margin:0}
  .tally b{color:var(--ivory);font-weight:700;font-size:19px}
  .tally .hot{color:var(--gold)}
  @media (prefers-reduced-motion:reduce){#smoke1,#smoke2{animation:none}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h2 class="wordmark">GUSLE</h2>
    <div class="readout">
      <span class="lab" id="modeLabel">SLOBODNO</span>
      <span id="mult">×2</span>
      <b id="scoreOut">0</b>
      <button class="ghost" id="backBtn">MENU</button>
    </div>
  </header>

  <div id="staffWrap"><span id="judge"></span><canvas id="staff"></canvas><div id="vatra"><i></i></div></div>

  <div id="stage">
    <svg id="fx" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#17202a"/>
          <stop offset=".48" stop-color="#30201e"/>
          <stop offset="1" stop-color="#4b2716"/>
        </linearGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a2a16"/>
          <stop offset="1" stop-color="#17100b"/>
        </linearGradient>
        <linearGradient id="gridG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8b56a" stop-opacity="0"/>
          <stop offset=".45" stop-color="#e8b56a" stop-opacity=".4"/>
          <stop offset="1" stop-color="#d05a3a" stop-opacity=".55"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="400" height="336" fill="url(#skyG)"/>
      <rect x="0" y="336" width="400" height="304" fill="url(#floorG)"/>
      <g id="fxHills" opacity=".8">
        <path d="M0 336 Q70 296 150 318 Q230 338 400 300 L400 336 Z" fill="#121a22"/>
        <path d="M0 336 Q120 312 220 328 Q320 342 400 322 L400 336 Z" fill="#1a1410"/>
      </g>
      <g id="fxBulbs"></g>
      <g id="fxGrid" opacity=".8"></g>
      <g id="fxRings"></g>
      <g id="fxLeds" opacity="0"></g>
      <g id="fxScan" opacity="0" style="display:none"></g>
    </svg>
    <div id="backlight"></div>
    <div class="beam w" id="beamA"></div>
    <div class="beam w" id="beamB"></div>
    <div class="beam r" id="beamC"></div>
    <div id="burst"></div>

    <svg id="gusle" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-label="Gusle">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3a2113"/><stop offset=".28" stop-color="#8a5731"/>
          <stop offset=".52" stop-color="#b7783f"/><stop offset=".75" stop-color="#6b3d22"/>
          <stop offset="1" stop-color="#27170e"/>
        </linearGradient>
        <linearGradient id="woodN" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#211713"/><stop offset=".32" stop-color="#5b4335"/>
          <stop offset=".62" stop-color="#34251f"/><stop offset="1" stop-color="#140e0c"/>
        </linearGradient>
        <linearGradient id="hide" x1=".1" y1="0" x2=".85" y2="1">
          <stop offset="0" stop-color="#fff5df"/><stop offset=".32" stop-color="#e9d5ae"/>
          <stop offset=".68" stop-color="#b49462"/><stop offset="1" stop-color="#705138"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2=".3">
          <stop offset="0" stop-color="#f0b45a" stop-opacity=".75"/>
          <stop offset=".48" stop-color="#b8783d" stop-opacity=".32"/>
          <stop offset="1" stop-color="#d05a3a" stop-opacity=".45"/>
        </linearGradient>
        <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2=".45">
          <stop offset="0" stop-color="#f0b45a" stop-opacity="0"/>
          <stop offset=".42" stop-color="#fff6dd" stop-opacity=".85"/>
          <stop offset=".5" stop-color="#ffe9a8" stop-opacity=".95"/>
          <stop offset=".58" stop-color="#fff6dd" stop-opacity=".8"/>
          <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="skinClip"><path id="skinClipPath" d=""/></clipPath>
        <clipPath id="bodyClip"><path id="bodyClipPath" d=""/></clipPath>
        <clipPath id="neckClip"><path id="neckClipPath" d=""/></clipPath>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" seed="11"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .2 0 0 0 0 .16 0 0 0 0 .1 0 0 0 .24 0"/></filter>
        <filter id="woodgrain"><feTurbulence type="fractalNoise" baseFrequency=".014 .8" numOctaves="4" seed="3"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .06 0 0 0 0 .03 0 0 0 0 .01 0 0 0 .55 0"/></filter>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5"/></filter>
        <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="11"/></filter>
        <filter id="psych" x="-45%" y="-45%" width="190%" height="190%">
          <feGaussianBlur stdDeviation="8" result="b"/>
          <feColorMatrix in="b" type="matrix"
            values="1.3 .3 .1 0 .06  .5 .8 .1 0 .02  .15 .1 .4 0 0  0 0 0 .95 0"/>
        </filter>
      </defs>

      <g id="ghosts" opacity="0" style="display:none" filter="url(#psych)"></g>

      <g id="cam">
        <g id="tiltG">
          <g id="scaleG">
            <g id="art">
              <rect x="-260" y="-260" width="920" height="1160" fill="transparent"/>
              <g id="bodyLayer"></g>
              <g id="neckLayer"></g>
              <g id="headLayer"></g>
              <path id="strHalo" fill="none" stroke="#ffe9a8" stroke-width="12" opacity="0" filter="url(#soft2)"/>
              <path id="strGlow" fill="none" stroke="#f4ead6" stroke-width="6" opacity="0" filter="url(#soft)"/>
              <path id="strPath" fill="none" stroke="#f4ead6" stroke-width="2.1" opacity=".92"/>
              <g id="tailLayer"></g>
              <g id="fretHand" opacity="0"></g>
              <g id="bow"></g>
              <g id="markLayer"></g>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div id="smoke1"></div>
    <div id="smoke2"></div>
    <div id="crowd"><svg id="crowdSvg" viewBox="0 0 400 96" preserveAspectRatio="xMidYMax slice"></svg></div>
    <div id="flare"></div>
    <div id="blackout"></div>
    <div id="call"></div>
    <div id="intro">
      <div class="ititle">GUSLE</div>
      <div class="isub"><span>JEDNA ŽICA</span></div>
      <div class="icopy">© by FG</div>
      <div class="iskip">TIPPEN ZUM ÜBERSPRINGEN</div>
    </div>
  </div>

  <footer id="hint">HALS GREIFEN · FELL STREICHEN</footer>
</div>

<div id="sig">© by FG</div>
<div id="veil" class="hidden"><div class="inner" id="veilInner"></div></div>

<script>
(function(){
"use strict";

/* ═══════════ Daten ═══════════ */
const CENTS  = [0,150,300,500,700,850,1000];
const ANCH_Y = [120,172,214,256,298,340,382];
const ROMAN  = ["","I","II","III","IV","V","VI"];

let AC=null,master,amp,lp,f1,f2,shaper,o1,o2,noiseGain,vib,noiseBuf,roomGain;
function curve(k){const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/Math.tanh(k);} return c;}
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-13; comp.ratio.value=4;
  master=AC.createGain(); master.gain.value=.95;
  master.connect(comp); comp.connect(AC.destination);

  amp=AC.createGain(); amp.gain.value=0;
  const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=125;
  lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=1.3;
  f1=AC.createBiquadFilter(); f1.type="peaking"; f1.frequency.value=1450; f1.Q.value=1.5; f1.gain.value=12;
  f2=AC.createBiquadFilter(); f2.type="peaking"; f2.frequency.value=2900; f2.Q.value=2.2; f2.gain.value=8;
  shaper=AC.createWaveShaper(); shaper.curve=curve(2.5); shaper.oversample="2x";
  o1=AC.createOscillator(); o1.type="sawtooth";
  o2=AC.createOscillator(); o2.type="sawtooth"; o2.detune.value=12;
  const og=AC.createGain(); og.gain.value=.3;
  o1.connect(og); o2.connect(og);
  og.connect(shaper); shaper.connect(f1); f1.connect(f2); f2.connect(lp); lp.connect(hp); hp.connect(amp);
  amp.connect(master);

  const len=AC.sampleRate*2; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const ns=AC.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
  const nf=AC.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=2400; nf.Q.value=.7;
  noiseGain=AC.createGain(); noiseGain.gain.value=0;
  ns.connect(nf); nf.connect(noiseGain); noiseGain.connect(f1);

  const lfo=AC.createOscillator(); lfo.type="sine"; lfo.frequency.value=5.4;
  vib=AC.createGain(); vib.gain.value=4;
  lfo.connect(vib); vib.connect(o1.detune); vib.connect(o2.detune);

  const rs=AC.createBufferSource(); rs.buffer=noiseBuf; rs.loop=true;
  const rf=AC.createBiquadFilter(); rf.type="lowpass"; rf.frequency.value=520; rf.Q.value=.5;
  roomGain=AC.createGain(); roomGain.gain.value=0;
  rs.connect(rf); rf.connect(roomGain); roomGain.connect(master);

  o1.start(); o2.start(); ns.start(); lfo.start(); rs.start();
  applyInstrument();
}
function applyInstrument(){
  if(!AC) return;
  const I=INST(); shaper.curve=curve(I.k); f1.frequency.value=I.f1; f2.frequency.value=I.f2;
}
function centsOf(p){
  const i=Math.max(0,Math.min(CENTS.length-2,Math.floor(p))), t=Math.max(0,Math.min(1,p-i));
  return CENTS[i]+(CENTS[i+1]-CENTS[i])*t;
}
function freqOf(p){ return INST().base*Math.pow(2,centsOf(p)/1200); }
function audioFrame(){
  if(!AC) return;
  const now=AC.currentTime, I=INST(), v=Math.min(1,S.speed), loud=Math.pow(v,.72);
  amp.gain.setTargetAtTime(loud*(.3+S.solo*.06), now, .025);
  lp.frequency.setTargetAtTime(600+v*3100+S.scratch*1500+S.solo*600, now, .04);
  noiseGain.gain.setTargetAtTime((v*.05+S.scratch*.14)*I.nz, now, .02);
  o1.frequency.setTargetAtTime(freqOf(S.playPos), now, .028);
  o2.frequency.setTargetAtTime(freqOf(S.playPos), now, .04);
  vib.gain.value=S.holding?(6+S.solo*4):2.2;
  roomGain.gain.setTargetAtTime(S.mode==="idle"?0:(.005+S.energy*.014+S.solo*.012), now, .6);
}
function roar(strength){
  if(!AC) return;
  const t=AC.currentTime, g=AC.createGain(), a=.06+(strength||0)*.09;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(a,t+.1);
  g.gain.exponentialRampToValueAtTime(.0002,t+.95);
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=780; bp.Q.value=.9;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t+1.05);
}

function ramHorn(cx,cy,turns,r0,b,dir){
  const out=[],inn=[],steps=110,tMax=turns*2*Math.PI;
  for(let i=0;i<=steps;i++){
    const t=tMax*i/steps, r=r0*Math.exp(b*t), w=r*.46, a=dir*t+2.4;
    out.push([cx+Math.cos(a)*(r+w/2),cy+Math.sin(a)*(r+w/2)]);
    inn.push([cx+Math.cos(a)*(r-w/2),cy+Math.sin(a)*(r-w/2)]);
  }
  let d="M"+out[0][0].toFixed(1)+" "+out[0][1].toFixed(1);
  for(let i=1;i<out.length;i++) d+=" L"+out[i][0].toFixed(1)+" "+out[i][1].toFixed(1);
  for(let i=inn.length-1;i>=0;i--) d+=" L"+inn[i][0].toFixed(1)+" "+inn[i][1].toFixed(1);
  return d+" Z";
}

/* Hände: Glieder werden aus einer Mittellinie mit veränderlicher Dicke
   aufgebaut — gleich dicke Kapseln lesen sich sonst als Würste. */
const SKIN_DARK="#6a3f2d", SKIN_LIT="rgba(245,191,144,.35)";
function taperD(P,w0,w1){
  const n=P.length, L=[], R=[];
  let ltx=1, lty=0;
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)], b=P[Math.min(n-1,i+1)];
    let tx=b[0]-a[0], ty=b[1]-a[1];
    const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    if(i===n-1){ ltx=tx; lty=ty; }
    const u=n>1?i/(n-1):0;
    // Knöchel als leichte Verdickung, sonst gleichmäßige Verjüngung
    const w=(w0+(w1-w0)*u)*(1+.07*Math.sin(u*Math.PI*2.6));
    L.push([P[i][0]-ty*w/2, P[i][1]+tx*w/2]);
    R.push([P[i][0]+ty*w/2, P[i][1]-tx*w/2]);
  }
  const c=w1*.62;
  let d="M"+L[0][0].toFixed(1)+" "+L[0][1].toFixed(1);
  for(let i=1;i<n;i++) d+=" L"+L[i][0].toFixed(1)+" "+L[i][1].toFixed(1);
  d+=" C"+(L[n-1][0]+ltx*c).toFixed(1)+" "+(L[n-1][1]+lty*c).toFixed(1)+
     " "+(R[n-1][0]+ltx*c).toFixed(1)+" "+(R[n-1][1]+lty*c).toFixed(1)+
     " "+R[n-1][0].toFixed(1)+" "+R[n-1][1].toFixed(1);
  for(let i=n-2;i>=0;i--) d+=" L"+R[i][0].toFixed(1)+" "+R[i][1].toFixed(1);
  return d+" Z";
}
function digit(P,w0,w1,p){
  const d=taperD(P,w0,w1);
  el("path",{d:d,fill:"none",stroke:"rgba(240,180,110,.3)","stroke-width":"3.4",
    "stroke-linejoin":"round"},p);
  el("path",{d:d,fill:SKIN_DARK,stroke:"#3a2016","stroke-width":".8"},p);
  // Streiflicht auf der Oberseite
  const hi=[]; for(let i=0;i<P.length;i++) hi.push([P[i][0],P[i][1]-w0*.22]);
  el("path",{d:taperD(hi,w0*.3,w1*.22),fill:SKIN_LIT},p);
}
function limb(d,w,p){
  el("path",{d:d,fill:"none",stroke:"rgba(240,180,110,.3)","stroke-width":(w+4).toFixed(1),
    "stroke-linecap":"round","stroke-linejoin":"round"},p);
  el("path",{d:d,fill:"none",stroke:SKIN_DARK,"stroke-width":w,
    "stroke-linecap":"round","stroke-linejoin":"round"},p);
  el("path",{d:d,fill:"none",stroke:SKIN_LIT,"stroke-width":(w*.34).toFixed(1),
    "stroke-linecap":"round",transform:"translate(0,"+(-w/2+2).toFixed(1)+")"},p);
}

const artG=document.getElementById("art");

function toArt(cx,cy){
  const m=artG.getScreenCTM(); if(!m) return null;
  svgPt.x=cx; svgPt.y=cy;
  return svgPt.matrixTransform(m.inverse());
}
function zoneOf(p){
  if(!p) return null;
  if(p.x>96&&p.x<312&&p.y>70&&p.y<416) return "neck";
  if(p.y>=416&&p.y<860&&p.x>-90&&p.x<500) return "bow";
  return null;
}
function posFromY(y){
  const last=ANCH_Y.length-1;
  if(y<=ANCH_Y[0]) return 0;
  if(y>=ANCH_Y[last]) return last;
  for(let i=0;i<last;i++) if(y<=ANCH_Y[i+1]) return i+(y-ANCH_Y[i])/(ANCH_Y[i+1]-ANCH_Y[i]);
  return last;
}
function yFromPos(p){
  const i=Math.max(0,Math.min(ANCH_Y.length-2,Math.floor(p)));
  return ANCH_Y[i]+(ANCH_Y[i+1]-ANCH_Y[i])*(p-i);
}
let fretPid=null,bowPid=null,lastAX=0;
svg.addEventListener("pointerdown",function(e){
  if(S.paused){ goResume(); e.preventDefault(); e.stopPropagation(); return; }
  if(S.mode==="demo"){ e.preventDefault(); return; }
  begin();
  const p=toArt(e.clientX,e.clientY), z=zoneOf(p);
  if(z==="bow"&&bowPid===null){
    bowPid=e.pointerId; lastAX=p.x; S.strokeDist=0;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }else if(z==="neck"&&fretPid===null){
    fretPid=e.pointerId; S.target=posFromY(p.y); S.holding=true;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }
});
svg.addEventListener("pointermove",function(e){
  if(S.paused) return;
  if(e.pointerId!==bowPid&&e.pointerId!==fretPid) return;
  const p=toArt(e.clientX,e.clientY); if(!p) return;
  if(e.pointerId===bowPid){
    const dx=p.x-lastAX;
    if(dx*S.lastDx<0&&Math.abs(dx)>1.4){
      S.scratch=1; S.revs++;
      if(S.strokeDist<16) S.micro++;
      S.strokeDist=0;
      // Gegenmoment: die Gusle reißt beim Wechsel zurück
      const kick=Math.min(1,S.speed)*(dx>0?1:-1);
      S.swingVel-=kick*1.9; S.pushVel-=kick*2.6; S.bowAngVel+=kick*2.4;
      S.shake=Math.min(1,S.speed*1.3);
      S.pulse=Math.min(1,Math.max(S.pulse,S.speed*1.6));   // Bühne blitzt mit
    }
    if(Math.abs(dx)>.4) S.lastDx=dx;
    S.moved+=Math.abs(dx); S.strokeDist+=Math.abs(dx);
    S.bowPos=Math.max(-64,Math.min(64,S.bowPos+dx*.6));
    lastAX=p.x;
  }else S.target=posFromY(p.y);
});

}

const cv=document.getElementById("staff"), g2=cv.getContext("2d");
let W=0,H=0;
function fit(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  g2.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",fit);
const PXMS=.128, HITX=80;
function ny(p){ return H-14-(p/6)*(H-42); }
function persp(x){                       // Fluchtperspektive: fern = klein
  if(x<=HITX) return 1;
  return Math.max(.28,1-(x-HITX)/(W*1.35));
}
function py(p,k){ const hor=H*.34; return hor+(ny(p)-hor)*k; }

function drawStaff(now){
  g2.clearRect(0,0,W,H);
  g2.lineCap="round"; g2.lineJoin="round";
  const fam=getComputedStyle(document.body).fontFamily;

  // Bühnenboden
  const grd=g2.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"rgba(8,7,10,0)");
  grd.addColorStop(1,"rgba(122,58,28,"+(.10+S.energy*.2+S.solo*.18).toFixed(3)+")");
  g2.fillStyle=grd; g2.fillRect(0,0,W,H);

  // Schienen laufen in die Ferne
  const kEnd=persp(W);
  g2.strokeStyle="rgba(244,234,214,"+(.06+S.energy*.05).toFixed(3)+")"; g2.lineWidth=1;
  [0,6].forEach(function(p){
    g2.beginPath(); g2.moveTo(HITX,py(p,1)); g2.lineTo(W,py(p,kEnd)); g2.stroke();
  });

  if(S.mode==="song"&&S.song){
    g2.font='700 10px '+fam; g2.textAlign="left";
    g2.fillStyle="rgba(244,234,214,.28)";
    g2.fillText(S.song.title.toUpperCase(),0,10);

    for(let i=S.notes.length-1;i>=0;i--){
      const n=S.notes[i], x=HITX+(n.t-now)*PXMS;
      if(x<-46||x>W+46) continue;
      const k=persp(x), y=py(n.pos,k), live=now>=n.t&&now<n.t+n.dur;
      if(n.syl===5){
        g2.strokeStyle="rgba(196,28,46,"+(.5*k).toFixed(3)+")"; g2.lineWidth=1;
        g2.beginPath();
        g2.moveTo(x-19*k,py(6,k)-8); g2.lineTo(x-19*k,py(0,k)+6);
        g2.moveTo(x-14*k,py(6,k)-8); g2.lineTo(x-14*k,py(0,k)+6); g2.stroke();
        if(k>.55){
          g2.fillStyle="rgba(196,28,46,.75)"; g2.textAlign="center";
          g2.font='700 8px '+fam; g2.fillText("4|6",x-16.5*k,py(6,k)-11);
        }
      }
      g2.strokeStyle=live?"rgba(244,234,214,.4)":"rgba(244,234,214,"+(.12*k).toFixed(3)+")";
      g2.lineWidth=(live?3:2)*k;
      g2.beginPath(); g2.moveTo(x,y); g2.lineTo(x+n.dur*PXMS*.84,y); g2.stroke();

      let col="rgba(244,234,214,"+(.45*k+.1).toFixed(3)+")";
      if(n.grade===2) col="#f0b45a";
      else if(n.grade===1) col="rgba(244,234,214,.5)";
      else if(n.grade===0) col="rgba(196,28,46,.85)";
      else if(live) col="#fff";
      g2.shadowBlur=(n.grade===2||live)?14:0;
      g2.shadowColor=n.grade===2?"rgba(240,180,90,.95)":"rgba(244,234,214,.85)";
      g2.fillStyle=col; g2.strokeStyle=col;
      const r=5*k;
      if(n.pos===0){ g2.lineWidth=1.8*k; g2.beginPath(); g2.arc(x,y,r,0,6.284); g2.stroke(); }
      else{ g2.beginPath(); g2.moveTo(x,y-r); g2.lineTo(x+r,y);
            g2.lineTo(x,y+r); g2.lineTo(x-r,y); g2.closePath(); g2.fill(); }
      g2.shadowBlur=0;
    }
  }

  // Bühnenkante als Trefferlinie
  g2.shadowBlur=10+S.solo*14; g2.shadowColor="rgba(208,90,58,.85)";
  g2.strokeStyle="rgba(208,90,58,"+(.65+S.solo*.3).toFixed(2)+")"; g2.lineWidth=2;
  g2.beginPath(); g2.moveTo(HITX+.5,6); g2.lineTo(HITX+.5,H-1); g2.stroke();
  g2.shadowBlur=0;

  // goldene Schweife perfekter Noten
  for(let i=S.sparks.length-1;i>=0;i--){
    const s=S.sparks[i], age=(now-s.t)/750;
    if(age>=1){ S.sparks.splice(i,1); continue; }
    const x=HITX-(now-s.t)*PXMS*.9, a=(1-age)*(1-age);
    g2.strokeStyle="rgba(240,180,90,"+(a*.9).toFixed(3)+")";
    g2.lineWidth=3.5*a+.6;
    g2.shadowBlur=14*a; g2.shadowColor="rgba(255,214,120,.9)";
    g2.beginPath(); g2.moveTo(x,s.y); g2.lineTo(x+26*a+6,s.y); g2.stroke();
    g2.shadowBlur=0;
  }

  // Solo-Line des eigenen Tons
  const passes=[[6,"rgba(196,28,46,.16)",0],[2.2,"rgba(240,180,90,.9)",10+S.solo*10]];
  for(let p=0;p<2;p++){
    g2.lineWidth=passes[p][0]+S.solo*1.2;
    g2.strokeStyle=passes[p][1];
    g2.shadowBlur=passes[p][2]; g2.shadowColor="rgba(240,180,90,.8)";
    g2.beginPath();
    let open=false;
    for(let i=1;i<S.trace.length;i++){
      const a=S.trace[i-1], b=S.trace[i];
      if(b.v<=.09){ open=false; continue; }
      const x1=HITX-(now-a.t)*PXMS, x2=HITX-(now-b.t)*PXMS;
      if(x2<-20) continue;
      if(!open){ g2.moveTo(x1,ny(a.p)); open=true; }
      g2.lineTo(x2,ny(b.p));
    }
    g2.stroke(); g2.shadowBlur=0;
  }

  const pyy=ny(S.playPos), v=Math.min(1,S.speed);
  g2.shadowBlur=v>.09?16:0; g2.shadowColor="rgba(255,240,200,.95)";
  g2.fillStyle=v>.09?"#fff":"rgba(244,234,214,.28)";
  g2.beginPath(); g2.moveTo(HITX-11,pyy-6.5); g2.lineTo(HITX-1,pyy);
  g2.lineTo(HITX-11,pyy+6.5); g2.closePath(); g2.fill(); g2.shadowBlur=0;

  if(S.mode==="song"&&LVL().show>0){
    const cur=S.notes.find(function(n){ return now>=n.t&&now<n.t+n.dur; });
    if(cur){
      const d=S.playPos-cur.pos;
      if(Math.abs(d)>.16&&Math.abs(d)<2.4){
        g2.fillStyle="rgba(196,28,46,.9)"; g2.textAlign="left";
        g2.font='700 12px '+fam; g2.fillText(d>0?"▲":"▼",HITX-27,pyy+5);
      }
    }
  }
}

function buildSong(song){
  const out=[]; let t=1700;
  song.verses.forEach(function(v,vi){
    for(let i=0;i<10;i++){
      if(i===4) t+=song.beat*.44;
      out.push({t:t,dur:song.beat*.9,pos:v[i],verse:vi+1,syl:i+1,ok:0,n:0,dev:0,hit:0,close:0,grade:null});
      t+=song.beat;
    }
    t+=song.beat*1.7;
  });
  return out;
}

const flareEl=document.getElementById("flare");
let flareT=0;
function flareSweep(){ if(!reduce) flareT=performance.now(); }

function judgeFrame(now,tNow){
  const lvl=LVL(), tol=lvl.tol;
  const bowing=S.bowHot>0;                 // Kulanz über den Wendepunkt hinweg
  let live=null;
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    if(now>=n.t-lvl.pre&&now<n.t+n.dur){
      if(now>=n.t) live=n;
      n.n++;
      const d=Math.abs(S.playPos-n.pos);
      n.dev+=d;
      if(d<=tol&&bowing){ n.ok++; n.hit=1; }
      if(d<=tol*2&&bowing) n.close=1;
      S.bowFrames++; if(bowing) S.bowOn++;
    }else if(n.grade===null&&now>=n.t+n.dur){
      const r=n.n?n.ok/n.n:0, mult=S.solo>.5?2:1;
      const isClean=(lvl.any&&n.hit)||r>=lvl.cleanR;
      const isNear =n.close||r>=lvl.nearR;
      S.tonSum+=Math.max(0,1-(n.n?n.dev/n.n:3)/1.5); S.tonN++;
      if(isClean){
        n.grade=2; S.score+=(100+S.combo*4)*mult; S.combo++; S.clean++; S.verseClean++;
        flash("ČISTO","#f0b45a");
        S.flash=1; S.rimFlash=1; S.sheenT=tNow;
        S.sparks.push({t:now,y:ny(n.pos)});
        BEAMS.forEach(function(b){ b.snap=tNow; });
        vatraBump(.055+S.vibQ*.03);
      }else if(isNear){
        n.grade=1; S.score+=40*mult; S.near++;
        S.combo=Math.floor(S.combo*lvl.nearKeep);   // je nach Stufe bleibt ein Teil
        vatraBump(-.02);
        flash("BLIZU","rgba(244,234,214,.85)");
      }else{
        n.grade=0; S.combo=0; S.miss++; flash("PROMAŠAJ","#d05a3a");
        S.dim=1; S.energy*=.35; vatraBump(-.18);
      }
      S.maxCombo=Math.max(S.maxCombo,S.combo); S.total++;
      document.getElementById("scoreOut").textContent=S.score;

      while(S.nextCall<S.calls.length&&S.combo>=S.calls[S.nextCall][0]){
        const c=S.calls[S.nextCall];
        burst(c[1]); roar(Math.min(1,c[0]/24)); S.shake=Math.max(S.shake,.65);
        if(c[0]>=S.soloAt){ S.soloEnd=Math.max(S.soloEnd,tNow+SOLO_MS); flareSweep(); }
        S.nextCall++;
      }
      if(S.combo===0) S.nextCall=0;
      else while(S.nextCall>0&&S.combo<S.calls[S.nextCall-1][0]) S.nextCall--;
      if(n.syl===10&&LVL().ref){
        const nx=S.notes[i+1];
        if(nx) setTimeout(function(){ refTone(nx.pos); },240);
      }
      if(n.syl===10){
        if(S.verseClean>=9){ roar(.8); flareSweep(); S.shake=Math.max(S.shake,.5); }
        S.verseClean=0;
      }
    }
  }
  if(!live){ S.restFrames++; if(S.speed>.09) S.restBow++; }
  if(band){
    if(live&&LVL().show===2){
      const y0=yFromPos(Math.max(0,live.pos-tol)), y1=yFromPos(Math.min(6,live.pos+tol));
      band.setAttribute("y",y0.toFixed(1));
      band.setAttribute("height",Math.max(6,y1-y0).toFixed(1));
      band.setAttribute("opacity","1");
    }else band.setAttribute("opacity","0");
  }
  marks.forEach(function(g,i){
    const on=live&&LVL().show>0&&(i+1)===live.pos;
    g.firstChild.setAttribute("class",on?"mark lead":"mark");
  });
  const last=S.notes[S.notes.length-1];
  if(last&&now>last.t+last.dur+1700){ if(S.mode==="demo") endDemo(); else finish(); }
}

/* ═══════════ Intro ═══════════ */
let introSkipWired=false;
const introEl=document.getElementById("intro"),
      iTitle=introEl.querySelector(".ititle"),
      iSubBox=introEl.querySelector(".isub"),
      iSub=introEl.querySelector(".isub span"),
      iCopy=introEl.querySelector(".icopy"),
      iSkip=introEl.querySelector(".iskip");
let introT=0;
const IN_END=6400;
function ease(x){ return 1-Math.pow(1-x,3); }
function easeBack(x){ const c=2.0; return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); }
function seg(e,a,b){ return Math.max(0,Math.min(1,(e-a)/(b-a))); }

function thump(){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(34,t+.42);
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0005,t+.6);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.65);
}
function startIntro(){
  introT=performance.now();
  if(!introSkipWired){
    introSkipWired=true;
    introEl.addEventListener("pointerdown",function(ev){
      begin(); endIntro(); ev.preventDefault(); ev.stopPropagation();
    });
  }
  document.body.classList.add("intro");
  introEl.classList.remove("done");
  introEl.style.display="flex";
  introEl.style.pointerEvents="auto";
  iTitle.style.opacity=0; iSubBox.style.height="0px";
  iSub.style.transform="translateY(100%)"; iSkip.style.opacity=0;
  iCopy.style.opacity=0; iSubBox.style.opacity=1;
  S.introSound={};
}
function endIntro(){
  if(!introT) return;
  introT=0;
  document.body.classList.remove("intro");
  introEl.classList.add("done");
  introEl.style.display="none";
  introEl.style.pointerEvents="none";
  blackoutEl.style.opacity=0;
  S.energy=0;
  showMenu("home");
}
function driveIntro(t){
  const e=t-introT;
  if(e>=IN_END){ endIntro(); return false; }
  const snd=S.introSound;

  // 0.0–0.5  Schwarz, dann Saallicht aus
  blackoutEl.style.opacity=(1-seg(e,150,900)*.92).toFixed(3);
  iSkip.style.opacity=(seg(e,1400,2000)*(1-seg(e,5200,5800))).toFixed(3);

  // 0.4–1.9  Zwei Scheinwerfer fahren herein
  const s1=ease(seg(e,400,1500)), s2=ease(seg(e,900,2000));
  BEAMS[0].el.style.transform="rotate("+(-62+50*s1).toFixed(2)+"deg)";
  BEAMS[0].el.style.opacity=(s1*.95).toFixed(3);
  BEAMS[1].el.style.transform="rotate("+(62-50*s2).toFixed(2)+"deg)";
  BEAMS[1].el.style.opacity=(s2*.95).toFixed(3);
  BEAMS[2].el.style.opacity=(seg(e,3400,4000)*.8).toFixed(3);
  BEAMS[2].el.style.transform="rotate("+(Math.sin(e*.004)*20).toFixed(2)+"deg)";

  // Ringe und LED-Säulen ziehen hoch
  S.energy=seg(e,600,2600)*.55+seg(e,3600,4400)*.45;

  // 1.8–2.4  Die Gusle fällt ins Bild und schlägt auf
  const drop=seg(e,1800,2380);
  const dy=drop<1?(1-easeBack(drop))*-620:0;
  if(drop>=1&&!snd.thump){ snd.thump=1; thump(); S.shake=1; }
  const introShake=reduce?0:(Math.random()-.5)*S.shake*7;
  camG.setAttribute("transform","translate("+introShake.toFixed(2)+","+
    (dy+introShake).toFixed(2)+")");

  // 2.4–3.2  Ein großer Bogenstrich quer über das Fell
  const sw=seg(e,2400,3150);
  if(sw>0&&sw<1){
    S.bowPos=-70+140*ease(sw);
    S.speed=Math.sin(sw*Math.PI)*.95;
    if(!snd.roar&&sw>.55){ snd.roar=1; roar(.9); }
  }else if(sw>=1) S.speed*=.9;
  if(bowG) bowG.setAttribute("transform","translate("+S.bowPos.toFixed(1)+
    ",0) rotate("+(-14+28*ease(sw))+" 200 472)");

  // 3.0–3.6  Titel schlägt ein, Untertitel fährt auf
  const ti=seg(e,3000,3520);
  iTitle.style.opacity=Math.min(1,ti*1.6).toFixed(3);
  iTitle.style.letterSpacing=(0.5-0.535*ease(ti)).toFixed(3)+"em";
  iTitle.style.transform="scaleX(.82) scale("+(1.22-.22*ease(ti)).toFixed(3)+")";
  if(ti>=1&&!snd.flare){ snd.flare=1; flareSweep(); roar(1); S.shake=Math.max(S.shake,.7); }
  iCopy.style.opacity=(seg(e,3900,4500)).toFixed(3);
  const su=seg(e,3450,3900);
  iSubBox.style.height=(su*26).toFixed(1)+"px";
  iSub.style.transform="translateY("+((1-ease(su))*100).toFixed(1)+"%)";

  // 4.0–5.2  Lichtschnitte im Takt
  if(e>4000&&e<5300){
    const cut=Math.floor(e/260);
    if(cut!==S.lastCut){
      S.lastCut=cut;
      BEAMS.forEach(function(b,i){
        b.el.style.transform="rotate("+((i-1)*26+((cut*41+i*17)%31)-15)+"deg)";
        b.el.style.opacity=((cut+i)%2?.35:1).toFixed(2);
      });
      S.pulse=1;
    }
  }

  // 5.2–6.4  Titel verglüht, Bühne fährt herunter
  const out=seg(e,5400,6400);
  if(out>0){
    iTitle.style.opacity=(1-out).toFixed(3);
    iSubBox.style.opacity=(1-out).toFixed(3);
    iCopy.style.opacity=(1-out).toFixed(3);
    BEAMS.forEach(function(b){ b.el.style.opacity=(.9*(1-out)+.2).toFixed(3); });
  }
  return true;
}


/* ═══════════ Grafikstufen: AUTO / VOLL / SPARSAM ═══════════ */
const GFX={mode:"auto", tier:2, fps:60, acc:0, n:0, lowT:0, highT:0};
/* Reihenfolge beim Abschalten: Ghost-Gusle, Blur, Rauch 2, Scanlines,
   danach nur noch Publikum/LEDs seltener aktualisieren.
   Nie reduziert: Eingabe, Audio, Tonhöhe, Bogenphysik, Treffererkennung. */
function gfxFrame(dt){
  GFX.acc+=dt; GFX.n++;
  if(GFX.acc>=500){
    GFX.fps=1000/(GFX.acc/GFX.n); GFX.acc=0; GFX.n=0;
    if(GFX.mode==="auto"){
      if(GFX.fps<44){ GFX.lowT++; GFX.highT=0; } 
      else if(GFX.fps>56){ GFX.highT++; GFX.lowT=0; }
      else { GFX.lowT=0; GFX.highT=0; }
      if(GFX.lowT>=3&&GFX.tier>0){ GFX.tier--; GFX.lowT=0; applyGfx(); }
      if(GFX.highT>=14&&GFX.tier<2){ GFX.tier++; GFX.highT=0; applyGfx(); }
    }
  }
}
function setGfx(mode){
  GFX.mode=mode;
  GFX.tier=(mode==="full")?2:(mode==="lite")?0:GFX.tier;
  GFX.lowT=0; GFX.highT=0;
  DB.gfx=mode; dbSave(); applyGfx();
}
function applyGfx(){
  const t=GFX.tier;
  smoke2.style.display=t>=2?"block":"none";
  const scan=document.getElementById("fxScan");
  if(scan) scan.style.display=t>=1?"block":"none";
  if(t<2&&ghostsG){ ghostsG.style.display="none"; ghostsG.setAttribute("opacity","0"); }
  if(strHalo) strHalo.style.display=t>=1?"block":"none";
  if(rimFlashEl) rimFlashEl.style.display=t>=1?"block":"none";
  BEAMS[2].el.style.display=t>=1?"block":"none";
  flareEl.style.display=t>=1?"block":"none";
}

/* ═══════════ Vibrato ═══════════ */
/* Der Hals ist stufenlos — also kann um den Zielton geschwungen werden.
   Gemessen werden Amplitude und Frequenz der Schwingung. */
function vibratoFrame(t,dt){
  if(S.speed<=.09||!S.holding){ S.vibHist.length=0; S.vibQ*=Math.pow(.94,dt/16.7); return; }
  S.vibHist.push({t:t,p:S.playPos});
  while(S.vibHist.length&&S.vibHist[0].t<t-420) S.vibHist.shift();
  const H=S.vibHist;
  if(H.length<10){ S.vibQ*=.98; return; }
  let mean=0; for(let i=0;i<H.length;i++) mean+=H[i].p; mean/=H.length;
  let amp=0, cross=0, prev=H[0].p-mean;
  for(let i=1;i<H.length;i++){
    const d=H[i].p-mean;
    amp+=Math.abs(d);
    if(prev<0&&d>=0) cross++;
    prev=d;
  }
  amp/=H.length;
  const span=(H[H.length-1].t-H[0].t)/1000;
  const rate=span>0?cross/span:0;
  // gut: 0,03–0,17 Positionseinheiten bei etwa 4–8 Hz
  const aQ=amp<.02?0:Math.max(0,1-Math.abs(amp-.09)/.1);
  const rQ=Math.max(0,1-Math.abs(rate-6)/4);
  const q=Math.min(1,aQ*rQ);
  S.vibQ+=(q-S.vibQ)*.12;
  if(amp>.30) S.vibQ*=.7;              // Gezitter, kein Vibrato
}

/* ═══════════ VATRA ═══════════ */
function vatraFrame(dt){
  const f=dt/16.7;
  let d=-0.00010*f;                                   // fällt langsam ab
  if(S.speed>.09){
    const steady=1-Math.min(1,Math.abs(S.speed-S.lastSp)*9);
    d+=(0.00016+steady*0.00024)*f;
    d+=S.vibQ*0.00055*f;
  }
  S.vatra=Math.max(0,Math.min(1,S.vatra+d));
}
function vatraBump(x){ S.vatra=Math.max(0,Math.min(1,S.vatra+x)); }

/* ═══════════ Referenzton für SLIJEPI ═══════════ */
function refTone(p){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="triangle"; o.frequency.value=freqOf(p);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.10,t+.05);
  g.gain.exponentialRampToValueAtTime(.0002,t+.5);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.55);
}

/* ═══════════ Übungen ═══════════ */
/* Gusle belohnt Kontrolle über einen laufenden Ton, nicht einzelne Anschläge —
   die Drills messen deshalb Haltedauer, Gleiten, Bogenruhe und Zweihandarbeit. */
const DRILLS=[
  {id:"ton",  name:"ČIST TON",  gloss:"Ton halten",   dur:30000,
   hint:"Halte einen Ton — egal welchen — so ruhig wie möglich.", unit:"%"},
  {id:"kliz", name:"KLIZANJE",  gloss:"Gleiten",      dur:36000,
   hint:"Gleite auf die leuchtende Marke und lande sauber.", unit:"/8"},
  {id:"gud",  name:"GUDALO",    gloss:"Bogen",        dur:25000,
   hint:"Nur streichen. Gleichmäßig, keine hektischen Wechsel.", unit:"%"},
  {id:"dvije",name:"DVIJE RUKE",gloss:"Beide Hände",  dur:34000,
   hint:"Wechsle den Ton, ohne den Bogen anzuhalten.", unit:"/10"},
  {id:"dugi", name:"DUGI TON",  gloss:"Langer Ton",   dur:40000,
   hint:"Halte einen Ton so lange wie möglich stabil.", unit:"s"}
];
const KLIZ_SEQ=[2,4,1,3,5,2,4,6], RUKE_SEQ=[2,4,3,5,2,6,3,1,4,2];

function startDrill(i){
  begin(); resetRun();
  const D=DRILLS[i];
  S.mode="drill";
  S.drill={def:D, t0:performance.now(), ok:0, n:0, idx:0, hits:0, breaks:0,
           ref:null, hold:0, best:0, seqT:0, done:false, val:0};
  document.getElementById("modeLabel").textContent="VJEŽBA";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=D.hint.toUpperCase();
  if(band) band.setAttribute("opacity","0");
  veil.classList.add("hidden"); fit();
}

function drillFrame(t){
  const D=S.drill; if(!D||D.done) return;
  const e=t-D.t0, def=D.def, sounding=S.speed>.09;

  if(def.id==="ton"){
    if(!sounding){ D.ref=null; }
    else{
      if(D.ref===null) D.ref=Math.round(S.playPos);
      D.n++; if(Math.abs(S.playPos-D.ref)<=.10) D.ok++;
    }
    D.val=D.n?Math.round(D.ok/D.n*100):0;

  }else if(def.id==="kliz"){
    if(!D.seqT) D.seqT=t;
    const tgt=KLIZ_SEQ[D.idx%KLIZ_SEQ.length];
    D.target=tgt;
    if(sounding&&Math.abs(S.playPos-tgt)<=.20) D.hold+=16.7; else D.hold*=.8;
    if(D.hold>320){                      // sauber gelandet und kurz gehalten
      D.hits++; D.idx++; D.hold=0; D.seqT=t; vatraBump(.05); flash("ČISTO","#f0b45a");
    }else if(t-D.seqT>4200){ D.idx++; D.hold=0; D.seqT=t; flash("DALJE","rgba(244,234,214,.6)"); }
    D.val=D.hits;
    if(D.idx>=KLIZ_SEQ.length) D.done=true;

  }else if(def.id==="gud"){
    if(sounding){
      D.n++;
      const steady=1-Math.min(1,Math.abs(S.speed-S.lastSp)*9);
      D.ok+=steady;
      if(S.strokeDist<16&&S.scratch>.9) D.breaks++;
    }
    const raw=D.n?D.ok/D.n:0;
    D.val=Math.round(Math.max(0,raw-D.breaks*.02)*100);

  }else if(def.id==="dvije"){
    if(!D.seqT) D.seqT=t;
    const tgt=RUKE_SEQ[D.idx%RUKE_SEQ.length];
    D.target=tgt;
    if(!sounding) D.breaks++;            // Bogen darf nicht stehenbleiben
    if(sounding&&Math.abs(S.playPos-tgt)<=.22) D.hold+=16.7; else D.hold*=.85;
    if(D.hold>260){ D.hits++; D.idx++; D.hold=0; D.seqT=t; vatraBump(.05); }
    else if(t-D.seqT>2600){ D.idx++; D.hold=0; D.seqT=t; }
    D.val=D.hits;
    if(D.idx>=RUKE_SEQ.length) D.done=true;

  }else if(def.id==="dugi"){
    if(!sounding){ D.ref=null; D.hold=0; }
    else{
      if(D.ref===null){ D.ref=S.playPos; D.hold=0; }
      if(Math.abs(S.playPos-D.ref)<=.13) D.hold+=16.7;
      else { D.ref=S.playPos; D.hold=0; }
      if(D.hold>D.best) D.best=D.hold;
    }
    D.val=(D.best/1000).toFixed(1);
  }

  if(e>=def.dur) D.done=true;
  if(D.done) endDrill();
}

function endDrill(){
  const D=S.drill; S.mode="idle";
  hintEl.className="";
  if(amp&&AC) amp.gain.setTargetAtTime(0,AC.currentTime,.15);
  const key="drill:"+D.def.id;
  const prev=DB.drill&&DB.drill[key]||0;
  const num=parseFloat(D.val)||0;
  if(!DB.drill) DB.drill={};
  const best=Math.max(prev,num); DB.drill[key]=best; dbSave();
  S.lastDrill={def:D.def, val:D.val, best:best, isBest:num>prev};
  buildDrillResult(); screen="drillResult"; renderMenu();
}

function drawDrill(t){
  const D=S.drill; if(!D) return;
  g2.clearRect(0,0,W,H);
  const fam=getComputedStyle(document.body).fontFamily;
  const e=Math.min(1,(t-D.t0)/D.def.dur);

  // Fortschritt
  g2.fillStyle="rgba(244,234,214,.1)"; g2.fillRect(0,0,W,2);
  g2.fillStyle="rgba(196,28,46,.8)"; g2.fillRect(0,0,W*e,2);

  // Tonleiter
  for(let p=0;p<=6;p++){
    g2.strokeStyle="rgba(244,234,214,.07)"; g2.lineWidth=1;
    g2.beginPath(); g2.moveTo(60,ny(p)+.5); g2.lineTo(W-8,ny(p)+.5); g2.stroke();
  }
  if(D.target!==undefined&&D.def.id!=="gud"&&D.def.id!=="ton"&&D.def.id!=="dugi"){
    const y=ny(D.target);
    g2.shadowBlur=16; g2.shadowColor="rgba(240,180,90,.9)";
    g2.strokeStyle="#f0b45a"; g2.lineWidth=2.5;
    g2.beginPath(); g2.moveTo(60,y); g2.lineTo(W-8,y); g2.stroke(); g2.shadowBlur=0;
    g2.fillStyle="#f0b45a"; g2.font='700 11px '+fam; g2.textAlign="left";
    g2.fillText(ROMAN[D.target]||"0",44,y+4);
  }
  if(D.ref!==null&&D.ref!==undefined&&(D.def.id==="ton"||D.def.id==="dugi")){
    const y=ny(D.ref);
    g2.strokeStyle="rgba(240,180,90,.6)"; g2.lineWidth=1.6;
    g2.setLineDash([6,6]); g2.beginPath(); g2.moveTo(60,y); g2.lineTo(W-8,y); g2.stroke();
    g2.setLineDash([]);
  }
  // eigener Ton
  const v=Math.min(1,S.speed), py2=ny(S.playPos);
  g2.shadowBlur=v>.09?15:0; g2.shadowColor="rgba(255,240,200,.95)";
  g2.fillStyle=v>.09?"#fff":"rgba(244,234,214,.28)";
  g2.beginPath(); g2.arc(70,py2,5.5,0,6.284); g2.fill(); g2.shadowBlur=0;

  // Wert
  g2.textAlign="right"; g2.fillStyle="#f4ead6"; g2.font='700 30px '+fam;
  g2.fillText(D.val+D.def.unit,W,34);
  g2.font='700 9px '+fam; g2.fillStyle="rgba(244,234,214,.4)";
  g2.fillText(D.def.name,W,50);
}

/* ═══════════ Demo: die Gusle spielt selbst ═══════════ */
function demoDrive(now){
  if(!S.song) return;
  let cur=null, idx=-1;
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    if(now>=n.t-150&&now<n.t+n.dur){ cur=n; idx=i; break; }
  }
  if(!cur){
    S.target*=.88; S.holding=S.target>.05;      // Pause zwischen den Versen
    S.demoV*=.84;
  }else{
    S.target=cur.pos+(Math.random()-.5)*.03;    // winzige Unreinheit, kein Synthesizer
    S.holding=cur.pos>.02;
    const u=Math.min(1,Math.max(0,(now-cur.t)/cur.dur));
    const dir=(idx%2)?1:-1;
    S.bowPos=dir*(-56+112*u);
    S.lastDx=dir;
    S.demoV=.34+.52*Math.sin(u*Math.PI);
    if(u<.07||u>.93) S.demoV*=.42;              // Einbruch am Bogenwechsel
    if(idx!==S.demoLast){
      S.demoLast=idx;
      S.scratch=1; S.swingVel-=dir*1.1; S.pushVel-=dir*1.4; S.bowAngVel+=dir*1.9;
    }
  }
  S.speed=Math.max(0,S.demoV);
  S.bowHot=LVL().grace;
}
function startDemo(i){
  begin(); resetRun();
  const s=SONGS[i];
  S.mode="demo"; S.song=s; S.notes=buildSong(s); S.t0=performance.now(); S.paused=false;
  S.demoLast=-1; S.demoV=0;
  document.getElementById("modeLabel").textContent="DEMO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=s.title.toUpperCase()+" — ZUHÖREN";
  veil.classList.add("hidden"); fit();
}
function endDemo(){
  S.mode="idle"; S.soloEnd=0; S.speed=0; S.target=0; S.holding=false;
  multEl.style.opacity=0; hintEl.className="";
  if(amp&&AC) amp.gain.setTargetAtTime(0,AC.currentTime,.15);
  showMenu("home");
}

/* ═══════════ Schleife ═══════════ */
const strPath=document.getElementById("strPath"),
      strGlow=document.getElementById("strGlow"),
      strHalo=document.getElementById("strHalo"),
      fretHand=document.getElementById("fretHand"),
      camG=document.getElementById("cam"),
      vatraBar=document.querySelector("#vatra i"),
      multEl=document.getElementById("mult"),
      hintEl=document.getElementById("hint");
let prev=performance.now(), hintT=0, wasSolo=false;

function loop(t){
  const dt=Math.min(60,t-prev); prev=t;
  const f=dt/16.7;                                   // Frame-normiert
  gfxFrame(dt);
  const slow=(t-S.slowT)>50; if(slow) S.slowT=t;     // 20 Hz für Nebenwerk

  const songNow=(S.mode==="song"||S.mode==="demo")?t-S.t0:0;
  if(!S.paused&&S.mode==="demo"){
    demoDrive(songNow);
    S.playPos+=(S.target-S.playPos)*Math.min(1,dt/22);
    S.visPos +=(S.target-S.visPos )*Math.min(1,dt/70);
  }else if(!S.paused){
    let tgt=S.moved/Math.max(8,dt)*.42;
    if(spaceDown) tgt=Math.max(tgt,.7);
    S.moved=0;
    if(bowPid===null&&!spaceDown) tgt=0;
    S.speed+=(tgt-S.speed)*(tgt>S.speed?.45:.16);
    if(S.speed<.002) S.speed=0;
    S.scratch*=.86;
    if(S.speed>.09){ S.spN++; S.spSum+=S.speed; S.spDev+=Math.abs(S.speed-S.lastSp); }
    S.lastSp=S.speed;
    if(S.speed>.09) S.bowHot=LVL().grace; else S.bowHot=Math.max(0,S.bowHot-dt);
    S.playPos+=(S.target-S.playPos)*Math.min(1,dt/16);
    S.visPos +=(S.target-S.visPos )*Math.min(1,dt/70);
  }
  vibratoFrame(t,dt);
  if(S.mode!=="idle") vatraFrame(dt);
  audioFrame();
  const v=Math.min(1,S.speed);

  // Dramaturgie: jeder Strich treibt die Bühne, die Combo hebt das Grundniveau
  const soloOn=t<S.soloEnd&&S.mode!=="idle";
  if(S.vatra>=1&&S.mode!=="idle"&&t>S.soloEnd){
    S.soloEnd=t+SOLO_MS; burst("GUSLAR!"); roar(1); flareSweep(); S.vatra=.55;
  }
  S.solo+=((soloOn?1:0)-S.solo)*(soloOn?.06:.03)*f;
  if(S.solo<.004&&!soloOn) S.solo=0;
  S.pulse*=Math.pow(.9,f);
  const drive=Math.max(v*.45, S.vatra, S.solo);
  S.energy+=(drive-S.energy)*(drive>S.energy?.12:.03)*f;
  S.dim*=Math.pow(.9,f); S.flash*=Math.pow(.88,f); S.rimFlash*=Math.pow(.9,f);
  S.shake*=Math.pow(.86,f);
  if(soloOn!==wasSolo){
    wasSolo=soloOn;
    multEl.style.opacity=soloOn?1:0;
    hintEl.textContent=soloOn?"SOLO":(S.mode==="song"?"TON UND STRICH ZUGLEICH":"HALS GREIFEN · FELL STREICHEN");
    hintEl.className=soloOn?"solo":"";
    if(soloOn) roar(1);
  }

  /* ── Physik des Instruments ── */
  // Rückstoß aus dem Bogenstrich, Feder zurück in die Ruhelage
  S.swingVel+=(-S.swing*.075-S.swingVel*.13)*f;  S.swing+=S.swingVel*f;
  S.pushVel +=(-S.push *.085-S.pushVel *.15)*f;  S.push +=S.pushVel*f;
  const bowTarget=-(S.lastDx>0?1:-1)*v*7*(1+S.solo*1.3);
  S.bowAngVel+=((bowTarget-S.bowAng)*.12-S.bowAngVel*.22)*f;
  S.bowAng+=S.bowAngVel*f;
  const bowLim=11+S.solo*13;
  S.bowAng=Math.max(-bowLim,Math.min(bowLim,S.bowAng));

  // Kamerafahrt: federt mit Überschwingen heran, statt linear zu wachsen
  S.zoomVel+=(((soloOn?1:0)-S.zoom)*.085-S.zoomVel*.115)*f;
  S.zoom+=S.zoomVel*f;
  const shk=(reduce||GFX.tier<1)?0:1;
  const sx=(Math.random()-.5)*S.shake*4*shk+S.push;
  const sy=(Math.random()-.5)*S.shake*4*shk-S.zoom*30;
  const rot=(reduce?0:S.swing*1.5+S.zoom*1.6);
  const sc=1+S.zoom*.26+S.flash*.012;
  camG.setAttribute("transform",
    "translate(240,520) scale("+sc.toFixed(4)+") rotate("+rot.toFixed(2)+
    ") translate(-240,-520) translate("+sx.toFixed(2)+","+sy.toFixed(2)+")");

  /* ── gespiegelte Silhouette ── */
  if(ghostL){
    if(S.solo>.02&&GFX.tier>=2){
      ghostsG.style.display="block";
      const sp=1.22+S.solo*.5, sway=Math.sin(t*.0016)*44*S.solo;
      const gy=340;
      ghostL.setAttribute("transform","translate("+(200-sway)+","+gy+") scale("+
        (-sp).toFixed(3)+","+sp.toFixed(3)+") translate(-200,-"+gy+")");
      ghostR.setAttribute("transform","translate("+(200+sway)+","+gy+") scale("+
        sp.toFixed(3)+","+sp.toFixed(3)+") translate(-200,-"+gy+")");
      ghostsG.setAttribute("opacity",(S.solo*(.2+Math.sin(t*.003)*.09)).toFixed(3));
    }else if(ghostsG.style.display!=="none"){
      ghostsG.style.display="none"; ghostsG.setAttribute("opacity","0");
    }
  }

  /* ── Saite ── */
  const wob=reduce?0:Math.sin(t*.075)*v*11*(1+S.solo*.5);
  const d="M199 104 Q"+(200+wob).toFixed(1)+" 310 201 508";
  strPath.setAttribute("d",d); strGlow.setAttribute("d",d); strHalo.setAttribute("d",d);
  strGlow.setAttribute("opacity",(v*.62+S.flash*.3).toFixed(3));
  strHalo.setAttribute("opacity",(Math.max(0,v-.35)*.7*(0.4+S.solo)+S.flash*.5).toFixed(3));
  strPath.setAttribute("stroke",(v>.6||S.solo>.4)?"#ffe9a8":"#f4ead6");

  /* ── Bogen ── */
  if(bowPid===null) S.bowPos*=Math.pow(.94,f);
  const bend=v*8+S.scratch*5;
  if(bowStick) bowStick.setAttribute("d","M-70 470 Q160 "+(444+bend).toFixed(1)+" 356 470");
  if(bowG) bowG.setAttribute("transform",
    "translate("+(S.bowPos*(1+S.solo*.25)).toFixed(1)+","+(v*2).toFixed(1)+") rotate("+
    S.bowAng.toFixed(2)+" 200 472)");

  fretHand.setAttribute("transform","translate(197,"+yFromPos(S.visPos).toFixed(1)+")");
  fretHand.setAttribute("opacity",S.holding?"1":(S.visPos>.05?".45":"0"));

  /* ── Instrumentlicht ── */
  if(rimFlashEl) rimFlashEl.setAttribute("opacity",(S.rimFlash*.85).toFixed(3));
  if(sheenEl){
    if(S.sheenT){
      const e=(t-S.sheenT)/620;
      if(e>=1){ S.sheenT=0; sheenEl.setAttribute("opacity","0"); }
      else{
        sheenEl.setAttribute("opacity",(Math.sin(e*Math.PI)*.75).toFixed(3));
        sheenEl.setAttribute("transform","translate("+((e-.5)*360).toFixed(1)+",0)");
      }
    }
  }

  /* ── Backdrop ── */
  const scroll=(t*(.00006+S.energy*.00022+S.solo*.0003))%1;
  if(GFX.tier>=1&&(GFX.tier>=2||slow)) for(let i=0;i<gridRows.length;i++){
    const u=((i/gridRows.length)+scroll)%1;
    const k=u*u;
    const y=HOR+(660-HOR)*k, w=200+520*k;
    gridRows[i].setAttribute("d","M"+(200-w)+" "+y.toFixed(1)+" L"+(200+w)+" "+y.toFixed(1));
    gridRows[i].setAttribute("opacity",(.08+k*.2).toFixed(3));
  }
  if(GFX.tier>=2||slow) for(let i=0;i<bulbEls.length;i++){
    const b=bulbEls[i];
    b.el.setAttribute("opacity",
      (.42+Math.sin(t*.0011+b.ph)*.14+S.energy*.2+S.solo*.28+S.pulse*.15).toFixed(3));
  }
  for(let i=0;i<ringEls.length;i++){
    const r=ringEls[i];
    if(S.solo>.02||S.pulse>.4){
      r.el.setAttribute("transform","rotate("+(t*r.spin*.006).toFixed(2)+" 200 330)");
      r.el.setAttribute("opacity",(.02+S.solo*.48+S.pulse*.10).toFixed(3));
      r.el.setAttribute("stroke-width",(1.4+S.solo*1.8).toFixed(2));
    } else r.el.setAttribute("opacity","0");
  }

  /* ── Scheinwerfer ── */
  const speedK=.9+S.energy*2.4+S.solo*2.2;
  // Im Solo schneidet das Licht im Songtakt hart um, wie an einem Lichtpult
  if(S.solo>.5){
    const bt=S.song?S.song.beat:480;
    const cut=Math.floor((t-(S.song?S.t0:0))/(bt*.5));
    if(cut!==S.lastCut){
      S.lastCut=cut; S.cutFlip=cut%2;
      BEAMS.forEach(function(b,i){
        b.cut=(i-1)*22+((cut*37+i*53)%29)-14;
        b.snap=0;
      });
      S.pulse=Math.min(1,S.pulse+.45);
    }
  }else S.lastCut=-1;
  BEAMS.forEach(function(b,i){
    let want=b.base+Math.sin(t*b.rate*speedK+b.ph)*b.amp*(.8+S.energy*1.1+S.solo*.9);
    if(S.solo>.5&&b.cut!==undefined) want=b.cut;
    if(b.snap&&t-b.snap<340) want=b.aimAt;
    const ease=(b.snap&&t-b.snap<340)?.24:(S.solo>.5?.34:.06);
    b.cur+=(want-b.cur)*ease*f;
    let on=(i===2?(S.energy*.62+S.solo*.8)
                 :(.34+S.energy*.6+S.solo*.55))+S.pulse*.22;
    if(S.solo>.5) on*= (i===2 ? (S.cutFlip?1.25:.35) : (S.cutFlip?.45:1.2));
    b.el.style.transform="rotate("+b.cur.toFixed(2)+"deg)";
    b.el.style.opacity=Math.min(1,on).toFixed(3);
  });
  backlightEl.style.opacity=(.45+S.energy*.55+S.solo*.5+S.pulse*.18).toFixed(3);
  smoke1.style.opacity=(.04+S.energy*.06+S.solo*.08).toFixed(3);
  smoke2.style.opacity=(.025+S.energy*.05+S.solo*.06).toFixed(3);
  blackoutEl.style.opacity=(S.dim*.15+S.solo*.04).toFixed(3);

  /* ── Publikum ── */
  const act=.3+S.energy*1.1+S.solo*.7+S.pulse*.4;
  const armAngle=72-Math.min(72,(S.energy*66+S.solo*30));
  if(GFX.tier>=2||slow) for(let i=0;i<fans.length;i++){
    const fa=fans[i], s=Math.sin(t*fa.rate*(1+S.energy*1.6)+fa.ph);
    fa.bob.setAttribute("transform","translate(0,"+(s*fa.amp*act).toFixed(2)+")");
    const a=armAngle+s*(6+S.energy*14);
    fa.aL.setAttribute("transform","translate(-15,-28) rotate("+(-a).toFixed(1)+")");
    fa.aR.setAttribute("transform","translate(15,-28) rotate("+a.toFixed(1)+")");
  }

  vatraBar.style.width=(S.vatra*100).toFixed(1)+"%";
  publikaFrame(t);
  if(S.callT){
    const ce=(t-S.callT)/3400;
    if(ce>=1){ S.callT=0; callEl.style.opacity=0; }
    else callEl.style.opacity=(Math.min(1,ce*6)*(1-Math.max(0,(ce-.7)/.3))).toFixed(3);
  }
  if(zoneHint){
    const e=hintT?(t-hintT)/4200:1;
    zoneHint.setAttribute("opacity",e>=1?"0":(Math.min(1,(1-e)*2.6)*.75).toFixed(3));
  }
  if(burstT){
    const e=(t-burstT)/900;
    if(e>=1){ burstT=0; burstEl.style.opacity=0; }
    else{
      burstEl.style.opacity=(Math.sin(Math.min(1,e*3)*Math.PI*.5)*(1-e)*1.25).toFixed(3);
      burstEl.style.transform="scaleX(.8) scale("+(1+e*.16).toFixed(3)+")";
    }
  }
  if(flareT){
    const e=(t-flareT)/620;
    if(e>=1){ flareT=0; flareEl.style.opacity=0; }
    else{
      flareEl.style.opacity=(Math.sin(e*Math.PI)*.8).toFixed(3);
      flareEl.style.transform="translateX("+((e-.5)*70).toFixed(1)+"%)";
    }
  }

  if(introT&&driveIntro(t)){ requestAnimationFrame(loop); return; }

  if(S.mode==="drill"){
    drillFrame(t); drawDrill(t);
  }else if((S.mode==="song"||S.mode==="demo")&&!S.paused){
    const now=songNow;
    judgeFrame(now,t);
    S.trace.push({t:now,p:S.playPos,v:v});
    while(S.trace.length&&S.trace[0].t<now-2800) S.trace.shift();
    drawStaff(now);
  }else if(S.mode==="free"){
    S.trace.push({t:t,p:S.playPos,v:v});
    while(S.trace.length&&S.trace[0].t<t-6000) S.trace.shift();
    drawStaff(t);
  }else if(S.mode==="song"&&S.paused) drawStaff(S.pauseAt-S.t0);

  requestAnimationFrame(loop);
}

       'bei SLIJEPI die Hälfte.</p>';
    h+='<p class="howto" style="color:rgba(244,234,214,.4)">Zehn Silben je Vers mit Zäsur '+
       'nach der vierten — das <b style="color:rgba(244,234,214,.55)">4|6</b> in der Notenspur. '+
       'Am iPhone den Lautlos-Schalter ausschalten.</p>';

  }else if(screen==="result"||screen==="drillResult"){
    h=lastResultHtml;
  }
  inner.innerHTML=h;

  const bk=inner.querySelector("#bkBtn");
  if(bk) bk.onclick=function(){ showMenu("home"); };
  inner.querySelectorAll(".nav").forEach(function(b){
    const go=b.getAttribute("data-go");
    b.onclick=function(){
      if(go==="PJESME") showMenu("songs");
      else if(go==="VJEŽBE") showMenu("drills");
      else if(go==="SLOBODNO") startFree();
      else if(go==="KAKO SE SVIRA") showMenu("help");
      else showMenu("settings");
    };
  });

  const lr=inner.querySelector("#lvlRow"); if(lr) fillLevels(lr);
  const ir=inner.querySelector("#instRow"); if(ir) fillInst(ir);
  const gr=inner.querySelector("#gfxRow"); if(gr) fillGfx(gr);

  const sl=inner.querySelector("#songList");
  if(sl) SONGS.forEach(function(s2,i){
    const best=DB.best[s2.id]||0, acc=DB.bestAcc[s2.id];
    const row=document.createElement("div"); row.className="songrow";
    const b=document.createElement("button");
    b.className="pick";
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t">'+s2.title+'</span>'+
      '<span class="g">'+s2.gloss+' · '+s2.verses.length+' VERSE<br>'+
      (best?('<em>'+best+'</em>'+(acc?' · '+acc+'%':'')):'NOCH UNGESPIELT')+'</span>';
    b.onclick=function(){ startSong(i); };
    const d=document.createElement("button");
    d.className="demoBtn"; d.setAttribute("aria-label","Demo: "+s2.title);
    d.innerHTML='<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">'+
      '<path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/></svg>';
    d.onclick=function(ev){ ev.stopPropagation(); startDemo(i); };
    row.appendChild(b); row.appendChild(d);
    sl.appendChild(row);
  });

  const dl=inner.querySelector("#drillList");
  if(dl) DRILLS.forEach(function(D,i){
    const best=(DB.drill&&DB.drill["drill:"+D.id])||0;
    const b=document.createElement("button");
    b.className="pick";
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t" '+
      'style="font-family:var(--cond);font-weight:700;letter-spacing:.06em">'+D.name+'</span>'+
      '<span class="g">'+D.gloss+'<br>'+(best?('<em>'+best+D.unit+'</em>'):'NEU')+'</span>';
    b.onclick=function(){ startDrill(i); };
    dl.appendChild(b);
  });

  const ib=inner.querySelector("#introBtn");
  if(ib) ib.onclick=function(){ begin(); veil.classList.add("hidden"); startIntro(); };
  const sb=inner.querySelector("#soloBtn");
  if(sb) sb.onclick=function(){
    startFree(); S.combo=12; S.energy=1; S.vatra=.9;
    S.soloEnd=performance.now()+14000;
    burst("GUSLAR!"); roar(1); flareSweep();
  };
  const rb=inner.querySelector("[data-again]");
  if(rb) rb.onclick=function(){
    const k=rb.getAttribute("data-again");
    if(k.charAt(0)==="d") startDrill(+k.slice(1)); else startSong(+k);
  };
  const ob=inner.querySelector("[data-other]");
  if(ob) ob.onclick=function(){ showMenu(rb&&rb.getAttribute("data-again").charAt(0)==="d"?"drills":"songs"); };
}
let lastResultHtml="";
function buildDrillResult(){
  const R=S.lastDrill;
  let h='<h1 style="font-size:clamp(38px,14vw,72px)">'+R.def.name+'</h1>'+
    '<p class="sub">'+R.def.gloss.toUpperCase()+'</p>';
  h+='<p class="tally">ERGEBNIS <b>'+R.val+R.def.unit+'</b>'+
     (R.isBest?' <span class="hot">· NOVO NAJBOLJE</span>':'')+
     '<br>BESTWERT <b>'+R.best+R.def.unit+'</b></p>';
  h+='<div class="rule"></div><p class="howto">'+R.def.hint+'</p>';
  h+='<div class="mini">'+
     '<button class="msm" data-again="d'+DRILLS.indexOf(R.def)+'">NOCH EINMAL</button>'+
     '<button class="msm" data-other="1">ANDERE ÜBUNG</button></div>';
  lastResultHtml=h;
}

function resetRun(){
  hintT=performance.now();
  S.score=0; S.combo=0; S.maxCombo=0; S.clean=0; S.near=0; S.miss=0; S.total=0;
  S.tonSum=0; S.tonN=0; S.bowOn=0; S.bowFrames=0; S.restBow=0; S.restFrames=0;
  S.spSum=0; S.spDev=0; S.spN=0; S.revs=0; S.micro=0; S.verseClean=0;
  S.nextCall=0; S.trace=[]; S.sparks=[]; S.bowHot=0;
  S.soloAt=LVL().soloAt; S.calls=makeCalls(S.soloAt);
  S.energy=0; S.solo=0; S.soloEnd=0; S.dim=0; wasSolo=false;
  S.swing=0; S.swingVel=0; S.push=0; S.pushVel=0; S.bowAng=0; S.bowAngVel=0;
  S.sheenT=0; S.rimFlash=0; S.flash=0; S.shake=0; S.pulse=0;
  S.zoom=0; S.zoomVel=0; S.lastCut=-1; S.cutFlip=0;
  BEAMS.forEach(function(b){ b.snap=0; b.cur=b.base; });
  multEl.style.opacity=0; hintEl.className="";
}
function startFree(){
  begin(); resetRun();
  S.mode="free"; S.song=null;
  document.getElementById("modeLabel").textContent="SLOBODNO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent="HALS GREIFEN · FELL STREICHEN";
  if(band) band.setAttribute("opacity","0");
  veil.classList.add("hidden"); fit();
}
function startSong(i){
  begin(); resetRun();
  const s=SONGS[i];
  S.mode="song"; S.song=s; S.notes=buildSong(s); S.t0=performance.now(); S.paused=false;
  document.getElementById("modeLabel").textContent="PJESMA";
  document.getElementById("scoreOut").textContent="0";
  hintEl.textContent="TON UND STRICH ZUGLEICH";
  veil.classList.add("hidden"); fit();
}

function finish(){
  const s=S.song; S.mode="idle"; S.soloEnd=0;
  multEl.style.opacity=0; hintEl.className="";
  const ton=S.tonN?S.tonSum/S.tonN:0;
  const steady=S.spN>4?1-Math.min(1,(S.spDev/S.spN)/((S.spSum/S.spN)+.001)*1.6):0;
  const ideal=1000/s.beat;
  const secs=Math.max(1,S.notes[S.notes.length-1].t/1000);
  const rate=S.revs/secs;
  const rateScore=1-Math.min(1,Math.abs(rate-ideal)/(ideal*1.15));
  const microPen=S.revs?(S.micro/S.revs)*.4:0;
  const gudalo=Math.max(0,steady*.45+rateScore*.55-microPen);
  const ritam=Math.max(0,(S.bowFrames?S.bowOn/S.bowFrames:0)
                        -(S.restFrames?(S.restBow/S.restFrames)*.3:0));
  const acc=S.total?Math.round(S.clean/S.total*100):0;

  const prevBest=DB.best[s.id]||0, isBest=S.score>prevBest;
  if(isBest) DB.best[s.id]=S.score;
  if(acc>(DB.bestAcc[s.id]||0)) DB.bestAcc[s.id]=acc;
  if(S.maxCombo>DB.bestCombo) DB.bestCombo=S.maxCombo;
  DB.totalScore+=S.score;
  dbSave();

  const perfect=S.miss===0&&S.near===0;
  let h='<h1 style="font-size:clamp(44px,17vw,92px)">GOTOVO</h1>'+
        '<p class="sub" style="font-family:var(--epic);font-weight:400;letter-spacing:.04em;'+
        'font-style:italic;color:var(--gold)">'+s.title+'</p>';
  h+='<p class="tally">PUNKTE <b>'+S.score+'</b>'+(isBest?' <span class="hot">· NOVO NAJBOLJE</span>':'')+
     '<br>ČISTO <b>'+S.clean+'</b> · BLIZU <b>'+S.near+'</b> · PROMAŠAJ <b>'+S.miss+'</b>'+
     '<br>NIZ <b>'+S.maxCombo+'</b> · UKUPNO <b>'+DB.totalScore+'</b>'+
     (perfect?'<br><span class="hot">SAVRŠENO — KEIN FEHLER</span>':'')+'</p>';
  h+='<div class="rule"></div>';
  [["TON",ton],["GUDALO",gudalo],["RITAM",ritam]].forEach(function(m){
    h+='<div class="meter"><span>'+m[0]+'</span><i><b style="width:'+pct(m[1])+
       '%"></b></i><em>'+pct(m[1])+'</em></div>';
  });
  h+='<div class="rule"></div><p class="eyebrow">NOCH EINMAL</p><div id="songList"></div>'+
     '<button class="big" id="freeBtn">SLOBODNO — FREI SPIELEN</button>';
  h+='<div class="mini">'+
     '<button class="msm" data-again="'+SONGS.indexOf(s)+'">NOCH EINMAL</button>'+
     '<button class="msm" data-other="1">ANDERES LIED</button></div>';
  lastResultHtml=h; screen="result"; renderMenu();
}

document.getElementById("backBtn").onclick=function(){
  S.mode="idle"; S.notes=[]; S.paused=false; S.soloEnd=0; S.drill=null; S.vatra=0;
  multEl.style.opacity=0; hintEl.className="";
  if(amp&&AC) amp.gain.setValueAtTime(0,AC.currentTime);
  showMenu("home");
};

rebuild(); buildCrowd(); buildGhosts(); buildFx(); fit();
dbLoad().then(function(){
  if(typeof DB.level==="number") S.level=DB.level;
  if(typeof DB.inst==="number"&&DB.totalScore>=INSTRUMENTS[DB.inst].need){ S.inst=DB.inst; rebuild(); }
  if(DB.gfx) GFX.mode=DB.gfx;
  if(GFX.mode==="lite") GFX.tier=0; else if(GFX.mode==="full") GFX.tier=2;
  applyGfx();
  startIntro();
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
