<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08070a">
<meta name="color-scheme" content="dark">
<title>GUSLE — Jedna žica</title>
<meta name="description" content="Gusle na ekranu: vrat lijevo, gudalo desno. Kosovka devojka, Smrt majke Jugovića, Banović Strahinja — bez instalacije, odmah u pregledniku.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GUSLE">
<meta property="og:title" content="GUSLE — Jedna žica">
<meta property="og:description" content="Gusle na ekranu: vrat lijevo, gudalo desno. Epske pjesme u desetercu — bez instalacije, odmah u pregledniku.">
<meta property="og:image" content="preview.jpg">
<meta property="og:locale" content="sr_RS">
<meta property="og:locale:alternate" content="de_DE">
<style>
  :root{
    color-scheme:dark;
    --black:#15100d; --wine:#7a261f; --wine-hot:#d05a3a;
    --ivory:#f4ead6; --gold:#f0b45a; --brass:#c9a24a;
    --cond:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow",Impact,sans-serif;
    --epic:"Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--black);color:var(--ivory);font-family:var(--cond);
    overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    position:fixed;width:100%;
  }
  #app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
       max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;
       padding:max(4px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
               max(3px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
         flex:0 0 auto;height:22px}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.18em;margin:0;opacity:.75;
            transform:scaleX(.86);transform-origin:left}
  .readout{display:flex;align-items:center;gap:8px}
  .readout .lab{font-size:7.5px;letter-spacing:.24em;color:rgba(244,234,214,.38)}
  #mult{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);
        opacity:0;transition:opacity .2s}
  .readout b{font-size:16px;font-weight:700;letter-spacing:-.01em;
             transform:scaleX(.88);display:inline-block;font-variant-numeric:tabular-nums}
  .ghost{background:none;border:1px solid rgba(244,234,214,.2);color:rgba(244,234,214,.55);
    font-family:var(--cond);font-size:8.5px;font-weight:700;letter-spacing:.2em;
    padding:5px 11px;cursor:pointer;border-radius:1px}
  .ghost:hover{border-color:var(--wine-hot);color:var(--wine-hot)}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #stopBtn{position:absolute;right:10px;top:10px;z-index:6;display:none;
    background:rgba(10,9,8,.55);border:1px solid rgba(240,180,90,.7);color:var(--gold);
    font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.24em;
    padding:9px 16px;border-radius:1px;cursor:pointer;pointer-events:auto}
  #stopBtn:hover{background:rgba(240,180,90,.15)}

  #staffWrap{flex:0 0 auto;margin-top:1px;position:relative;
             height:clamp(64px,19.5%,110px);background:#0d0b09}
  #staff{display:block;width:100%;height:100%}
  #vatra{position:absolute;left:0;right:0;bottom:-3px;height:3px;
    background:rgba(244,234,214,.08)}
  #vatra i{display:block;height:3px;width:0;
    background:linear-gradient(90deg,#d05a3a,#f0b45a);box-shadow:0 0 8px rgba(240,180,90,.6)}
  #judge{position:absolute;right:0;top:-1px;font-size:15px;font-weight:700;letter-spacing:.1em;
    transform:scaleX(.85);transform-origin:right;opacity:0;transition:opacity .26s;pointer-events:none}

  /* ── Bühne ── */
  #stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;
         background:#07060a;isolation:isolate}
  #stage>div{position:absolute;pointer-events:none}
  #stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scene{pointer-events:none}
  #inst{pointer-events:auto;touch-action:none;transition:opacity .5s ease}
  body.gate #inst{opacity:0}
  #warm{inset:-20% -25%;
    background:
      radial-gradient(46% 52% at 60% 46%, rgba(240,180,90,.30), rgba(150,70,20,.10) 48%, transparent 74%),
      radial-gradient(70% 46% at 50% 104%, rgba(122,38,31,.34), transparent 72%);
    opacity:.5}
  .beam{top:-24%;height:160%;width:44%;margin-left:-22%;transform-origin:50% 0;
        opacity:0;mix-blend-mode:screen;
        clip-path:polygon(46% 0, 54% 0, 120% 100%, -20% 100%)}
  .beam.w{background:linear-gradient(180deg,rgba(255,238,205,.20),rgba(255,224,170,.05) 42%,transparent 74%)}
  .beam.r{background:linear-gradient(180deg,rgba(208,90,58,.22),rgba(170,60,40,.05) 46%,transparent 76%)}
  #beamA{left:26%} #beamB{left:74%} #beamC{left:50%}
  #haze1,#haze2{inset:-25%;
    background:radial-gradient(36% 26% at 32% 60%, #d8c9a8, transparent 70%),
               radial-gradient(28% 20% at 70% 42%, #d8c9a8, transparent 70%)}
  #haze1{animation:drift1 53s linear infinite;opacity:.1}
  #haze2{animation:drift2 79s linear infinite;opacity:.07}
  @keyframes drift1{0%{transform:translate(-4%,2%) scale(1)}50%{transform:translate(6%,-3%) scale(1.1)}100%{transform:translate(-4%,2%) scale(1)}}
  @keyframes drift2{0%{transform:translate(5%,-2%)}50%{transform:translate(-6%,3%)}100%{transform:translate(5%,-2%)}}
  #flare{inset:0;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(100deg,transparent 38%,rgba(244,234,214,.5) 49%,rgba(240,180,90,.35) 52%,transparent 62%)}
  #blackout{inset:0;background:#000;opacity:0}
  #burst{inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(46px,13vw,140px);font-weight:700;letter-spacing:-.03em;
    transform:scaleX(.8);color:rgba(244,234,214,.12);opacity:0;white-space:nowrap}
  #stage #call{inset:auto 0 14px 0;text-align:center;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(240,180,90,.85);opacity:0;pointer-events:none;
    text-shadow:0 2px 12px #000}

  #stage #intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:auto;z-index:5}
  #stage #intro.done{display:none;pointer-events:none}
  .ititle{font-size:clamp(44px,14vw,132px);font-weight:700;line-height:.86;
    color:#f4ead6;opacity:0;transform:scaleX(.82);
    text-shadow:0 0 34px rgba(196,28,46,.55),0 0 90px rgba(240,180,90,.28)}
  .isub{overflow:hidden;margin-top:8px;height:0}
  .isub span{display:block;font-size:clamp(11px,2.6vw,18px);font-weight:700;
    letter-spacing:.44em;color:var(--wine-hot);white-space:nowrap;transform:translateY(100%)}
  .itag{margin-top:14px;font-family:var(--epic);font-style:italic;
    font-size:clamp(11px,2.2vw,17px);letter-spacing:.2em;
    color:rgba(240,180,90,.88);opacity:0;transform:translateY(8px)}
  .icopy{margin-top:12px;font-size:9.5px;font-weight:700;letter-spacing:.42em;
    color:rgba(201,162,74,.75);opacity:0}
  .iskip{position:absolute;bottom:12px;font-size:9px;letter-spacing:.3em;
    color:rgba(244,234,214,.3);opacity:0}
  #sig{position:fixed;z-index:40;pointer-events:none;
    right:calc(11px + env(safe-area-inset-right));
    bottom:calc(5px + env(safe-area-inset-bottom));
    font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:.26em;
    color:rgba(244,234,214,.3);transition:opacity .6s}
  body.intro #sig{opacity:0}
  body.intro header,body.intro #staffWrap,body.intro footer,
  body.gate  header,body.gate  #staffWrap,body.gate  footer{
    opacity:0;flex:0 0 0;height:0;min-height:0;
    margin:0;padding:0;border:0;overflow:hidden}
  body.intro #app,body.gate #app{padding:0}

  footer{flex:0 0 auto;text-align:center;font-size:7.5px;letter-spacing:.22em;
    color:rgba(244,234,214,.22);padding-top:1px;height:12px;line-height:11px}
  footer.solo{color:var(--gold);letter-spacing:.4em}

  /* ── Menü: feste Bildschirme, niemals Scrollen ── */
  #veil{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:20;
    overflow:hidden;
    background:
      radial-gradient(64% 46% at 50% 96%, rgba(240,180,90,.2), transparent 72%),
      radial-gradient(86% 58% at 50% 112%, rgba(122,38,31,.42), transparent 74%),
      radial-gradient(52% 40% at 50% 6%, rgba(196,28,46,.14), transparent 70%),
      linear-gradient(180deg,#17202a 0%, #21191a 44%, #352018 86%, #1d120e 100%);
    padding:max(10px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
            max(10px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  #veil::before{content:"";position:absolute;left:-4%;right:-4%;top:0;height:46px;
    pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 11px 15px, rgba(255,212,137,.95) 0 2.1px, transparent 3.4px),
      linear-gradient(rgba(36,26,18,.9),rgba(36,26,18,.9)) 0 14px/100% 1px no-repeat,
      radial-gradient(circle at 34px 33px, rgba(255,212,137,.55) 0 1.7px, transparent 2.8px),
      linear-gradient(rgba(36,26,18,.7),rgba(36,26,18,.7)) 0 32px/100% 1px no-repeat;
    background-size:44px 46px, 100% 1px, 44px 46px, 100% 1px;
    background-repeat:repeat-x, no-repeat, repeat-x, no-repeat}
  #veil.hidden{display:none}
  .inner{max-width:1120px;height:100%;margin:0 auto;display:flex;flex-direction:column;
         justify-content:center;overflow:visible;transform-origin:50% 50%}
  @media (max-height:400px){
    .nav{gap:5px} .nav button{padding:8px 12px;font-size:11px}
    .cards{gap:6px} .card{padding:8px 8px 6px}
    .steps li{margin-bottom:4px} .big{padding:8px;margin-top:6px}
    .mm .brand .status{margin-top:8px}
  }
  h1{font-size:clamp(34px,8.4vw,86px);font-weight:700;letter-spacing:-.035em;line-height:.84;
     margin:0 0 4px;transform:scaleX(.82);transform-origin:left;color:var(--ivory);
     text-shadow:0 0 30px rgba(196,28,46,.45),0 0 82px rgba(240,180,90,.22)}
  .sub{font-size:clamp(11px,2.4vw,17px);font-weight:700;letter-spacing:.3em;
       color:var(--wine-hot);margin:0}
  .tagline{font-family:var(--epic);font-style:italic;font-size:clamp(10px,1.8vw,14px);
    letter-spacing:.16em;color:rgba(201,162,74,.72);margin:6px 0 0}
  .rule{height:1px;background:linear-gradient(90deg,rgba(196,28,46,.6),rgba(244,234,214,.1),transparent);margin:10px 0}
  .eyebrow{font-size:9px;letter-spacing:.32em;color:rgba(244,234,214,.38);margin:0 0 6px}
  .shead{display:flex;align-items:baseline;gap:14px;flex:0 0 auto;margin-bottom:8px}
  .shead h2{margin:0;font-size:clamp(20px,4.4vw,34px);font-weight:700;letter-spacing:-.02em;
    transform:scaleX(.84);transform-origin:left;color:var(--ivory)}
  .shead .note{font-size:9px;letter-spacing:.26em;color:rgba(244,234,214,.34)}
  .back{margin-left:auto;background:none;border:1px solid rgba(244,234,214,.22);
    color:rgba(244,234,214,.6);font-family:var(--cond);font-size:9px;font-weight:700;
    letter-spacing:.24em;padding:6px 12px;cursor:pointer;border-radius:1px;flex:0 0 auto}
  .back:hover{border-color:var(--wine-hot);color:var(--wine-hot)}
  .back:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .mm{display:flex;gap:clamp(18px,5vw,54px);align-items:center;flex:1 1 auto;min-height:0}
  .mm .brand{flex:1 1 44%;min-width:0}
  .mm .brand .status{margin-top:14px;font-size:9.5px;letter-spacing:.24em;
    color:rgba(244,234,214,.36);line-height:2}
  .mm .brand .status b{color:var(--gold);font-weight:700}
  .nav{flex:1 1 56%;display:flex;flex-direction:column;gap:7px;min-width:0}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;
    background:linear-gradient(90deg,rgba(196,28,46,.16),rgba(240,180,90,.06));
    border:1px solid rgba(196,28,46,.55);
    color:var(--ivory);font-family:var(--cond);font-size:12px;font-weight:700;
    letter-spacing:.3em;padding:11px 14px;cursor:pointer;border-radius:1px;text-align:left}
  .nav button:hover{background:rgba(196,28,46,.22)}
  .nav button.quiet{background:rgba(240,180,90,.05);border-color:rgba(201,162,74,.3);
    color:rgba(244,234,214,.7)}
  .nav button.quiet:hover{border-color:var(--gold);color:var(--gold)}
  .nav button i{font-style:normal;font-size:9px;letter-spacing:.18em;
    color:rgba(244,234,214,.34);margin-left:auto;text-align:right}

  .cards{flex:1 1 auto;min-height:0;display:grid;gap:9px;
    grid-template-columns:repeat(2,1fr);align-content:center}
  @media (min-width:620px){ .cards{grid-template-columns:repeat(3,1fr)} }
  .cards.five{grid-template-columns:repeat(3,1fr)}
  @media (min-width:620px){ .cards.five{grid-template-columns:repeat(5,1fr)} }
  .card{display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;
    border:1px solid rgba(201,162,74,.22);min-width:0;
    background:linear-gradient(180deg,rgba(240,180,90,.07),rgba(122,38,31,.07))}
  .card .ct{font-family:var(--epic);font-size:14px;line-height:1.18;color:var(--ivory)}
  .card .ct.c{font-family:var(--cond);font-weight:700;letter-spacing:.06em}
  .card .cg{font-size:8.5px;letter-spacing:.2em;color:rgba(244,234,214,.34);line-height:1.7}
  .card .clyr{font-family:var(--epic);font-style:italic;font-size:11px;
    letter-spacing:.01em;color:rgba(240,180,90,.55);margin:5px 0 2px;
    line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .cg em{font-style:normal;color:var(--gold)}
  .card .crow{display:flex;gap:6px;margin-top:auto}
  .card .crow button{flex:1;background:rgba(196,28,46,.14);border:1px solid rgba(196,28,46,.6);
    color:var(--ivory);font-family:var(--cond);font-size:9.5px;font-weight:700;
    letter-spacing:.2em;padding:8px 2px;cursor:pointer;border-radius:1px}
  .card .crow button.d{flex:0 0 40px;background:none;border-color:rgba(240,180,90,.45);
    color:var(--gold);letter-spacing:0}
  .card .crow button:hover{background:rgba(196,28,46,.28)}
  .card .crow button.d:hover{background:rgba(240,180,90,.16)}
  .card[aria-disabled="true"]{opacity:.35}

  .cols{display:flex;gap:26px;align-items:flex-start;flex:1 1 auto;min-height:0}
  .cols>div{flex:1;min-width:0}
  .diag{display:block;width:100%;max-width:390px;margin:0 auto;height:auto}
  .diag .dl{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;
    fill:rgba(244,234,214,.85)}
  .diag .ds{font-family:var(--cond);font-size:9.5px;letter-spacing:.14em;
    fill:rgba(244,234,214,.4)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:st}
  .steps li{position:relative;padding-left:22px;margin-bottom:6px;font-size:11.5px;
    line-height:1.5;color:rgba(244,234,214,.62)}
  .steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;
    width:15px;height:15px;border:1px solid rgba(196,28,46,.7);border-radius:50%;
    font-size:8.5px;font-weight:700;color:var(--wine-hot);
    display:flex;align-items:center;justify-content:center}
  .steps b{color:var(--ivory);font-weight:700;letter-spacing:.06em}
  .howto{margin:0 0 4px;font-size:11.5px;line-height:1.55;color:rgba(244,234,214,.62)}
  .howto b{color:var(--ivory);font-weight:700;letter-spacing:.1em}
  .row{display:flex;gap:6px;margin-bottom:10px}
  .chip{flex:1;background:none;border:1px solid rgba(244,234,214,.14);color:rgba(244,234,214,.45);
    padding:7px 3px;cursor:pointer;font-family:var(--cond);font-size:8px;letter-spacing:.14em;border-radius:1px}
  .chip .cn{display:block;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    color:rgba(244,234,214,.85);margin-bottom:2px;transform:scaleX(.92)}
  .chip[aria-pressed="true"]{border-color:var(--wine-hot);background:rgba(196,28,46,.1);color:var(--wine-hot)}
  .chip[aria-pressed="true"] .cn{color:var(--ivory)}
  .chip[disabled]{opacity:.26;cursor:default}
  .big{display:block;width:100%;margin-top:8px;padding:10px;background:rgba(196,28,46,.12);
    border:1px solid var(--wine-hot);color:var(--ivory);font-family:var(--cond);
    font-size:10.5px;font-weight:700;letter-spacing:.3em;cursor:pointer;border-radius:1px}
  .big:hover{background:rgba(196,28,46,.24)}
  .big.q{background:none;border-color:rgba(244,234,214,.3);color:rgba(244,234,214,.66)}
  .mini{display:flex;gap:8px;margin-top:10px}
  .mini .big{margin-top:0}

  .meter{display:flex;align-items:center;gap:10px;margin:6px 0}
  .meter span{font-size:8.5px;letter-spacing:.26em;color:rgba(244,234,214,.42);width:72px}
  .meter i{flex:1;height:3px;background:rgba(244,234,214,.09)}
  .meter i b{display:block;height:3px;background:linear-gradient(90deg,var(--wine-hot),var(--gold))}
  .meter em{font-style:normal;font-size:15px;font-weight:700;width:42px;text-align:right;
    transform:scaleX(.86);display:inline-block;font-variant-numeric:tabular-nums}
  .tally{font-size:13px;line-height:1.85;color:rgba(244,234,214,.6);margin:0}
  .tally b{color:var(--ivory);font-weight:700;font-size:17px}
  .tally .hot{color:var(--gold)}

  .bulb{animation:twink 3.4s ease-in-out infinite}
  @keyframes twink{0%,100%{opacity:1}50%{opacity:.62}}

  #gate{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:50;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:
      radial-gradient(44% 40% at 50% 50%, rgba(7,6,10,.82), rgba(7,6,10,.5) 62%, rgba(7,6,10,.42)),
      linear-gradient(180deg, rgba(7,6,10,.72) 0%, rgba(7,6,10,.34) 26%,
                              rgba(7,6,10,.34) 74%, rgba(7,6,10,.78) 100%);
    animation:gatein .8s ease both}
  @keyframes gatein{from{opacity:0}to{opacity:1}}
  #gate.done{display:none}
  .gwrap{display:flex;flex-direction:column;align-items:center;gap:26px;
         padding:0 24px;text-align:center}
  .gtitle{font-size:clamp(24px,6.4vw,62px);font-weight:700;letter-spacing:.24em;
    line-height:1.05;color:var(--ivory);transform:scaleX(.9);
    text-shadow:0 0 34px rgba(196,28,46,.5),0 0 90px rgba(240,180,90,.26);
    animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
  .gring{position:relative;width:44px;height:44px}
  .gring i{position:absolute;inset:0;border:1.5px solid rgba(240,180,90,.85);
    border-radius:50%;animation:ping 2.6s ease-out infinite}
  .gring i:nth-child(2){animation-delay:1.3s}
  .gnote{font-size:clamp(9px,1.7vw,12px);letter-spacing:.16em;
    color:rgba(244,234,214,.42);max-width:26em;line-height:1.6}
  @keyframes ping{0%{transform:scale(.42);opacity:0}18%{opacity:.9}100%{transform:scale(1);opacity:0}}
  body.gate #sig{opacity:0}

  #rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:#07060a;text-align:center;gap:16px}
  #rotate.on{display:flex}
  #rotate p{font-size:11px;letter-spacing:.34em;color:rgba(244,234,214,.6);margin:0}
  #rotate .ph{width:54px;height:88px;border:2px solid var(--gold);border-radius:8px;
    animation:turn 2.4s ease-in-out infinite}
  @keyframes turn{0%,30%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#haze1,#haze2,#rotate .ph,.bulb,.gtitle{animation:none}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h2 class="wordmark">GUSLE</h2>
    <div class="readout">
      <span class="lab" id="modeLabel">SLOBODNO</span>
      <span id="mult">×2</span>
      <b id="scoreOut">0</b>
      <button class="ghost" id="backBtn">MENU</button>

/* ═══════════ Klang ═══════════
   Eine Gusle ist kein Oszillator. Der Ton entsteht daraus, dass das
   Rosshaar des Bogens an der Saite haftet und abrutscht, viele Male je
   Schwingung — daraus kommen das Kratzen beim Bogenwechsel, das
   Einschwingen nach dem Ansatz und das Heisere bei zu viel Druck oder zu
   wenig Tempo. Die Saite selbst ist ein Bündel Rosshaar, kein Draht: zwei
   Stränge, die nie ganz gleich gestimmt sind, geben ihr das Raue.

   Darum rechnet ein AudioWorklet die Saite als gestrichene Saite: zwei
   Verzögerungsleitungen (Sattelseite, Stegseite), dazwischen die
   Reibungskennlinie des Bogens. Bogengeschwindigkeit und Bogendruck kommen
   aus dem Daumen. Danach ein Fell auf einer Holzschale als gefaltete
   Antwort aus abklingenden Moden, dann der Raum.

   Browser ohne AudioWorklet bekommen den alten Oszillatorweg, durch
   dasselbe Fell geschickt. Er klingt flacher, aber er klingt.            */
const STRING_DSP = `
'use strict';
class Dline {
  constructor(n){ this.b=new Float32Array(n); this.n=n; this.w=0; }
  read(d){
    let p=this.w-d; while(p<0) p+=this.n;
    const i=p|0, f=p-i; let j=i+1; if(j>=this.n) j-=this.n;
    const b=this.b; return b[i]+(b[j]-b[i])*f;
  }
  write(v){ this.b[this.w]=v; if(++this.w>=this.n) this.w=0; }
  clear(){ this.b.fill(0); }
}
/* Ein Haarstrang der Saite. beta ist die Bogenstelle, gemessen vom Steg.  */
class Hair {
  constructor(sr){
    this.sr=sr; this.nut=new Dline(4096); this.br=new Dline(4096);
    this.D=sr/196; this.Dt=this.D; this.beta=.13;
    this.lp=0; this.a=.7; this.g=.97; this.dcx=0; this.dcy=0;
    this.kf=1/(sr*.016);
  }
  set(fc,loss,beta){
    this.a=Math.min(.95,Math.max(.05,Math.exp(-6.2831853*fc/this.sr)));
    this.g=loss; this.beta=beta;
  }
  tune(f){ this.Dt=Math.min(4000,Math.max(8,this.sr/Math.max(30,f)-1.4)); }
  hush(){ this.nut.clear(); this.br.clear(); this.lp=0; this.dcx=0; this.dcy=0; }
  step(bv,press,noise,damp){
    this.D+=(this.Dt-this.D)*this.kf;
    const Lb=Math.max(2,this.D*this.beta), Ln=Math.max(2,this.D-Lb);
    const bo=this.br.read(Lb), no=this.nut.read(Ln);
    this.lp=(1-this.a)*bo+this.a*this.lp;
    const brRef=-this.g*damp*this.lp;
    const nuRef=-no;
    const vs=brRef+nuRef;
    const dv=bv+noise-vs;
    /* Die Kennlinie des Bogens: nahe null Geschwindigkeitsunterschied
       haftet das Haar (1), weiter weg rutscht es (gegen 0).              */
    const slope=5-4*press;
    let x=Math.abs(dv*slope)+.75; x=x*x; x=1/(x*x); if(x>1) x=1;
    const nv=dv*x;
    this.br.write(nuRef+nv); this.nut.write(brRef+nv);
    const v=bo;
    const d=v-this.dcx+.995*this.dcy; this.dcx=v; this.dcy=d;
    return d;
  }
}
class Gusle extends AudioWorkletProcessor {
  constructor(){
    super();
    this.H=[new Hair(sampleRate),new Hair(sampleRate)];
    this.bv=0; this.bvT=0; this.pr=.6; this.prT=.6; this.on=0; this.f=196;
    this.bump=0; this.burst=0; this.n0=0; this.n1=0; this.og=2.6; this.hair=3.4;
    this.kb=1/(sampleRate*.007);
    this.db=Math.exp(-1/(sampleRate*.045));
    this.retune();
    this.port.onmessage=(ev)=>{
      const m=ev.data;
      if(m.t==="bow"){
        this.bvT=m.v; this.prT=m.p; this.on=m.on;
        if(m.f!==this.f){ this.f=m.f; this.retune(); }
      }else if(m.t==="stroke"){
        this.bump=Math.max(this.bump,.22*m.k);
        this.burst=Math.max(this.burst,.028*m.k);
      }else if(m.t==="setup"){
        this.og=m.og; this.hair=m.hair;
        for(let i=0;i<2;i++) this.H[i].set(m.fc*(i?1.05:1),m.loss,m.beta*(i?1.07:1));
        this.retune();
      }else if(m.t==="hush"){
        for(let i=0;i<2;i++) this.H[i].hush();
        this.bv=0; this.bvT=0; this.bump=0; this.burst=0;
      }
    };
  }

function ramHorn(cx,cy,turns,r0,b,dir){
  const out=[],inn=[],steps=90,tMax=turns*2*Math.PI;
  for(let i=0;i<=steps;i++){
    const t=tMax*i/steps, r=r0*Math.exp(b*t), w=r*.46, a=dir*t+2.4;
    out.push([cx+Math.cos(a)*(r+w/2),cy+Math.sin(a)*(r+w/2)]);
    inn.push([cx+Math.cos(a)*(r-w/2),cy+Math.sin(a)*(r-w/2)]);
  }
  let d="M"+out[0][0].toFixed(1)+" "+out[0][1].toFixed(1);
  for(let i=1;i<out.length;i++) d+=" L"+out[i][0].toFixed(1)+" "+out[i][1].toFixed(1);
  for(let i=inn.length-1;i>=0;i--) d+=" L"+inn[i][0].toFixed(1)+" "+inn[i][1].toFixed(1);
  return d+" Z";
}

/* Hände: Glieder aus einer Mittellinie mit veränderlicher Dicke.         */
const SKIN_DARK="#3a2118", SKIN_LIT="rgba(226,164,118,.28)";
function taperD(P,w0,w1){
  const n=P.length, A=[], B=[];
  let ltx=1, lty=0;
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)], b=P[Math.min(n-1,i+1)];
    let tx=b[0]-a[0], ty=b[1]-a[1];
    const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    if(i===n-1){ ltx=tx; lty=ty; }
    const u=n>1?i/(n-1):0;
    const w=(w0+(w1-w0)*u)*(1+.07*Math.sin(u*Math.PI*2.6));
    A.push([P[i][0]-ty*w/2, P[i][1]+tx*w/2]);
    B.push([P[i][0]+ty*w/2, P[i][1]-tx*w/2]);
  }
  const c=w1*.62;
  let d="M"+A[0][0].toFixed(1)+" "+A[0][1].toFixed(1);
  for(let i=1;i<n;i++) d+=" L"+A[i][0].toFixed(1)+" "+A[i][1].toFixed(1);
  d+=" C"+(A[n-1][0]+ltx*c).toFixed(1)+" "+(A[n-1][1]+lty*c).toFixed(1)+
     " "+(B[n-1][0]+ltx*c).toFixed(1)+" "+(B[n-1][1]+lty*c).toFixed(1)+
     " "+B[n-1][0].toFixed(1)+" "+B[n-1][1].toFixed(1);
  for(let i=n-2;i>=0;i--) d+=" L"+B[i][0].toFixed(1)+" "+B[i][1].toFixed(1);
  return d+" Z";
}
function digit(P,w0,w1,p){
  const d=taperD(P,w0,w1);
  el("path",{d:d,fill:"none",stroke:"#7d2f18","stroke-width":"3","stroke-linejoin":"round",opacity:".55"},p);
  el("path",{d:d,fill:SKIN_DARK,stroke:"#1a0d08","stroke-width":".8"},p);
  const hi=[]; for(let i=0;i<P.length;i++) hi.push([P[i][0],P[i][1]-w0*.22]);
  el("path",{d:taperD(hi,w0*.3,w1*.22),fill:SKIN_LIT},p);
}
function limb(d,w,p){
  el("path",{d:d,fill:"none",stroke:"#7d2f18","stroke-width":(w+4).toFixed(1),
    "stroke-linecap":"round","stroke-linejoin":"round",opacity:".5"},p);
  el("path",{d:d,fill:"none",stroke:SKIN_DARK,"stroke-width":w,
    "stroke-linecap":"round","stroke-linejoin":"round"},p);
  el("path",{d:d,fill:"none",stroke:SKIN_LIT,"stroke-width":(w*.32).toFixed(1),
    "stroke-linecap":"round",transform:"translate(0,"+(-w/2+2).toFixed(1)+")"},p);
}

/* ═══════════ Eingabe ═══════════
   Links der Hals: der Finger liegt auf der Saite und bestimmt die Höhe,
   stufenlos, gleiten erlaubt. Rechts das Fell: der Daumen zieht den
   Bogen quer über die Saite. Jeder Richtungswechsel ist ein Strich.      */
const instSvg=document.getElementById("inst");
const localG=document.getElementById("local");
const svgPt=instSvg.createSVGPoint();
function toLocal(cx,cy){
  const m=localG.getScreenCTM(); if(!m) return null;
  svgPt.x=cx; svgPt.y=cy;
  return svgPt.matrixTransform(m.inverse());
}
function zoneOf(p){
  if(!p) return null;
  if(p.x<NECK_END+8) return (p.y>-170&&p.y<190&&p.x>-130)?"neck":null;
  return (p.y>-300&&p.y<300&&p.x<1000)?"bow":null;
}
let fretPid=null, bowPid=null, lastBY=0, bowDownT=0, bowMoved=0;
const STROKE_COOL=45;

/* Ein Strich: Richtungswechsel oder Neuansatz des Bogens. Er wird sofort
   gewertet — die Note wartet nicht auf ihr Ende.                          */
function onStroke(dir,power){
  const t=performance.now();
  if(t-S.strokeT<STROKE_COOL) return;
  S.strokeT=t; S.strokeDir=dir; S.strokeP=Math.max(.3,Math.min(1.4,power||1));
  S.revs++;
  if(S.strokeDist<16&&S.revs>1) S.micro++;
  S.strokeDist=0;
  S.scratch=Math.min(1,.6+S.strokeP*.4);
  strokeSound(S.strokeP);
  S.bowAngVel+=dir*2.2*S.strokeP;
  if(S.strokeP>1.05) S.thumpVel-=(S.strokeP-1)*2.2;
  S.pulse=Math.min(1,Math.max(S.pulse,.35+S.strokeP*.3));
  if(S.mode==="song") judgeStroke(t-S.t0);
  else if(S.mode==="free") S.sparks.push({t:t,pos:S.playPos});
}
function bowMove(p){
  const dy=p.y-lastBY;
  if(dy*S.lastDy<0&&Math.abs(dy)>1.2){
    onStroke(dy>0?1:-1,Math.min(1.35,.6+S.speed*.7));
  }
  if(Math.abs(dy)>.4) S.lastDy=dy;
  S.moved+=Math.abs(dy); S.strokeDist+=Math.abs(dy); bowMoved+=Math.abs(dy);
  S.bowPos=Math.max(-92,Math.min(92,S.bowPos+dy));
  lastBY=p.y;
}
instSvg.addEventListener("pointerdown",function(e){
  if(S.paused){ goResume(); e.preventDefault(); e.stopPropagation(); return; }
  if(S.mode==="demo"){ endDemo(); e.preventDefault(); return; }
  begin();
  const p=toLocal(e.clientX,e.clientY), z=zoneOf(p);
  if(z==="bow"&&bowPid===null){
    bowPid=e.pointerId; lastBY=p.y; S.strokeDist=0; S.lifted=false;
    bowDownT=performance.now(); bowMoved=0; S.lastDy=0;
    try{ instSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }else if(z==="neck"&&fretPid===null){
    fretPid=e.pointerId; S.target=posFromX(p.x); S.holding=true;
    try{ instSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }
});
instSvg.addEventListener("pointermove",function(e){
  if(S.paused) return;

  if(e.pointerId===bowPid){
    /* Ein Handy meldet den Finger öfter, als es Bilder zeichnet, und fasst
       die Zwischenschritte zusammen — beim schnellen Wechsel ginge sonst
       jeder zweite Richtungswechsel verloren.                             */
    const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||null;
    if(list&&list.length>1){
      for(let i=0;i<list.length;i++){ const p=toLocal(list[i].clientX,list[i].clientY); if(p) bowMove(p); }
    }else{ const p=toLocal(e.clientX,e.clientY); if(p) bowMove(p); }

    const p=toLocal(e.clientX,e.clientY); if(p) S.target=posFromX(p.x);

});
function release(e){

}
instSvg.addEventListener("pointerup",release);

const held=[]; let spaceDown=false, spaceDir=1;

  if(gateOpen){ closeGate(); e.preventDefault(); return; }

  if(e.key==="ArrowUp"||e.key==="ArrowDown"){
    begin(); S.target=Math.max(0,Math.min(6,S.target+(e.key==="ArrowUp"?.14:-.14)));
    S.holding=S.target>.02; e.preventDefault(); return;

    begin(); const n=+e.key, i=held.indexOf(n);
    if(i>=0) held.splice(i,1);

  }
  if(e.key==="0"){ held.length=0; S.target=0; S.holding=false; }
  if(e.code==="Space"||e.key==="j"||e.key==="J"||e.key==="k"||e.key==="K"){
    begin(); spaceDown=true; S.lifted=false;
    const dir=(e.key==="k"||e.key==="K")?-1:(e.code==="Space"?-spaceDir:1);

let staffGrad=null, staffGradH=0;
function drawStaff(now){
  g2.fillStyle="#0d0b09"; g2.fillRect(0,0,W,H);
  g2.lineCap="round"; g2.lineJoin="round";
  if(!staffGrad||staffGradH!==H){
    staffGrad=g2.createLinearGradient(0,0,0,H);
    staffGrad.addColorStop(0,"rgba(10,9,8,0)");
    staffGrad.addColorStop(1,"rgb(122,38,31)");
    staffGradH=H;
  }
  g2.globalAlpha=Math.min(1,.12+S.energy*.2+S.solo*.18);
  g2.fillStyle=staffGrad; g2.fillRect(0,0,W,H);
  g2.globalAlpha=1;

  for(let p=0;p<=6;p++){
    const y=ny(p);
    g2.strokeStyle=(p===0)?"rgba(244,234,214,.3)":"rgba(244,234,214,"+(.09+S.energy*.05).toFixed(3)+")";
    g2.lineWidth=1;
    g2.beginPath(); g2.moveTo(HITX-26,y); g2.lineTo(W,y); g2.stroke();
  }

  if((S.mode==="song"||S.mode==="demo")&&S.song){
    const s=S.song;
    g2.font=FNT10; g2.textAlign="left";
    g2.fillStyle="rgba(244,234,214,.5)";
    g2.fillText(s.title.toUpperCase()+(S.lastVerse?("  ·  "+S.lastVerse+". VERS"):""),0,10);

    for(let i=S.notes.length-1;i>=0;i--){
      const n=S.notes[i], x=HITX+(n.t-now)*PXMS;
      if(x<-70||x>W+70) continue;
      const y=ny(n.pos), live=now>=n.t&&now<n.t+n.dur;
      if(n.syl===5){
        // Zäsur 4|6 des Deseterac
        g2.strokeStyle="rgba(196,28,46,.5)"; g2.lineWidth=1;
        g2.beginPath();
        g2.moveTo(x-19,ny(6)-8); g2.lineTo(x-19,ny(0)+6);
        g2.moveTo(x-14,ny(6)-8); g2.lineTo(x-14,ny(0)+6); g2.stroke();
        g2.fillStyle="rgba(196,28,46,.75)"; g2.textAlign="center";
        g2.font=FNT9; g2.fillText("4|6",x-16.5,ny(6)-11);
      }
      let col="rgba(250,241,222,.9)";
      if(n.grade===2) col="#f0b45a";
      else if(n.grade===1) col="rgba(244,234,214,.6)";
      else if(n.grade===0) col="rgba(212,58,42,.9)";
      // Haltebalken: so lang klingt die Silbe
      g2.strokeStyle=live?"rgba(244,234,214,.4)":"rgba(244,234,214,.13)";
      g2.lineWidth=live?3:2;
      g2.beginPath(); g2.moveTo(x,y); g2.lineTo(x+n.dur*PXMS*.84,y); g2.stroke();
      g2.shadowBlur=(n.grade===2||live)?14:0;
      g2.shadowColor=n.grade===2?"rgba(240,180,90,.95)":"rgba(244,234,214,.85)";
      g2.fillStyle=col; g2.strokeStyle=col;
      const r=6.2*(n.syl===1||n.syl===5?1.16:1);
      if(n.pos===0){ g2.lineWidth=2; g2.beginPath(); g2.arc(x,y,r,0,6.284); g2.stroke(); }
      else{ g2.beginPath(); g2.moveTo(x,y-r); g2.lineTo(x+r,y);
            g2.lineTo(x,y+r); g2.lineTo(x-r,y); g2.closePath(); g2.fill(); }
      g2.shadowBlur=0;
      if(n.text){
        g2.font=FNT9; g2.textAlign="center";
        g2.fillStyle=(n.grade===2)?"rgba(240,180,90,.9)":"rgba(244,234,214,.5)";
        g2.fillText(n.text, x, H-2.5);
      }
    }
  }

  // Trefferlinie
  g2.shadowBlur=10+S.solo*14; g2.shadowColor="rgba(208,90,58,.85)";
  g2.strokeStyle="rgba(208,90,58,"+(.65+S.solo*.3).toFixed(2)+")"; g2.lineWidth=2;
  g2.beginPath(); g2.moveTo(HITX+.5,2); g2.lineTo(HITX+.5,H-1); g2.stroke();
  g2.shadowBlur=0;

  // goldene Schweife der Striche
  const tNow=performance.now();
  for(let i=S.sparks.length-1;i>=0;i--){
    const sp=S.sparks[i], age=(tNow-sp.t)/700;
    if(age>=1){ S.sparks.splice(i,1); continue; }
    const x=HITX-(tNow-sp.t)*PXMS*.85, a=(1-age)*(1-age), y=ny(sp.pos);
    g2.strokeStyle="rgba(240,180,90,"+(a*.9).toFixed(3)+")";
    g2.lineWidth=3.2*a+.6;
    g2.shadowBlur=13*a; g2.shadowColor="rgba(255,214,120,.9)";
    g2.beginPath(); g2.moveTo(x,y); g2.lineTo(x+24*a+6,y); g2.stroke();
    g2.shadowBlur=0;
  }

  // Die Linie des eigenen Tons
  const passes=[[6,"rgba(196,28,46,.16)",0],[2.2,"rgba(240,180,90,.9)",8+S.solo*10]];
  for(let p=0;p<2;p++){
    g2.lineWidth=passes[p][0]+S.solo*1.2;
    g2.strokeStyle=passes[p][1];
    g2.shadowBlur=passes[p][2]; g2.shadowColor="rgba(240,180,90,.8)";
    g2.beginPath();
    let open=false;
    for(let i=1;i<S.trace.length;i++){
      const a=S.trace[i-1], b=S.trace[i];
      if(b.v<=.09){ open=false; continue; }
      const x1=HITX-(now-a.t)*PXMS, x2=HITX-(now-b.t)*PXMS;

      g2.lineTo(x2,ny(b.p));

    g2.stroke(); g2.shadowBlur=0;
  }

  const pyy=ny(S.playPos), v=Math.min(1,S.speed);
  g2.shadowBlur=v>.09?16:0; g2.shadowColor="rgba(255,240,200,.95)";
  g2.fillStyle=v>.09?"#fff":"rgba(244,234,214,.4)";
  g2.beginPath(); g2.moveTo(HITX-12,pyy-6.5); g2.lineTo(HITX-2,pyy);
  g2.lineTo(HITX-12,pyy+6.5); g2.closePath(); g2.fill(); g2.shadowBlur=0;

  if(S.mode==="song"&&LVL().show>1){
    const cur=S.curNote;
    if(cur){
      const d=S.playPos-cur.pos;
      if(Math.abs(d)>.16&&Math.abs(d)<2.4){
        g2.fillStyle="rgba(196,28,46,.9)"; g2.textAlign="left";
        g2.font=FNT12; g2.fillText(d>0?"▼":"▲",HITX-28,pyy+5);
      }
    }
  }
}

function buildSong(song){
  const out=[]; let t=1800;
  song.verses.forEach(function(v,vi){
    const p=v.p||v, sy=v.s?v.s.split(/[\s-]+/):null;
    for(let i=0;i<10;i++){
      if(i===4) t+=song.beat*.44;
      out.push({t:t,dur:song.beat*.9,pos:p[i],verse:vi+1,syl:i+1,
        text:sy?(sy[i]||""):"",ok:0,n:0,dev:0,close:0,stroked:0,grade:null,dt:0});
      t+=song.beat;
    }
    t+=song.beat*1.7;
  });
  return out;
}

/* Woran es lag: zu früh, zu spät, zu hoch, zu tief, oder kein Strich. Der
   Hinweis kommt nur nach BLIZU und PROMAŠAJ.                             */
function reason(dt,pd,noStroke){
  const parts=[];
  if(noStroke) parts.push("BEZ POTEZA");
  else if(Math.abs(dt)>=40) parts.push(dt<0?"RANO":"KASNO");
  if(Math.abs(pd)>LVL().tol*.6) parts.push(pd>0?"VISOKO":"NISKO");
  return parts.length?" · "+parts.join(" · "):"";
}
function applyGrade(n,grade,dt,pd,noStroke){
  const mult=S.solo>.5?2:1, tNow=performance.now(), lvl=LVL();
  n.grade=grade; n.dt=dt;
  S.total++;
  if(grade===2){
    S.score+=(100+S.combo*4)*mult; S.combo++; S.clean++; S.verseClean++;
    if(S.clean<=10) flash("ČISTO","#f0b45a");
    S.flash=1; S.rimFlash=1; S.sheenT=tNow;
    S.sparks.push({t:tNow,pos:n.pos});
    BEAMS.forEach(function(b){ b.snap=tNow; });
    vatraBump(.055+S.vibQ*.03);
  }else if(grade===1){
    S.score+=40*mult; S.near++;
    S.combo=Math.floor(S.combo*lvl.nearKeep);
    vatraBump(-.02);
    flash("BLIZU"+reason(dt,pd,noStroke),"rgba(244,234,214,.85)");
  }else{
    S.combo=0; S.miss++; flash("PROMAŠAJ"+reason(dt,pd,noStroke),"#d05a3a");
    S.dim=1; S.energy*=.35; vatraBump(-.18);
  }
  S.maxCombo=Math.max(S.maxCombo,S.combo);
  document.getElementById("scoreOut").textContent=S.score;

  while(S.nextCall<S.calls.length&&S.combo>=S.calls[S.nextCall][0]){
    const c=S.calls[S.nextCall];
    burst(c[1]); roar(Math.min(1,c[0]/24)); S.shake=Math.max(S.shake,.45);
    if(c[0]>=S.soloAt){
      if(S.soloEnd<tNow) S.soloStart=tNow;
      S.soloEnd=Math.max(S.soloEnd,tNow+SOLO_MS); flareSweep(); S.shake=Math.max(S.shake,.7);
    }
    S.nextCall++;
  }
  if(S.combo===0) S.nextCall=0;
  else while(S.nextCall>0&&S.combo<S.calls[S.nextCall-1][0]) S.nextCall--;
  if(n.syl===10){
    if(lvl.ref){
      const nx=S.notes[S.notes.indexOf(n)+1];
      if(nx) setTimeout(function(){ refTone(nx.pos); },240);
    }
    if(S.verseClean>=9){ roar(.8); flareSweep(); S.shake=Math.max(S.shake,.5); }
    S.verseClean=0;
  }
}
/* Ein Strich sucht sich die zeitlich nächste offene Note.                */
function judgeStroke(now){
  const lvl=LVL();
  let best=null, bd=1e9;
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.grade!==null) continue;
    if(n.t-now>lvl.nearMs+60) break;
    const d=Math.abs(now-n.t);
    if(d<bd&&d<=lvl.nearMs+40){ bd=d; best=n; }
  }
  S.sparks.push({t:performance.now(),pos:S.playPos});
  if(!best) return;
  best.stroked=1;
  const pd=S.playPos-best.pos, apd=Math.abs(pd), dt=now-best.t;
  let grade;
  if(bd<=lvl.cleanMs&&apd<=lvl.tol) grade=2;
  else if(bd<=lvl.nearMs&&apd<=lvl.tol*2) grade=1;
  else grade=0;
  applyGrade(best,grade,dt,pd,false);
}
function judgeFrame(now,tNow){
  const lvl=LVL(), sounding=S.speed>.09, grading=(S.mode==="song");
  while(S.head<S.notes.length&&S.notes[S.head].grade!==null) S.head++;
  let live=null;
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.t-now>lvl.nearMs+120) break;
    if(now>=n.t&&now<n.t+n.dur&&!live) live=n;
    if(n.grade!==null) continue;
    const pd=S.playPos-n.pos, apd=Math.abs(pd);
    const inWin=now>=n.t-lvl.cleanMs&&now<=n.t+lvl.nearMs;
    if(now>=n.t&&now<n.t+n.dur){ n.n++; n.dev+=apd; if(sounding&&apd<=lvl.tol) n.ok++; }
    if(!grading) continue;
    if(inWin&&sounding&&apd<=lvl.tol*2) n.close=1;
    // Leichte Stufe: ein klingender Ton im Fenster genügt, kein Strich nötig
    if(lvl.any&&inWin&&sounding&&apd<=lvl.tol){ applyGrade(n,2,now-n.t,pd,false); continue; }
    if(now>n.t+lvl.nearMs+45){
      if(n.close) applyGrade(n,1,lvl.nearMs,pd,!lvl.any);
      else applyGrade(n,0,lvl.nearMs+50,pd,!n.stroked&&!sounding);
    }
  }
  if(live){ S.bowFrames++; if(sounding) S.bowOn++; S.tonSum+=Math.max(0,1-Math.abs(S.playPos-live.pos)/1.5); S.tonN++; }
  else{ S.restFrames++; if(sounding) S.restBow++; }
  // Zielnote für Band und Marken
  let cur=null;
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i];
    if(n.t-now>420) break;
    if(n.grade===null&&now>=n.t-420&&now<n.t+n.dur){ cur=n; break; }
  }
  if(!cur&&live) cur=live;
  S.curNote=cur;
  const curKey=(cur?cur.pos:-1)*10+lvl.show+(cur&&cur.grade!==null?100:0);
  if(curKey!==judgeFrame._k){
    judgeFrame._k=curKey;
    if(band){
      if(cur&&lvl.show===2&&cur.grade===null){
        const x0=xFromPos(Math.max(0,cur.pos-lvl.tol)), x1=xFromPos(Math.min(6,cur.pos+lvl.tol));
        band.setAttribute("x",x0.toFixed(1));
        band.setAttribute("width",Math.max(8,x1-x0).toFixed(1));
        band.setAttribute("opacity","1");
      }else band.setAttribute("opacity","0");
    }
    for(let i=0;i<marks.length;i++){
      const on=cur&&lvl.show>0&&(i+1)===cur.pos;
      marks[i].pip.setAttribute("fill",on?"#f0b45a":"#8a7a5c");
      marks[i].pip.setAttribute("opacity",on?"1":".55");
      marks[i].tx.setAttribute("fill",on?"rgba(240,180,90,.95)":"rgba(244,234,214,.28)");
    }
  }
  if(cur&&cur.verse!==S.lastVerse) S.lastVerse=cur.verse;
  const last=S.notes[S.notes.length-1];
  if(last&&S.mode==="song"&&!S.finale&&last.grade!==null&&now>last.t+last.dur+120){
    S.finale=1;
    const q=S.total?(S.clean+S.near*.5)/S.total:0;
    if(q>=.6){
      S.finaleGood=1;
      S.energy=Math.max(S.energy,.6+q*.35); S.pulse=1;
      BEAMS.forEach(function(b){ b.snap=tNow; });
      flareSweep(); roar(.35+q*.6);
    }
  }
  if(last&&now>last.t+last.dur+(S.finaleGood?2500:1700)){ if(S.mode==="demo") endDemo(); else finish(); }
}

const IN_END=7400;
function ease(x){ return 1-Math.pow(1-x,3); }
function easeBack(x){ const c=2.0; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); }
function seg(e,a,b){ return Math.max(0,Math.min(1,(e-a)/(b-a))); }

/* Das Vorspiel: das Licht geht an, die Gusle wird aufgesetzt, ein langer
   Strich über die leere Saite, dann ein kurzer Aufstieg über die
   Griffstellen — der Titel schlägt auf dem hohen Ton ein.                 */
const INTRO_MEL=[[0,0,1],[900,2,-1],[1500,3,1],[2050,4,-1],[2500,5,1],[2900,4,-1],[3500,3,1]];
const MEL_T0=2650;
function driveIntro(t){
  const e=t-introT;
  if(e>=IN_END){ endIntro(); return false; }
  const snd=S.introSound;
  blackoutEl.style.opacity=(1-seg(e,150,900)*.92).toFixed(3);
  iSkip.style.opacity=(seg(e,900,1500)*(1-seg(e,5600,6200))).toFixed(3);
  S.energy=seg(e,600,2600)*.4+seg(e,MEL_T0,MEL_T0+3500)*.35+seg(e,4600,5600)*.25;

  const s1=ease(seg(e,400,1500)), s2=ease(seg(e,900,2000));
  BEAMS[0].el.style.transform="rotate("+(-58+46*s1).toFixed(2)+"deg)";
  BEAMS[0].el.style.opacity=(s1*.9).toFixed(3);
  BEAMS[1].el.style.transform="rotate("+(58-46*s2).toFixed(2)+"deg)";
  BEAMS[1].el.style.opacity=(s2*.9).toFixed(3);
  BEAMS[2].el.style.opacity=(seg(e,4200,4800)*.75).toFixed(3);
  BEAMS[2].el.style.transform="rotate("+(Math.sin(e*.004)*18).toFixed(2)+"deg)";

  const drop=seg(e,1700,2500);
  const dy=drop<1?(1-easeBack(drop))*-520:0;
  const dx=drop<1?(1-easeBack(drop))*-160:0;
  if(drop>=1&&!snd.thump){ snd.thump=1; thump(); S.shake=1; }
  const sh=reduce?0:(Math.random()-.5)*S.shake*7;
  camG.setAttribute("transform","translate("+(dx+sh).toFixed(2)+","+(dy+sh).toFixed(2)+")");

  // Die Striche, Ton für Ton — der Bogen läuft sichtbar, die Hand greift
  if(snd.mel===undefined) snd.mel=0;
  while(snd.mel<INTRO_MEL.length&&e>=MEL_T0+INTRO_MEL[snd.mel][0]){
    const n=INTRO_MEL[snd.mel];
    S.target=n[1]; S.holding=n[1]>0; S.lifted=false;
    snd.dir=n[2]; snd.strokeAt=e; snd.len=(snd.mel+1<INTRO_MEL.length)?(INTRO_MEL[snd.mel+1][0]-n[0]):900;
    onStroke(n[2],1);
    snd.mel++;
  }
  if(snd.strokeAt!==undefined){
    const u=Math.min(1,(e-snd.strokeAt)/snd.len);
    S.speed=Math.max(0,Math.sin(u*Math.PI)*.85+.05)*(e<MEL_T0+4500?1:Math.max(0,1-(e-MEL_T0-4500)/700));
    S.bowPos=snd.dir*(-70+140*u);
    if(e>MEL_T0+5200){ S.speed=0; S.lifted=true; S.holding=false; S.target=0; }
  }

  const ti=seg(e,4200,4750);
  iTitle.style.opacity=Math.min(1,ti*1.6).toFixed(3);
  iTitle.style.letterSpacing=(0.5-0.535*ease(ti)).toFixed(3)+"em";
  iTitle.style.transform="scaleX(.82) scale("+(1.2-.2*ease(ti)).toFixed(3)+")";
  if(ti>=1&&!snd.flare){ snd.flare=1; flareSweep(); roar(.8); S.shake=Math.max(S.shake,.6); }
  iCopy.style.opacity=(seg(e,5600,6100)).toFixed(3);
  const su=seg(e,4650,5100);
  iSubBox.style.height=(su*24).toFixed(1)+"px";
  iSub.style.transform="translateY("+((1-ease(su))*100).toFixed(1)+"%)";
  const tg=seg(e,5200,5800);
  iTag.style.opacity=tg.toFixed(3);
  iTag.style.transform="translateY("+((1-ease(tg))*8).toFixed(2)+"px)";

  if(e>4800&&e<5800){
    const cut=Math.floor(e/250);
    if(cut!==S.lastCut){
      S.lastCut=cut;
      BEAMS.forEach(function(b,i){
        b.el.style.transform="rotate("+((i-1)*24+((cut*41+i*17)%29)-14)+"deg)";
        b.el.style.opacity=((cut+i)%2?.35:1).toFixed(2);
      });
      S.pulse=1;
    }
  }
  const out=seg(e,6300,7400);
  if(out>0){
    iTitle.style.opacity=(1-out).toFixed(3);
    iSubBox.style.opacity=(1-out).toFixed(3);
    iCopy.style.opacity=(1-out).toFixed(3);
    iTag.style.opacity=(1-out).toFixed(3);
    BEAMS.forEach(function(b){ b.el.style.opacity=(.85*(1-out)+.2).toFixed(3); });
  }
  return true;
}

/* ═══════════ Vibrato ═══════════
   Der Hals ist stufenlos — also kann um den Zielton geschwungen werden.
   Gemessen werden Amplitude und Frequenz der Schwingung.                  */
function vibratoFrame(t,dt){
  if(S.speed<=.09||!S.holding){ S.vibHist.length=0; S.vibQ*=Math.pow(.94,dt/16.7); return; }
  S.vibHist.push({t:t,p:S.playPos});
  while(S.vibHist.length&&S.vibHist[0].t<t-420) S.vibHist.shift();
  const Hh=S.vibHist;
  if(Hh.length<10){ S.vibQ*=.98; return; }
  let mean=0; for(let i=0;i<Hh.length;i++) mean+=Hh[i].p; mean/=Hh.length;
  let amp=0, cross=0, prev=Hh[0].p-mean;
  for(let i=1;i<Hh.length;i++){
    const d=Hh[i].p-mean;
    amp+=Math.abs(d);
    if(prev<0&&d>=0) cross++;
    prev=d;
  }
  amp/=Hh.length;
  const span=(Hh[Hh.length-1].t-Hh[0].t)/1000;
  const rate=span>0?cross/span:0;
  const aQ=amp<.02?0:Math.max(0,1-Math.abs(amp-.09)/.1);
  const rQ=Math.max(0,1-Math.abs(rate-6)/4);
  const q=Math.min(1,aQ*rQ);
  S.vibQ+=(q-S.vibQ)*.12;
  if(amp>.30) S.vibQ*=.7;
}

/* ═══════════ VATRA ═══════════ */
function vatraFrame(dt){
  const f=dt/16.7;
  let d=-0.00010*f;
  if(S.speed>.09){
    const steady=1-Math.min(1,Math.abs(S.speed-S.lastSp)*9);
    d+=(0.00016+steady*0.00024)*f;
    d+=S.vibQ*0.00055*f;
  }
  S.vatra=Math.max(0,Math.min(1,S.vatra+d));
}
function vatraBump(x){ S.vatra=Math.max(0,Math.min(1,S.vatra+x)); }

/* ═══════════ Übungen ═══════════ */
function startDrill(i){
  begin(); resetRun();
  const D=DRILLS[i];
  S.mode="drill";
  S.drill={def:D, t0:performance.now(), ok:0, n:0, idx:0, hits:0, breaks:0,
           ref:null, hold:0, best:0, seqT:0, done:false, val:0};
  document.getElementById("modeLabel").textContent="VJEŽBA";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=D.hint.toUpperCase();
  if(band) band.setAttribute("opacity","0");
  setVeil(false); fit();
}
function drillFrame(t){
  const D=S.drill; if(!D||D.done) return;
  const e=t-D.t0, def=D.def, sounding=S.speed>.09;
  if(def.id==="ton"){
    if(!sounding){ D.ref=null; }
    else{
      if(D.ref===null) D.ref=Math.round(S.playPos);
      D.n++; if(Math.abs(S.playPos-D.ref)<=.10) D.ok++;
    }
    D.val=D.n?Math.round(D.ok/D.n*100):0;
  }else if(def.id==="kliz"){
    if(!D.seqT) D.seqT=t;
    const tgt=KLIZ_SEQ[D.idx%KLIZ_SEQ.length];
    D.target=tgt;
    if(sounding&&Math.abs(S.playPos-tgt)<=.20) D.hold+=16.7; else D.hold*=.8;
    if(D.hold>320){ D.hits++; D.idx++; D.hold=0; D.seqT=t; vatraBump(.05); flash("ČISTO","#f0b45a"); }
    else if(t-D.seqT>4200){ D.idx++; D.hold=0; D.seqT=t; flash("DALJE","rgba(244,234,214,.6)"); }
    D.val=D.hits;
    if(D.idx>=KLIZ_SEQ.length) D.done=true;
  }else if(def.id==="gud"){
    if(sounding){
      D.n++;
      const steady=1-Math.min(1,Math.abs(S.speed-S.lastSp)*9);
      D.ok+=steady;
      if(S.strokeDist<16&&S.scratch>.9) D.breaks++;
    }
    const raw=D.n?D.ok/D.n:0;
    D.val=Math.round(Math.max(0,raw-D.breaks*.02)*100);
  }else if(def.id==="dvije"){
    if(!D.seqT) D.seqT=t;
    const tgt=RUKE_SEQ[D.idx%RUKE_SEQ.length];
    D.target=tgt;
    if(!sounding) D.breaks++;
    if(sounding&&Math.abs(S.playPos-tgt)<=.22) D.hold+=16.7; else D.hold*=.85;
    if(D.hold>260){ D.hits++; D.idx++; D.hold=0; D.seqT=t; vatraBump(.05); }
    else if(t-D.seqT>2600){ D.idx++; D.hold=0; D.seqT=t; }
    D.val=D.hits;
    if(D.idx>=RUKE_SEQ.length) D.done=true;
  }else if(def.id==="dugi"){
    if(!sounding){ D.ref=null; D.hold=0; }
    else{
      if(D.ref===null){ D.ref=S.playPos; D.hold=0; }
      if(Math.abs(S.playPos-D.ref)<=.13) D.hold+=16.7;
      else { D.ref=S.playPos; D.hold=0; }
      if(D.hold>D.best) D.best=D.hold;
    }
    D.val=(D.best/1000).toFixed(1);
  }
  if(e>=def.dur) D.done=true;
  if(D.done) endDrill();
}
function endDrill(){
  const D=S.drill; S.mode="idle";
  hintEl.className="";
  S.speed=0; S.lifted=true; audioFrame();
  const key="drill:"+D.def.id;
  const prevB=DB.drill&&DB.drill[key]||0;
  const num=parseFloat(D.val)||0;
  if(!DB.drill) DB.drill={};
  const best=Math.max(prevB,num); DB.drill[key]=best; dbSave();
  S.lastDrill={def:D.def, val:D.val, best:best, isBest:num>prevB};
  showScreen("drillResult");
}
function drawDrill(t){
  const D=S.drill; if(!D) return;
  g2.fillStyle="#0d0b09"; g2.fillRect(0,0,W,H);
  const e=Math.min(1,(t-D.t0)/D.def.dur);
  g2.fillStyle="rgba(244,234,214,.1)"; g2.fillRect(0,0,W,2);
  g2.fillStyle="rgba(196,28,46,.8)"; g2.fillRect(0,0,W*e,2);
  for(let p=0;p<=6;p++){
    g2.strokeStyle="rgba(244,234,214,.07)"; g2.lineWidth=1;
    g2.beginPath(); g2.moveTo(60,ny(p)+.5); g2.lineTo(W-8,ny(p)+.5); g2.stroke();
  }
  if(D.target!==undefined&&D.def.id!=="gud"&&D.def.id!=="ton"&&D.def.id!=="dugi"){
    const y=ny(D.target);
    g2.shadowBlur=16; g2.shadowColor="rgba(240,180,90,.9)";
    g2.strokeStyle="#f0b45a"; g2.lineWidth=2.5;
    g2.beginPath(); g2.moveTo(60,y); g2.lineTo(W-8,y); g2.stroke(); g2.shadowBlur=0;
    g2.fillStyle="#f0b45a"; g2.font=FNT12; g2.textAlign="left";
    g2.fillText(ROMAN[D.target]||"0",44,y+4);
  }
  if(D.ref!==null&&D.ref!==undefined&&(D.def.id==="ton"||D.def.id==="dugi")){
    const y=ny(D.ref);
    g2.strokeStyle="rgba(240,180,90,.6)"; g2.lineWidth=1.6;
    g2.setLineDash([6,6]); g2.beginPath(); g2.moveTo(60,y); g2.lineTo(W-8,y); g2.stroke();
    g2.setLineDash([]);
  }
  const v=Math.min(1,S.speed), py2=ny(S.playPos);
  g2.shadowBlur=v>.09?15:0; g2.shadowColor="rgba(255,240,200,.95)";
  g2.fillStyle=v>.09?"#fff":"rgba(244,234,214,.28)";
  g2.beginPath(); g2.arc(70,py2,5.5,0,6.284); g2.fill(); g2.shadowBlur=0;
  g2.textAlign="right"; g2.fillStyle="#f4ead6"; g2.font='700 26px '+FAM;
  g2.fillText(D.val+D.def.unit,W,30);
  g2.font=FNT9; g2.fillStyle="rgba(244,234,214,.4)";
  g2.fillText(D.def.name,W,44);
}

/* ═══════════ Demo: die Gusle spielt selbst ═══════════ */
function demoDrive(now){
  if(!S.song) return;
  let cur=null, idx=-1;
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i];
    if(now>=n.t-150&&now<n.t+n.dur){ cur=n; idx=i; break; }
  }
  if(!cur){
    S.target*=.88; S.holding=S.target>.05;
    S.demoV*=.84;
    if(S.demoV<.05) S.lifted=true;
  }else{
    S.target=cur.pos+(Math.random()-.5)*.03;
    S.holding=cur.pos>.02; S.lifted=false;
    const u=Math.min(1,Math.max(0,(now-cur.t)/cur.dur));
    const dir=(idx%2)?1:-1;
    S.bowPos=dir*(-60+120*u);
    S.demoV=.34+.52*Math.sin(u*Math.PI);
    if(u<.07||u>.93) S.demoV*=.42;
    if(idx!==S.demoLast){ S.demoLast=idx; onStroke(dir,.9+Math.random()*.2); }
  }
  S.speed=Math.max(0,S.demoV);
}
function startDemo(i){
  begin(); resetRun();
  const s=SONGS[i];
  S.mode="demo"; S.song=s; S.notes=buildSong(s); S.t0=performance.now(); S.paused=false;
  S.demoLast=-1; S.demoV=0;
  document.getElementById("modeLabel").textContent="DEMO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=s.title.toUpperCase()+" — ZUHÖREN · TIPPEN BEENDET";
  document.getElementById("stopBtn").style.display="block";
  setVeil(false); fit();
}
function endDemo(){
  S.mode="idle"; S.soloEnd=0; S.speed=0; S.target=0; S.holding=false; S.lifted=true;
  multEl.style.opacity=0; hintEl.className="";
  document.getElementById("stopBtn").style.display="none";
  audioFrame();
  showMenu();
}
document.getElementById("stopBtn").onclick=function(){ if(S.mode==="demo") endDemo(); };

/* ═══════════ Schleife ═══════════ */
const fretHand=document.getElementById("fretHand"),
      camG=document.getElementById("cam"),
      scaleG=document.getElementById("scaleG"),
      vatraBar=document.querySelector("#vatra i"),
      multEl=document.getElementById("mult"),
      hintEl=document.getElementById("hint");
let prev=performance.now(), hintT=0, wasSolo=false;
let veilOpen=false;
const veil=document.getElementById("veil"), inner=document.getElementById("veilInner");
function setVeil(on){
  veilOpen=on;
  if(on){ veil.classList.remove("hidden"); requestAnimationFrame(fitVeil); }
  else veil.classList.add("hidden");
}
/* Kein Scrollen: passt ein Bildschirm nicht in die Höhe, wird sein Inhalt
   gleichmäßig verkleinert.                                               */
function fitVeil(){
  if(!veilOpen||!inner) return;
  inner.style.transform="";
  const need=inner.scrollHeight, have=inner.clientHeight;
  if(need>have+2){
    const k=Math.max(.55,have/need);
    inner.style.transform="scale("+k.toFixed(3)+")";
  }
}
/* Das Spiel läuft mit voller Bildrate, die Dekoration in einem eigenen,
   langsameren Takt.                                                      */
let decoT=0, decoF=2, staffT=0;
let frameSum=0, frameN=0, gfxHold=0, spikeN=0, hotWins=0, coolWins=0;
function measure(dt){
  frameSum+=dt; frameN++;
  if(dt>34) spikeN++;
  if(frameN<48) return;
  const avg=frameSum/frameN, spikes=spikeN;
  GFX.avgMs=Math.round(avg*10)/10; GFX.spikes=spikes;
  frameSum=0; frameN=0; spikeN=0;
  if(GFX.mode!=="auto") return;
  if(gfxHold>0){ gfxHold--; return; }
  if(!GFX.low){
    if(avg>21||spikes>=4){ GFX.low=true; applyGfx(); gfxHold=6; hotWins=0; }
    else if(avg>17.5){ if(++hotWins>=2){ GFX.low=true; applyGfx(); gfxHold=6; hotWins=0; } }
    else hotWins=0;
  }else{
    if(avg<12.5&&spikes===0){
      if(++coolWins>=6){ GFX.low=false; applyGfx(); gfxHold=10; coolWins=0; }
    }else coolWins=0;
  }
}
let rafId=0;
function schedule(){
  if(rafId||hidden) return;
  rafId=requestAnimationFrame(function(t){ rafId=0; loop(t); });
}
function loop(t){
  if(hidden) return;
  const dt=Math.min(60,t-prev); prev=t;
  const f=dt/16.7;
  const songNow=(S.mode==="song"||S.mode==="demo")?t-S.t0:0;
  if(gateOpen||(!introT&&veilOpen)){ schedule(); return; }
  measure(dt);
  const deco=(t-decoT)>=GFX.decoMs;
  if(deco){ decoF=Math.min(4.5,(t-decoT)/16.7); decoT=t; }

  /* ── Bogen und Griff ── */
  if(!S.paused&&S.mode==="demo"){
    demoDrive(songNow);
    S.playPos+=(S.target-S.playPos)*Math.min(1,dt/22);
    S.visPos +=(S.target-S.visPos )*Math.min(1,dt/48);
  }else if(!S.paused&&!introT){
    let tgt=S.moved/Math.max(8,dt)*.4;
    if(spaceDown) tgt=Math.max(tgt,.7);
    if(S.tapPulse>.02){ tgt=Math.max(tgt,S.tapPulse*.8); S.tapPulse*=Math.pow(.84,f); } else S.tapPulse=0;
    S.moved=0;
    if(bowPid===null&&!spaceDown&&S.tapPulse<.02) tgt=0;
    // schnell hoch, zügig runter: der Ton hängt nicht am Finger nach
    S.speed+=(tgt-S.speed)*(tgt>S.speed?.6:.32);
    if(S.speed<.002) S.speed=0;
    S.playPos+=(S.target-S.playPos)*Math.min(1,dt/14);
    S.visPos +=(S.target-S.visPos )*Math.min(1,dt/40);
  }
  if(!introT){
    S.scratch*=Math.pow(.86,f);
    if(S.speed>.09){ S.spN++; S.spSum+=S.speed; S.spDev+=Math.abs(S.speed-S.lastSp); }
    S.lastSp=S.speed;
    // Bogen neu angesetzt: das zählt als Strich
    if(S.speed>.09&&!S.sounding){ S.sounding=true; if(S.mode!=="demo") onStroke(S.lastDy>=0?1:-1,.8); }
    else if(S.speed<=.06&&S.sounding) S.sounding=false;
  }
  vibratoFrame(t,dt);
  if(S.mode!=="idle") vatraFrame(dt);
  audioFrame();
  const v=Math.min(1,S.speed);

  /* ── Dramaturgie ── */
  const soloOn=t<S.soloEnd&&S.mode!=="idle";
  if(S.vatra>=1&&S.mode!=="idle"&&t>S.soloEnd){
    S.soloStart=t; S.soloEnd=t+SOLO_MS; burst("GUSLAR!"); roar(1); flareSweep(); S.vatra=.55;
  }
  let env=0, su=0;
  if(soloOn&&S.soloStart){
    su=Math.min(1,Math.max(0,(t-S.soloStart)/Math.max(1,S.soloEnd-S.soloStart)));
    const rise=Math.min(1,su/.26), fall=Math.min(1,(1-su)/.2);
    env=Math.pow(rise,.7)*(.42+.58*Math.pow(fall,.9));
  }else if(soloOn) env=1;
  S.solo+=(env-S.solo)*(env>S.solo?.1:.05)*f;
  if(S.solo<.004&&!soloOn) S.solo=0;
  S.pulse*=Math.pow(.9,f);
  let drive=Math.max(v*.45, S.vatra, S.solo);
  if(S.mode==="song") drive=Math.max(drive,Math.min(1,S.combo/10));
  if(S.drill) drive=Math.min(drive,.4);
  S.energy+=(drive-S.energy)*(drive>S.energy?.12:.03)*f;
  S.dim*=Math.pow(.9,f); S.flash*=Math.pow(.88,f); S.rimFlash*=Math.pow(.9,f);
  S.shake*=Math.pow(.86,f);
  if(soloOn!==wasSolo){
    wasSolo=soloOn;
    multEl.style.opacity=soloOn?1:0;
    hintEl.textContent=soloOn?"SOLO":(S.drill?S.drill.def.hint.toUpperCase():
      (S.mode==="song"?"TON UND STRICH ZUGLEICH":"HALS GREIFEN · FELL STREICHEN"));
    hintEl.className=soloOn?"solo":"";
    if(soloOn) roar(1);
  }
  if(soloOn){
    if(S.soloEnd-t<2000) multEl.style.opacity=(.35+.65*Math.abs(Math.sin(t*.009))).toFixed(2);
    else multEl.style.opacity=1;
  }

  /* ── Physik: ruhige Kamera, nur Thump und Zoom ── */
  S.thumpVel+=(-S.thump*.09-S.thumpVel*.16)*f; S.thump+=S.thumpVel*f;
  const bowTarget=-(S.strokeDir>0?1:-1)*v*6*(1+S.solo*.8);
  S.bowAngVel+=((bowTarget-S.bowAng)*.14-S.bowAngVel*.24)*f;
  S.bowAng+=S.bowAngVel*f;
  const bowLim=9+S.solo*8;
  S.bowAng=Math.max(-bowLim,Math.min(bowLim,S.bowAng));
  S.zoomVel+=((S.solo-S.zoom)*.085-S.zoomVel*.115)*f;
  S.zoom+=S.zoomVel*f;
  if(Math.abs(S.thump)<.004&&Math.abs(S.thumpVel)<.004){ S.thump=0; S.thumpVel=0; }
  if(!S.solo&&Math.abs(S.zoom)<.002&&Math.abs(S.zoomVel)<.002){ S.zoom=0; S.zoomVel=0; }
  const shk=(reduce||GFX.thrift||S.shake<.12)?0:(Math.random()-.5)*S.shake*4;
  const sx=shk+S.thump*.6, sy=shk-S.zoom*22+S.thump;
  const rot=reduce?0:S.zoom*1.2;
  const sc=1+S.zoom*.16+S.flash*.01;
  if(!introT) sattr(camG,"transform","translate("+sx.toFixed(1)+","+sy.toFixed(1)+")");
  sattr(scaleG,"transform","translate(500,240) scale("+sc.toFixed(3)+") rotate("+rot.toFixed(2)+") translate(-500,-240)");

  /* ── Saite, Hände, Bogen ── */
  const cut=S.visPos>.05?xFromPos(S.visPos):0;
  const wob=reduce?0:Math.round(Math.sin(t*.075)*v*90*(1+S.solo*.4)*(1-S.visPos*.05))/10;
  const cq=Math.round(cut);
  if(wob!==updateString._w||cq!==updateString._f){ updateString._w=wob; updateString._f=cq; updateString(wob,cq); }
  sattr(strPath,"stroke",(v>.6||S.solo>.4)?"#ffe9a8":"#f4ead6");
  const glowOn=GFX.blur&&(v>.12||S.flash>.05);
  if(glowOn){
    if(strGlow.style.display==="none") strGlow.style.display="";
    sattr(strGlow,"opacity",(v*.6+S.flash*.35).toFixed(2));
  }else if(strGlow.style.display!=="none"){ strGlow.style.display="none"; }

  if(bowPid===null&&S.mode!=="demo"&&!introT) S.bowPos*=Math.pow(.9,f);
  if(bowStick){
    const bend=v*6+S.scratch*4;
    sattr(bowStick,"d","M"+(BOWX-8)+" -168 Q"+(BOWX-44-bend).toFixed(1)+" -20 "+(BOWX-8)+" 132");
  }
  if(bowG) sattr(bowG,"transform","translate("+(v*1.5).toFixed(1)+","+S.bowPos.toFixed(1)+") rotate("+S.bowAng.toFixed(1)+" "+BOWX+" 0)");
  sattr(fretHand,"transform","translate("+xFromPos(S.visPos).toFixed(1)+",0)");
  sattr(fretHand,"opacity",S.holding?"1":(S.visPos>.05?".5":"0"));

  /* ── Instrumentlicht ── */
  if(rimFlashEl){
    if(S.rimFlash>.012){
      if(rimFlashEl.style.display==="none") rimFlashEl.style.display="";
      rimFlashEl.setAttribute("opacity",(S.rimFlash*.85).toFixed(3));
    }else if(rimFlashEl.style.display!=="none"){ rimFlashEl.style.display="none"; rimFlashEl.setAttribute("opacity","0"); }
  }
  if(sheenEl&&S.sheenT){
    const e=(t-S.sheenT)/620;
    if(e>=1){ S.sheenT=0; sheenEl.setAttribute("opacity","0"); }
    else{
      sheenEl.setAttribute("opacity",(Math.sin(e*Math.PI)*.75).toFixed(3));
      sheenEl.setAttribute("transform","translate("+((e-.5)*420).toFixed(1)+",0)");
    }
  }

  /* ── Lichterkette, Feuer, Sijelo ── */
  if(deco){
    const lvlNow=Math.max(S.energy,v*.5);
    for(let r=0;r<bulbRows.length;r++){
      let on=.24+lvlNow*.62+S.pulse*.3;
      if(S.solo>.62) on*=((Math.floor(t/170)+r)%2)?1.25:.4;
      sattr(bulbRows[r],"opacity",Math.min(1,on).toFixed(2));
      sattr(haloRows[r],"opacity",Math.min(.9,on*.55).toFixed(2));
    }
    if(fireEl) sattr(fireEl,"opacity",(.3+S.energy*.3+Math.sin(t*.011)*.05+S.pulse*.15).toFixed(2));
    const act=.3+S.energy*1.1+S.solo*.7+S.pulse*.4;
    for(let i=0;i<listeners.length;i++){
      const li=listeners[i], s=Math.sin(t*li.rate*(1+S.energy*1.4)+li.ph);
      sattr(li.bob,"transform","translate("+(s*1.2*act).toFixed(1)+","+(s*li.amp*act*.5).toFixed(1)+")");
    }
  }

  /* ── Scheinwerfer ── */
  const speedK=.9+S.energy*2.2+S.solo*2;
  if(S.solo>.62&&!introT){
    const bt=S.song?S.song.beat:440;
    const cutN=Math.floor((t-(S.song?S.t0:0))/(bt*.5));
    if(cutN!==S.lastCut){
      S.lastCut=cutN; S.cutFlip=cutN%2;
      BEAMS.forEach(function(b,i){ b.cut=(i-1)*20+((cutN*37+i*53)%27)-13; b.snap=0; });
      S.pulse=Math.min(1,S.pulse+.4);
    }
  }else if(!introT) S.lastCut=-1;
  if(!introT&&deco) BEAMS.forEach(function(b,i){
    let want=b.base+Math.sin(t*b.rate*speedK+b.ph)*b.amp*(.8+S.energy*1.1+S.solo*.9);
    if(S.solo>.62&&b.cut!==undefined) want=b.cut;
    if(b.snap&&t-b.snap<320) want=b.aimAt;
    const ez=(b.snap&&t-b.snap<320)?.24:(S.solo>.62?.34:.06);
    b.cur+=(want-b.cur)*ez*decoF;
    let on=(i===2?(S.energy*.6+S.solo*.85):(.19+S.energy*.66+S.solo*.62))+S.pulse*.2;
    if(S.solo>.62) on*=(i===2?(S.cutFlip?1.2:.35):(S.cutFlip?.45:1.15));
    sstyle(b.el,"transform","rotate("+b.cur.toFixed(1)+"deg)");
    sstyle(b.el,"opacity",Math.min(1,on).toFixed(2));
  });
  if(deco){
    sstyle(warmEl,"opacity",(.28+S.energy*.62+S.solo*.55+S.pulse*.16).toFixed(2));
    if(!GFX.thrift){
      sstyle(haze1,"opacity",(.05+S.energy*.17+S.solo*.13).toFixed(2));
      sstyle(haze2,"opacity",(.03+S.energy*.13+S.solo*.11).toFixed(2));
    }
  }
  sstyle(blackoutEl,"opacity",(S.dim*.3+S.solo*.1).toFixed(2));

  /* ── Spiegelbilder ── */
  if(ghostL&&GFX.ghosts){
    if(S.solo>.02){
      ghostsG.style.display="block";
      const sp=1.12+S.solo*.34, sway=Math.sin(t*.0016)*54*S.solo;
      const gx=INST_CX, gy=INST_CY;
      ghostL.setAttribute("transform","translate("+(gx-sway)+","+gy+") scale("+(-sp).toFixed(3)+","+sp.toFixed(3)+") translate(-"+gx+",-"+gy+")");
      ghostR.setAttribute("transform","translate("+(gx+sway)+","+gy+") scale("+sp.toFixed(3)+","+sp.toFixed(3)+") translate(-"+gx+",-"+gy+")");
      ghostsG.setAttribute("opacity",(S.solo*(.16+Math.sin(t*.003)*.07)).toFixed(3));
    }else if(ghostsG.style.display!=="none"){ ghostsG.style.display="none"; ghostsG.setAttribute("opacity","0"); }
  }

  sstyle(vatraBar,"width",(S.vatra*100).toFixed(1)+"%");
  publikaFrame(t);
  if(S.callT){
    const ce=(t-S.callT)/3400;
    if(ce>=1){ S.callT=0; callEl.style.opacity=0; }
    else callEl.style.opacity=(Math.min(1,ce*6)*(1-Math.max(0,(ce-.7)/.3))).toFixed(3);
  }
  if(zoneHint){
    const e=hintT?(t-hintT)/4200:1;
    sattr(zoneHint,"opacity",e>=1?"0":(Math.min(1,(1-e)*2.6)*.7).toFixed(2));
  }
  if(burstT){
    const e=(t-burstT)/900;
    if(e>=1){ burstT=0; burstEl.style.opacity=0; }
    else{
      burstEl.style.opacity=(Math.sin(Math.min(1,e*3)*Math.PI*.5)*(1-e)*1.25).toFixed(3);
      burstEl.style.transform="scaleX(.8) scale("+(1+e*.16).toFixed(3)+")";
    }
  }
  if(flareT){
    const e=(t-flareT)/620;
    if(e>=1){ flareT=0; flareEl.style.opacity=0; }
    else{
      flareEl.style.opacity=(Math.sin(e*Math.PI)*.75).toFixed(3);
      flareEl.style.transform="translateX("+((e-.5)*70).toFixed(1)+"%)";
    }
  }

  if(introT&&driveIntro(t)){ schedule(); return; }

  const staffDue=(t-staffT)>=GFX.staffMs;
  if(S.mode==="drill"){
    drillFrame(t); if(staffDue){ staffT=t; drawDrill(t); }
  }else if((S.mode==="song"||S.mode==="demo")&&!S.paused){
    judgeFrame(songNow,t);
    S.trace.push({t:songNow,p:S.playPos,v:v});
    while(S.trace.length&&S.trace[0].t<songNow-2800) S.trace.shift();
    if(staffDue){ staffT=t; drawStaff(songNow); }
  }else if(S.mode==="free"){
    S.trace.push({t:t,p:S.playPos,v:v});
    while(S.trace.length&&S.trace[0].t<t-6000) S.trace.shift();
    if(staffDue){ staffT=t; drawStaff(t); }
  }else if(S.mode==="song"&&S.paused&&staffDue){ staffT=t; drawStaff(S.pauseAt-S.t0); }
  schedule();
}

}

function scrHowto(){
  inner.innerHTML=shead("KAKO SE SVIRA","SO WIRD GESPIELT")+
    '<div class="cols"><div>'+howtoSvg()+
    '<p class="howto"><b>WERTUNG</b> — <span style="color:var(--gold)">ČISTO</span> getroffen, '+
    'BLIZU knapp, <span style="color:var(--wine-hot)">PROMAŠAJ</span> daneben. Steht dahinter '+
    'RANO, KASNO, VISOKO, NISKO oder BEZ POTEZA, weiß man, woran es lag.</p>'+
    '<p class="howto" style="color:rgba(244,234,214,.4)">Zehn Silben je Vers mit Zäsur nach der '+
    'vierten — das <b style="color:rgba(244,234,214,.55)">4|6</b> in der Notenbahn.</p></div><div>'+
    '<ol class="steps">'+
    '<li><b>Finger auf den Hals</b> — halten und gleiten. Kein Griffbrett, die Tonhöhe '+
    'folgt stufenlos. Loslassen heißt leere Saite.</li>'+
    '<li><b>Daumen übers Fell</b> — quer zur Saite hin und her. Jeder Richtungswechsel ist ein '+
    'Strich, Stillstand heißt Stille. Ein Tipp aufs Fell ist ein kurzer Strich.</li>'+
    '<li><b>Beides zugleich</b> — eine Hand allein klingt nicht.</li>'+
    '<li><b>Im Lied</b> läuft eine Raute auf die rote Linie zu: ihren Ton greifen und im '+
    'selben Moment den Bogen wenden. Die Silbe steht darunter. Ein offener Ring heißt: '+
    'Finger weg, leere Saite.</li>'+
    '<li><b>VATRA</b> ist der Balken unter der Notenbahn. Er steigt durch reine Töne, ruhigen '+
    'Bogen und Vibrato und fällt durch hektische Wechsel und Fehler. Bei voll gehört die Bühne dir.</li>'+
    '<li><b>Vibrato</b> — beim gehaltenen Ton leicht um die Zielstelle schwingen, etwa sechsmal '+
    'je Sekunde und ganz schmal. Zittern zählt nicht.</li>'+
    '</ol></div></div>';

}
function chips(el,items,cur,fn){
  items.forEach(function(it,i){
    const b=document.createElement("button");
    b.className="chip"; b.setAttribute("aria-pressed",i===cur);
    if(it.locked) b.disabled=true;
    b.innerHTML='<span class="cn">'+it.name+'</span>'+it.sub;
    b.onclick=function(){ fn(i); };
    el.appendChild(b);
  });
}
function scrSetup(){
  inner.innerHTML=shead("POSTAVKE","STUFE · INSTRUMENT · GRAFIK")+
    '<div class="cols"><div>'+
    '<p class="eyebrow">SCHWIERIGKEIT</p><div class="row" id="lvlRow"></div>'+
    '<p class="eyebrow">INSTRUMENT</p><div class="row" id="instRow"></div>'+
    '</div><div>'+
    '<p class="eyebrow">GRAFIK</p><div class="row" id="gfxRow"></div>'+
    '<p class="howto" style="font-size:10.5px;color:rgba(244,234,214,.4)">AUTO schaltet Effekte ab, '+
    'sobald die Bildrate fällt. Eingabe, Ton und Wertung bleiben immer unberührt.'+
    (GFX.avgMs?(' Gemessen: '+GFX.avgMs+' ms je Bild.'):'')+'</p>'+
    '<div class="mini"><button class="big q" id="introBtn">INTRO</button>'+
    '<button class="big q" id="soloBtn">SOLO ANSEHEN</button></div>'+
    '</div></div>';
  wireBack("main");
  chips(inner.querySelector("#lvlRow"),LEVELS.map(function(L){ return {name:L.name,sub:L.gloss+' · solo '+L.soloAt}; }),
    S.level,function(i){ S.level=i; DB.level=i; dbSave(); fit(); scrSetup(); });
  chips(inner.querySelector("#instRow"),INSTRUMENTS.map(function(I){
      const locked=DB.totalScore<I.need; return {name:I.name,sub:locked?("ab "+I.need):I.legend,locked:locked}; }),
    S.inst,function(i){ S.inst=i; DB.inst=i; dbSave(); rebuild(); applyInstrument(); scrSetup(); });
  chips(inner.querySelector("#gfxRow"),[{name:"AUTO",sub:"passt sich an"},{name:"VOLL",sub:"alle Effekte"},{name:"SPARSAM",sub:"flüssig"}],
    ["auto","full","lite"].indexOf(GFX.mode),function(i){ setGfx(["auto","full","lite"][i]); scrSetup(); });
  inner.querySelector("#introBtn").onclick=function(){ begin(); setVeil(false); startIntro(); };
  inner.querySelector("#soloBtn").onclick=function(){
    startFree(); S.combo=12; S.energy=1; S.vatra=.9;
    S.soloStart=performance.now(); S.soloEnd=performance.now()+14000;
    burst("GUSLAR!"); roar(1); flareSweep();
  };
}
function scrDrillResult(){
  const R=S.lastDrill;
  inner.innerHTML=shead(R.def.name,R.def.gloss.toUpperCase())+
    '<div class="cols"><div><p class="tally">ERGEBNIS <b>'+R.val+R.def.unit+'</b>'+
    (R.isBest?' <span class="hot">· NOVO NAJBOLJE</span>':'')+
    '<br>BESTWERT <b>'+R.best+R.def.unit+'</b></p>'+

  inner.querySelector("#otherBtn").onclick=function(){ showScreen("drills"); };

let lastResult=null;
function scrResult(){
  const R=lastResult; if(!R){ scrMain(); return; }
  let h=shead("GOTOVO",R.song.title.toUpperCase())+'<div class="cols"><div>'+
    '<p class="tally">PUNKTE <b>'+R.score+'</b>'+(R.isBest?' <span class="hot">· NOVO NAJBOLJE</span>':'')+
    '<br>ČISTO <b>'+R.clean+'</b> · BLIZU <b>'+R.near+'</b> · PROMAŠAJ <b>'+R.miss+'</b>'+
    '<br>NIZ <b>'+R.maxCombo+'</b> · UKUPNO <b>'+DB.totalScore+'</b>'+
    (R.perfect?'<br><span class="hot">SAVRŠENO — KEIN FEHLER</span>':'')+'</p></div><div>';
  [["TON",R.ton],["GUDALO",R.gudalo],["RITAM",R.ritam]].forEach(function(m){
    h+='<div class="meter"><span>'+m[0]+'</span><i><b style="width:'+pct(m[1])+'%"></b></i><em>'+pct(m[1])+'</em></div>';
  });
  h+='<div class="mini"><button class="big" id="againBtn">NOCH EINMAL</button>'+
     '<button class="big q" id="otherBtn">ANDERES LIED</button></div></div></div>';
  inner.innerHTML=h;
  wireBack("main");
  inner.querySelector("#againBtn").onclick=function(){ startSong(SONGS.indexOf(R.song)); };
  inner.querySelector("#otherBtn").onclick=function(){ showScreen("songs"); };
}

/* ═══════════ Runden ═══════════ */
function resetRun(){
  hintT=performance.now();
  S.score=0; S.combo=0; S.maxCombo=0; S.clean=0; S.near=0; S.miss=0; S.total=0;
  S.tonSum=0; S.tonN=0; S.bowOn=0; S.bowFrames=0; S.restBow=0; S.restFrames=0;
  S.spSum=0; S.spDev=0; S.spN=0; S.revs=0; S.micro=0; S.verseClean=0;
  S.nextCall=0; S.trace=[]; S.sparks=[]; S.head=0; S.curNote=null; S.lastVerse=0;
  S.soloAt=LVL().soloAt; S.calls=makeCalls(S.soloAt);
  S.energy=0; S.solo=0; S.soloStart=0; S.soloEnd=0; S.dim=0; wasSolo=false;
  S.thump=0; S.thumpVel=0; S.bowAng=0; S.bowAngVel=0; S.bowPos=0;
  S.sheenT=0; S.rimFlash=0; S.flash=0; S.shake=0; S.pulse=0; S.vatra=0; S.vibQ=0;
  S.zoom=0; S.zoomVel=0; S.lastCut=-1; S.cutFlip=0; S.finale=0; S.finaleGood=0;
  S.drill=null; S.paused=false; S.callT=0; S.callNext=0;
  BEAMS.forEach(function(b){ b.snap=0; b.cur=b.base; });
  multEl.style.opacity=0; hintEl.className="";
  document.getElementById("stopBtn").style.display="none";
  judgeFrame._k=undefined;
  if(band) band.setAttribute("opacity","0");
}
function startFree(){
  begin(); resetRun();
  S.mode="free"; S.song=null; S.notes=[];
  document.getElementById("modeLabel").textContent="SLOBODNO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent="HALS GREIFEN · FELL STREICHEN";
  setVeil(false); fit();
}
function startSong(i){
  begin(); resetRun();
  const s=SONGS[i];
  S.mode="song"; S.song=s; S.notes=buildSong(s); S.t0=performance.now();
  document.getElementById("modeLabel").textContent="PJESMA";
  document.getElementById("scoreOut").textContent="0";
  hintEl.textContent="TON UND STRICH ZUGLEICH";
  setVeil(false); fit();
}
function finish(){
  const s=S.song; S.mode="idle"; S.soloEnd=0;
  S.speed=0; S.lifted=true; audioFrame();
  multEl.style.opacity=0; hintEl.className="";
  const ton=S.tonN?S.tonSum/S.tonN:0;
  const steady=S.spN>4?1-Math.min(1,(S.spDev/S.spN)/((S.spSum/S.spN)+.001)*1.6):0;
  const ideal=1000/s.beat;
  const secs=Math.max(1,S.notes[S.notes.length-1].t/1000);
  const rate=S.revs/secs;
  const rateScore=1-Math.min(1,Math.abs(rate-ideal)/(ideal*1.15));
  const microPen=S.revs?(S.micro/S.revs)*.4:0;
  const gudalo=Math.max(0,steady*.45+rateScore*.55-microPen);
  const ritam=Math.max(0,(S.bowFrames?S.bowOn/S.bowFrames:0)-(S.restFrames?(S.restBow/S.restFrames)*.3:0));
  const acc=S.total?Math.round(S.clean/S.total*100):0;
  const prevBest=DB.best[s.id]||0, isBest=S.score>prevBest;
  if(isBest) DB.best[s.id]=S.score;
  if(acc>(DB.bestAcc[s.id]||0)) DB.bestAcc[s.id]=acc;
  if(S.maxCombo>DB.bestCombo) DB.bestCombo=S.maxCombo;
  DB.totalScore+=S.score;
  dbSave();
  lastResult={song:s,score:S.score,isBest:isBest,clean:S.clean,near:S.near,miss:S.miss,
    maxCombo:S.maxCombo,perfect:S.miss===0&&S.near===0,ton:ton,gudalo:gudalo,ritam:ritam};
  showScreen("result");
}
function toMenu(){
  if(S.mode==="demo"){ endDemo(); return; }
  S.mode="idle"; S.notes=[]; S.paused=false; S.soloEnd=0; S.drill=null; S.vatra=0;
  S.speed=0; S.lifted=true; audioFrame();
  multEl.style.opacity=0; hintEl.className="";
  showMenu();
}
document.getElementById("backBtn").onclick=toMenu;

/* ═══════════ Start ═══════════ */
rebuild(); buildScene(); buildGhosts(); fit();
dbLoad().then(function(){
  if(typeof DB.level==="number") S.level=DB.level;
  if(typeof DB.inst==="number"&&DB.totalScore>=INSTRUMENTS[DB.inst].need){ S.inst=DB.inst; rebuild(); }
  if(DB.gfx) GFX.mode=DB.gfx;
  applyGfx();
  showGate();
});
schedule();

window.__G={S:S,SONGS:SONGS,DRILLS:DRILLS,LEVELS:LEVELS,INSTRUMENTS:INSTRUMENTS,DB:DB,GFX:GFX,
  startSong:startSong,startDrill:startDrill,startFree:startFree,startDemo:startDemo,endDemo:endDemo,
  closeGate:closeGate,endIntro:endIntro,showScreen:showScreen,finish:finish,goPause:goPause,goResume:goResume,
  onStroke:onStroke,judgeFrame:judgeFrame,buildSong:buildSong,rebuild:rebuild,applyInstrument:applyInstrument,
  unlock:unlock,ac:function(){ return AC; },tap:function(n){ if(AC&&AC._lim) AC._lim.connect(n); },
  get workletOn(){ return workletOn; },get veil(){ return veilOpen; },setVeil:setVeil,toMenu:toMenu,
  bow:function(v,dir){ S.speed=v; S.strokeDir=dir||1; S.lifted=v<=0; },
  pitch:function(p){ S.target=p; S.playPos=p; S.holding=p>.02; }};
})();
