/* ---------- utils ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function eio(t){ return 0.5-0.5*Math.cos(Math.PI*clamp(t,0,1)); }
function eoc(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function eic(t){ t=clamp(t,0,1); return t*t*t; }
function eob(t){ t=clamp(t,0,1); var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
function txt(s,x,y,font,fill,align,base){
  ctx.direction = (LANG === 'he') ? 'rtl' : 'ltr';   /* hebrejski ide zdesna nalijevo */
  ctx.font = font; ctx.fillStyle = fill;
  ctx.textAlign = align||'center'; ctx.textBaseline = base||'middle';
  ctx.fillText(s,x,y);
}
function wrap(s,maxw,font){
  ctx.font = font;
  var words = String(s).split(' '), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(ctx.measureText(t).width > maxw && cur){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}

    if(!o || typeof o !== 'object') return null;

      best: clamp(o.best|0, 0, 9999999),

}

var AU = {
  on: true, ctx: null,
  init: function(){
    if(this.ctx) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      /* jedan zajednički noise-buffer: nema novog velikog AudioBuffera za svaki whoosh */
      var nlen = Math.floor(this.ctx.sampleRate*2);
      this.noiseBuf = this.ctx.createBuffer(1,nlen,this.ctx.sampleRate);
      var nd = this.noiseBuf.getChannelData(0);
      for(var ni=0;ni<nlen;ni++) nd[ni] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  ok: function(){
    if(!this.on || !this.ctx) return false;
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }
    return true;
  },
  tone: function(f,dur,type,vol,f2,delay){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.05);
  },
  noise: function(dur,freq,q,vol,delay,slideTo){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    if(!s.buffer) return;
    var f = this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.setValueAtTime(freq,t0); f.Q.value = q||1;
    if(slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    var off = Math.random()*Math.max(0.01, s.buffer.duration-dur-0.01);
    s.start(t0, off, Math.min(dur, s.buffer.duration-off)); s.stop(t0+dur+0.02);
  },
  /* plucked string – šargija-ish */
  pluck: function(f,dur,vol,delay){
    if(!this.ok()) return;
    this.tone(f,dur,'triangle',vol||0.14,f*0.995,delay);
    this.tone(f*2.01,dur*0.4,'sine',(vol||0.14)*0.4,f*2,delay);
  },
  thunk: function(){ this.tone(150,0.16,'sine',0.22,58); this.noise(0.07,900,1.2,0.16); },
  whoosh: function(){ this.noise(0.20,700,0.9,0.10,0,2200); },
  tap: function(){ this.tone(760,0.05,'square',0.07,520); },
  chip: function(){ this.tone(1180,0.06,'triangle',0.12,1560); this.tone(1560,0.09,'sine',0.08,2100,0.05); },
  glint: function(){ this.tone(2450,0.09,'triangle',0.09,3100); this.tone(3300,0.06,'sine',0.05,3900,0.05); },
  coin: function(n){
    for(var i=0;i<(n||3);i++) this.tone(880+i*180,0.10,'triangle',0.10,1400+i*200,i*0.055);
  },
  win: function(){
    /* hidžaz-ish: D Eb F# G A */
    var f = [293.66,311.13,369.99,392.00,466.16,587.33];
    for(var i=0;i<f.length;i++) this.pluck(f[i],0.42,0.15,i*0.075);
    this.tone(146.83,0.6,'sine',0.10,146.83,0);
  },
  lose: function(){
    this.tone(300,0.45,'sawtooth',0.13,70);
    this.tone(196,0.5,'square',0.06,52,0.04);
    this.noise(0.3,300,0.7,0.08,0.02,120);

  coo: function(){
    this.tone(430,0.16,'sine',0.10,360);

  ring: function(){
    for(var i=0;i<2;i++){

      this.tone(1560,0.09,'square',0.06,1560,i*0.16+0.08);

  },
  sirena: function(){

  },
  poke: function(){ this.tone(520,0.07,'square',0.09,700); this.tone(700,0.06,'sine',0.06,900,0.06); },
  gameover: function(){

  }
};

/* Prvo pokretanje: pogodi jezik iz postavki uređaja.
   Isključeni jezici (sq, he) padaju na bosanski dok se ne uključe. */
function pogodiJezik(){
  var lista = [];
  try{
    if(navigator.languages && navigator.languages.length) lista = navigator.languages.slice(0);
    else if(navigator.language) lista = [navigator.language];
  }catch(e){ lista = []; }
  for(var i=0;i<lista.length;i++){
    var kod = String(lista[i]).toLowerCase();
    var dva = kod.slice(0,2);
    var pogodak = '';
    if(dva === 'de') pogodak = 'de';
    else if(dva === 'en') pogodak = 'en';
    else if(dva === 'bs' || dva === 'hr' || dva === 'sr' || dva === 'sh' ||
            dva === 'me' || kod.indexOf('bih') >= 0) pogodak = 'bs';
    else if(dva === 'sq') pogodak = 'sq';
    else if(dva === 'he' || dva === 'iw') pogodak = 'he';
    if(pogodak && JEZICI.indexOf(pogodak) >= 0) return pogodak;
  }
  return 'bs';
}

function LB(k){

  return (t && t[k]) ? t[k] : LINES.bs[k];
}

/* difficulty */
function nSwaps(r){
  if(G.easy) return Math.min(7, 3 + Math.floor((r-1)*0.45));
  /* dalje raste sporije — 20 zamjena je već more, 30 je cirkus */
  var base = 3 + Math.floor((r-1)*0.75) + (G.season|0);
  if(base > 10) base = 10 + Math.floor((base-10)*0.45);
  return Math.min(base, 14);
}
function swapDur(r){
  if(G.easy) return Math.max(0.36, 0.58 - (r-1)*0.012);
  /* ruka ostaje ljudska: ispod 0.24 s po zamjeni se više ništa ne vidi */
  var d = 0.50 - (r-1)*0.022 - (G.season|0)*0.014;
  return Math.max(0.240, d);
}
function cheatChance(r){
  if(G.easy) return 0;
  if(r < 3 - Math.min(2, G.season|0)) return 0;
  return Math.min(0.55, (r-2)*0.07 + (G.season|0)*0.04);
}

/* koliko se kreće u sljedeći nivo: osnovica sezone ili ono što si iznio */
/* Najveći dopušteni ulog: četvrtina onoga što u ovom nivou treba zaraditi,
   plus mali bonus za seriju. Tako nijedna runda ne može sama završiti nivo —
   bez obzira koliko si para donio iz prošlog. */
/* Koliko je Šaner nervozan: 0 miran · 1 iznerviran · 2 nervozan · 3 panika.
   Mjeri se koliko si blizu cilja, pa radi i kad doneseš pare iz prošlog nivoa. */
function nervoza(){
  var raspon = Math.max(1, G.fleeCilj - G.startPare);
  var p = (G.money - G.startPare) / raspon;
  if(p >= 0.82) return 3;
  if(p >= 0.55) return 2;
  if(p >= 0.24) return 1;
  return 0;
}

function maxUlog(){
  var potreba = Math.max(40, G.fleeCilj - G.startPare);
  var kapa = Math.round(potreba / 4 / 5) * 5;
  kapa += Math.min(4, G.streak) * 5;          /* serija otvara malo veći ulog */
  if(G.silvester) kapa *= 2;                  /* doček: sve duplo */
  return Math.max(5, Math.min(kapa, G.money));
}

function pocetnePare(){
  var osnovica = 20 + Math.min(40, (G.season|0)*8);
  return Math.max(osnovica, G.carry|0);
}

function toBet(){
  G.st = S.BET; G.t = 0; G.picked = -1;
  G.slow = 1; G.kafaOn = false; G.okoT = 0;
  G.hakalaRunda = false; G.hakalaCheckT = 0;   /* Hakala se vraća u publiku */
  for(var i=0;i<G.nc;i++){ G.cups[i].lift = 0; G.cups[i].tilt = 0; }
  if(G.money < 5){ toOver(); return; }
  /* kasnije u sezoni Levat može sam otići → kraj levela */
  if(!G.levatGone && G.round >= 8 && Math.random() < (0.04 + Math.max(0,45-G.levatMood)*0.005)){
    startLevatLeave('fedup');
    return;
  }
  /* Hakala — dobacivanje iz publike, pa Šanerov odgovor */
  if(!G.levatGone && G.minkaAnim < 0.15 && G.round >= 2 && Math.random() < 0.08){
    levatSay(T('hakala1'), 2.4);
    G.levatHold = 2.6;
    G.hakalaT = 1.5;
    AU.tone(520, 0.08, 'square', 0.06, 380);
    return;
  }
  /* što je nervozniji, to češće progovori iz nervoze umjesto uobičajene najave */
  G.nerv = nervoza();

/* sljedeći nivo se izvlači nasumično — iz vreće, da se mjesta ne ponavljaju */
function novoMjesto(){
  G.mjestoUzeto = true;
  if(!G.levelBag || !G.levelBag.length){
    var b = [];
    for(var i=0;i<MJESTA.length;i++) if(i !== G.level) b.push(i);
    for(i=b.length-1;i>0;i--){ var j = ri(0,i), tmp = b[i]; b[i] = b[j]; b[j] = tmp; }
    G.levelBag = b;
  }
  /* nikad isto mjesto dva puta zaredom */
  if(G.levelBag[0] === G.level && G.levelBag.length > 1){
    var t0 = G.levelBag[0]; G.levelBag[0] = G.levelBag[1]; G.levelBag[1] = t0;
  }
  G.level = G.levelBag.shift();
}

function odaberiMedjuigru(){
  if(!G.medjuBag || !G.medjuBag.length){
    var b = [];
    for(var i=0;i<MEDJU.length;i++) b.push(i);
    for(i=b.length-1;i>0;i--){ var j = ri(0,i), tmp = b[i]; b[i] = b[j]; b[j] = tmp; }
    if(b[0] === G.medjuLast && b.length > 1){ var t0 = b[0]; b[0] = b[1]; b[1] = t0; }
    G.medjuBag = b;
  }
  G.medju = G.medjuBag.shift();
  G.medjuLast = G.medju;
}

/* međuigra na kraju svakog nivoa — pokreće se s dugmeta „još jednom" */

/* svaka varijanta bijega: kad kreće trk, kad se pojavi bošča, odakle kreće trk */
var FLEE_VARS = {
  inventura: {runAt:2.2,  boscaAt:1.5,  dx0:0},   /* pakuje fildžane i ćilim */
  sto:       {runAt:2.35, boscaAt:1.95, dx0:0},   /* prevrne sto */
  dim:       {runAt:99,   boscaAt:1.05, dx0:0},   /* dimna bomba — nestane */
  milicija:  {runAt:1.7,  boscaAt:1.75, dx0:260}  /* „eno milicije!" pa trk */
};

function pickFleeVar(){
  var keys = [];
  for(var k in FLEE_VARS) if(k !== G.fleeZadnji) keys.push(k);
  return keys[(Math.random()*keys.length)|0];
}

function toFlee(){
  G.st = S.BJEG; G.t = 0;
  G.sanerDX = 0; G.sanerDY = 0; G.sanerS = 1;
  G.clothFly = 0; G.fleeStep = 0; G.clothSnd = false; G.stepT = 0;
  G.tableFlip = 0; G.sanerA = 1;
  G.fleeVar = pickFleeVar(); G.fleeZadnji = G.fleeVar;
  var fv = FLEE_VARS[G.fleeVar];
  G.fleeRunAt = fv.runAt; G.boscaAt = fv.boscaAt; G.fleeDX0 = fv.dx0;
  for(var i=0;i<G.nc;i++){
    var c = G.cups[i];
    c.a = 1; c.sc = 1; c.grab = false; c.lift = 0; c.tilt = 0; c.x = SLOTX[c.slot];
    c.fly = false; c.fvx = 0; c.fvy = 0; c.fvr = 0;
  }
  G.bird.leave = true; G.minka = 0; G.levatTip = -1;
  say(T('sastanak'), 2.4);
  /* Levat ide s njim / odlazi — level gotov */
  startLevatLeave('flee');
  AU.tone(240,0.5,'sawtooth',0.10,130);
  vib([30,60,30]);
}

function toPobjeda(){
  TRK.dogadjaj('bijeg', G.money|0); meta('flees');
  /* prevrnuo je sto — od sada isti sto, samo pokrpan selotejpom */
  if(G.fleeVar === 'sto') G.stoPokrpan = true;
  G.st = S.POBJEDA; G.t = 0;
  G.carry = G.money;               /* zarađeno ide u sljedeći nivo */
  G.levatLeavePhase = 0;   /* oproštaj je gotov — dugmad opet rade */
  if(G.money > G.peakMoney) G.peakMoney = G.money;
  if(G.peakMoney > G.best){ G.best = G.peakMoney; G.newBest = true; }
  if(G.round-1 > G.bestRound) G.bestRound = G.round-1;
  /* sezona je već povećana kad je Levat otišao; ako nije, sada */
  if(!G.seasonUp && G.season < 8){ G.season++; G.seasonUp = true; }
  if(!G.mjestoUzeto){ G.levelPrev = G.level; novoMjesto(); }
  save(); AU.win(); vib([20,50,20,50,120]);
}

function startRound(bet){
  TRK.rundi++;
  /* ako runda ipak počne, oproštaj se prekida — inače tajmer resetuje partiju usred igre */
  if(G.levatLeavePhase > 0){
    G.levatLeavePhase = 0; G.levatGone = true; G.levatPeek = 0; G.levatHold = 0;
  }
  /* pravila emisije — djelomično nasumična, jača s rundama */
  var nc = 3;
  if(G.zaplijena){ nc = 2; G.zaplijena = false; }
  else {
    var p4 = G.round >= 6 ? Math.min(0.38, 0.12 + (G.round-6)*0.03) : 0;
    if(Math.random() < p4) nc = 4;
  }
  var ncBefore = G.nc;
  setCups(nc);
  /* jedna ruka / usporeno: otključava se, pa se nasumično aktivira */
  var canRuka = G.round >= 10, canSporo = G.round >= 13;
  var ruka = canRuka && (G.jednaRuka || Math.random() < 0.35);
  var sporo = canSporo && (G.usporeno || Math.random() < 0.30);
  var novoPravilo = '';
  if(nc === 2) novoPravilo = LB('PRAVILA').dva;
  else if(nc === 4 && ncBefore !== 4) novoPravilo = LB('PRAVILA').cetiri;
  else if(sporo && !G.usporeno) novoPravilo = LB('PRAVILA').sporo;
  else if(ruka && !G.jednaRuka) novoPravilo = LB('PRAVILA').ruka;
  G.jednaRuka = ruka; G.usporeno = sporo;
  G.idleT = 0; G.idleStep = 0;
  if(G.st !== S.MITO) G.polA = 0;

  G.bet = Math.min(bet, G.money, maxUlog());
  G.money -= G.bet;
  G.st = S.SHOW; G.t = 0;
  G.picked = -1; G.cheated = false; G.cheatDone = false;
  G.revPhase = 0;
  G.resolved = false; G.shownTruth = false; G.bonus = 0;
  /* kuglica ide pod srednji fildžan */
  var mid = cupAt(((G.nc-1)/2)|0);
  G.cube = G.cups.indexOf(mid);
  for(var i=0;i<G.nc;i++){ G.cups[i].lift = 0; }
  G.levatTip = -1;
  G.bird.on = false; G.bird.leave = false; G.bird.cupIdx = -1;
  G.ciroTip = -1; G.vjetar = null; G.vjetarBio = false;
  G.nakrivT = 0; G.levatSaplT = 0; G.navikaDone = false;
  var ns = nSwaps(G.round), sd = swapDur(G.round);
  if(G.nc === 4){ ns = Math.round(ns*1.15); }
  if(G.nc === 2){ ns = Math.max(2, Math.round(ns*0.8)); }
  if(G.usporeno) sd *= 1.30;
  /* ili Minka zove, ili Minka dođe — nikad oboje (na dočeku je ionako tu) */
  G.minka = 0;
  if(G.round >= 2 && !G.silvester){
    var ev = Math.random();
    var mp = Math.min(0.38, 0.18 + G.round*0.008 + Math.max(0,G.money-100)*0.0005);
    if(ev < mp*0.54) G.minka = 1;
    else if(ev < mp) G.minka = 2;
    if(G.minka) meta('minka');
  }
  if(G.minka !== 2){          /* ako ne dolazi lično, nema je na bini */
    G.minkaAnim = 0; G.minkaSeen = false; G.minkaSayT = 0;
  }
  if(G.minka === 1){
    ns = Math.max(2, Math.round(ns*0.55));
    sd *= 1.55;
  }else if(G.minka === 2){
    ns = Math.max(2, Math.round(ns*0.45));
    sd *= 1.70;
  }
  /* Hakala jednom po partiji preuzme miješanje — sporo, klimavo i pošteno */
  G.hakalaRunda = false; G.hakalaCheckT = 0; G.hakalaChecked = false;
  if(!G.minka && !G.silvester && !G.hakalaBio && G.round >= 4 && Math.random() < 0.10){
    G.hakalaRunda = true; G.hakalaBio = true;
    ns = Math.max(2, Math.round(ns*0.55));
    sd *= 1.85;
  }
  G.swaps = buildSwaps(ns);
  G.swDur = sd;
  /* od 6. runde Šaner ponekad izvede puni pokret bez stvarne zamjene. Vizuelno čitljivo, nikad teleport. */
  var fakeSansa = Math.min(0.34, 0.10+(G.round-6)*0.025) + Math.max(0, nervoza()-1)*0.06;
  G.fakeAt = (G.forceFake || (!G.easy && G.round >= 6 && Math.random() < fakeSansa))
             ? ri(1, Math.max(1,G.swaps.length-1)) : -1;
  G.fakeSwap = false;
  G.si = 0; G.sw = 0; G.swActive = false;
  var cc = cheatChance(G.round) + (G.usporeno ? 0.12 : 0);
  G.cheatAt = (G.forceCheat || (!G.minka && Math.random() < cc)) ? ri(1, G.swaps.length-1) : -1;
  if(G.hakalaRunda){
    /* pijan, ali pošten */
    G.cheatAt = -1; G.fakeAt = -1;
    G.hakalaCheckAt = Math.max(1, (G.swaps.length/2)|0);
  }
  /* zapamtio je tvoju naviku — večeras vara češće */
  if(G.navika >= 0 && !G.hakalaRunda && !G.minka && G.cheatAt < 0 && Math.random() < 0.5){
    G.cheatAt = ri(1, Math.max(1, G.swaps.length-1));
  }
  AU.chip(); vib(12);
  if(G.minka === 1){
    AU.ring(); vib([20,40,20]);
    say(pick(LB('MINKA')), 3.0);
    /* dok je Minka na vezi, Levat se ne pojavljuje — svoj komentar čuva za poslije */
    G.levatT = 0; G.levatHold = 0; G.levatPeek = 0;
  }else if(G.minka === 2){
    vib([30,60,30]);
    say(pick(LB('MINKA_LICNO')), 3.4);
    G.levatT = 0; G.levatHold = 0;   /* Levat se ne miješa dok je Minka tu */
  }else if(novoPravilo){
    say(novoPravilo, 3.0);
  }else{
    say(T('evoKuglice'), 1.9);
  }
  if(G.hakalaRunda){
    say(T('hakalaMijesa'), 3.2);
    AU.tone(340, 0.14, 'square', 0.07, 220);
  }
  if(G.silvester && Math.random() < 0.30){
    G.minkaSay = pick(T('silvMinka')); G.minkaSayT = 3.6;
  }
}

function buildSwaps(n){
  var arr = [], last = -1;
  for(var i=0;i<n;i++){
    var a,b,k,guard=0;
    do{
      a = ri(0,G.nc-1); b = ri(0,G.nc-1); k = Math.min(a,b)*5+Math.max(a,b); guard++;
    }while((a===b || k===last) && guard<40);
    last = k;
    arr.push([a,b]);
  }
  return arr;
}

function beginSwap(){
  var s = G.swaps[G.si];
  var ca = cupAt(s[0]), cb = cupAt(s[1]);
  var oldASlot=ca.slot, oldBSlot=cb.slot;
  ca.from = SLOTX[oldASlot]; ca.to = SLOTX[oldBSlot];
  cb.from = SLOTX[oldBSlot]; cb.to = SLOTX[oldASlot];
  var over = Math.random() < 0.5;
  ca.over = over; cb.over = !over;
  G.fakeSwap = (G.si === G.fakeAt);
  if(!G.fakeSwap){ ca.slot = oldBSlot; cb.slot = oldASlot; }
  G.swActive = true; G.sw = 0;
  G.cheated = !G.fakeSwap && (G.si === G.cheatAt) && (G.cups.indexOf(ca) === G.cube || G.cups.indexOf(cb) === G.cube);
  G.cheatDone = false;
  AU.whoosh();
  if(G.si % 3 === 0 && Math.random()<0.5) say(pick(LB('MIX')), 1.4);
}

function doPick(slot){
  if(G.st !== S.PICK) return;
  /* Šaner pamti gdje uvijek biraš */
  G.pickHist.push(slot);
  if(G.pickHist.length > 6) G.pickHist.shift();
  var ph = G.pickHist.length;
  G.navika = (ph >= 3 && G.pickHist[ph-1] === G.pickHist[ph-2] &&
              G.pickHist[ph-2] === G.pickHist[ph-3]) ? slot : -1;
  G.picked = slot;
  G.st = S.REVEAL; G.t = 0; G.revPhase = 0;
  /* telefon je upravo nestao s ekrana — sad Levat smije proviriti s komentarom */
  if(G.minka === 1) levatSay(T('doTri'), 3.5);
  var c = cupAt(slot);
  c.wob = 1;
  G.bird.leave = true; G.levatTip = -1;
  G.won = (G.cups.indexOf(c) === G.cube);
  AU.tap(); vib(10);
}

function resolve(){
  if(G.won){
    meta('wins'); meta('wonKM', G.bet);
    G.levatMood = clamp(G.levatMood-7,0,100);
    G.payout = G.bet*2;
    G.money += G.payout;
    G.streak++;
    if(G.streak > G.bestStreak) G.bestStreak = G.streak; if(G.streak > META.bestStreak) META.bestStreak = G.streak;
    var bonus = 0;
    if(G.streak % 3 === 0){
      bonus = 10 + G.round*2;
      G.money += bonus;
      var p = pick(['kafa','oko','golub']);
      G.pow[p]++;
      var pn = (LANG === 'bs') ? {kafa:'kafom', oko:'okom', golub:'golubom'}[p]
                              : {kafa:T('kafa'), oko:T('oko'), golub:T('golub')}[p];
      levatSay(T('serijaCasti') + pn + '."', 3.6);
    }
    G.bonus = bonus;
    boom(pick(T('win')), SLOTX[G.picked], true);
    say(pick(LB('WIN')), 3.2);
    AU.win(); vib([16,40,16]);
    G.flash = 0.5;
    for(var i=0;i<14;i++) spawnCoin(SLOTX[G.picked], TABLEY-120);
    burst(SLOTX[G.picked], TABLEY-140, 18, '#ffd479');
  }else{
    meta('losses'); meta('lostKM', G.bet);
    G.levatMood = clamp(G.levatMood+4,0,100);
    G.payout = 0; G.streak = 0;
    boom(pick(T('lose')), SLOTX[G.picked], false);
    say(pick(LB('LOSE')), 3.2);
    AU.lose(); vib([30,50,30]);
    G.shake = 14;
    burst(SLOTX[G.picked], TABLEY-100, 14, '#8a7060');
  }
  if(G.money > G.peakMoney) G.peakMoney = G.money;
  G.levatHold = 1.4; G.levatIdleT = rnd(22, 38);
  G.round++; meta('rounds');
  if(Math.random()<0.22) levatSay(pick(LB('LEVAT')), 4);
  /* Ćiro iz publike — obračun njegove wette */
  if(G.ciroTip >= 0){
    var ciroPravi = (G.ciroTip === G.cups[G.cube].slot);
    if(ciroPravi){
      G.ciroPogodio++;
      if(G.ciroPogodio >= 3){
        G.ciroTjeran = true;
        say(T('ciroTjera'), 3.6);
        G.poke = 0.6; AU.tone(200, 0.25, 'sawtooth', 0.10, 120); vib([30,40,30]);
      }else{
        levatSay(T('ciroPogodak'), 3.4);
      }
    }else if(G.picked === G.ciroTip){
      say(T('ciroFulao'), 3.2);
      AU.tone(520, 0.28, 'triangle', 0.08, 300);
    }
    G.ciroTip = -1;
  }
}

function boom(word, x, win){
  G.onom = {s:word, t:0, x:clamp(x,120,600), win:!!win, rot:rnd(-0.16,0.16)};
}
function idleGunđanje(dt, uBet){
  G.idleT += dt;
  G.tapT = (G.idleT > 6.5) ? Math.min(1, G.tapT + dt*3) : Math.max(0, G.tapT - dt*3);
  if(G.idleStep < 1 && G.idleT > 8){
    G.idleStep = 1; say(pick(LB('IDLE')), 3.0); AU.tone(330,0.08,'square',0.06,260);
  }else if(G.idleStep < 2 && G.idleT > 15){
    G.idleStep = 2; say(pick(LB('IDLE')), 3.0);
    levatSay(T('meniNeSmeta'), 3.4);
  }else if(G.idleStep < 3 && G.idleT > 22){
    G.idleStep = 3; say(pick(LB('IDLE2')), 3.4);
    AU.tone(220,0.14,'sawtooth',0.09,150);
  }else if(uBet && G.idleStep < 4 && G.idleT > 28){
    G.idleStep = 4;
    say(T('zaTebe'), 2.6);
    AU.chip(); vib(20);
    startRound(Math.min(5, G.money));
  }
}

function say(s,d){ G.say = s; G.sayT = d||3; }
function levatSay(s,d){ G.levat = s; G.levatT = d||3.5; }

function burst(x,y,n,col){

}
function spawnCoin(x,y){

    r:rnd(12,18), rot:rnd(0,6.28), vr:rnd(-9,9), life:2.2, kotrlja:false});
}
function dust(x,y,n){

    G.parts.push({x:x+rnd(-30,30),y:y,vx:rnd(-70,70),vy:rnd(-90,-10),

/* ---------- bijeg: četiri načina da Šaner zbriše ---------- */
function fleeRun(ft, dt){
  /* zajednički trk udesno — svaka varijanta kaže kad kreće (G.fleeRunAt) */
  if(ft <= G.fleeRunAt) return;
  var k = clamp((ft-G.fleeRunAt)/2.0, 0, 1);
  G.sanerDX = G.fleeDX0 + eic(k)*(820 - G.fleeDX0);
  G.sanerDY = -k*70;
  G.sanerS = 1 - 0.44*k;
  G.stepT -= dt;
  if(G.stepT <= 0 && k < 0.9){
    G.stepT = 0.17;
    AU.tone(96, 0.07, 'sine', 0.09, 60);
    dust(360 + G.sanerDX*0.85, TABLEY + 96, 4);
  }
}

function fleeUpdate(ft, dt){
  var i, cf;
  switch(G.fleeVar){

    case 'sto':  /* prevrne sto — fildžani i pare lete */
      if(ft > 0.9 && G.fleeStep < 1){
        G.fleeStep = 1;
        say(T('bjegSto'), 2.0);
        AU.tone(180, 0.2, 'sawtooth', 0.10, 60);
      }
      if(ft > 1.3 && G.fleeStep < 2){
        G.fleeStep = 2;
        AU.thunk(); AU.noise(0.55, 260, 0.8, 0.20, 0.05, 90);
        G.shake = 26; vib([60, 40, 90]);
        dust(200, TABLEY+40, 20); dust(500, TABLEY+40, 20);
        burst(360, TABLEY-20, 22, '#c9ab8b');
        for(i=0;i<G.nc;i++){
          cf = G.cups[i];
          cf.fly = true;
          cf.fvx = rnd(-260, 260); cf.fvy = rnd(-620, -420); cf.fvr = rnd(-9, 9);
          AU.tone(500+i*120, 0.10, 'triangle', 0.10, 260, i*0.06);
        }
        for(i=0;i<9;i++) spawnCoin(360, TABLEY-40);
      }
      G.tableFlip = clamp((ft-1.3)/0.55, 0, 1);
      if(G.fleeStep >= 2){
        for(i=0;i<G.nc;i++){
          cf = G.cups[i];
          if(!cf.fly) continue;
          cf.fvy += 1400*dt;
          cf.x += cf.fvx*dt;
          cf.lift -= cf.fvy*dt/LIFTH;
          cf.tilt += cf.fvr*dt;
          cf.a = Math.max(0, cf.a - dt*0.75);
        }
      }
      break;

    case 'dim':  /* dimna bomba — puf, i nema ga */
      if(ft > 0.9 && G.fleeStep < 1){
        G.fleeStep = 1;
        say(T('bjegDim'), 1.6);
        AU.tone(700, 0.18, 'triangle', 0.10, 1500);
      }
      if(ft > 1.5 && G.fleeStep < 2){
        G.fleeStep = 2;
        AU.noise(0.7, 500, 0.6, 0.22, 0, 120);
        AU.tone(90, 0.3, 'sine', 0.25, 40);
        G.shake = 18; G.flash = 0.55; vib([30, 30, 80]);
        for(i=0;i<30;i++){
          G.smoke.push({x:360+rnd(-230,230), y:TABLEY-50+rnd(-110,50),
            vx:rnd(-30,30), vy:rnd(-46,-10), r:rnd(34,80), life:rnd(1.6,2.6), bomba:true});
        }
        for(i=0;i<G.nc;i++) G.cups[i].a = 0;   /* pod dimom sve nestaje */
      }
      if(G.fleeStep >= 2) G.sanerA = Math.max(0, G.sanerA - dt*4);
      if(ft > 2.9 && G.fleeStep < 3){ G.fleeStep = 3; say(T('bjegDim2'), 2.2); }
      break;

    case 'milicija':  /* pokaže „eno milicije" — dok gledaš, njega nema */
      if(ft > 0.75 && G.fleeStep < 1){
        G.fleeStep = 1;
        say(T('bjegMil'), 1.7);
        AU.tone(2100, 0.09, 'square', 0.08, 2600);
        AU.tone(2100, 0.12, 'square', 0.08, 1700, 0.12);
        vib([40, 40, 40]);
      }
      if(ft > 1.7 && G.fleeStep < 2){
        G.fleeStep = 2;
        G.flash = 0.8; AU.whoosh();
        dust(360, TABLEY+60, 18); dust(560, TABLEY+80, 10);
        for(i=0;i<G.nc;i++) G.cups[i].a = 0;   /* pokupio ih u treptaju */
      }
      if(ft > 2.6 && G.fleeStep < 3){ G.fleeStep = 3; say(T('bjegMil2'), 2.2); }
      break;

    default:  /* 'inventura' — pakuje fildžane u prsluk, ćilim leti */
      if(ft > 0.9 && G.fleeStep < 1){
        G.fleeStep = 1;
        say(T('zatvoreno'), 2.0);
        AU.whoosh();
      }
      /* fildžani nestaju u prsluku */
      for(i=0;i<G.nc;i++){
        cf = G.cups[i];
        var d = clamp((ft-0.95-i*0.15)/0.45, 0, 1);
        if(d > 0){
          cf.x = lerp(SLOTX[cf.slot], 372, eic(d));
          cf.lift = Math.sin(Math.PI*d)*0.55;
          cf.tilt = d*1.1;
          cf.sc = 1 - 0.6*d;
          cf.a = 1 - d;
          if(!cf.grab){ cf.grab = true; AU.tone(560+i*110, 0.09, 'triangle', 0.11, 320); }
        }
      }
      /* ćilim leti */
      if(ft > 1.55){
        G.clothFly = clamp((ft-1.55)/0.5, 0, 1);
        if(!G.clothSnd){
          G.clothSnd = true;
          AU.noise(0.35, 520, 0.8, 0.15, 0, 1900);
          dust(360, TABLEY, 26);
          dust(200, TABLEY+20, 14); dust(520, TABLEY+20, 14);
          burst(360, TABLEY-40, 16, '#c9ab8b');
          G.shake = 14;
        }
      }
      break;
  }
  /* i onda trk (dim: Šaner je već nestao, fleeRunAt je 99) */
  fleeRun(ft, dt);
}

/* ---------- update ---------- */
function update(dt){
  G.gt += dt; G.t += dt;
  G.shake *= Math.pow(0.001, dt);
  G.flash = Math.max(0, G.flash - dt*1.6);
  if(G.tell>0) G.tell = Math.max(0, G.tell - dt*2.6);
  if(DEMO.on) DEMO.update(dt);
  if(G.poke>0) G.poke = Math.max(0, G.poke - dt*2.2);
  /* nervoza raste s tvojim parama; nervA je omekšana vrijednost za crtanje */
  G.nerv = nervoza();
  G.nervA = lerp(G.nervA, G.nerv, Math.min(1, dt*1.4));
  if(G.st === S.BET || G.st === S.PICK){
    G.gestT -= dt;
    if(G.gestT <= 0){
      G.gestT = rnd(3.4, 6.2) - G.nerv*0.6;
      G.gest = (G.nerv > 0 && Math.random() < 0.35 + G.nerv*0.15) ? G.nerv : 0;
    }
  }
  if(G.nerv > G.nervRekao && G.st === S.BET && G.nerv > 0){
    G.nervRekao = G.nerv;
    say(pick(LB('NERV' + G.nerv)), 3.2);
  }
  /* Šaner odgovara Hakali sekundu i po kasnije */
  if(G.hakalaT > 0){
    G.hakalaT -= dt;
    if(G.hakalaT <= 0){
      say(T('hakala2'), 3.4);
      G.poke = 0.8; G.shake = 8;
      AU.tone(180, 0.22, 'sawtooth', 0.10, 110);
      vib([20,40,20]);
    }
  }
  /* Levat "slučajno" zapne za sto sekundu nakon što mu gurneš pare */
  if(G.levatSaplT > 0){
    G.levatSaplT -= dt;
    if(G.levatSaplT <= 0){
      if(G.st === S.PICK){
        G.nakrivT = 1.1;
        G.levatHold = 1.8;
        AU.thunk(); G.shake = 12; vib([30,50,30]);
        dust(120, TABLEY+40, 10);
        say(T('levatMito2'), 2.6);
      }
      G.levatSaplT = 0;
    }
  }
  /* milicija odlazi čim racija prestane — inače ostane stajati do kraja partije */
  if(G.st !== S.RACIJA && G.st !== S.MITO && G.polA > 0.001){
    G.polA = lerp(G.polA, 0, Math.min(1, dt*3.2));
    if(G.polA < 0.01) G.polA = 0;
  }
  /* Levat — provirivanje ili konačni odlazak (kraj levela) */
  if(G.levatLeavePhase > 0){
    G.levatLeave += dt;
    if(G.levatLeavePhase === 1){
      G.levatPeek = 1;
      if(G.levatLeave > 2.2) G.levatLeavePhase = 2;
    } else if(G.levatLeavePhase === 2){
      G.levatPeek = Math.max(0, 1 - (G.levatLeave - 2.2) / 1.4);
      if(G.levatPeek <= 0.02){
        G.levatGone = true;
        G.levatPeek = 0;
        G.seasonUp = false;
        if(G.season < 8){ G.season++; G.seasonUp = true; }
        /* Levat je otišao → nivo je gotov, sljedeći je na drugom mjestu */
        G.carry = G.money;
        G.levelPrev = G.level;
        novoMjesto();
        if(G.st === S.BJEG){
          G.levatLeavePhase = 3;   /* bijeg se mora do kraja odigrati */
        } else {
          say(pick(LB('GONE')), 3.2);
          G.levatLeavePhase = 4;
          G.levatLeave = 0;
          save();
        }
      }
    } else if(G.levatLeavePhase === 4){
      G.levatPeek = 0;
      var ml = G.levatLeave, mi = MEDJU[G.medju];
      if(G.medjuCue < 1 && ml > 0.02){
        G.medjuCue = 1;
        if(G.medju === 0){ AU.noise(0.10, 900, 1.0, 0.10); }
        else if(G.medju === 1){ AU.tone(120, 0.5, 'sine', 0.10, 90); }
        else if(G.medju === 2){ AU.pluck(587.33, 0.30, 0.15); AU.pluck(880, 0.30, 0.12, 0.12); }
        else if(G.medju === 3){ AU.tone(440, 0.20, 'square', 0.07, 660); }
        else if(G.medju === 4){ AU.ring(); }
        else { AU.noise(0.30, 700, 0.7, 0.09, 0, 1600); }
      }
      /* svaka međuigra ima svoj udarac negdje na sredini */
      if(G.medjuCue < 2 && ml > mi.cut*0.5){
        G.medjuCue = 2;
        if(G.medju === 0){ AU.thunk(); AU.noise(0.09, 2600, 1.6, 0.16); G.shake = 20; vib(24); }
        else if(G.medju === 2){ AU.coin(3); }
        else if(G.medju === 4){ AU.tone(300, 0.12, 'square', 0.08, 240); }
        else if(G.medju === 5){ AU.tone(520, 0.10, 'triangle', 0.09, 700); }
      }
      if(G.medjuCue < 3 && ml > mi.cut){
        G.medjuCue = 3;
        G.sceneLevel = G.level;              /* rez na novo mjesto */
        var f4 = [293.66, 369.99, 440.00, 587.33];
        for(var q4=0; q4<f4.length; q4++) AU.pluck(f4[q4], 0.46, 0.15, q4*0.11);
      }
      if(G.medjuCue < 4 && ml > mi.cut + 0.7){ G.medjuCue = 4; AU.chip(); }
      if(ml > mi.dur){
        G.levatLeavePhase = 0;
        newGame();
      }
    }
  } else {
    if(G.levatHold > 0) G.levatHold -= dt;
    /* dok Minka zove (telefon na ekranu), Levat se drži po strani */
    var minkaTel = (G.minka === 1 && (G.st === S.SHOW || G.st === S.MIX || G.st === S.PICK));
    var wantLevat = !G.levatGone && G.minkaAnim < 0.15 && G.hakalaAnim < 0.15 && !minkaTel &&   /* dvoje na sceni je gužva */
                   ((G.levatT > 0) || (G.st === S.PICK && G.levatTip >= 0) || (G.levatHold > 0));
    if(!wantLevat && G.st !== S.INTRO && G.st !== S.POBJEDA && G.st !== S.BJEG){
      G.levatIdleT -= dt;
      if(G.levatIdleT <= 0){ G.levatHold = rnd(0.9, 1.6); G.levatIdleT = rnd(24, 42); }
    }
    if(G.st === S.INTRO){
      /* uvod #4: Levat najavljuje emisiju kao spiker */
      var levNajava = (G.introVar === 3 && G.t > 2.55 && G.t < 6.60);
      G.levatPeek = levNajava ? lerp(G.levatPeek, 1, Math.min(1, dt*7)) : 0;
    }
    else if(G.levatGone){ G.levatPeek = 0; }
    else G.levatPeek = lerp(G.levatPeek, wantLevat ? 1 : 0, Math.min(1, dt*(wantLevat ? 7 : 4.5)));
  }
  /* Minka dolazi lično — na dočeku je stalno tu kao voditeljka */
  var ft2 = (G.minka === 2 ||
             (G.silvester && G.st !== S.INTRO && G.st !== S.BJEG && G.st !== S.POBJEDA)) ? 1 : 0;
  G.minkaAnim = lerp(G.minkaAnim, ft2, Math.min(1, dt*4.2));
  /* Hakala dolazi za sto kad miješa */
  G.hakalaAnim = lerp(G.hakalaAnim, G.hakalaRunda ? 1 : 0, Math.min(1, dt*3.4));
  if(G.minka === 2 && !G.minkaSeen && G.minkaAnim > 0.45){
    G.minkaSeen = true;
    G.minkaSay = pick(LB('MINKA_ONA')); G.minkaSayT = 4.2;
    AU.tone(1400,0.05,'square',0.06,900); AU.tone(1400,0.05,'square',0.05,900,0.14);
  }
  if(G.minka !== 2) G.minkaSeen = false;
  if(G.minkaSayT>0) G.minkaSayT -= dt;
  /* dim iz pepeljare (na dočeku: konfete umjesto dima) */
  if(!G.silvester && G.st !== S.BJEG && G.st !== S.POBJEDA && G.st !== S.INTRO){
    G.smokeT -= dt;
    if(G.smokeT <= 0 && G.smoke.length < 18){
      G.smokeT = (G.level === MJ_KAFIC) ? 0.16 : ((scena() === 1) ? 0.20 : 0.28);
      /* žar je na (143, TABLEY+47) — dim mora krenuti odatle */
      G.smoke.push({x:143+rnd(-3,3), y:TABLEY+44, vx:rnd(-5,12), vy:rnd(-42,-26), r:5, life:1});
    }
  }
  for(i=G.smoke.length-1;i>=0;i--){
    var sm = G.smoke[i];
    sm.life -= dt*(sm.bomba ? 0.55 : 0.13);   /* bomba se raziđe brže od cigare */
    sm.x += (sm.vx + Math.sin(G.gt*0.9 + sm.y*0.01)*9)*dt;
    sm.y += sm.vy*dt;
    sm.vy *= (1 - dt*0.25);
    sm.r += 17*dt;
    if(sm.life <= 0 || sm.y < 120) G.smoke.splice(i,1);
  }
  /* Silvestrovo — konfete padaju cijelu partiju */
  if(G.silvester && G.st !== S.INTRO){
    G.konfT -= dt;
    if(G.konfT <= 0 && G.konf.length < 36){
      G.konfT = 0.12;
      G.konf.push({x:rnd(20,700), y:-12, vy:rnd(46,90), ph:rnd(0,6.28),
        rot:rnd(0,6.28), vr:rnd(-3,3), r:rnd(3.5,6.5),
        c:pick(['#f0c46a','#e87a9a','#8fd48f','#9fc3da','#e8734a'])});
    }
  }
  for(i=G.konf.length-1;i>=0;i--){
    var kf = G.konf[i];
    kf.y += kf.vy*dt;
    kf.x += Math.sin(G.gt*2.2 + kf.ph)*36*dt;
    kf.rot += kf.vr*dt;
    if(kf.y > 1170) G.konf.splice(i,1);
  }
  if(G.onom){
    G.onom.t += dt;
    if(G.onom.t > 1.25) G.onom = null;
  }
  updateBird(dt);
  if(G.sayT>0) G.sayT -= dt;
  if(G.levatT>0) G.levatT -= dt;
  if(G.okoT>0){ G.okoT -= dt; if(G.st===S.MIX||G.st===S.PICK) G.cups[G.cube].hi = 1; }

  var i,p;
  for(i=G.parts.length-1;i>=0;i--){
    p = G.parts[i]; p.life -= dt;
    p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.life<=0) G.parts.splice(i,1);
  }
  for(i=G.rings.length-1;i>=0;i--){
    p = G.rings[i]; p.life -= dt*2.2; p.r = lerp(p.r,p.max,dt*7);
    if(p.life<=0) G.rings.splice(i,1);
  }
  for(i=G.coins.length-1;i>=0;i--){
    p = G.coins[i]; p.life -= dt;
    if(p.kotrlja){
      /* kotrlja se po stolu dok ne stane */
      p.x += p.vx*dt;
      p.rot += p.vx*dt/Math.max(4, p.r);
      p.vx *= Math.pow(0.28, dt);
      if(Math.abs(p.vx) < 12) p.vx = 0;
    }else{
      p.vy += 1500*dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
      if(p.y > TABLEY-30 && p.vy>0){
        p.y = TABLEY-30;
        if(Math.abs(p.vy) < 220 && Math.abs(p.vx) > 20){
          p.kotrlja = true; p.vy = 0; p.vr = 0;
        }else{
          p.vy *= -0.42; p.vx *= 0.72;
        }
      }
    }
    if(p.life<=0) G.coins.splice(i,1);
  }

  for(i=0;i<G.nc;i++){
    var c = G.cups[i];
    c.wob *= Math.pow(0.02, dt);
    c.hi = lerp(c.hi, 0, dt*6);
    c.sq = lerp(c.sq, 1, dt*10);
  }

  switch(G.st){
    case S.INTRO: {
      var it = G.t;
      var iv = G.introVar;
      if(G.introCue < 1 && it > 0.02){
        G.introCue = 1;
        AU.noise(0.10, 2400, 1.4, 0.13); AU.tone(70, 0.28, 'sine', 0.13, 44);
      }
      if(G.introCue < 2 && it > 0.9){
        G.introCue = 2;
        if(iv === 1) AU.tone(440, 0.35, 'sine', 0.05, 440);
        else AU.tone(1000, 1.45, 'sine', 0.045);
      }
      if(G.introCue < 3 && it > 2.45){
        G.introCue = 3;
        if(iv === 1){
          /* klapa! */
          AU.thunk(); AU.tone(1600, 0.10, 'square', 0.12, 900);
          G.shake = 12; vib(24);
        }else{
          AU.noise(0.5, 1100, 0.5, 0.11, 0, 380);
        }
      }
      /* srednji dio — svaki uvod svoja mala scena */
      if(iv === 1){          /* filmski set: klapa, pa zbunjeni Šaner */
        if(G.introCue < 4 && it > 3.10){ G.introCue = 4; say(T('intKlapa2'), 2.0); }
        if(G.introCue < 5 && it > 4.60){ G.introCue = 5; G.poke = 0.5; }
      }else if(iv === 2){    /* telefonira s Minkom, pa panika */
        if(G.introCue < 4 && it > 2.60){
          G.introCue = 4;
          say(T('intTel1'), 2.2);
          AU.tone(880, 0.07, 'square', 0.04, 700);
        }
        if(G.introCue < 5 && it > 4.30){
          G.introCue = 5;
          say(T('intTel2'), 1.9);
          AU.tone(180, 0.3, 'sawtooth', 0.12, 90);
          G.shake = 12; G.poke = 0.8; vib([16,50,16]);
        }
      }else if(iv === 3){    /* Levat najavljuje kao spiker */
        if(G.introCue < 4 && it > 2.70){
          G.introCue = 4;
          levatSay(T('intLevat1'), 3.4);
          AU.tone(520, 0.10, 'square', 0.06, 400);
        }
        if(G.introCue < 5 && it > 4.60){
          G.introCue = 5;
          say(T('intLevat2'), 2.0);
          G.poke = 0.5;
        }
      }else{                 /* klasika: zatečen broji pare */
        if(G.introCue < 4 && it > 2.98){
          G.introCue = 4;
          say(T('brojiPare'), 1.60);
        }
        if(G.introCue < 5 && it > 4.30){
          G.introCue = 5;
          say(T('snimaLi'), 1.90);
          AU.noise(0.22, 300, 0.7, 0.16, 0, 1500);
          AU.tone(180, 0.3, 'sawtooth', 0.12, 90);
          G.shake = 16; G.poke = 0.9; vib([16,50,16]);
        }
      }
      /* 3) fildžani na sto */
      for(i=0;i<G.nc;i++){
        var ic = G.cups[i];
        var t0 = 5.10 + i*0.30;
        if(it < t0){
          ic.a = 0; ic.lift = 1.9; ic.grab = false; ic.sq = 1;
        }else{
          ic.a = 1;
          var dd = clamp((it-t0)/0.30, 0, 1);
          ic.lift = 1.9*(1-eic(dd));
          if(dd >= 1 && !ic.grab){
            ic.grab = true; ic.sq = 0.76;
            AU.thunk(); G.shake = 7;
            dust(SLOTX[ic.slot], TABLEY, 6);
          }
        }
      }
      /* 4) uljudan pozdrav */
      if(G.introCue < 6 && it > 6.10){
        G.introCue = 6;
        say(T('dobroVece'), 1.80);
      }
      /* 5) naslov */
      if(G.introCue < 7 && it > 7.30){
        G.introCue = 7;
        AU.tone(84, 0.55, 'sine', 0.17, 46);
        AU.pluck(293.66, 0.7, 0.16);
        G.shake = 20; vib([12,40,12]);
      }
      break;
    }

    case S.BET:
      for(i=0;i<G.nc;i++) G.cups[i].lift = lerp(G.cups[i].lift, 0, dt*9);
      if(G.levatLeavePhase === 0) idleGunđanje(dt, true);
      break;

    case S.SHOW:
      /* fildžani se dignu, kuglica se vidi, pa se spuste */
      var up = clamp(G.t/0.42, 0, 1);
      var hold = 1.15, down = 0.34;
      if(G.t < 0.42 + hold){
        for(i=0;i<G.nc;i++) G.cups[i].lift = eoc(up);
      }else{
        var d = clamp((G.t-0.42-hold)/down,0,1);
        for(i=0;i<G.nc;i++) G.cups[i].lift = 1-eic(d);
        if(d>=1){
          AU.thunk(); vib(18);
          for(i=0;i<G.nc;i++) dust(SLOTX[i],TABLEY,5);
          G.shake = 7;
          for(i=0;i<G.nc;i++) G.cups[i].sq = 0.80;
          G.st = S.MIX; G.t = 0;
          say(pick(LB('MIX')), 1.6);
        }
      }
      break;

    case S.MIX:
      var sdt = dt * (G.kafaOn ? 0.55 : 1);
      if(!G.swActive){
        if(G.hakalaCheckT > 0){
          /* Hakala je zaboravio — digne fildžan da provjeri, svi vide kuglicu */
          G.hakalaCheckT -= dt;
          var hcc = G.cups[G.cube];
          hcc.lift = Math.sin(Math.PI * clamp(1 - G.hakalaCheckT/1.7, 0, 1)) * 0.55;
          if(G.hakalaCheckT <= 0){
            hcc.lift = 0;
            AU.thunk(); dust(SLOTX[hcc.slot], TABLEY, 5); vib(14);
            G.t = 0.05;
          }
        } else if(G.hakalaRunda && !G.hakalaChecked && G.si === G.hakalaCheckAt &&
                  G.si < G.swaps.length && G.t > 0.25){
          G.hakalaChecked = true; G.hakalaCheckT = 1.7;
          say(T('hakalaZaboravio'), 2.0);
          AU.tone(300, 0.2, 'sine', 0.08, 180);
        } else if(G.t > 0.25){ beginSwap(); }
      }else{
        G.sw += sdt / G.swDur;
        var t = clamp(G.sw,0,1);
        if(G.cheated && !G.cheatDone && t>=0.5){
          G.cheatDone = true;
          var s = G.swaps[G.si];
          /* kuglica prelazi pod drugi fildžan — Šaner je podvalio */
          var a = cupAt(s[0]), b = cupAt(s[1]);
          G.cube = (G.cups.indexOf(a)===G.cube) ? G.cups.indexOf(b) : G.cups.indexOf(a);
          AU.glint();
          G.tellX = lerp(SLOTX[s[0]],SLOTX[s[1]],0.5); G.tellY = TABLEY-104; G.tell = 1;
          burst(G.tellX, G.tellY, 12, '#fff3c4');
          G.rings.push({x:G.tellX, y:G.tellY, r:14, max:120, life:1, c:'#fff3c4'});
        }
        for(i=0;i<G.nc;i++){
          var cc = G.cups[i];
          if(cc.from !== cc.to){
            cc.x = G.fakeSwap ? lerp(cc.from, cc.to, Math.sin(Math.PI*t)) : lerp(cc.from, cc.to, eio(t));
            var h = cc.over ? 92 : 13;
            cc.lift = Math.sin(Math.PI*t) * (h/LIFTH);
            cc.tilt = Math.sin(Math.PI*t) * (cc.to>cc.from?0.16:-0.16) * (cc.over?1:0.4);
          }
        }
        if(t>=1){
          for(i=0;i<G.nc;i++){
            var c2 = G.cups[i];
            c2.x = SLOTX[c2.slot]; c2.from = c2.x; c2.to = c2.x;
            c2.lift = 0; c2.tilt = 0;
          }
          G.swActive = false; G.si++;
          AU.tone(110,0.07,'sine',0.10,70);
          /* zapamtio je tvoj omiljeni fildžan: ako je kuglica baš tu, prošeta je još jednom */
          if(G.si >= G.swaps.length && G.navika >= 0 && !G.navikaDone && !G.hakalaRunda &&
             G.cups[G.cube].slot === G.navika && Math.random() < 0.75){
            G.navikaDone = true;
            var nb = G.navika + ((G.navika === G.nc-1) ? -1 : 1);
            G.swaps.push([G.navika, nb]);
            say(T('navika'), 2.4);
            AU.tone(420, 0.12, 'triangle', 0.09, 300);
          }
          if(G.si >= G.swaps.length){
            G.st = S.PICK; G.t = 0;
            if(!G.tut){
              G.tut = true; save();
              say(T('tut'), 3.4);
            }else{
              say(T('gdjeKuglica'), 6);
            }
            for(i=0;i<G.nc;i++) G.cups[i].sq = 0.92;
            /* golub s krova panelaka sleti na fildžan — najčešće na pravi */
            if(G.round >= 3 && Math.random() < ((G.level === MJ_KAFIC) ? 0.36 : 0.18)){
              var bs = (Math.random()<0.55) ? -70 : W+70;
              G.bird.on = true; G.bird.phase = 0; G.bird.t = 0;
              G.bird.perch = false; G.bird.leave = false;
              G.bird.sx = bs; G.bird.x = bs; G.bird.y = -40;
              G.bird.cupIdx = -1;
              G.bird.slot = (Math.random() < 0.72) ? G.cups[G.cube].slot : ri(0,G.nc-1);
              levatSay(pick(LB('BIRD')), 4.2);
            }
            /* Levat daje savjet od kojeg nema koristi — ali ne dok je Minka na vezi */
            else if(G.minka !== 1 && Math.random() < 0.28){
              G.levatTip = ri(0,G.nc-1);
              levatSay(pick(LB('TIP')), 4.0);
            }
            /* Ćiro, stalna mušterija — glasno tipuje, i to opasno dobro.
               Dok Minka zove, i publika šuti. */
            else if(!G.ciroTjeran && G.minka !== 1 && G.round >= 3 && Math.random() < 0.22){
              G.ciroTip = (Math.random() < 0.65) ? G.cups[G.cube].slot : ri(0, G.nc-1);
              levatSay(T('ciroKaze'), 4.0);
              AU.tone(600, 0.10, 'square', 0.06, 480);
            }
          }else{
            G.t = 0.2; /* mali predah između zamjena */
          }
        }
      }
      break;

    case S.PICK:
      for(i=0;i<G.nc;i++) G.cups[i].lift = Math.sin(G.gt*2.2 + i)*0.012;
      /* bura u noćnim scenama — fildžani se prošetaju za jedan slot */
      if(!G.vjetar && !G.vjetarBio && scena() === 2 && !G.bird.on && G.t > 1.4 &&
         Math.random() < dt*0.11){
        G.vjetarBio = true;
        var vdir = (Math.random() < 0.5) ? 1 : -1;
        for(i=0;i<G.nc;i++){
          var vc = G.cups[i];
          vc.vFrom = vc.slot; vc.vTo = (vc.slot + vdir + G.nc) % G.nc;
          vc.vHop = (vdir === 1 && vc.slot === G.nc-1) || (vdir === -1 && vc.slot === 0);
        }
        /* savjeti prate fildžane, ne mjesta */
        if(G.levatTip >= 0) G.levatTip = (G.levatTip + vdir + G.nc) % G.nc;
        if(G.ciroTip >= 0) G.ciroTip = (G.ciroTip + vdir + G.nc) % G.nc;
        G.vjetar = {t:0, dur:0.6, dir:vdir};
        say(T('vjetar'), 2.2);
        AU.noise(0.8, 320, 0.5, 0.16, 0, 1100);
        G.shake = 8; vib(20);
        for(i=0;i<14;i++) G.parts.push({x:(vdir===1 ? -10 : 730), y:rnd(500,860),
          vx:vdir*rnd(260,520), vy:rnd(-170,-40), life:rnd(0.5,0.9), max:1,
          r:rnd(2,5), c:(i%3) ? '#8a793f' : '#6f7a3a'});
      }
      if(G.vjetar){
        G.vjetar.t += dt;
        var wt = clamp(G.vjetar.t/G.vjetar.dur, 0, 1);
        for(i=0;i<G.nc;i++){
          var wc = G.cups[i];
          wc.x = lerp(SLOTX[wc.vFrom], SLOTX[wc.vTo], eio(wt));
          wc.lift = Math.sin(Math.PI*wt) * (wc.vHop ? 0.95 : 0.10);
          wc.tilt = Math.sin(Math.PI*wt) * 0.18 * G.vjetar.dir * (wc.vHop ? 2 : 1);
        }
        if(wt >= 1){
          for(i=0;i<G.nc;i++){
            var wd = G.cups[i];
            wd.slot = wd.vTo; wd.x = SLOTX[wd.slot]; wd.from = wd.x; wd.to = wd.x;
            wd.lift = 0; wd.tilt = 0;
            dust(wd.x, TABLEY, 4);
          }
          AU.thunk(); vib(14);
          G.vjetar = null;
        }
      }
      /* Levat je zapeo za sto — fildžan s kuglicom se nakrivi */
      if(G.nakrivT > 0){
        G.nakrivT -= dt;
        var nkc = G.cups[G.cube];
        var nk = Math.sin(Math.PI * clamp(1 - G.nakrivT/1.1, 0, 1));
        nkc.lift = nk * 0.42;
        nkc.tilt = nk * 0.30;
        if(G.nakrivT <= 0){ nkc.lift = 0; nkc.tilt = 0; AU.thunk(); }
      }
      idleGunđanje(dt, false);
      break;

    case S.REVEAL:
      var pc = cupAt(G.picked);
      if(G.revPhase===0){
        pc.lift = eoc(clamp(G.t/0.34,0,1));
        if(G.t>0.34 && !G.resolved){ G.resolved = true; resolve(); }
        if(G.t > 1.5){
          if(G.won){ G.st = S.RESULT; G.t = 0; G.resolved=false; }
          else { G.revPhase = 1; G.t = 0; }
        }
      }else{
        var cc2 = G.cups[G.cube];
        cc2.lift = eoc(clamp(G.t/0.34,0,1));
        if(G.t>0.30 && !G.shownTruth){
          G.shownTruth = true;
          if(G.cheatAt>=0 && !G.tellSeen){
            G.tellSeen = true;
            levatSay(T('bljesak'), 5.5);
          }
          burst(SLOTX[cc2.slot], TABLEY-130, 12, '#fff0c0');
          AU.tone(660,0.18,'triangle',0.12,880);
        }
        if(G.t > 1.5){ G.st = S.RESULT; G.t = 0; G.resolved=false; G.shownTruth=false; }
      }
      break;

    case S.RESULT:
      if(G.t > 2.0 && G.levatLeavePhase === 0) nextRound();
      break;

    case S.BJEG: {
      fleeUpdate(G.t, dt);
      if(G.t > 4.4 && G.levatLeavePhase !== 1 && G.levatLeavePhase !== 2) toPobjeda();
      break;
    }

    case S.RACIJA: {
      var rt2 = G.t;
      G.polA = lerp(G.polA, (rt2 < 4.4) ? 1 : 0, Math.min(1, dt*4));
      if(G.racijaIshod === 'hapsenje'){
        G.polA = lerp(G.polA, 1, Math.min(1, dt*4));
        if(G.racijaStep < 1 && rt2 > 1.4){
          G.racijaStep = 1;
          say(pick(LB('MILICIJA_UVOD')), 2.6);
          AU.thunk(); G.shake = 14; vib(40);
        }
        if(G.racijaStep < 2 && rt2 > 2.6){
          G.racijaStep = 2;
          say(T('rukeUvis'), 2.2);
        }
        if(rt2 > 3.6) pokreniMito();
        break;
      }
      if(G.racijaStep < 1 && rt2 > 1.5){
        G.racijaStep = 1;
        G.zaplijena = true;
        say(T('uzeliFildzan'), 3.2);
        AU.thunk(); G.shake = 12;
      }
      /* zaplijenjeni fildžan odlazi udesno */
      if(G.racijaIshod === 'zaplijena' && rt2 > 1.5){
        var zc = cupAt(G.nc-1);
        var zd = clamp((rt2-1.5)/0.8, 0, 1);
        zc.lift = Math.sin(Math.PI*zd)*0.7;
        zc.x = lerp(SLOTX[G.nc-1], 640, eic(zd));
        zc.tilt = zd*0.9;
        zc.a = 1-zd;
      }
      if(G.racijaStep < 2 && rt2 > 3.0){
        G.racijaStep = 2;
        levatSay(T('zvaoSamIh'), 3.6);
        G.levatHold = 2.4;
      }
      if(rt2 > 5.2){
        for(i=0;i<G.nc;i++){ G.cups[i].a = 1; G.cups[i].tilt = 0; G.cups[i].x = SLOTX[G.cups[i].slot]; }
        if(G.money < 5){ toOver(); }
        else toBet();
      }
      break;
    }

    case S.MITO: {
      G.polA = lerp(G.polA, 1, Math.min(1, dt*4));
      if(G.mitoFaza === 0){
        G.mitoT -= dt;
        if(G.mitoT <= 0){
          /* nema odgovora — vode obojicu */
          G.mitoFaza = 1; G.t = 0;
          G.mitoDato = -1;
          say(T('nemaOdgovora'), 3.0);
          AU.thunk(); G.shake = 16; vib([60,80,60]);
        }
      }else{
        if(G.t > 2.6){
          if(G.mitoDato === -2) toOdveli();
          else if(G.mitoDato >= G.mitoPrag){
            for(i=0;i<G.nc;i++){ G.cups[i].a = 1; G.cups[i].tilt = 0; G.cups[i].x = SLOTX[G.cups[i].slot]; }
            if(G.money < 5) toOver(); else toBet();
          }
          else toUhapsen();
        }
      }
      break;
    }

    case S.UHAPSEN: break;
    case S.ODVELI: break;

    case S.POBJEDA: break;

    case S.OVER: break;
  }
}

function updateBird(dt){
  var b = G.bird;
  if(!b.on) return;
  b.t += dt;
  var cup = (b.cupIdx >= 0) ? G.cups[b.cupIdx] : cupAt(b.slot);
  var tx = cup.x, ty = TABLEY - CUPH - cup.lift*LIFTH - 20;
  if(b.phase === 0){
    var k = clamp(b.t/1.1, 0, 1);
    b.dir = (tx > b.sx) ? 1 : -1;
    b.x = lerp(b.sx, tx, eio(k));
    b.y = lerp(-40, ty, eio(k)) - Math.sin(Math.PI*k)*70;
    if(k >= 1){ b.phase = 1; b.t = 0; b.perch = true; AU.coo(); vib(8); }
  }else if(b.phase === 1){
    b.x = tx; b.y = ty + Math.sin(G.gt*3)*2.5;
    if(b.t > 3.4 || b.leave){
      b.phase = 2; b.t = 0; b.perch = false; b.sx = b.x; b.sy = b.y;
      AU.noise(0.28, 900, 0.9, 0.09, 0, 2600);
    }
  }else{
    var k2 = clamp(b.t/0.9, 0, 1);
    b.x = b.sx + b.dir*k2*560;
    b.y = b.sy - k2*420;
    if(k2 >= 1) b.on = false;
  }
}

function pokeSaner(){
  G.poke = 1;
  say(pick(LB('TAP')), 2.6);
  AU.poke(); vib(8);
}

function nextRound(){
  G.resolved = false; G.shownTruth = false;
  G.minka = 0;
  if(G.money >= G.fleeCilj){ toFlee(); return; }
  /* povod: pare, serija ili prosto dugo trajanje emisije */
  var povod = (G.money >= 120 || G.streak >= 3 || G.round >= 10);
  /* što duže traje, to je vjerovatnije da neko prijavi */
  var sansaRacije = 0.14 + Math.min(0.22, Math.max(0, G.round - 8) * 0.02);
  if(G.racija < 2 && G.round >= 6 && povod && G.money >= 20 &&
     Math.random() < sansaRacije){
    toRacija(); return;
  }
  if(G.money < 5){ toOver(); return; }
  toBet();
}

/* kulisa: panelaci sa upaljenim prozorima */
function drawPanelak(x, base, w, h, seed){
  ctx.fillStyle = '#171b22';
  ctx.fillRect(x, base-h, w, h);
  ctx.fillStyle = '#12161c';
  ctx.fillRect(x, base-h, w, 7);
  var cols = Math.max(2, Math.floor(w/26)), rows = Math.max(2, Math.floor(h/30));
  for(var i=0;i<cols;i++){
    for(var j=0;j<rows;j++){
      var k = (i*7 + j*13 + seed*5) % 11;
      if(k > 5) continue;
      var fl = (k === 2) ? (0.55 + 0.45*Math.abs(Math.sin(G.gt*2.4 + i + j))) : 1;
      /* neka svjetla se pale i gase kroz vrijeme */
      if(k === 3 || k === 5){
        var sw = Math.sin(G.gt*0.22 + i*1.7 + j*0.9 + seed*2.3);
        fl *= clamp(0.15 + sw*1.6, 0, 1);
      }
      if(fl < 0.03) continue;
      ctx.fillStyle = (k === 0) ? 'rgba(150,196,220,'+(0.42*fl)+')' : 'rgba(255,206,124,'+(0.5*fl)+')';
      ctx.fillRect(x + 9 + i*26, base - h + 20 + j*30, 12, 16);
      /* topli odsjaj na fasadi */

    }
  }
  /* antene */
  ctx.strokeStyle = '#12161c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  var ax = x + w*0.5;
  ctx.beginPath(); ctx.moveTo(ax, base-h); ctx.lineTo(ax, base-h-26); ctx.stroke();
  for(var t2=0;t2<3;t2++){

    ctx.moveTo(ax-11, base-h-10-t2*7); ctx.lineTo(ax+11, base-h-10-t2*7); ctx.stroke();

}

function drawRedakcija(base){
  /* zid s monitorima */
  ctx.fillStyle = '#20272b';
  ctx.fillRect(24, base-300, W-48, 300);
  for(var i=0;i<8;i++){
    var mx2 = 56 + (i%4)*172, my2 = base-282 + Math.floor(i/4)*146;
    ctx.fillStyle = '#12171a';
    rr(ctx, mx2, my2, 148, 118, 8); ctx.fill();
    var sn = 0.28 + 0.2*Math.abs(Math.sin(G.gt*(2+i*0.7)));
    ctx.fillStyle = 'rgba(170,205,225,'+sn+')';
    rr(ctx, mx2+8, my2+8, 132, 84, 4); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.rect(mx2+8, my2+8, 132, 84); ctx.clip();
    if(i % 4 === 1){
      /* oscilogram */
      ctx.strokeStyle = 'rgba(20,40,50,0.65)'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for(var wv=0; wv<=132; wv+=6){
        var wy = my2+50 + Math.sin((wv*0.08) + G.gt*(3+i*0.4))*Math.sin(G.gt*0.9+i)*22;
        if(wv === 0) ctx.moveTo(mx2+8+wv, wy); else ctx.lineTo(mx2+8+wv, wy);
      }
      ctx.stroke();
    } else {
      /* tekst koji promiče */
      var roll = (G.gt*(14+i*4)) % 96;
      ctx.fillStyle = 'rgba(20,30,36,0.5)';
      for(var l=0;l<10;l++){
        var ly = my2+16+l*12 - roll;
        if(ly < my2+8 || ly > my2+88) continue;
        ctx.fillRect(mx2+16, ly, 100 - ((i+l)%3)*26, 4);

    ctx.restore();
    ctx.fillStyle = 'rgba(255,70,60,'+(0.4+0.6*Math.abs(Math.sin(G.gt*3+i)))+')';
    ctx.beginPath(); ctx.arc(mx2+138, my2+108, 4, 0, 6.284); ctx.fill();
  }
  /* papiri na zidu */
  ctx.fillStyle = 'rgba(232,226,208,0.8)';
  for(i=0;i<5;i++) ctx.fillRect(30+i*22, base-70, 16, 22);
}

function drawAutobus(base){
  /* unutrašnjost autobusa: prozori i rukohvati */
  ctx.fillStyle = '#2a2f36';
  ctx.fillRect(0, base-320, W, 320);
  for(var i=0;i<3;i++){
    var wx = 30 + i*230;
    ctx.fillStyle = '#0e141c';
    rr(ctx, wx, base-292, 200, 190, 14); ctx.fill();
    ctx.strokeStyle = '#4a525c'; ctx.lineWidth = 6;
    rr(ctx, wx, base-292, 200, 190, 14); ctx.stroke();
    /* kiša koja klizi niz staklo */
    ctx.save();
    ctx.beginPath(); rr(ctx, wx, base-292, 200, 190, 14); ctx.clip();
    for(var kd=0; kd<7; kd++){
      var dx3 = wx + 18 + ((kd*37 + i*23) % 170);
      var dy3 = (base-292) + ((G.gt*(70+kd*22) + kd*61 + i*40) % 190);
      ctx.fillStyle = 'rgba(190,215,235,0.30)';
      ctx.beginPath(); ctx.ellipse(dx3, dy3, 2.4, 7 + (kd%3)*3, 0, 0, 6.284); ctx.fill();
      ctx.fillStyle = 'rgba(190,215,235,0.14)';
      ctx.fillRect(dx3-1, dy3-26, 2, 22);
    }
    ctx.restore();
    /* svjetla grada kroz prozor — brža, jasnija */
    for(var k=0;k<9;k++){
      var lx = wx + ((G.gt*95 + k*52 + i*31) % 200);
      var bright = 0.35 + 0.45*((k+i)%3===0?1:0.6);
      ctx.fillStyle = 'rgba(255,210,130,'+bright+')';
      ctx.fillRect(lx, base-250 - (k%4)*22, 11, 18);
    }
  }
  /* rukohvat s ručkama */
  ctx.strokeStyle = '#6a727c'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(0, base-330); ctx.lineTo(W, base-336); ctx.stroke();
  for(i=0;i<5;i++){
    var hx = 70 + i*146, sw = Math.sin(G.gt*1.6 + i)*0.12;

    ctx.translate(hx, base-334); ctx.rotate(sw);
    ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,42); ctx.stroke();
    ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.ellipse(0, 54, 15, 14, 0, 0, 6.284); ctx.stroke();
    ctx.restore();
  }
}

function drawTehničar(base){
  /* svakih ~13 s neko pređe preko kulise */
  var per = 13.0, tt = G.gt % per;
  if(tt > 4.2) return;
  var k = tt/4.2;
  var dir = (Math.floor(G.gt/per) % 2) ? -1 : 1;
  var x = (dir > 0) ? lerp(-90, W+90, k) : lerp(W+90, -90, k);
  var bob = Math.abs(Math.sin(G.gt*7))*5;
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#0a0d12';
  ctx.translate(x, base + 6 - bob);
  ctx.scale(dir, 1);
  /* noge */
  ctx.strokeStyle = '#0a0d12'; ctx.lineWidth = 13; ctx.lineCap = 'round';
  for(var L=0;L<2;L++){
    var an = G.gt*7 + L*Math.PI;
    ctx.beginPath(); ctx.moveTo(0,-62); ctx.lineTo(Math.cos(an)*20, -4); ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(-24,-64); ctx.quadraticCurveTo(-26,-140, 0,-150);
  ctx.quadraticCurveTo(26,-140, 24,-64); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-168, 20, 22, 0, 0, 6.284); ctx.fill();
  /* nosi kutiju / kabal */
  ctx.strokeStyle = '#0a0d12'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(18,-120); ctx.lineTo(44,-96); ctx.stroke();
  ctx.fillRect(30, -96, 44, 34);
  ctx.restore();
}

    txt(T('snimaSe'), 568, 208, '900 34px system-ui,sans-serif', 'rgba(255,214,196,'+(0.55+0.45*on)+')');
    ctx.restore();

    ctx.moveTo(650, 700); ctx.lineTo(616, 578); ctx.lineTo(608, 578); ctx.lineTo(628, 700);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(570, 700); ctx.lineTo(604, 578); ctx.lineTo(612, 578); ctx.lineTo(592, 700);
    ctx.closePath(); ctx.fill();
    rr(ctx, 540, 470, 128, 96, 8); ctx.fill();
    ctx.fillStyle = '#0e1115';
    rr(ctx, 496, 494, 52, 48, 6); ctx.fill();
    ctx.fillStyle = '#2b3138';
    ctx.beginPath(); ctx.ellipse(496, 518, 9, 22, 0, 0, 6.284); ctx.fill();

    rr(ctx, 606, 436, 40, 36, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,60,50,'+(0.5+0.5*Math.abs(Math.sin(G.gt*3.1)))+')';
    ctx.beginPath(); ctx.arc(554, 484, 6, 0, 6.284); ctx.fill();
    ctx.restore();

    /* mikrofon */

    ctx.beginPath(); ctx.moveTo(742, 208); ctx.lineTo(486, 336); ctx.stroke();
    ctx.save();
    ctx.translate(482, 338); ctx.rotate(-0.46 + Math.sin(G.gt*0.9)*0.05);

    rr(ctx, -14, -12, 76, 26, 13); ctx.fill();

    for(var m=0;m<5;m++) ctx.fillRect(2+m*11, -8, 5, 18);

/* CRT-sloj preko svega: linije, valjanje slike, vinjeta */
function drawCRT(){
  ctx.save();
  ctx.globalAlpha = 0.11;
  ctx.fillStyle = '#000';
  for(var y=0;y<HH;y+=4) ctx.fillRect(0, y, W, 2);
  ctx.globalAlpha = 1;

  /* traka koja putuje – tracking */
  var by = (G.gt*90) % (HH+300) - 150;
  var bg2 = ctx.createLinearGradient(0, by-60, 0, by+60);
  bg2.addColorStop(0,'rgba(255,255,255,0)');
  bg2.addColorStop(0.5,'rgba(255,255,255,0.045)');
  bg2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = bg2; ctx.fillRect(0, by-60, W, 120);

  /* vinjeta */
  if(!_vigG){
    _vigG = ctx.createRadialGradient(360, 640, 240, 360, 640, 780);
    _vigG.addColorStop(0,'rgba(0,0,0,0)');
    _vigG.addColorStop(1,'rgba(0,0,0,0.55)');
  }
  ctx.fillStyle = _vigG; ctx.fillRect(0,0,W,HH);
  ctx.restore();
}

/* Levat je samo glava koja proviri iza lijeve ivice — bez trupa i udova,
   pa nema ni predugih vratova ni ruku koje strše. */
var LEVAT_X = 46, LEVAT_Y = 680, LEVAT_R = 42;

function drawLevat(){
  /* uvod je Šanerov solo — osim kad Levat najavljuje (uvod #4) */
  if(G.st === S.INTRO && !(G.introVar === 3 && G.t > 2.55)) return;
  if(G.levatGone && G.levatLeavePhase !== 2) return;
  var pk = eoc(clamp(G.levatPeek, 0, 1));
  if(pk < 0.02) return;

  var talking = (G.levatT > 0);
  var pose = 'idle';
  if(G.levatLeavePhase > 0) pose = 'wave';
  else if(G.st === S.RESULT) pose = G.won ? 'joy' : 'sad';
  else if(G.st === S.PICK && G.levatTip >= 0) pose = 'point';
  else if(G.st === S.BJEG || G.st === S.POBJEDA) pose = 'wave';

  var nervous = (G.streak >= 5);
  var bob = Math.sin(G.gt*1.6)*3 + (nervous ? Math.sin(G.gt*9.5)*2 : 0);
  /* kad odlazi, ide još lijevo */
  var leaveOff = (G.levatLeavePhase === 2) ? (1-pk)*80 : 0;
  var hx = lerp(-110, LEVAT_X, pk) - leaveOff;
  var hy = LEVAT_Y + bob + (1-pk)*14;
  var tilt = lerp(0.98, 0.72, pk) + (pose === 'point' ? 0.05 : 0);
  var R = LEVAT_R;

  ctx.save();
  ctx.globalAlpha = clamp(pk*1.7, 0, 1);
  ctx.translate(hx, hy);
  ctx.rotate(tilt);

  /* vrat — izlazi iz kadra na lijevo, tijela nema u slici */
  ctx.fillStyle = '#b07d52';
  rr(ctx, -17, R-16, 34, 96, 10); ctx.fill();

  /* glava */
  ctx.fillStyle = '#c08a5e';
  ctx.beginPath(); ctx.ellipse(0, 0, R, R+4, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-R, 8, 8, 12, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R, 8, 8, 12, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = 'rgba(90,58,34,0.25)';
  ctx.beginPath(); ctx.ellipse(0, R+2, 19, 7, 0, 0, 6.284); ctx.fill();

  /* vijenac kose oko ćele */
  ctx.fillStyle = '#4a4038';
  ctx.beginPath(); ctx.ellipse(-R+4, -4, 10, 19, 0.25, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R-4, -4, 10, 19, -0.25, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -R-2, 27, 8, 0, Math.PI, 0); ctx.fill();

  /* debele naočale */
  var gy = -8;
  ctx.strokeStyle = '#241d18'; ctx.lineWidth = 5;
  ctx.fillStyle = 'rgba(190,225,240,0.45)';
  ctx.beginPath(); ctx.ellipse(-18, gy, 15, 13, 0, 0, 6.284); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(18, gy, 15, 13, 0, 0, 6.284); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-3, gy-2); ctx.lineTo(3, gy-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-33, gy-4); ctx.lineTo(-R, gy-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(33, gy-4); ctx.lineTo(R, gy-8); ctx.stroke();

  /* oči */
  var look = (pose === 'point') ? 5 : (G.st === S.MIX ? 4 + Math.sin(G.gt*3)*2 : 2);
  if(pose === 'sad'){
    ctx.strokeStyle = '#241a14'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(-18, gy, 8, 3.5, 6.0); ctx.stroke();
    ctx.beginPath(); ctx.arc(18, gy, 8, 3.5, 6.0); ctx.stroke();
  }else{
    ctx.fillStyle = '#241a14';
    ctx.beginPath(); ctx.arc(-18+look, gy+1, 5.2, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc(18+look, gy+1, 5.2, 0, 6.284); ctx.fill();

  }else if(talking){

  /* strnjika */
  ctx.fillStyle = 'rgba(60,48,38,0.20)';
  ctx.beginPath(); ctx.ellipse(0, gy+32, 24, 17, 0, 0, 6.284); ctx.fill();

}

function drawRacija(){
  if(G.polA < 0.02) return;
  if(G.st === S.UHAPSEN || G.st === S.ODVELI) return;
  var k = eoc(G.polA);
  /* rotacija plavog i crvenog po rubovima */
  var ph = Math.sin(G.gt*7) > 0;
  ctx.save();
  ctx.globalAlpha = k*0.55;
  var lg = ctx.createLinearGradient(0,0,240,0);
  lg.addColorStop(0, ph ? 'rgba(70,130,255,0.85)' : 'rgba(255,60,60,0.55)');
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0,0,240,HH);
  var rg2 = ctx.createLinearGradient(W,0,W-240,0);
  rg2.addColorStop(0, ph ? 'rgba(255,60,60,0.85)' : 'rgba(70,130,255,0.55)');
  rg2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg2; ctx.fillRect(W-240,0,240,HH);
  ctx.restore();

  drawPandur(lerp(-190, 128, k), 604, 0.92, 1);
  drawPandur(lerp(W+190, 604, k), 596, 0.96, -1);
}

  ctx.beginPath(); ctx.ellipse(fx+16, hy-2+bob, 6, 7, 0, 0, 6.284); ctx.fill();

  ctx.beginPath(); ctx.moveTo(fx+27, hy-20+bob); ctx.lineTo(fx+7, hy-14+bob); ctx.stroke();

  }else{

function drawSaner(){
  if(G.sanerA <= 0.01) return;   /* dimna bomba — nema ga više */
  var cx = 360, hy = 508;
  var breathe = Math.sin(G.gt*1.7)*(4 + G.nervA*1.6) + (G.nervA > 1.6 ? Math.sin(G.gt*11)*G.nervA*0.7 : 0);
  if(G.poke > 0) breathe += Math.sin(G.poke*34)*7*G.poke;

  /* ruke ciljaju čaše tokom miješanja */
  var lt = {x:250, y:770}, rt = {x:470, y:770};
  if(G.hakalaRunda && G.st === S.MIX){
    /* Hakala miješa — Šaner prekrsti ruke i pati */
    lt = {x:cx+34, y:702}; rt = {x:cx-34, y:708};
  } else if(G.st === S.MIX && G.swActive){
    var moving = [];
    for(var i=0;i<G.nc;i++) if(G.cups[i].from !== G.cups[i].to) moving.push(G.cups[i]);
    if(moving.length===2 && G.jednaRuka){
      var m0 = moving[0], m1 = moving[1];
      var near = (Math.abs(m0.x-360) < Math.abs(m1.x-360)) ? m1 : m0;
      rt = {x:near.x+20, y:TABLEY-96-near.lift*LIFTH};
      lt = {x:296, y:812};                     /* druga ruka iza leđa */
    } else if(moving.length===2){
      var m0 = moving[0], m1 = moving[1];
      var a = (m0.x < m1.x) ? m0 : m1, b = (m0.x < m1.x) ? m1 : m0;
      lt = {x:a.x-20, y:TABLEY-96-a.lift*LIFTH};
      rt = {x:b.x+20, y:TABLEY-96-b.lift*LIFTH};
    }
  } else if(G.st === S.SHOW || G.st === S.REVEAL){
    lt = {x:290, y:748}; rt = {x:430, y:748};
  } else if(G.st === S.MITO || (G.st === S.RACIJA && G.racijaIshod === 'hapsenje' && G.t > 1.4)){
    var uv = Math.sin(G.gt*2)*4;
    lt = {x:cx-86, y:498+uv}; rt = {x:cx+86, y:492-uv};
  } else if(G.st === S.BJEG){
    lt = {x:cx-46, y:706}; rt = {x:cx+54, y:694};
    if(G.fleeVar === 'milicija' && G.t > 0.75 && G.t < 1.7){
      /* pokazuje iza tebe */
      rt = {x:cx+168, y:556 + Math.sin(G.gt*7)*4};
      lt = {x:cx-58, y:730};
    } else if(G.fleeVar === 'sto' && G.t > 0.9 && G.t < 1.9){
      /* hvata rub stola */
      lt = {x:cx-96, y:TABLEY-26}; rt = {x:cx+96, y:TABLEY-34};
    } else if(G.fleeVar === 'dim' && G.t > 0.9 && G.t < 1.55){
      /* poseže u prsluk po bombu */
      rt = {x:cx+18, y:668}; lt = {x:cx-64, y:736};
    }
  } else if(G.gest > 0 && (G.st === S.BET || G.st === S.PICK)){
    /* nervozne geste: popravlja kačket, briše čelo, broji kasu */
    var gf = clamp(G.gestT / 1.2, 0, 1);          /* traje zadnjih 1.2 s ciklusa */
    var jak = (gf > 0 ? 0 : 1);
    if(G.gest === 1){                              /* popravlja kačket */
      rt = {x:cx+42, y:452 + Math.sin(G.gt*6)*6};
      lt = {x:cx-72, y:742};
    }else if(G.gest === 2){                        /* briše čelo */
      rt = {x:cx-6 + Math.sin(G.gt*7)*22, y:470};
      lt = {x:cx-74, y:748};
    }else{                                         /* broji kasu u prsluku */
      rt = {x:cx+26, y:672 + Math.sin(G.gt*9)*8};
      lt = {x:cx-30, y:700};
    }
  } else if(G.tapT > 0.2 && (G.st === S.BET || G.st === S.PICK)){
    var tp = Math.abs(Math.sin(G.gt*9));
    rt = {x:474, y:TABLEY - 34 - tp*18};
    lt = {x:250, y:TABLEY - 26};
  } else if(G.st === S.INTRO){
    if(G.introVar === 1){          /* filmski set: popravlja kačket, zbunjen */
      if(G.t < 4.6){ rt = {x:cx+42, y:452 + Math.sin(G.gt*5)*6}; lt = {x:cx-72, y:742}; }
      else { lt = {x:cx-70, y:744}; rt = {x:cx+70, y:740}; }
    }else if(G.introVar === 2){    /* telefonira s Minkom */
      if(G.t < 4.75){ rt = {x:cx+56, y:522}; lt = {x:cx-52, y:730}; }
      else { lt = {x:cx-70, y:744}; rt = {x:cx+70, y:740}; }
    }else if(G.introVar === 3){    /* sluša najavu, ruke na bokovima */
      lt = {x:cx-80, y:700}; rt = {x:cx+80, y:696};
    }else if(G.t < 3.62){          /* klasika: broji pare */
      lt = {x:cx-34, y:722}; rt = {x:cx+30, y:704 + Math.sin(G.gt*9)*6};
    }else if(G.t < 4.0){           /* strpa ih u prsluk */
      lt = {x:cx-40, y:730}; rt = {x:cx+14, y:668};
    }else{
      lt = {x:cx-70, y:744}; rt = {x:cx+70, y:740};
    }
  }

  ctx.save();
  if(G.sanerA < 1) ctx.globalAlpha = G.sanerA;
  /* bijeg: pomak, smanjenje, noge */
  if(G.sanerDX || G.sanerDY || G.sanerS !== 1){
    ctx.translate(G.sanerDX, G.sanerDY);
    ctx.translate(cx, 900); ctx.scale(G.sanerS, G.sanerS); ctx.translate(-cx, -900);
  }
  if(G.st === S.BJEG && G.t > G.fleeRunAt - 0.05){
    var ph = G.gt*15;
    ctx.strokeStyle = '#3b3145'; ctx.lineWidth = 26; ctx.lineCap = 'round';
    for(var L=0;L<2;L++){
      var a3 = ph + L*Math.PI;
      var kx = cx + Math.cos(a3)*58, ky = 946 - Math.max(0, Math.sin(a3))*54;
      ctx.beginPath(); ctx.moveTo(cx + (L?16:-16), 848); ctx.lineTo(kx, ky); ctx.stroke();
      ctx.fillStyle = '#241a14';
      ctx.beginPath(); ctx.ellipse(kx+9, ky+8, 21, 10, 0, 0, 6.284); ctx.fill();
    }
  }
  /* košulja – uska ramena, ravan kroj (nikakav ogrtač) */
  var sy0 = 604+breathe;
  ctx.fillStyle = '#e6d9bf';
  ctx.beginPath();
  ctx.moveTo(cx-74, 890);
  ctx.quadraticCurveTo(cx-76, 664+breathe, cx-60, sy0+4);
  ctx.quadraticCurveTo(cx-32, 588+breathe, cx, 588+breathe);
  ctx.quadraticCurveTo(cx+32, 588+breathe, cx+60, sy0+4);
  ctx.quadraticCurveTo(cx+76, 664+breathe, cx+74, 890);
  ctx.closePath(); ctx.fill();
  /* nabori na košulji */
  ctx.strokeStyle = 'rgba(120,100,74,0.25)'; ctx.lineWidth = 2;
  for(var f=0;f<3;f++){
    ctx.beginPath();
    ctx.moveTo(cx-40+f*4, 700+breathe+f*10);
    ctx.quadraticCurveTo(cx, 716+breathe+f*12, cx+40-f*4, 700+breathe+f*10);
    ctx.stroke();
  }
  /* prsluk – dva panela, otvoren na prsima */
  ctx.fillStyle = '#6d2530';
  ctx.beginPath();
  ctx.moveTo(cx-62, sy0);
  ctx.quadraticCurveTo(cx-74, 690+breathe, cx-72, 890);
  ctx.lineTo(cx-16, 890);
  ctx.lineTo(cx-8, 706+breathe);
  ctx.lineTo(cx-22, 622+breathe);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+62, sy0);
  ctx.quadraticCurveTo(cx+74, 690+breathe, cx+72, 890);
  ctx.lineTo(cx+16, 890);
  ctx.lineTo(cx+8, 706+breathe);
  ctx.lineTo(cx+22, 622+breathe);
  ctx.closePath(); ctx.fill();
  /* rub prsluka u zlatnom vezu */
  ctx.strokeStyle = 'rgba(230,186,112,0.55)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx-22, 622+breathe); ctx.lineTo(cx-8, 706+breathe); ctx.lineTo(cx-16, 890); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+22, 622+breathe); ctx.lineTo(cx+8, 706+breathe); ctx.lineTo(cx+16, 890); ctx.stroke();
  /* dugmad */
  ctx.fillStyle = 'rgba(230,186,112,0.8)';
  for(var bb=0;bb<3;bb++){
    ctx.beginPath(); ctx.arc(cx-30, 690+breathe+bb*46, 4.5, 0, 6.284); ctx.fill();
  }

  /* ruke */
  drawArm(cx-58, 648+breathe, lt.x, lt.y, -1);
  drawArm(cx+58, 648+breathe, rt.x, rt.y, 1);

  /* brick-telefon u ruci (uvod #3: zove ga Minka prije emisije) */
  if(G.st === S.INTRO && G.introVar === 2 && G.t < 4.75){
    ctx.save();
    ctx.translate(rt.x+8, rt.y-8);
    ctx.rotate(-0.32);
    ctx.fillStyle = '#22262b';
    rr(ctx, -15, -46, 30, 86, 6); ctx.fill();
    ctx.fillStyle = '#3c444c';
    rr(ctx, -10, -40, 20, 26, 3); ctx.fill();
    ctx.fillStyle = '#181b1f';
    ctx.fillRect(-6, -62, 5, 18);   /* antena */
    ctx.restore();
  }

  /* svežanj para koji broji na početku emisije (samo klasični uvod) */
  if(G.st === S.INTRO && G.introVar === 0 && G.t > 2.90 && G.t < 4.00){
    var pk = (G.t < 3.62) ? 1 : clamp((4.00-G.t)/0.34, 0, 1);
    ctx.save();
    ctx.globalAlpha = pk;
    ctx.translate(rt.x+4, rt.y-6);
    ctx.scale(0.6+0.4*pk, 0.6+0.4*pk);
    for(var nb=0;nb<5;nb++){
      var flick = (nb === 4 && G.t < 3.62) ? Math.abs(Math.sin(G.gt*9))*16 : 0;
      ctx.save();
      ctx.rotate(-0.34 + nb*0.16);
      ctx.translate(0, -flick);
      ctx.fillStyle = nb%2 ? '#9fb58f' : '#b6c8a4';
      rr(ctx, -6, -13, 52, 26, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(60,80,54,0.5)'; ctx.lineWidth = 1.5;
      rr(ctx, -6, -13, 52, 26, 3); ctx.stroke();
      ctx.fillStyle = 'rgba(60,80,54,0.35)';
      ctx.beginPath(); ctx.arc(20, 0, 6, 0, 6.284); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  /* bošča s parama pod miškom */
  if(G.st === S.BJEG && G.t > G.boscaAt){
    var bs = clamp((G.t-G.boscaAt)/0.35, 0, 1);
    ctx.save();
    ctx.translate(rt.x+16, rt.y+6); ctx.scale(bs, bs); ctx.rotate(0.2);
    ctx.fillStyle = '#b8323a';
    ctx.beginPath(); ctx.ellipse(0, 8, 42, 34, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#8f2028';
    ctx.beginPath(); ctx.ellipse(-10, 16, 26, 18, 0.3, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#b8323a';
    ctx.beginPath();
    ctx.moveTo(-16,-14); ctx.lineTo(0,-40); ctx.lineTo(12,-14); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2,-14); ctx.lineTo(20,-34); ctx.lineTo(20,-10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(232,199,140,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 6, 30, 0.4, 2.6); ctx.stroke();
    ctx.restore();
  }

  /* vrat + glava */
  ctx.fillStyle = '#c9946a';
  ctx.fillRect(cx-16, 566+breathe, 32, 40);
  /* kragna */
  ctx.fillStyle = '#f2e8d4';
  ctx.beginPath();
  ctx.moveTo(cx-26, 594+breathe); ctx.lineTo(cx-2, 600+breathe); ctx.lineTo(cx-6, 630+breathe);
  ctx.lineTo(cx-30, 606+breathe); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+26, 594+breathe); ctx.lineTo(cx+2, 600+breathe); ctx.lineTo(cx+6, 630+breathe);
  ctx.lineTo(cx+30, 606+breathe); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, hy+breathe, 56, 62, 0, 0, 6.284); ctx.fill();
  /* uši */
  ctx.beginPath(); ctx.ellipse(cx-56, hy+8+breathe, 9, 14, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+56, hy+8+breathe, 9, 14, 0, 0, 6.284); ctx.fill();

  /* oči prate čaše */
  var look = 0, lookY = 0;
  /* nervozan pogleda tvoje pare, pa vrata, pa milicijsku stranu */
  if(G.nervA >= 0.8 && (G.st === S.BET || G.st === S.PICK)){
    var faza = (G.gt*0.5) % 3;
    if(G.nerv >= 3) look = (faza < 1.4) ? -9 : 6;
    else if(G.nerv >= 2) look = (faza < 1.6) ? -8 : 3;
    else look = -7;
    lookY = -2;
  }
  if(G.minkaAnim > 0.5){ look = 9; lookY = 1; }
  else if(G.st===S.MIX || G.st===S.PICK || G.st===S.REVEAL){
    var target = (G.st===S.MIX && G.swActive) ? (lt.x+rt.x)/2 : SLOTX[(G.nc/2)|0];
    look = clamp((target-cx)/240, -1, 1)*7;
    lookY = 4;
  }
  ctx.fillStyle = '#fdf6ec';
  ctx.beginPath(); ctx.ellipse(cx-22, hy-6+breathe, 14, 10, 0,0,6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+22, hy-6+breathe, 14, 10, 0,0,6.284); ctx.fill();
  ctx.fillStyle = '#241a14';
  ctx.beginPath(); ctx.arc(cx-22+look, hy-5+lookY+breathe, 6, 0,6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+22+look, hy-5+lookY+breathe, 6, 0,6.284); ctx.fill();
  /* obrve – lukave */
  ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 5; ctx.lineCap='round';
  var obr = G.nervA*2.6;
  ctx.beginPath(); ctx.moveTo(cx-36, hy-26-obr+breathe); ctx.lineTo(cx-10, hy-21+obr+breathe); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+36, hy-26-obr+breathe); ctx.lineTo(cx+10, hy-21+obr+breathe); ctx.stroke();
  /* nos */
  ctx.strokeStyle = '#a8764f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx, hy-2+breathe); ctx.lineTo(cx-4, hy+14+breathe); ctx.lineTo(cx+6, hy+15+breathe); ctx.stroke();
  /* brkovi */
  ctx.fillStyle = '#2b1b12';
  ctx.beginPath();
  ctx.moveTo(cx, hy+22+breathe);
  ctx.quadraticCurveTo(cx-30, hy+16+breathe, cx-40, hy+30+breathe);
  ctx.quadraticCurveTo(cx-24, hy+30+breathe, cx, hy+30+breathe);
  ctx.quadraticCurveTo(cx+24, hy+30+breathe, cx+40, hy+30+breathe);
  ctx.quadraticCurveTo(cx+30, hy+16+breathe, cx, hy+22+breathe);
  ctx.closePath(); ctx.fill();
  /* osmijeh */
  ctx.strokeStyle = '#6b3a2a'; ctx.lineWidth = 3;
  if(G.nerv >= 3){
    /* stisnuta usta, bez osmijeha */
    ctx.beginPath(); ctx.moveTo(cx-16, hy+34+breathe); ctx.lineTo(cx+16, hy+33+breathe); ctx.stroke();
  }else if(G.nerv === 2){
    ctx.beginPath(); ctx.arc(cx, hy+40+breathe, 15, 3.6, 5.8); ctx.stroke();
  }else{
    ctx.beginPath(); ctx.arc(cx, hy+30+breathe, 17, 0.35, Math.PI-0.35); ctx.stroke();
  }

  /* znoj na čelu — jasnije vidljiv kad serija raste */
  if((G.nerv >= 2 || G.streak >= 3) && G.st !== S.BJEG){
    var nd = Math.min(5, 2 + Math.floor(G.streak/2));
    for(var d2=0; d2<nd; d2++){
      var dp = ((G.gt*0.48 + d2*0.29) % 1);
      ctx.save();
      ctx.globalAlpha = 0.92*(1-dp*0.85);
      /* svijetlija i veća kap */
      ctx.fillStyle = '#d8f4fc';
      var side = (d2 % 3) - 1;                 /* -1, 0, 1 → čelo lijevo/sredina/desno */
      var dx2 = cx + side*18 + (d2%2 ? 4 : -4);
      var dy2 = hy - 48 + breathe + dp*52;     /* počinje na čelu, klizi dolje */
      var sz = 1.15 + (1-dp)*0.35;
      ctx.beginPath();
      ctx.moveTo(dx2, dy2 - 11*sz);
      ctx.quadraticCurveTo(dx2 + 7*sz, dy2 + 1, dx2, dy2 + 9*sz);
      ctx.quadraticCurveTo(dx2 - 7*sz, dy2 + 1, dx2, dy2 - 11*sz);
      ctx.closePath(); ctx.fill();
      /* tamni obrub — bez njega se kap gubi na svijetlom licu */
      ctx.strokeStyle = 'rgba(24,86,120,0.85)'; ctx.lineWidth = 2.2;
      ctx.stroke();
      /* mali highlight */
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(dx2 - 2*sz, dy2 - 3*sz, 2.2*sz, 3.5*sz, 0, 0, 6.284);
      ctx.fill();
      ctx.restore();
    }
  }

  /* Minka zove — veliki ekran, da se vidi na telefonu */
  if(G.minka === 1 && (G.st === S.SHOW || G.st === S.MIX || G.st === S.PICK)){
    ctx.save();
    var wig = Math.sin(G.gt*24)*0.055;
    ctx.translate(cx+168, 600+breathe);
    ctx.rotate(0.14 + wig);
    /* sjaj ekrana */
    var pg = ctx.createRadialGradient(0,0,10,0,0,130);
    pg.addColorStop(0,'rgba(150,220,255,0.30)');
    pg.addColorStop(1,'rgba(150,220,255,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(0,0,130,0,6.284); ctx.fill();
    /* kućište */
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    rr(ctx, -54, -92, 108, 190, 18); ctx.fill();
    ctx.fillStyle = '#1b1726';
    rr(ctx, -58, -96, 116, 192, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,180,0.45)'; ctx.lineWidth = 2.5;
    rr(ctx, -58, -96, 116, 192, 18); ctx.stroke();
    /* ekran */
    ctx.fillStyle = '#7fc6e4';
    rr(ctx, -48, -84, 96, 168, 10); ctx.fill();
    /* avatar */
    ctx.fillStyle = '#2d5f74';
    ctx.beginPath(); ctx.arc(0, -46, 21, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#7fc6e4';
    ctx.beginPath(); ctx.arc(0, -52, 8.5, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -32, 14, 10, 0, Math.PI, 0); ctx.fill();
    txt(T('dMinka'), 0, -2, '900 30px system-ui,sans-serif', '#10323f');
    txt(T('dZove'), 0, 26, '700 17px system-ui,sans-serif', 'rgba(16,50,63,0.75)');
    /* tipke */
    ctx.fillStyle = '#3fa860';
    ctx.beginPath(); ctx.arc(-22, 60, 15, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#c9463c';
    ctx.beginPath(); ctx.arc(22, 60, 15, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#eaf6fb';
    ctx.beginPath(); ctx.arc(-22, 60, 5, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc(22, 60, 5, 0, 6.284); ctx.fill();
    /* valovi zvona */
    ctx.strokeStyle = 'rgba(255,220,170,0.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for(var w2=1; w2<=3; w2++){
      ctx.globalAlpha = 0.30 + 0.45*Math.abs(Math.sin(G.gt*8 - w2*0.7));
      ctx.beginPath(); ctx.arc(-58, 0, 42+w2*20, 2.35, 3.93); ctx.stroke();
    }
    ctx.restore();
  }

  /* kačket */
  ctx.fillStyle = '#3b3145';
  ctx.beginPath(); ctx.ellipse(cx, hy-52+breathe, 58, 32, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx-58, hy-54+breathe, 116, 8);
  ctx.beginPath(); ctx.ellipse(cx-14, hy-46+breathe, 62, 12, -0.06, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#2a2333';
  ctx.beginPath(); ctx.ellipse(cx-46, hy-44+breathe, 34, 9, -0.12, 0, 6.284); ctx.fill();
  ctx.restore();
}

function drawArm(sx,sy,hx,hy,side){
  var mx = (sx+hx)/2 + side*24, my = (sy+hy)/2 + 24;

  /* rukav košulje */
  ctx.strokeStyle = '#e6d9bf'; ctx.lineWidth = 25;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,hx,hy); ctx.stroke();

  ctx.strokeStyle = '#6d2530'; ctx.lineWidth = 28;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(lerp(sx,mx,0.34), lerp(sy,my,0.34));

  ctx.strokeStyle = 'rgba(150,128,96,0.5)'; ctx.lineWidth = 3;

  ctx.fillStyle = '#c9946a';
  ctx.beginPath(); ctx.ellipse(hx,hy,16,13,side*0.3,0,6.284); ctx.fill();
}
