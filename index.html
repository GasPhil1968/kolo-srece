function detectLang(){
  let l="";
  try{ l=(navigator.languages&&navigator.languages[0])||navigator.language||""; }catch(e){}
  l=String(l).toLowerCase();
  if(/^(sr|bs|hr|cnr|sh|me|sl|mk)/.test(l)) return "sr";
  if(/^de/.test(l)) return "de";
  return "en";
}
function TR(k,a,b){
  const tab=STR[LANG]||STR.de;
  let v=(k in tab)?tab[k]:STR.de[k];
  if(v===undefined) return k;
  if(a!==undefined) v=v.replace("%1",a);
  if(b!==undefined) v=v.replace("%2",b);
  return v;
}

  return [[c1,TR("callRun")+c1],[c2,"OPA!"],[a,"KIDAJ!"],[a*2,"MAJSTORE"]];
}

/* ═══════════ Klang ═══════════
   Alles synthetisch, aber nicht mehr aus einem Sägezahn. Eine Harmonika-
   zunge ist ein Metallblatt, das im Luftstrom schlägt: kein reiner Sägezahn,
   sondern ein Spektrum mit einer Nase um den sechsten Teilton — daher das
   Näselnde, an dem man sie sofort erkennt. Die Zunge braucht ein paar
   Millisekunden, bis sie »spricht«: sie setzt ein wenig zu tief an, zieht
   sich auf die Tonhöhe hoch und schießt in der Lautstärke kurz übers Ziel.
   Davor steht ein Luftgeräusch — das Anblasen, der »Chiff«.

   Zwei oder drei Zungen je Ton, gegeneinander verstimmt, geben die
   Schwebung. Ein Stimmer legt sie nicht in gleichen Cent an: im Bass
   breiter, im Diskant enger, sonst flattert die Höhe. Das steckt in
   reedDetune().

   Der Balg ist mehr als ein Lautstärkeregler. Mehr Druck heißt lauter,
   heller UND ein paar Cent höher — deshalb hängt an jeder Zunge eine
   Modulationsquelle, die den Druck auf die Verstimmung legt.

   Signalweg:
     Zungen  → reedFilt → Kammerfilter (Cassotto) → Panorama rechts ─┐
     Bässe   → bassFilt → Basskuppe      → Panorama links            ├→ belGain
                                                                     │
     belGain → Korpusresonanz → Sättigung → Kompressor → Ausgang     ┘
             ↘ Vorverzögerung → Kafana-Hall ─────────────────────────┘
     Mechanik (Klappen, Balgstoß, Rufe) geht am Balg vorbei — die hört
     man auch dann, wenn keine Luft mehr da ist.                          */
let AC=null, master=null, comp=null, shaper=null, preGain=null, lim=null, belGain=null;
let reedFilt=null, chamP=null, chamN=null, trebPan=null;
let bassFilt=null, bassP=null, bassPan=null;
let bodyHP=null, bodyP1=null, bodyP2=null;
let room=null, roomGain=null, roomPre=null, mechBus=null;
let pressCS=null;                                  // Balgdruck als Modulationsquelle
let reedWave=null, bassWave=null, subWave=null;
let noiseBuf=null, chiffBuf=null, clickBuf=null;
let reedBase=3000;
const LIVE=[];                                     // klingende Töne
const AUDIO={vol:.9, room:.20};                    // vom Spieler einstellbar
const VOLS=[.55,.9,1.35], ROOMS=[.06,.20,.42], TEMPI=[.85,1,1.18];

/* Ein Zungenspektrum. tilt = Abfall der Teiltöne, fq/fw = Lage und Breite
   der Nase, odd = wie weit die geraden Teiltöne zurücktreten. Die Phasen
   werden verwürfelt: gleichphasige Teiltöne geben eine harte Spitze im
   Wellenzug, verwürfelte klingen voller bei gleicher Lautstärke.         */
function mkWave(n,tilt,formant,fq,fw,odd){
  const re=new Float32Array(n+1), im=new Float32Array(n+1);
  let s=987654321;
  const rr=function(){ s=(s*1664525+1013904223)%4294967296; return s/4294967296; };
  for(let k=1;k<=n;k++){
    let a=Math.pow(k,-tilt);
    a*=1+formant*Math.exp(-Math.pow(k-fq,2)/(2*fw*fw));
    a*=Math.exp(-Math.pow(k/n,2)*2.1);
    if(k%2===0) a*=odd;
    const ph=rr()*6.2831853;
    re[k]=a*Math.cos(ph); im[k]=a*Math.sin(ph);
  }
  try{ return AC.createPeriodicWave(re,im,{disableNormalization:false}); }
  catch(e){ return AC.createPeriodicWave(re,im); }
}
/* Der Chiff: das kurze Zischen, mit dem die Zunge anspricht. Fertig
   gerechnet in einen Puffer, damit je Ton nur drei Knoten nötig sind.    */
function mkChiff(sr){
  const N=Math.floor(sr*.085), b=AC.createBuffer(1,N,sr), d=b.getChannelData(0);
  let lp=0;
  for(let i=0;i<N;i++){ const x=Math.random()*2-1; lp+=(x-lp)*.5; d[i]=lp*Math.pow(1-i/N,3.4); }
  return b;
}
/* Die Klappe, die auf das Loch zurückfällt. Ein Holz-Leder-Klack.        */
function mkClick(sr){
  const N=Math.floor(sr*.03), b=AC.createBuffer(1,N,sr), d=b.getChannelData(0);
  let lp=0;
  for(let i=0;i<N;i++){ const x=Math.random()*2-1; lp+=(x-lp)*.3; d[i]=lp*Math.pow(1-i/N,5.5); }
  return b;
}
/* Kafana-Hall: erst ein paar frühe Reflexionen von den nahen Wänden,
   darüber eine Fahne, in der die Höhen schneller sterben als die Tiefen —
   ein niedriger Raum voller Menschen und Vorhänge, kein Konzertsaal.
   Beide Seiten werden getrennt gewürfelt, sonst klingt es mono.          */
function mkRoom(sr,sec){
  const N=Math.max(1,Math.floor(sr*sec)), b=AC.createBuffer(2,N,sr);
  const taps=[[.0091,.44],[.0163,-.36],[.0247,.30],[.0359,-.24],[.0501,.20],[.0662,-.16],[.0834,.13]];
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c); let lp=0;
    for(let i=0;i<N;i++){
      const t=i/N, x=Math.random()*2-1;
      lp+=(x-lp)*Math.max(.05,.58-.48*t);          // Dämpfung wächst mit der Zeit
      d[i]=lp*Math.pow(1-t,2.5)*.55;
    }
    for(let i=0;i<taps.length;i++){
      const idx=Math.floor((taps[i][0]+c*.0026+i*.0007)*sr);
      if(idx<N) d[idx]+=taps[i][1]*(c?.88:1);
    }
  }
  return b;
}
/* Sanfte Sättigung statt hartem Anschlag am Rand — der Kompressor darunter
   fängt Spitzen, diese Kurve nimmt ihnen vorher die Schärfe.             */
function mkCurve(){
  const N=1024, c=new Float32Array(N);
  for(let i=0;i<N;i++){ const x=i/(N-1)*2-1; c[i]=Math.tanh(x*1.6)/Math.tanh(1.6); }
  return c;
}
/* Ganz am Ende ein Fangnetz. Unterhalb von .72 rührt es nichts an, darüber
   biegt es die Spitzen weich auf 1 herunter. Ohne das würde GLASNO im
   Veselje — Baß, Melodie, Terz und die ganze Kafana zugleich — anschlagen. */
function mkLimit(){
  const N=2048, K=.7, CEIL=.96, c=new Float32Array(N);
  for(let i=0;i<N;i++){
    const x=i/(N-1)*2-1, a=Math.abs(x), sg=x<0?-1:1;
    c[i]=a<=K?x:sg*(K+(CEIL-K)*Math.tanh((a-K)/(1-K)*1.6)/Math.tanh(1.6));
  }
  return c;
}
function mkPan(v){
  if(AC.createStereoPanner){ try{ const p=AC.createStereoPanner(); p.pan.value=v; return p; }catch(e){} }
  return AC.createGain();
}
function initAudio(){
  if(AC) return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx) return;
  AC=new Ctx({latencyHint:"interactive"});
  const sr=AC.sampleRate;

  lim=AC.createWaveShaper(); lim.curve=mkLimit(); lim.oversample="2x";
  lim.connect(AC.destination);
  master=AC.createGain(); master.gain.value=.78;     // fest — die Lautstärke
  master.connect(lim);                                // sitzt vor dem Kompressor
  comp=AC.createDynamicsCompressor();
  comp.threshold.value=-12; comp.knee.value=22; comp.ratio.value=3.4;
  comp.attack.value=.006; comp.release.value=.19;
  comp.connect(master);
  // Die Lautstärke läuft VOR den Kompressor: so fängt er das Mehr an Pegel
  // ab, statt dass es hinter ihm den Ausgang übersteuert.
  preGain=AC.createGain(); preGain.gain.value=AUDIO.vol/.9;
  preGain.connect(comp);
  shaper=AC.createWaveShaper(); shaper.curve=mkCurve(); shaper.oversample="2x";
  shaper.connect(preGain);

  // Korpus: das Holz um die Zungen. Eine tiefe Kuppe, eine in den Mitten,
  // und unten weg, was nur wummert.
  bodyHP=AC.createBiquadFilter(); bodyHP.type="highpass"; bodyHP.frequency.value=62; bodyHP.Q.value=.7;
  bodyP1=AC.createBiquadFilter(); bodyP1.type="peaking"; bodyP1.frequency.value=232; bodyP1.Q.value=1.0; bodyP1.gain.value=1.5;
  bodyP2=AC.createBiquadFilter(); bodyP2.type="peaking"; bodyP2.frequency.value=1380; bodyP2.Q.value=1.5; bodyP2.gain.value=2.2;
  bodyHP.connect(bodyP1); bodyP1.connect(bodyP2); bodyP2.connect(shaper);

  belGain=AC.createGain(); belGain.gain.value=0;
  belGain.connect(bodyHP);

  // Diskant: Helligkeit des Registers, dann die Kammer (Cassotto)
  reedFilt=AC.createBiquadFilter(); reedFilt.type="lowpass"; reedFilt.Q.value=.85;
  chamP=AC.createBiquadFilter(); chamP.type="peaking"; chamP.frequency.value=520; chamP.Q.value=.9;
  chamN=AC.createBiquadFilter(); chamN.type="peaking"; chamN.frequency.value=2500; chamN.Q.value=.8;
  trebPan=mkPan(.32);
  reedFilt.connect(chamP); chamP.connect(chamN); chamN.connect(trebPan); trebPan.connect(belGain);

  // Bassseite: hinter dem Riemen, ohne Kammer, deutlich dumpfer
  bassFilt=AC.createBiquadFilter(); bassFilt.type="lowpass"; bassFilt.frequency.value=1150; bassFilt.Q.value=.7;
  bassP=AC.createBiquadFilter(); bassP.type="peaking"; bassP.frequency.value=150; bassP.Q.value=.9; bassP.gain.value=3.2;
  bassPan=mkPan(-.36);
  bassFilt.connect(bassP); bassP.connect(bassPan); bassPan.connect(belGain);

  // Mechanik hört man auch ohne Luft
  mechBus=AC.createGain(); mechBus.gain.value=1; mechBus.connect(shaper);

  // Hall mit Vorverzögerung — die erste Wand ist ein paar Meter weg
  try{
    room=AC.createConvolver(); room.buffer=mkRoom(sr,1.45);
    roomPre=AC.createDelay(.2); roomPre.delayTime.value=.019;
    roomGain=AC.createGain(); roomGain.gain.value=AUDIO.room;
    belGain.connect(roomPre); mechBus.connect(roomPre);
    roomPre.connect(room); room.connect(roomGain); roomGain.connect(preGain);
  }catch(e){ room=null; }

  // Balgdruck als Modulationsquelle auf die Verstimmung aller Zungen
  try{
    if(AC.createConstantSource){ pressCS=AC.createConstantSource(); pressCS.offset.value=0; pressCS.start(); }
  }catch(e){ pressCS=null; }

  reedWave=mkWave(40,0.92,1.60,5.5,2.7,.82);
  bassWave=mkWave(30,1.32,0.95,4.0,2.2,.86);
  subWave =mkWave(16,1.60,0.45,3.0,1.7,.72);
  chiffBuf=mkChiff(sr); clickBuf=mkClick(sr);
  const N=Math.floor(sr*1.2); noiseBuf=AC.createBuffer(1,N,sr);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<N;i++) d[i]=Math.random()*2-1;
  applyRegister();
}
function unlock(){
  initAudio();
  if(AC&&AC.state!=="running"){ try{ AC.resume(); }catch(e){} }
}
function applyRegister(){
  if(!AC) return;
  const R=REG(), cm=R.cham||0, t=AC.currentTime;
  reedBase=1600+R.bright*4700;
  reedFilt.frequency.setTargetAtTime(reedBase,t,.05);
  chamP.gain.setTargetAtTime(5.5*cm,t,.05);
  chamN.gain.setTargetAtTime(-8.5*cm,t,.05);
}
function setVolume(v){ AUDIO.vol=v; if(preGain) preGain.gain.setTargetAtTime(v/.9,AC.currentTime,.04); }
function setRoom(v){ AUDIO.room=v; if(roomGain) roomGain.gain.setTargetAtTime(v,AC.currentTime,.05); }

const CENT=Math.pow(2,1/1200);
function scaleOf(){ return SCALES[(S.song&&S.song.scale)||"dur"]; }
function rootOf(){ return (S.song&&S.song.root)||196; }
function freqOf(deg){ return rootOf()*Math.pow(2,scaleOf()[Math.max(0,Math.min(7,deg))]/12); }
/* Schwebungskurve. Gleiche Cent über den ganzen Umfang klingen im Diskant
   nervös; ein Stimmer nimmt sie oben zurück.                             */
function reedDetune(f,cents){ return cents*Math.pow(440/Math.max(60,f),.34); }

/* Ein Ton: die Zungen des Registers, jede mit eigener Ansprache. Mehr als
   acht Töne zugleich gibt es nicht — der Älteste fliegt raus, wie beim
   echten Instrument der Finger, der weitermuss.                          */
function noteOn(deg,vel,when){
  if(!AC) return null;
  const R=REG(), t=Math.max(AC.currentTime,when||0)+.003, f=freqOf(deg), v=vel||1;
  const speak=Math.min(.040,.008+4.6/f);                 // tiefe Zungen sprechen träger an
  const scoop=Math.pow(2,-(8+20*Math.min(1,280/f))/1200); // sie setzt zu tief an
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t);
  const pk=.095*v;
  g.gain.linearRampToValueAtTime(pk*1.18,t+speak);        // die Zunge schießt kurz übers Ziel
  g.gain.linearRampToValueAtTime(pk,t+speak*2.6);
  g.connect(reedFilt);
  const oscs=[], vg=R.vgain||[];
  R.voices.forEach(function(c,i){
    const o=AC.createOscillator(); o.setPeriodicWave(reedWave);
    o.frequency.setValueAtTime(f*scoop,t);
    o.frequency.exponentialRampToValueAtTime(f,t+speak*.9);
    o.detune.setValueAtTime(reedDetune(f,c)+(Math.random()-.5)*4.2,t);
    if(pressCS){ try{ pressCS.connect(o.detune); }catch(e){} }
    const og=AC.createGain(); og.gain.value=(vg[i]!==undefined?vg[i]:(i===0?1:.8));
    o.connect(og); og.connect(g); o.start(t+i*.0035); oscs.push(o);
  });
  if(R.sub>0){
    const o=AC.createOscillator(); o.setPeriodicWave(subWave);
    o.frequency.setValueAtTime(f*.5*scoop,t);
    o.frequency.exponentialRampToValueAtTime(f*.5,t+speak*1.4);
    o.detune.setValueAtTime((Math.random()-.5)*3,t);
    if(pressCS){ try{ pressCS.connect(o.detune); }catch(e){} }
    const og=AC.createGain(); og.gain.value=R.sub*.6;
    o.connect(og); og.connect(g); o.start(t+.004); oscs.push(o);
  }
  // Anblasen: der Luftstoß, bevor die Zunge greift — tiefe Töne zischen mehr
  const n=AC.createBufferSource(); n.buffer=chiffBuf;
  const nf=AC.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=Math.min(6800,f*2.6); nf.Q.value=1.1;
  const ng=AC.createGain(); ng.gain.value=.05*v*(1.4-.5*Math.min(1,f/520));
  n.connect(nf); nf.connect(ng); ng.connect(g); n.start(t);
  n.onended=function(){ try{ n.disconnect(); nf.disconnect(); ng.disconnect(); }catch(e){} };

  const h={g:g, oscs:oscs, deg:deg, on:t};
  oscs[0].onended=function(){
    for(let i=0;i<oscs.length;i++){
      try{ if(pressCS) pressCS.disconnect(oscs[i].detune); }catch(e){}
      try{ oscs[i].disconnect(); }catch(e){}
    }
    try{ g.disconnect(); }catch(e){}
  };
  LIVE.push(h);
  while(LIVE.length>8) noteOff(LIVE[0]);
  return h;
}
function noteOff(h,when){
  if(!h||!AC||h.off) return;
  h.off=true;
  const t=Math.max(AC.currentTime,when||0,h.on+.03);
  try{
    h.g.gain.cancelScheduledValues(t);
    h.g.gain.setValueAtTime(h.g.gain.value,t);
    h.g.gain.setTargetAtTime(.0001,t,.016);            // die Zunge steht schnell
  }catch(e){}
  h.oscs.forEach(function(o){ try{ o.stop(t+.11); }catch(e){} });
  clickSnd(t,.45);                                     // die Klappe fällt zu
  const i=LIVE.indexOf(h); if(i>=0) LIVE.splice(i,1);
}
function allOff(){ while(LIVE.length) noteOff(LIVE[0]); }

/* Linke Hand: Stradella. Der Grundbass wechselt von Takt zu Takt zwischen
   Grundton und Quinte — das ist der Gang, den man hört, ohne ihn zu suchen.
   Der Akkord liegt in enger Lage in einer festen Oktave: am echten
   Instrument gibt es keine Umkehrungen, drei Zungen sitzen fest, und
   deshalb springt der Akkord nie, egal wohin die Harmonie geht.          */
const ROMANDEG={I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};
function degSemi(d){ const sc=scaleOf(), o=Math.floor(d/7), k=((d%7)+7)%7; return sc[k]+12*o; }
function chordFreqs(deg){ return stradella(deg); }
function stradella(deg){
  const r=rootOf(), lo=r*.92;
  return [degSemi(deg),degSemi(deg+2),degSemi(deg+4)].map(function(s){
    let f=r*Math.pow(2,s/12);
    while(f<lo) f*=2;
    while(f>=lo*2) f/=2;
    return f;
  });
}
function bassRoot(deg,alt){
  const r=rootOf();
  let f=r*Math.pow(2,(degSemi(deg)+(alt?7:0))/12)/2;
  while(f>r*.8) f/=2;
  return f;
}
function clickSnd(when,amt){
  if(!AC||!clickBuf) return;
  const t=Math.max(AC.currentTime,when||0);
  const n=AC.createBufferSource(); n.buffer=clickBuf;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1500+Math.random()*700; f.Q.value=.8;
  const g=AC.createGain(); g.gain.value=.03*(amt||1);
  n.connect(f); f.connect(g); g.connect(mechBus); n.start(t);
  n.onended=function(){ try{ n.disconnect(); f.disconnect(); g.disconnect(); }catch(e){} };
}
/* Bass und Akkord sind Zungen wie der Diskant, keine gezupften Saiten:
   sie stehen für die Dauer des Schlags und werden dann abgestellt.       */
function bassHit(kind,deg,when,strength,opt){
  if(!AC) return;
  const t=Math.max(AC.currentTime,when||0), s=strength||1, o=opt||{};
  const beat=(S.song&&S.song.beat)||420;
  const g=AC.createGain(); g.connect(bassFilt);
  let dur, parts;
  if(kind==="b"){
    const fr=bassRoot(deg,o.alt);
    dur=Math.max(.16,Math.min(.52,beat/1000*.62));
    parts=[[fr,.92],[fr*2,.5],[fr*4,.10]];
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(.21*s,t+.020);
    g.gain.setTargetAtTime(.115*s,t+.034,.10);
    g.gain.setTargetAtTime(.0001,t+dur,.050);
  }else{
    dur=Math.max(.11,Math.min(.36,beat/1000*.44));
    parts=stradella(deg).map(function(f){ return [f,.9]; });
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(.092*s,t+.016);
    g.gain.setTargetAtTime(.056*s,t+.032,.08);
    g.gain.setTargetAtTime(.0001,t+dur,.038);
  }
  const stop=t+dur+.3;
  let last=null;
  parts.forEach(function(p){
    const oo=AC.createOscillator(); oo.setPeriodicWave(bassWave);
    oo.frequency.setValueAtTime(p[0]*.988,t);
    oo.frequency.exponentialRampToValueAtTime(p[0],t+.028);
    oo.detune.value=(Math.random()-.5)*5;
    const og=AC.createGain(); og.gain.value=p[1];
    oo.connect(og); og.connect(g); oo.start(t); oo.stop(stop);
    oo.onended=function(){ try{ oo.disconnect(); og.disconnect(); }catch(e){} };
    last=oo;
  });
  if(last){ const prev=last.onended; last.onended=function(){ if(prev) prev(); try{ g.disconnect(); }catch(e){} }; }
  clickSnd(t,kind==="b"?.8:.55);                       // der Bassknopf schlägt an
}
/* Balgwechsel: die Luft kehrt um. Unten ein dumpfer Stoß, darüber ein
   Streifen Zischen an der Falte, dazu das Leder.                         */
function puff(str){
  if(!AC||!noiseBuf) return;
  const t=AC.currentTime, s=str||1;
  const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
  const lo=AC.createBiquadFilter(); lo.type="lowpass"; lo.frequency.value=300; lo.Q.value=.8;
  const g=AC.createGain(); g.gain.setValueAtTime(.075*s,t); g.gain.exponentialRampToValueAtTime(.0006,t+.11);
  n.connect(lo); lo.connect(g); g.connect(mechBus); n.start(t); n.stop(t+.14);
  const n2=AC.createBufferSource(); n2.buffer=noiseBuf; n2.loop=true;
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2300; bp.Q.value=.9;
  const g2b=AC.createGain(); g2b.gain.setValueAtTime(.016*s,t); g2b.gain.exponentialRampToValueAtTime(.0004,t+.07);
  n2.connect(bp); bp.connect(g2b); g2b.connect(mechBus); n2.start(t); n2.stop(t+.09);
  n.onended=function(){ try{ n.disconnect(); lo.disconnect(); g.disconnect(); }catch(e){} };
  n2.onended=function(){ try{ n2.disconnect(); bp.disconnect(); g2b.disconnect(); }catch(e){} };
  clickSnd(t,.5*s);
}
/* Die Kafana: Rauschen, das anschwillt, und ein paar Kehlen darüber.     */
function roar(strength){
  if(!AC||!noiseBuf) return;
  const t=AC.currentTime, s=strength||1;
  const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=.5;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.16*s,t+.25); g.gain.exponentialRampToValueAtTime(.0001,t+1.9);
  n.connect(f); f.connect(g); g.connect(mechBus); n.start(t); n.stop(t+2);
  n.onended=function(){ try{ n.disconnect(); f.disconnect(); g.disconnect(); }catch(e){} };
  for(let i=0;i<5;i++){
    const o=AC.createOscillator(); o.type="triangle";
    const f0=180+Math.random()*160; o.frequency.setValueAtTime(f0,t+i*.07);
    o.frequency.exponentialRampToValueAtTime(f0*1.25,t+i*.07+.18);
    const og=AC.createGain(); og.gain.setValueAtTime(.0001,t+i*.07);
    og.gain.exponentialRampToValueAtTime(.05*s,t+i*.07+.04); og.gain.exponentialRampToValueAtTime(.0001,t+i*.07+.32);
    o.connect(og); og.connect(mechBus); o.start(t+i*.07); o.stop(t+i*.07+.35);
    o.onended=function(){ try{ o.disconnect(); og.disconnect(); }catch(e){} };
  }
}
/* Živjeli: zwei Gläser, wenn das Veselje beginnt.                        */
function clink(){
  if(!AC) return;
  const t=AC.currentTime;
  [2950,4420].forEach(function(f,i){
    const o=AC.createOscillator(); o.type="sine"; o.frequency.value=f;
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t+i*.11);
    g.gain.exponentialRampToValueAtTime(.06,t+i*.11+.004); g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.5);
    o.connect(g); g.connect(mechBus); o.start(t+i*.11); o.stop(t+i*.11+.55);
    o.onended=function(){ try{ o.disconnect(); g.disconnect(); }catch(e){} };
  });
}
function thumpSnd(){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+.14);
  const g=AC.createGain(); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g); g.connect(mechBus); o.start(t); o.stop(t+.18);
  o.onended=function(){ try{ o.disconnect(); g.disconnect(); }catch(e){} };
}
/* Luft-Modell. Von Hand: jede Balgbewegung füllt, Stillstand leert.
   Automatisch: der Balg ist immer voll — nur das Tresenje braucht die
   Hand. Aus der Luft und der Bewegung der Hand wird ein Druck: er
   bestimmt Lautstärke, Helligkeit und die letzten paar Cent Tonhöhe.
   Genau das ist der Unterschied zwischen einem Sampler und einem
   Instrument — auf einer Harmonika macht die linke Hand die Dynamik.    */
function driveAir(dt){
  const lvl=LVL();
  if(S.autoBel) S.air=1;
  else{
    S.air-=dt/1000*lvl.air*.85;
    if(S.air<0) S.air=0;
  }
  const a=Math.min(1,S.air);
  const push=Math.min(1,Math.abs(S.belVel)*11);
  const want=a*(.74+.26*push);
  S.press+=(want-S.press)*Math.min(1,dt/85);
  if(AC&&belGain){
    const t=AC.currentTime;
    belGain.gain.setTargetAtTime(S.press*.94+.0002,t,.028);
    reedFilt.frequency.setTargetAtTime(reedBase*(.60+.52*S.press),t,.055);
    if(pressCS) pressCS.offset.setTargetAtTime(S.press*7.5-3,t,.09);
  }
}
function pumpAir(amt){ S.air=Math.min(1,S.air+amt); }

/* ═══════════ Das Instrument ═══════════
   Eine Jugo-Harmonika, wie sie in jeder Kafana von Subotica bis Gevgelija
   hängt: Konzertgröße, fünf Reihen Knöpfe, Chromgitter mit Ornament,
   Registerwippen und Kinnschalter, Metallecken an jeder Falte des Balgs,
   Štras am Rand. Gezeigt aus der Sicht des Spielers — man schaut über das
   Instrument hinweg in die Kafana: rechts der Diskant unter der rechten
   Hand, links der Basskasten unter dem Riemen, dazwischen der Balg.
   Tiefe Töne oben, hohe unten, wie am echten Instrument.                */
const NS="http://www.w3.org/2000/svg";
function el(tag,a,p){ const n=document.createElementNS(NS,tag);
  if(a) for(const k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }
let seed=7;
function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }

const BASS_X0=48, BASS_X1=226, BOX_Y0=34, BOX_Y1=404;
const BEL_MIN=104, BEL_MAX=236;                  // Balglänge zu / auf
const TREB_W=330, PLEATS=15;
const CHROME="url(#chrome)";
function trebX(){ return BASS_X1+BEL_MIN+(BEL_MAX-BEL_MIN)*S.bel; }
/* Fünf Reihen. Die drei inneren tragen die acht Stufen, die zwei äußeren
   sind Hilfsreihen wie am C-Griff — Kulisse, aber echte Kulisse.        */
const ROW_DX=23, ROW_DY=8, BTN_DY=27, BTN_X0=176, BTN_Y0=92;
function btnCol(i){ return i%3; }
function btnY(i){ return BTN_Y0+i*BTN_DY+btnCol(i)*ROW_DY+ (i>=3?BTN_DY*.6:0)+(i>=6?BTN_DY*.6:0); }
function btnXrel(i){ return BTN_X0+btnCol(i)*ROW_DX; }
let bellowsEl=null, trebG=null, btnEls=[], btnGlow=null, fingerEl=null, lhandEl=null, strapEl=null, targetRing=null;

function buildPlayer(){
  const L=document.getElementById("playerLayer"); L.innerHTML="";
  /* Kein Rumpf — wir sind der Harmonikaš. Nur die Schulterriemen, die
     von den Kästen nach oben aus dem Bild laufen.                       */

/* Der Balg. Vorher war er eine schwarze Fläche mit Strichen darauf; das
   Auge liest daraus keine Falten. Jetzt ist jede Falte ein eigenes Feld
   mit eigenem Verlauf — Tal dunkel, Grat hell —, und weil der Verlauf im
   Kasten der Falte sitzt, wandert das Licht beim Ziehen richtig mit.
   Dazu der Zwickel oben und unten: die rote Innenseite der Falte, die man
   an jedem Balg von Subotica bis Đevđelija sieht.                        */
const BEL_TOP=BOX_Y0+8, BEL_BOT=BOX_Y1-8, BEL_AMP=9, BEL_LIP=2, GUSS=15;
function bellowsD(x0,x1){
  const w=(x1-x0)/PLEATS, d=[];
  d.push("M"+x0+" "+BEL_TOP);
  for(let i=0;i<=PLEATS;i++){ d.push("L"+(x0+i*w)+" "+(i%2?BEL_TOP-BEL_AMP:BEL_TOP+BEL_LIP)); }
  d.push("L"+x1+" "+BEL_BOT);
  for(let i=PLEATS;i>=0;i--){ d.push("L"+(x0+i*w)+" "+(i%2?BEL_BOT+BEL_AMP:BEL_BOT-BEL_LIP)); }
  d.push("Z");
  return d.join(" ");
}
/* Das Band entlang der Zickzackkante — der sichtbare Streifen Zwickel.   */
function bellowsBand(x0,x1,y,dir){
  const w=(x1-x0)/PLEATS, d=[];
  for(let i=0;i<=PLEATS;i++){ const yy=y+dir*(i%2?-BEL_AMP:BEL_LIP); d.push((i?"L":"M")+(x0+i*w).toFixed(1)+" "+yy.toFixed(1)); }
  for(let i=PLEATS;i>=0;i--){ const yy=y+dir*((i%2?-BEL_AMP:BEL_LIP)+GUSS); d.push("L"+(x0+i*w).toFixed(1)+" "+yy.toFixed(1)); }
  d.push("Z");
  return d.join(" ");
}
function buildBellows(){
  const L=document.getElementById("bellowsLayer"); L.innerHTML="";
  bellowsEl=el("path",{d:bellowsD(BASS_X1,trebX()),fill:"url(#bellG)",stroke:"#241c17","stroke-width":1},L);
  bellowsEl.folds=[]; bellowsEl.corners=[]; bellowsEl.ribs=[];
  // Ein Feld je Falte, jedes mit eigenem Licht
  for(let i=0;i<PLEATS;i++){
    bellowsEl.folds.push(el("rect",{x:0,y:BEL_TOP-BEL_AMP,width:1,height:BEL_BOT-BEL_TOP+BEL_AMP*2,fill:"url(#foldG)"},L));
  }
  // Die Kante selbst: ein heller Grat, im Wechsel mit dem Schatten des Tals
  for(let i=1;i<PLEATS;i++){
    bellowsEl.ribs.push(el("line",{x1:0,y1:BEL_TOP-6,x2:0,y2:BEL_BOT+6,
      stroke:i%2?"#8a705d":"#050303","stroke-width":i%2?1.3:2,"stroke-opacity":i%2?".6":".8"},L));
  }
  bellowsEl.gTop=el("path",{d:"",fill:"url(#gussG)","fill-opacity":".9"},L);
  bellowsEl.gBot=el("path",{d:"",fill:"url(#gussG2)","fill-opacity":".9"},L);
  // Das Licht der Kafana über allem
  bellowsEl.shade=el("rect",{x:0,y:BEL_TOP-BEL_AMP-2,width:1,height:BEL_BOT-BEL_TOP+BEL_AMP*2+4,fill:"url(#belVG)"},L);
  // Metallecken: an jeder äußeren Falte eine Chromkappe, die den Grat
  // umschließt — vorher standen dort Dreiecke ab wie Pfeilspitzen.
  for(let i=1;i<PLEATS;i+=2){
    const t=el("path",{d:"M-3.8 7.5 L-2.4 0.4 Q0 -1.6 2.4 0.4 L3.8 7.5 Q0 5.6 -3.8 7.5 Z",
      fill:CHROME,stroke:"#1a1618","stroke-width":.5,opacity:.78},L);
    const b=el("path",{d:"M-3.8 -7.5 L-2.4 -0.4 Q0 1.6 2.4 -0.4 L3.8 -7.5 Q0 -5.6 -3.8 -7.5 Z",
      fill:CHROME,stroke:"#1a1618","stroke-width":.5,opacity:.78},L);
    bellowsEl.corners.push([t,b]);
  }
  updateBellows();
}
function updateBellows(){
  if(!bellowsEl) return;
  const x0=BASS_X1, x1=trebX(), w=(x1-x0)/PLEATS;
  sattr(bellowsEl,"d",bellowsD(x0,x1));
  for(let i=0;i<PLEATS;i++){
    const f=bellowsEl.folds[i];
    sattr(f,"x",(x0+i*w).toFixed(1)); sattr(f,"width",w.toFixed(2));
  }
  for(let i=1;i<PLEATS;i++){ const r=bellowsEl.ribs[i-1], x=(x0+i*w).toFixed(1); sattr(r,"x1",x); sattr(r,"x2",x); }
  sattr(bellowsEl.gTop,"d",bellowsBand(x0,x1,BEL_TOP,1));
  sattr(bellowsEl.gBot,"d",bellowsBand(x0,x1,BEL_BOT,-1));
  sattr(bellowsEl.shade,"x",x0.toFixed(1)); sattr(bellowsEl.shade,"width",(x1-x0).toFixed(1));
  let k=0;
  for(let i=1;i<PLEATS;i+=2){ const x=(x0+i*w).toFixed(1), c=bellowsEl.corners[k++];
    sattr(c[0],"transform","translate("+x+" "+(BOX_Y0-3)+")"); sattr(c[1],"transform","translate("+x+" "+(BOX_Y1+3)+")"); }

}

    el("rect",{x:p[0]+10,y:p[1]-26,width:10,height:34,rx:3,fill:"#1f4a2a",opacity:".9"},tables);
  });
  // Gäste: sitzende Silhouetten hinter den Tischen, jeder mit einem Glas in der Hand
  const G=[[20,262],[130,266],[850,264],[960,262]];
  window.GUESTS=[];
  G.forEach(function(p,i){
    const g=el("g",{},guests);
    // Die Bühne steht hinter ihnen: die Kontur glüht, das Innere bleibt schwarz
    const lit=p[0]<500?1:-1;
    el("ellipse",{cx:p[0]+lit*2.5,cy:p[1]+39,rx:35.5,ry:31.5,fill:"#f0a83c","fill-opacity":".2"},g);
    el("circle",{cx:p[0]+lit*2.5,cy:p[1]-1,r:18.5,fill:"#f0a83c","fill-opacity":".22"},g);
    el("ellipse",{cx:p[0],cy:p[1]+40,rx:34,ry:30,fill:"#0b0709"},g);
    el("circle",{cx:p[0],cy:p[1],r:17,fill:"#0b0709"},g);
    if(i%2) el("path",{d:"M"+(p[0]-20)+" "+(p[1]-10)+" C"+(p[0]-16)+" "+(p[1]-30)+" "+(p[0]+16)+" "+(p[1]-30)+" "+(p[0]+20)+" "+(p[1]-10)+" Z",fill:"#0b0709"},g);
    const arm=el("g",{},g);
    el("path",{d:"M"+(p[0]+22)+" "+(p[1]+34)+" L"+(p[0]+44)+" "+(p[1]+2),stroke:"#0b0709","stroke-width":9,"stroke-linecap":"round"},arm);
    el("rect",{x:p[0]+40,y:p[1]-14,width:9,height:16,rx:2,fill:"#e9d9c4",opacity:".6"},arm);
    window.GUESTS.push({arm:arm,x:p[0]+22,y:p[1]+34,ph:rnd()*6.3});
  });
  // Lichterkette
  const wires=document.getElementById("wires"), halos=document.getElementById("halos"), bulbs=document.getElementById("bulbs");
  [[0,40,1000,28],[0,16,1000,8]].forEach(function(w,k){
    el("path",{d:"M"+w[0]+" "+w[1]+" Q500 "+(w[1]+70)+" "+w[2]+" "+w[3],stroke:"#241a12","stroke-width":1.4,fill:"none"},wires);
    const N=k?9:12;
    for(let i=0;i<=N;i++){
      const t=i/N, x=w[0]+(w[2]-w[0])*t, y=(1-t)*(1-t)*w[1]+2*(1-t)*t*(w[1]+70)+t*t*w[3];
      el("circle",{cx:x,cy:y+8,r:22,fill:"url(#bulbG)",opacity:".55"},halos);
      const b=el("circle",{cx:x,cy:y+8,r:3.2,fill:"#ffe6ac",class:"bulb"},bulbs);
      b.style.animationDelay=(rnd()*3.4).toFixed(2)+"s";
    }
  });
}
/* Die Gäste werfen Geld: bei jedem Zuruf und im Veselje regnet es Scheine
   auf den Diskant. Sie flattern, landen, bleiben kurz liegen.            */
const BILLS=[]; let billsG=null;
function buildBills(){ billsG=document.getElementById("bills"); }
function throwBills(n){
  if(!billsG) return;
  for(let i=0;i<n;i++){
    const side=rnd()<.5?-1:1;
    const r=el("g",{},billsG);
    el("rect",{x:-16,y:-8,width:32,height:16,rx:1.5,fill:i%3?"#8fb28a":"#c9a24a",stroke:"#1a2a14","stroke-width":.8},r);
    const t=el("text",{x:0,y:3,"text-anchor":"middle","font-size":"8","font-weight":"700","font-family":"Arial Narrow, Arial, sans-serif",fill:"#1a2a14"},r);
    t.textContent=i%3?"100":"1000";
    BILLS.push({el:r,x:500+side*(430+rnd()*60),y:120+rnd()*100,vx:-side*(3.2+rnd()*2.2),vy:-2-rnd()*2,rot:rnd()*360,vr:(rnd()-.5)*18,t:0,land:230+rnd()*60});
  }
}
function driveBills(dt){
  const f=dt/16.7;
  for(let i=BILLS.length-1;i>=0;i--){
    const b=BILLS[i]; b.t+=dt;
    if(b.y<b.land){ b.x+=b.vx*f; b.vy+=.14*f; b.y+=b.vy*f+Math.sin(b.t/90)*.8; b.rot+=b.vr*f; b.vx*=.985; }
    else if(b.t>3200){ sattr(b.el,"opacity",Math.max(0,1-(b.t-3200)/600).toFixed(2)); }
    if(b.t>3900){ b.el.remove(); BILLS.splice(i,1); continue; }
    sattr(b.el,"transform","translate("+b.x.toFixed(1)+" "+b.y.toFixed(1)+") rotate("+b.rot.toFixed(1)+")");
  }
}
function sattr(el,k,v){ const c=el.__a||(el.__a={}); if(c[k]!==v){ c[k]=v; el.setAttribute(k,v); } }
function sstyle(el,k,v){ const c=el.__s||(el.__s={}); if(c[k]!==v){ c[k]=v; el.style[k]=v; } }

/* ═══════════ Eingabe ═══════════
   Zwei Zonen auf der Bühne: links der Balg, rechts die Knöpfe. Jeder
   Finger wird nach seiner Zone verfolgt — zwei Daumen spielen gleichzeitig.
   Auf der Tastatur sind 1–8 die Knöpfe, Leertaste und Pfeile der Balg.   */
const instSvg=document.getElementById("inst"), artG=document.getElementById("art"), stageEl=document.getElementById("stage");
const hintEl=document.getElementById("hint"), multEl=document.getElementById("mult");
const ptrs={};                                    // pointerId → {zone,x,y,btn}
function zoneOf(e){
  const r=stageEl.getBoundingClientRect();
  return (e.clientX-r.left)<r.width*.46?"bel":"btn";
}
/* getScreenCTM() zwingt den Browser zu einem Layout — bei jedem Finger-
   zucken einmal, und es sind zwei Finger, die auf einem 120-Hz-Schirm
   mehrfach je Bild melden. Die Matrix wird deshalb je Bild einmal geholt
   und bis zum nächsten Bild behalten: die Kamera wackelt zwar weiter,
   aber um höchstens ein Bild — das merkt kein Finger.                    */
let ctmInv=null;
function dropCtm(){ ctmInv=null; }
function toLocal(cx,cy){
  if(!ctmInv){
    const m=artG.getScreenCTM(); if(!m) return {x:0,y:0};
    ctmInv=m.inverse();
  }
  const p=instSvg.createSVGPoint(); p.x=cx; p.y=cy;
  const q=p.matrixTransform(ctmInv); return {x:q.x,y:q.y};
}
function btnFromY(cy){
  const l=toLocal(0,cy).y;
  let best=0, bd=1e9;
  for(let i=0;i<8;i++){ const d=Math.abs(btnY(i)-l); if(d<bd){ bd=d; best=i; } }
  return best;
}
const NOTES_ON={};                                // Knopf → Klang-Handle
function press(i,src){
  if(S.paused||S.mode==="demo"||S.mode==="idle") return;
  if(S.held[i]) return;
  S.held[i]=true; S.btn=i; S.visBtn=i; S.holding=true;
  if(S.air<.02&&!S.autoBel){ S.airWarnT=performance.now(); }
  NOTES_ON[i]=noteOn(i,1);
  const now=performance.now();
  S.presses++;
  if(S.lastPress){ const gap=now-S.lastPress; if(gap<2500){ S.gapN++; S.gapSum+=gap; S.gapDev+=Math.abs(gap-(S.song?S.song.beat:400)); } }
  S.lastPress=now;
  S.sparks.push({t:now,pos:i});
  S.bob=Math.max(S.bob,.35);
  if(S.mode==="song") judgePress(now-S.t0);
  else if(S.mode==="free"){ S.freeStrokes++; S.energy=Math.min(1,S.energy+.05); }
}
function releaseBtn(i){
  if(!S.held[i]) return;
  delete S.held[i];
  if(NOTES_ON[i]){ noteOff(NOTES_ON[i]); delete NOTES_ON[i]; }
  const keys=Object.keys(S.held);
  if(keys.length){ S.btn=+keys[keys.length-1]; }
  else { S.btn=-1; S.holding=false; }
}
function releaseAll(){ for(const k in S.held) releaseBtn(+k); }

/* Balg: die Bewegung füllt die Luft, jede Umkehr ist ein Wechsel. Für das
   Tresenje zählen die Wechsel innerhalb der Note.                        */
const REV_MIN=.06;
function moveBellows(dx){
  if(S.paused||S.mode==="demo") return;
  S.bel=Math.max(0,Math.min(1,S.bel+dx));
  const dir=dx>0?1:-1;
  if(dir!==S.belDir){ S.belAcc+=Math.abs(dx); if(S.belAcc>=REV_MIN){ reversal(dir); } }
  else S.belAcc=0;
  S.belVel=S.belVel*.6+dx*.4;
  pumpAir(Math.abs(dx)*5.5);
  S.energy=Math.min(1,S.energy+Math.abs(dx)*.4);
}
function reversal(dir){
  const now=performance.now();
  S.belDir=dir; S.belAcc=0; S.revs++; S.lastRev=now;
  puff(.6);
  if(S.mode==="song") shakeTick(now-S.t0);
}
/* Automatischer Balg: die Luft bleibt, aber Tippen links zählt als Wechsel
   und lässt den Balg sichtbar zucken.                                    */
function tapBellows(){
  if(S.paused||S.mode==="demo") return;
  reversal(-S.belDir); S.belVel=S.belDir*.05;
  if(!S.autoBel) pumpAir(.22);
}
function onDown(e){
  if(S.mode==="idle"){ return; }
  if(S.mode==="demo"){ return; }
  if(S.paused){ goResume(); return; }
  unlock();
  const z=zoneOf(e);
  if(e.pointerId!==undefined&&instSvg.setPointerCapture){ try{ instSvg.setPointerCapture(e.pointerId); }catch(x){} }
  const p={zone:z,x:e.clientX,y:e.clientY,btn:-1,t:performance.now(),moved:0};
  ptrs[e.pointerId]=p;
  if(z==="btn"){ p.btn=btnFromY(e.clientY); press(p.btn,"touch"); }
  else if(S.autoBel){ tapBellows(); }
  else { p.t0=performance.now(); }
  e.preventDefault();
}
function onMove(e){
  const p=ptrs[e.pointerId]; if(!p) return;
  const r=stageEl.getBoundingClientRect();
  if(p.zone==="btn"){
    const b=btnFromY(e.clientY);
    if(b!==p.btn){ releaseBtn(p.btn); p.btn=b; press(b,"slide"); }
  }else{
    const dx=(e.clientX-p.x)/(r.width*.46);
    p.moved+=Math.abs(dx);
    if(Math.abs(dx)>.002) moveBellows(dx*1.6);
  }
  p.x=e.clientX; p.y=e.clientY;
  e.preventDefault();
}
function onUp(e){
  const p=ptrs[e.pointerId]; if(!p) return;
  if(p.zone==="btn") releaseBtn(p.btn);
  else if(!S.autoBel&&p.moved<.03&&performance.now()-p.t<220){ tapBellows(); }   // ein Tipp links ohne Ziehen: kleiner Balgstoß
  delete ptrs[e.pointerId];
}
instSvg.addEventListener("pointerdown",onDown);
instSvg.addEventListener("pointermove",onMove);
instSvg.addEventListener("pointerup",onUp);
instSvg.addEventListener("pointercancel",onUp);
instSvg.addEventListener("lostpointercapture",onUp);
stageEl.addEventListener("pointerdown",function(e){
  if(S.mode==="demo"&&e.target!==document.getElementById("stopBtn")){ endDemo(); }
});

const KEYS={};
addEventListener("keydown",function(e){
  if(e.repeat) return;
  const k=e.key;
  if(veilOpen||S.mode==="idle") return;
  if(k>="1"&&k<="8"){ if(!KEYS[k]){ KEYS[k]=true; unlock(); if(S.paused){ goResume(); return; } press(+k-1,"key"); } e.preventDefault(); }
  else if(k===" "||k==="k"||k==="K"||k==="ArrowLeft"||k==="ArrowRight"){
    unlock(); if(S.paused){ goResume(); return; }
    if(k==="ArrowLeft") { moveBellows(-.12); } else if(k==="ArrowRight"){ moveBellows(.12); }
    else { moveBellows(-S.belDir*.12); }
    if(!S.autoBel) pumpAir(.3);
    e.preventDefault();
  }
  else if(k==="Escape"){ if(S.mode==="demo") endDemo(); else if(!S.paused) goPause(); else goResume(); }
});
addEventListener("keyup",function(e){
  const k=e.key; if(k>="1"&&k<="8"){ KEYS[k]=false; releaseBtn(+k-1); }
});

/* ═══════════ Start, Pause ═══════════ */
function begin(){
  unlock();
  if(!S.started){ S.started=true; }
  S.paused=false;
}
const IOSISH=(function(){ try{ return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1); }catch(e){ return false; } })();
function showGate(){
  document.body.classList.add("gate");
  const g=document.getElementById("gate"); g.classList.remove("done");
  const go=function(e){ e.preventDefault(); closeGate(); };
  g.addEventListener("pointerdown",go,{once:true});

}
function closeGate(){

}
function goPause(){
  if(S.mode!=="song"&&S.mode!=="free") return;
  S.paused=true; S.pauseAt=performance.now(); releaseAll(); allOff();
  hintEl.textContent=TR("hintPause");
  if(AC&&AC.suspend){ try{ AC.suspend(); }catch(e){} }
}
function goResume(){
  if(!S.paused) return;
  const d=performance.now()-S.pauseAt;
  S.t0+=d; S.lastPress+=d; S.soloEnd+=d; S.soloStart+=d;
  S.notes.forEach(function(n){ if(n.fillT) n.fillT+=d; });
  S.paused=false; prev=performance.now();
  unlock();
  hintEl.textContent=S.mode==="free"?TR("hintFree"):(S.drill?TR("dh"+S.drill.i).toUpperCase():TR("hintSong"));
}
document.addEventListener("visibilitychange",function(){ if(document.hidden&&!S.paused&&(S.mode==="song"||S.mode==="free")) goPause(); });
document.getElementById("backBtn").onclick=function(){
  if(S.mode==="demo") endDemo();
  else { if(S.mode==="song"||S.mode==="free") goPause(); releaseAll(); allOff(); S.mode="idle"; showMenu(); }
};

/* ═══════════ Notenbahn ═══════════ */
const cv=document.getElementById("staff"), g2=cv.getContext("2d");
let W=0,H=0,HITX=70;
const INST_W=900, INST_H=420, INST_CX=440, INST_CY=222;
function frameInstrument(){
  const r=stageEl.getBoundingClientRect();
  if(!(r.width>8&&r.height>8)) return;
  const R=r.width/r.height;
  const vbH=Math.max(INST_H, INST_W/R), vbW=vbH*R;
  instSvg.setAttribute("viewBox",(INST_CX-vbW/2).toFixed(1)+" "+(INST_CY-vbH/2).toFixed(1)+" "+vbW.toFixed(1)+" "+vbH.toFixed(1));
}
let PXMS=.20;
let FAM="Arial Narrow, Arial, sans-serif";
let FNT10='700 10px '+FAM, FNT12='700 12px '+FAM, FNT9='700 9px '+FAM;
function readFont(){
  try{ const f=getComputedStyle(document.body).fontFamily; if(f) FAM=f; }catch(e){}
  FNT10='700 10px '+FAM; FNT12='700 12px '+FAM; FNT9='700 9px '+FAM;
}
function fit(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(GFX.low?1.5:2,devicePixelRatio||1);
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  g2.setTransform(dpr,0,0,dpr,0,0);
  HITX=Math.max(56,Math.min(120,W*.13));
  PXMS=.20/LVL().lead;
  readFont(); frameInstrument(); checkOrient(); dropCtm();
}
function checkOrient(){ document.getElementById("rotate").className=(innerHeight>innerWidth*1.02)?"on":""; }
addEventListener("resize",function(){ fit(); if(veilOpen) requestAnimationFrame(fitVeil); });

addEventListener("orientationchange",function(){ setTimeout(function(){ fit(); if(veilOpen) fitVeil(); },220); });
function ny(p){ return 11+(p/7)*(H-26); }   // tief oben, hoch unten — wie am Diskant

let staffGrad=null, staffGradH=0;
let drawFrom=0, drawRef=null;      // Fensterkopf der gezeichneten Noten
function drawStaff(now){
  g2.fillStyle="#0d0a08"; g2.fillRect(0,0,W,H);
  g2.lineCap="round"; g2.lineJoin="round";
  if(!staffGrad||staffGradH!==H){
    staffGrad=g2.createLinearGradient(0,0,0,H);
    staffGrad.addColorStop(0,"rgba(10,8,6,0)"); staffGrad.addColorStop(1,"rgb(90,15,20)");
    staffGradH=H;
  }
  g2.globalAlpha=Math.min(1,.12+S.energy*.2+S.solo*.18);
  g2.fillStyle=staffGrad; g2.fillRect(0,0,W,H); g2.globalAlpha=1;
  for(let p=0;p<8;p++){
    const y=ny(p);
    g2.strokeStyle=(p===0)?"rgba(244,234,214,.3)":"rgba(244,234,214,"+(.11+S.energy*.05).toFixed(3)+")";
    g2.lineWidth=1; g2.beginPath(); g2.moveTo(HITX-26,y); g2.lineTo(W,y); g2.stroke();
  }
  // Luftanzeige links: der Balg als kleiner Pegel neben der Trefflinie
  const airH=(H-22)*Math.min(1,S.air);
  g2.fillStyle=S.air<.2?"rgba(212,58,42,.7)":"rgba(240,168,60,.55)";
  g2.fillRect(4,H-11-airH,4,airH);
  g2.strokeStyle="rgba(244,234,214,.18)"; g2.strokeRect(4,11,4,H-22);

  if((S.mode==="song"||S.mode==="demo")&&S.song){
    const s=S.song;
    const startT=1800-s.beat*2, endT=S.notes.length?S.notes[S.notes.length-1].t+s.beat*4:0;
    const firstK=Math.floor((now-HITX/PXMS-startT)/s.beat), lastK=Math.ceil((now+(W-HITX)/PXMS-startT)/s.beat);
    for(let k=Math.max(0,firstK);k<=lastK;k++){
      const tt=startT+k*s.beat; if(tt>endT) break;
      const x=HITX+(tt-now)*PXMS; if(x<-8||x>W+8) continue;
      const bar=(k%s.meter)===0;
      g2.strokeStyle=bar?"rgba(240,168,60,.38)":"rgba(244,234,214,.12)"; g2.lineWidth=bar?1.4:1;
      g2.beginPath(); g2.moveTo(x,ny(0)-7); g2.lineTo(x,ny(7)+7); g2.stroke();
    }
    const lvl=LVL();
    // Der Kopf wandert mit: was links hinausgelaufen ist, wird nicht mehr
    // angefasst. Vorher lief jeder Frame über alle Noten des Liedes.
    if(drawRef!==S.notes){ drawRef=S.notes; drawFrom=0; }
    while(drawFrom<S.notes.length&&HITX+(S.notes[drawFrom].t+S.notes[drawFrom].dur-now)*PXMS<-30) drawFrom++;
    for(let i=drawFrom;i<S.notes.length;i++){
      const n=S.notes[i];
      const x=HITX+(n.t-now)*PXMS, xe=HITX+(n.t+n.dur-now)*PXMS;
      if(xe<-30) continue; if(x>W+30) break;
      const y=ny(n.pos);
      let col="rgba(244,234,214,.9)";
      if(n.grade===2) col="rgba(240,168,60,.95)"; else if(n.grade===1) col="rgba(244,234,214,.5)"; else if(n.grade===0) col="rgba(212,58,42,.85)";
      if(n.type===1){
        // Tresenje: Balken mit Zacken, füllt sich mit jedem Balgwechsel
        const w=Math.max(12,xe-x);
        g2.strokeStyle=col; g2.lineWidth=1.4; g2.beginPath(); g2.rect(x,y-6,w,12); g2.stroke();
        const fill=Math.min(1,n.strokes/n.need);
        g2.fillStyle=n.grade===null?"rgba(240,168,60,.5)":col; g2.fillRect(x,y-6,w*fill,12);
        g2.strokeStyle=col; g2.beginPath();
        for(let z=0;z<w;z+=6){ g2.moveTo(x+z,y+6); g2.lineTo(x+z+3,y-6); } g2.stroke();
        g2.fillStyle="#0d0a08"; g2.font=FNT9; g2.textAlign="left"; g2.fillText(NUMS[n.pos],x+3,y+3);
      }else{
        if(n.dur>n.b*1.05){ g2.strokeStyle=col; g2.lineWidth=3; g2.beginPath(); g2.moveTo(x,y); g2.lineTo(xe,y); g2.stroke(); }
        g2.fillStyle=col; g2.beginPath(); g2.arc(x,y,6,0,6.283); g2.fill();
        if(lvl.show>0||n.grade!==null){ g2.fillStyle="#0d0a08"; g2.font=FNT9; g2.textAlign="center"; g2.fillText(NUMS[n.pos],x,y+3); }
      }
    }
  }
  // Trefflinie
  g2.strokeStyle="rgba(240,168,60,"+(.55+S.flash*.45).toFixed(2)+")"; g2.lineWidth=2+S.flash*2;
  g2.beginPath(); g2.moveTo(HITX,6); g2.lineTo(HITX,H-6); g2.stroke();
  // Funken
  const pn=performance.now();
  for(let i=S.sparks.length-1;i>=0;i--){
    const sp=S.sparks[i];
    const age=pn-sp.t; if(age>420){ S.sparks.splice(i,1); continue; }
    const k=age/420;
    g2.strokeStyle="rgba(240,168,60,"+(1-k).toFixed(2)+")"; g2.lineWidth=2;
    g2.beginPath(); g2.arc(HITX,ny(sp.pos),6+k*16,0,6.283); g2.stroke();
  }
}

/* ═══════════ Lied bauen ═══════════ */
function parseVerse(v,beat,t,vi,out){
  const toks=v.split(/\s+/);
  for(let i=0;i<toks.length;i++){
    const tok=toks[i];
    if(tok===""||tok==="."){ t+=beat; continue; }
    if(tok==="-"){ if(out.length) out[out.length-1].dur+=beat; t+=beat; continue; }
    const m=/^([1-8])(\*{1,3})?$/.exec(tok);
    if(!m){ t+=beat; continue; }
    const pos=+m[1]-1, stars=m[2]?m[2].length:0, beats=stars?stars+1:1;
    out.push({ t:t, dur:beat*(stars?beats:.92), pos:pos, b:beat,
      type:stars?1:0, need:stars?beats*3:1, strokes:0,
      bdev:0, bn:0, dt:0, grade:null, verse:vi, beat:i, air:0 });
    t+=beat*beats;
  }
  return t;
}
/* Bassfiguren je Taktart: b = Bass, c = Akkord, . = nichts.
   Der wichtigste Punkt am ganzen Lied. Im geraden Takt ist es das
   Oom-Pah des Kola, im Dreier der Walzerschritt. Im Aksak aber sitzt die
   linke Hand NICHT auf jedem Achtel, sondern auf den Gruppenköpfen:
   7/8 ist 2+2+3, also Achtel 0, 2, 4 — die letzte Gruppe ist die längere,
   und genau dieses Hinken macht Jovano und Ajde Jano aus. 9/8 ist
   2+2+2+3, also 0, 2, 4, 6. Vorher lief der Bass hier gleichmäßig durch
   und hat den Čoček zu einem Marsch gemacht.                             */
const BASSPAT={
  "2":"b c b c",                     // 4/4 — Kolo
  "3":"b c c",                       // 3/4 — Walzer
  "7":"b . c . c . .",               // 7/8 — 2+2+3
  "9":"b . c . c . c . ."            // 9/8 — 2+2+2+3, Čoček
};
/* Gruppenköpfe je Taktart. Dort liegt der Akzent — in der Begleitung wie
   in der Melodie.                                                        */
const GROUPS={ 2:[0], 3:[0], 4:[0,2], 7:[0,2,4], 9:[0,2,4,6] };
function groupsOf(meter){ return GROUPS[meter]||[0]; }
function isHead(k,meter){ const g=groupsOf(meter); for(let i=0;i<g.length;i++) if(g[i]===k) return true; return false; }
/* Wie stark ein Schlag gespielt wird: der Taktkopf voll, die anderen
   Gruppenköpfe fast, alles dazwischen leicht.                            */
function beatVel(k,meter){ return k===0?1:(isHead(k,meter)?.84:.62); }
/* st traegt den Wechselbass ueber die Strophengrenze. Er darf nicht je
   Strophe neu anfangen: im 7/8 und 9/8 ist eine Strophe genau ein Takt,
   also gaebe es sonst nie eine Quinte — die linke Hand bliebe auf dem
   Grundton stehen.                                                       */
function addBass(song,verse,t,out,st){
  const pat=(BASSPAT[song.bass]||BASSPAT["2"]).split(" ");
  const chs=(verse.ch||"I").split(/\s+/), toks=verse.n.split(/\s+/).length;
  const bars=Math.max(1,Math.round(toks/song.meter));
  for(let b=0;b<bars;b++){
    const deg=ROMANDEG[chs[Math.min(b,chs.length-1)]]||0;
    for(let k=0;k<song.meter;k++){
      const p=pat[k%pat.length]; if(p===".") continue;
      // Wechselbass: erst der Grundton, beim nächsten Bass die Quinte
      const alt=(p==="b")&&((st.bn++)%2===1);
      out.push({t:t+(b*song.meter+k)*song.beat, kind:p, deg:deg, acc:k===0,
                alt:alt, vel:beatVel(k,song.meter)});
    }
  }
}
function buildSong(song,onlyVerse,rounds){
  const out=[], bass=[], st={bn:0}; let t=1800;
  const R=onlyVerse?1:Math.max(1,rounds||1);
  for(let r=0;r<R;r++){
    const src=onlyVerse?[song.verses[onlyVerse-1]]:song.verses;
    src.forEach(function(v,vi0){
      const vi=onlyVerse?onlyVerse:(vi0+1);
      addBass(song,v,t,bass,st);
      t=parseVerse(v.n,song.beat,t,vi,out);
      t+=song.beat*1.6;
    });
    if(!onlyVerse&&r<R-1) t+=song.beat*2.2;
  }
  S.bassEvents=bass; S.bassHead=0;
  return out;
}
/* Tempo ist eine Einstellung, kein Eingriff ins Lied. Das Stück bekommt
   einen eigenen Schlagabstand, alles andere bleibt, wie es geschrieben
   steht — und weil Bahn, Bass und Wertung alle S.song.beat lesen, rechnen
   sie danach mit demselben Puls.                                         */
function atTempo(o){
  const f=TEMPI[S.tempo]||1;
  if(f===1||!o) return o;
  const c=Object.assign({},o); c.beat=Math.round(o.beat/f); return c;
}
const DRILL_MS=30000;
function buildDrill(d,ms){
  const out=[], bass=[], st={bn:0}; let t=1600, rep=0;
  const song={beat:d.beat,meter:d.meter,bass:d.bass};
  while(t<1600+(ms||DRILL_MS)&&rep<200){
    addBass(song,{n:d.pat,ch:"I"},t,bass,st);
    t=parseVerse(d.pat,d.beat,t,++rep,out);
  }
  S.bassEvents=bass; S.bassHead=0;
  return out;
}
/* Der Bass läuft mit dem Lied — vorausgeplant, damit er nicht am Frame
   hängt. In der Übung und im Lied spielt ihn die linke Hand mit, im
   Freien Spiel bleibt es bei der rechten.                                */
function driveBass(now){
  if(!AC||S.paused) return;
  if(!(S.mode==="song"||S.mode==="demo")) return;
  const ahead=90;
  while(S.bassHead<S.bassEvents.length&&S.bassEvents[S.bassHead].t<=now+ahead){
    const e=S.bassEvents[S.bassHead++];
    if(e.t<now-60) continue;
    const when=AC.currentTime+(e.t-now)/1000;
    bassHit(e.kind,e.deg,when,(e.vel!==undefined?e.vel:.75)*(e.acc?1.1:.95),{alt:e.alt});
    if(e.kind==="b") S.pulseAt=e.t;
  }
}

/* ═══════════ Wertung ═══════════ */
const judgeEl=document.getElementById("judge");
function flash(txt,col){ judgeEl.textContent=txt; judgeEl.style.color=col; judgeEl.style.opacity=1; S.judgeTimer=performance.now(); }
const burstEl=document.getElementById("burst"); let burstT=0;
function burst(txt){ burstEl.textContent=txt; burstT=performance.now(); }
const flareEl=document.getElementById("flare"); let flareT=0;
function flareSweep(){ if(!reduce) flareT=performance.now(); }
function reason(n,dt,bd,noAir){
  if(bd>=9) return "";
  const parts=[];
  if(noAir) parts.push(TR("rAir"));
  if(Math.abs(dt)>=12) parts.push(dt<0?TR("rEarly"):TR("rLate"));
  if(bd>0) parts.push(TR("rFret",NUMS[n.pos]));
  return parts.length?" · "+parts.join(" · "):"";
}
function applyGrade(n,grade,dt,bd,noAir){
  const mult=S.bec?2:1, tNow=performance.now(), lvl=LVL();
  n.grade=grade; n.dt=dt;
  S.total++;
  S.btnSum+=(bd===0?1:(bd<=1?.4:0)); S.btnN++;
  S.airSum+=Math.min(1,n.air||0); S.airN++;
  if(grade>0){ S.devSum+=Math.abs(dt); S.devN++; }
  const vs=S.verseStat[n.verse]||(S.verseStat[n.verse]={n:0,bad:0}); vs.n++;
  if(grade===2){
    S.score+=(100+S.combo*4)*mult; S.combo++; S.clean++; S.verseClean++;
    if(n.type===1){ S.score+=60*mult; S.shakeDone++; flash(TR("techPrebir")+"!","#f0a83c"); }
    else if(S.clean<=10) flash(TR("jClean"),"#f0a83c");
    S.flash=1; S.edgeFlash=1; S.sheenT=tNow;
    BEAMS.forEach(function(b){ b.snap=tNow; });
  }else if(grade===1){
    S.score+=40*mult; S.near++; vs.bad+=.5;
    S.combo=Math.floor(S.combo*lvl.nearKeep);
    flash(TR("jNear")+reason(n,dt,bd,noAir),"rgba(244,234,214,.85)");
  }else{
    S.combo=0; S.miss++; vs.bad++; flash(TR("jMiss")+reason(n,dt,bd,noAir),"#d43a2a");
    S.dim=1; S.energy*=.35;
  }
  S.maxCombo=Math.max(S.maxCombo,S.combo);
  document.getElementById("scoreOut").textContent=S.score;
  while(S.nextCall<S.calls.length&&S.combo>=S.calls[S.nextCall][0]){
    const c=S.calls[S.nextCall];
    burst(c[1]); S.shake=Math.max(S.shake,.45); throwBills(3);
    if(c[0]>=S.soloAt){
      if(S.soloEnd<tNow){ S.soloStart=tNow; clink(); }
      S.soloEnd=Math.max(S.soloEnd,tNow+SOLO_MS);
      flareSweep(); roar(1); S.shake=Math.max(S.shake,.7); throwBills(8);
    }
    S.nextCall++;
  }
  if(S.combo===0) S.nextCall=0;
  else while(S.nextCall>0&&S.combo<S.calls[S.nextCall-1][0]) S.nextCall--;
}
function judgePress(now){
  const lvl=LVL();
  let best=null, bd=1e9;
  for(let i=0;i<S.notes.length;i++){
    const n=S.notes[i]; if(n.grade!==null) continue;
    let d;
    if(n.type===1) d=(now<n.t)?(n.t-now):((now>n.t+n.dur)?(now-n.t-n.dur):0);
    else d=Math.abs(now-n.t);
    if(d<bd&&d<=lvl.nearMs+45){ bd=d; best=n; }
  }
  if(!best){ S.stray++; return; }
  if(best.type===1){ best.pressed=true; return; }        // beim Tresenje zählt der Balg, nicht der Druck
  const dist=Math.abs(S.btn-best.pos);
  const noAir=!S.autoBel&&S.air<.15;
  best.air=S.autoBel?1:S.air;
  let grade;
  if(bd<=lvl.cleanMs&&dist===0&&!noAir) grade=2;
  else if(bd<=lvl.nearMs&&dist<=lvl.slack) grade=1;
  else grade=0;
  applyGrade(best,grade,now-best.t,dist,noAir);
}
function shakeTick(now){
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i]; if(n.grade!==null) continue;
    if(n.t-now>200) break;
    if(n.type===1&&now>=n.t-120&&now<=n.t+n.dur+80){
      n.strokes++; if(S.btn>=0){ n.bdev+=Math.abs(S.btn-n.pos); n.bn++; } n.fillT=performance.now();
      S.sparks.push({t:performance.now(),pos:n.pos});
      return;
    }
  }
}
function judgeFrame(now){
  const lvl=LVL(), grading=(S.mode==="song");
  while(S.head<S.notes.length&&S.notes[S.head].grade!==null) S.head++;
  for(let i=S.head;i<S.notes.length&&grading;i++){
    const n=S.notes[i];
    if(n.t-now>lvl.nearMs+120) break;
    if(n.grade!==null) continue;
    if(n.type===1){
      if(now>=n.t+n.dur){
        /* Nur Frames mit gehaltenem Knopf zählen: wer den Knopf einen Tick
           nach Beginn der Note trifft, hat nicht danebengegriffen.       */
        const r=n.strokes/n.need, bAvg=n.bn?n.bdev/n.bn:9;
        let grade;
        if(r>=.8&&bAvg<=.25) grade=2; else if(r>=.45&&bAvg<=lvl.slack+.4) grade=1; else grade=0;
        n.air=1; applyGrade(n,grade,0,bAvg<=.25?0:(bAvg<=1.2?1:2),false);
      }else if(now>=n.t&&now<n.t+n.dur&&S.btn>=0){ n.bn++; n.bdev+=Math.abs(S.btn-n.pos); }
      continue;
    }
    if(now>n.t+lvl.nearMs+45) applyGrade(n,0,lvl.nearMs+50,9,false);
  }
  let cur=null;
  for(let i=S.head;i<S.notes.length;i++){
    const n=S.notes[i]; if(n.t-now>420) break;
    if(n.grade===null&&now>=n.t-420&&now<n.t+n.dur){ cur=n; break; }
  }
  S.curNote=cur;
  const curKey=(cur?cur.pos:-1)*10+lvl.show;
  if(curKey!==judgeFrame._k){
    judgeFrame._k=curKey;
    if(targetRing){
      if(cur&&lvl.show===2){ const b=btnEls[cur.pos]; sattr(targetRing,"cx",b.cx); sattr(targetRing,"cy",b.cy); sattr(targetRing,"opacity","1"); }
      else sattr(targetRing,"opacity","0");
    }
  }
  const last=S.notes[S.notes.length-1];
  if(last&&S.mode==="song"&&!S.drill&&!S.finale&&last.grade!==null&&now>last.t+last.dur+120){
    S.finale=1;
    const q=S.total?(S.clean+S.near*.5)/S.total:0;
    if(q>=.6){
      S.finaleGood=1; const tn=performance.now();
      S.energy=Math.max(S.energy,.6+q*.35); S.pulse=1;
      BEAMS.forEach(function(b){ b.snap=tn; });
      flareSweep(); roar(.35+q*.6); throwBills(6);
      // Schlussakkord: linke Hand voll drauf
      if(AC){ bassHit("b",0,AC.currentTime,1.2); bassHit("c",0,AC.currentTime+.02,1.4); S.air=1; }
    }
  }
  if(last&&now>last.t+last.dur+(S.finaleGood?2500:1600)){
    if(S.mode==="demo") endDemo(); else finish();
  }
}

/* ═══════════ Intro ═══════════
   Die Kafana im Dunkeln. Die Lichterkette geht an, ein Lauf über die
   Knöpfe, der Bass setzt ein, der Titel steht. Zwölf Sekunden, und wer
   tippt, ist früher drin.                                                */
let introSkipWired=false;
const introEl=document.getElementById("intro"), blackoutEl=document.getElementById("blackout");
const ititle=introEl.querySelector(".ititle"), isub=introEl.querySelector(".isub"), isubSpan=isub.querySelector("span"),
      itag=introEl.querySelector(".itag"), icopy=introEl.querySelector(".icopy"), iskip=introEl.querySelector(".iskip");
let introT=0;
const INTRO_MEL=[[0,0],[1,190],[2,380],[3,570],[4,760],[5,950],[6,1140],[7,1330],[7,1900],[6,2090],[5,2280],[4,2470],[2,2660],[0,3040]];
const IN_END=12200;
function ease(x){ return 1-Math.pow(1-x,3); }
function easeBack(x){ const c=2.0; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); }
function seg(e,a,b){ return Math.max(0,Math.min(1,(e-a)/(b-a))); }
function startIntro(){
  S.mode="intro"; document.body.classList.add("intro");
  introEl.classList.remove("done"); introT=performance.now(); S.introSound={};
  S.song={scale:"dur",root:196}; S.bel=.5; S.air=1;
  setVeil(false); fit();
  if(!introSkipWired){ introSkipWired=true; introEl.addEventListener("pointerdown",function(e){ e.preventDefault(); endIntro(); }); }
  if(AC&&belGain) belGain.gain.setTargetAtTime(.9,AC.currentTime,.02);
}
function endIntro(){
  if(S.mode!=="intro") return;
  allOff(); S.song=null; S.mode="idle"; document.body.classList.remove("intro");
  introEl.classList.add("done");
  ititle.style.opacity=0; isub.style.height="0"; itag.style.opacity=0; icopy.style.opacity=0; iskip.style.opacity=0;
  blackoutEl.style.opacity=0; S.zoom=0;
  showMenu(); fit();
}
function driveIntro(t){
  const e=t-introT;
  if(e>=IN_END){ endIntro(); return; }
  // Licht: erst schwarz, dann flackert die Kette an
  const dark=e<2400?1-seg(e,900,2400)*.75:.25-seg(e,2400,4000)*.25;
  blackoutEl.style.opacity=Math.max(0,dark).toFixed(2);
  if(e>1200&&e<2300&&Math.floor(e/90)%3===0) blackoutEl.style.opacity=(dark+.3).toFixed(2);
  // Lauf über die Knöpfe, dann der Bass
  const IS=S.introSound;
  INTRO_MEL.forEach(function(m,i){
    const at=2900+m[1];
    if(e>=at&&!IS["m"+i]){ IS["m"+i]=1;
      if(IS.h) noteOff(IS.h); IS.h=noteOn(m[0],1); S.visBtn=m[0]; S.held={}; S.held[m[0]]=true;
      S.sparks.push({t:performance.now(),pos:m[0]});
      S.bel=.5+Math.sin(i*.9)*.4; }
  });
  if(e>=6300&&IS.h&&!IS.hOff){ IS.hOff=1; noteOff(IS.h); S.held={}; }
  for(let k=0;k<8;k++){ const at=6400+k*300;
    if(e>=at&&!IS["b"+k]){ IS["b"+k]=1; if(AC) bassHit(k%2?"c":"b",k<6?0:4,AC.currentTime,1); S.pulse=1; S.bel=.5+(k%2?.35:-.35); } }
  if(e>=8800&&!IS.fin){ IS.fin=1; if(AC){ bassHit("b",0,AC.currentTime,1.2); bassHit("c",0,AC.currentTime+.02,1.3); }
    IS.h=noteOn(7,1); S.held={7:true}; S.visBtn=7; S.shake=.6; flareSweep(); throwBills(10); roar(.8); }
  if(e>=10800&&IS.h&&!IS.h2){ IS.h2=1; noteOff(IS.h); S.held={}; }
  S.energy=Math.max(S.energy,seg(e,2900,8800)*.9);
  // Schrift
  ititle.style.opacity=seg(e,3000,3900).toFixed(2);
  ititle.style.transform="scaleX(.82) scale("+(1.06-.06*ease(seg(e,3000,4600))).toFixed(3)+")";
  const sh=seg(e,4400,5100); isub.style.height=(sh>0?"1.6em":"0"); isubSpan.style.transform="translateY("+((1-ease(sh))*100).toFixed(1)+"%)";
  itag.style.opacity=seg(e,6300,7200).toFixed(2); itag.style.transform="translateY("+((1-ease(seg(e,6300,7200)))*8).toFixed(1)+"px)";
  icopy.style.opacity=seg(e,8800,9500).toFixed(2);
  iskip.style.opacity=(e>1500?.7:0);
  S.zoom=.12*ease(seg(e,2900,9000));
  if(e>11200) blackoutEl.style.opacity=seg(e,11200,12100).toFixed(2);
}

/* ═══════════ Demo ═══════════ */
let demoIdx=0;
/* Was ein Harmonikaš tut, was in keiner Griffschrift steht.
   Ein Vorschlag von oben (predudar) auf einen betonten Ton, ein Mordent
   auf einem langen — und in den Kolos die Terz darunter, die zweite
   Stimme, die jeder mitspielt, ohne sie je gelernt zu haben. Ausgewürfelt
   wird nichts: die Wahl hängt an Ton, Schlag und Strophe, damit dieselbe
   Stelle beim zweiten Durchgang gleich klingt.                           */
function demoOrn(n){
  const meter=(S.song&&S.song.meter)||4, beat=(S.song&&S.song.beat)||400;
  if(n.type===1||n.pos>=7) return 0;
  if(!isHead(n.beat%meter,meter)) return 0;
  const pick=(n.pos*7+n.beat*3+n.verse*5)%9;
  if(n.dur>beat*1.5&&pick<4) return 2;              // Mordent auf langen Tönen
  if(pick===4||pick===7) return 1;                  // Vorschlag von oben
  return 0;
}
function demoExtraOff(){
  for(let i=0;i<S.demoExtra.length;i++) noteOff(S.demoExtra[i]);
  S.demoExtra.length=0;
}
function demoDrive(now){
  const meter=(S.song&&S.song.meter)||4;
  while(demoIdx<S.notes.length&&S.notes[demoIdx].t<=now){
    const n=S.notes[demoIdx++];
    if(S.demoH) noteOff(S.demoH);
    demoExtraOff();
    const t0=AC?AC.currentTime:0;
    const orn=demoOrn(n);
    const vel=.72+.28*beatVel(n.beat%meter,meter);
    if(orn===1&&AC){
      // Vorschlag: die obere Stufe klingt kurz an und fällt auf den Ton
      const gr=noteOn(n.pos+1,vel*.72,t0); noteOff(gr,t0+.048);
      S.demoH=noteOn(n.pos,vel,t0+.044);
    }else{
      S.demoH=noteOn(n.pos,vel,t0);
      if(orn===2&&AC){
        const up=noteOn(n.pos+1,vel*.6,t0+.085); noteOff(up,t0+.155);
      }
    }
    // Terca: die zweite Stimme eine Terz tiefer, nur auf den Gruppenköpfen
    if(AC&&S.song&&S.song.terca&&n.pos>=2&&n.type===0&&isHead(n.beat%meter,meter)){
      S.demoExtra.push(noteOn(n.pos-2,vel*.46,t0+.006));
    }
    S.demoOff=n.t+n.dur; S.held={}; S.held[n.pos]=true; S.visBtn=n.pos; S.btn=n.pos;
    S.sparks.push({t:performance.now(),pos:n.pos}); n.grade=2; S.flash=1; S.combo++; S.energy=Math.min(1,S.energy+.06);
    if(n.type===1){ n.strokes=n.need; }
    S.bob=Math.max(S.bob,.3);
  }
  if(S.demoH&&now>=S.demoOff){ noteOff(S.demoH); S.demoH=null; demoExtraOff(); S.held={}; }
  // der Balg atmet im Takt — und mit ihm Lautstärke, Helligkeit, Tonhöhe
  const beat=S.song?S.song.beat:400;
  const ph=(now/(beat*4))%1;
  const pb=S.bel;
  S.bel=.5+Math.sin(ph*6.283)*.42;
  S.belVel=S.belVel*.5+(S.bel-pb)*.5;
  const cur=S.curNote; if(cur&&cur.type===1){ S.bel=.5+Math.sin(now/40)*.18; if(Math.floor(now/80)!==S.lastShakeK){ S.lastShakeK=Math.floor(now/80); puff(.4); } }
  S.air=1;
  if(S.demoBec&&now>2600&&!S.demoBecOn){ S.demoBecOn=1; S.soloStart=performance.now(); S.soloEnd=performance.now()+14000; flareSweep(); roar(1); clink(); throwBills(10); burst("VESELJE!"); S.shake=.7; }
}
function startDemo(i,verse,bec){
  begin(); resetRun();
  const s=SONGS[i]; S.songIdx=i; S.verse=verse||0;
  S.mode="demo"; S.song=atTempo(s); S.notes=buildSong(S.song,S.verse,s.rounds);
  demoIdx=0; S.demoH=null; S.demoBec=!!bec; S.demoBecOn=0;
  S.t0=performance.now(); S.paused=false; S.air=1;
  document.getElementById("modeLabel").textContent="DEMO";
  document.getElementById("scoreOut").textContent="—";
  hintEl.textContent=TR("hintDemo",s.title.toUpperCase());
  stopBtn.style.display="block";
  setVeil(false); fit();
}
function endDemo(){
  if(S.mode!=="demo") return;
  if(S.demoH) noteOff(S.demoH); demoExtraOff(); allOff(); S.held={};
  S.mode="idle"; S.soloEnd=0; stopBtn.style.display="none"; multEl.style.opacity=0; hintEl.className="";
  showMenu();
}
const stopBtn=document.getElementById("stopBtn");
stopBtn.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
stopBtn.onclick=function(){ endDemo(); };

/* ═══════════ Hauptschleife ═══════════ */
let prev=performance.now(), hintT=0, wasSolo=false;
let veilOpen=false;
const veil=document.getElementById("veil"), inner=document.getElementById("veilInner");
function setVeil(on){ veilOpen=on; veil.className=on?"":"hidden"; if(on) requestAnimationFrame(fitVeil); }
function fitVeil(){
  inner.style.transform="";
  const avail=veil.clientHeight-20, need=inner.scrollHeight;
  if(need>avail&&need>0) inner.style.transform="scale("+(avail/need).toFixed(3)+")";
}
const camG=document.getElementById("cam"), scaleG=document.getElementById("scaleG");
const warmEl=document.getElementById("warm"), beamEls=[document.getElementById("beamA"),document.getElementById("beamB"),document.getElementById("beamC")];
const BEAMS=[{base:-14,cur:-14,snap:0,k:1},{base:14,cur:14,snap:0,k:-1},{base:0,cur:0,snap:0,k:1}];
let decoT=0, frameSum=0, frameN=0, gfxHold=0, hotWins=0, coolWins=0;
function measure(dt){
  frameSum+=dt; frameN++;
  if(frameN>=90){
    const avg=frameSum/frameN; frameSum=0; frameN=0;
    if(GFX.mode!=="auto") return;
    if(avg>26){ hotWins++; coolWins=0; if(hotWins>=2&&!GFX.low){ GFX.low=true; applyGfx(); } }
    else if(avg<18){ coolWins++; hotWins=0; if(coolWins>=6&&GFX.low){ GFX.low=false; applyGfx(); } }
  }
}
function loop(t){
  requestAnimationFrame(loop);
  ctmInv=null;                       // die Kamera hat sich bewegt
  let dt=Math.min(50,t-prev); prev=t;
  measure(dt);
  if(veilOpen&&S.mode!=="intro"){ return; }
  if(S.mode==="intro") driveIntro(t);
  const running=(S.mode==="song"||S.mode==="free"||S.mode==="demo")&&!S.paused;
  const now=running?t-S.t0:0;
  if(running){
    if(S.mode==="demo") demoDrive(now);
    if(S.mode!=="free"){ judgeFrame(now); driveBass(now); }
    driveAir(dt);
    // Luftwarnung: der Ton verhungert, die Bahn sagt es
    if(!S.autoBel&&S.mode!=="demo"&&S.holding&&S.air<.08&&t-S.airWarnT>900){ S.airWarnT=t; flash(TR("airLow"),"#d43a2a"); }
  }else if(S.mode==="intro"){ if(AC&&belGain) belGain.gain.setTargetAtTime(.9,AC.currentTime,.05); }
  // Bewegung des Instruments: Wippen im Takt, Zittern beim Zuruf
  const beat=(S.song&&S.song.beat)||420;
  S.pulse*=Math.pow(.02,dt/1000);
  S.flash*=Math.pow(.02,dt/1000); S.edgeFlash*=Math.pow(.05,dt/1000); S.dim*=Math.pow(.05,dt/1000);
  S.shake*=Math.pow(.02,dt/1000);
  S.bobVel+=(-S.bob*40-S.bobVel*7)*dt/1000; S.bob+=S.bobVel*dt/1000;
  if(!running&&S.mode!=="intro") S.energy*=Math.pow(.3,dt/1000); else S.energy*=Math.pow(.6,dt/1000);
  const soloOn=running&&S.mode!=="free"&&S.soloEnd>t;
  S.solo+=((soloOn?1:0)-S.solo)*Math.min(1,dt/260);
  if(soloOn&&!wasSolo){ S.bec=true; multEl.style.opacity=1; hintEl.textContent="VESELJE!"; hintEl.className="solo"; }
  if(!soloOn&&wasSolo){ S.bec=false; multEl.style.opacity=0; hintEl.className=""; if(running) hintEl.textContent=S.mode==="free"?TR("hintFree"):TR("hintSong"); }
  wasSolo=soloOn;
  // Balg atmet auch ohne Hand ein wenig nach
  S.belVel*=Math.pow(.05,dt/1000);
  const swing=Math.sin(t/(beat*2)*3.1416)*S.energy*.8;
  const sx=(rnd()-.5)*S.shake*14, sy=(rnd()-.5)*S.shake*10;
  const zoom=1+S.zoom+S.solo*.06+S.pulse*.02;
  sattr(camG,"transform","translate("+(INST_CX+sx).toFixed(1)+" "+(INST_CY+sy+S.bob*12).toFixed(1)+") scale("+zoom.toFixed(3)+") rotate("+(swing*1.2).toFixed(2)+") translate("+(-INST_CX)+" "+(-INST_CY)+")");
  updateBellows(); updateButtons();
  // Lichter
  const warm=.42+S.energy*.35+S.solo*.25;
  sstyle(warmEl,"opacity",warm.toFixed(2));
  BEAMS.forEach(function(b,i){
    const el=beamEls[i]; const snapAge=t-b.snap;
    const target=b.base+(soloOn?Math.sin(t/700+i*2)*22:0);
    b.cur+=(target-b.cur)*Math.min(1,dt/300);
    const op=(soloOn?.85:(S.energy*.5))*(snapAge<200?1.3:1);
    sstyle(el,"opacity",Math.min(1,op).toFixed(2));
    sstyle(el,"transform","rotate("+b.cur.toFixed(1)+"deg)");
  });
  if(flareT){ const a=t-flareT; if(a<700){ sstyle(flareEl,"opacity",(Math.sin(a/700*3.1416)).toFixed(2)); sstyle(flareEl,"transform","translateX("+((a/700-.5)*160).toFixed(1)+"%)"); } else { sstyle(flareEl,"opacity","0"); flareT=0; } }
  if(burstT){ const a=t-burstT; if(a<900){ sstyle(burstEl,"opacity",(Math.sin(a/900*3.1416)*.9).toFixed(2)); sstyle(burstEl,"transform","scaleX(.8) scale("+(1+a/900*.35).toFixed(3)+")"); } else { sstyle(burstEl,"opacity","0"); burstT=0; } }
  if(S.judgeTimer&&t-S.judgeTimer>650){ judgeEl.style.opacity=0; S.judgeTimer=0; }
  // Gäste prosten zu, wenn's brennt
  decoT+=dt;
  if(decoT>=GFX.decoMs){ decoT=0;
    (window.GUESTS||[]).forEach(function(g){
      const lift=(S.energy*.6+S.solo)*(.6+.4*Math.sin(t/420+g.ph));
      sattr(g.arm,"transform","rotate("+(-lift*38).toFixed(1)+" "+g.x+" "+g.y+")");
    });
    driveBills(GFX.decoMs);
  }
  drawStaff(now);
  if(S.mode==="free"&&hintT&&t-hintT>9000&&S.freeStrokes>6){ hintT=0; hintEl.textContent=""; }
}

  h+='</div><div><p class="eyebrow">'+TR("resAgain")+'</p>';
  if(weakV) h+='<button class="big" id="weakBtn" style="border-color:var(--amber);background:rgba(240,168,60,.12)">'+TR("weakBtn")+'<span style="font-weight:400;letter-spacing:.12em"> · '+TR("verseWord",weakV)+'</span></button>';
  h+='<button class="big'+(weakV?' q':'')+'" id="againBtn">'+(S.verse?TR("btnRepeatVerse",S.verse):TR("btnRepeatSong"))+'</button>';
  if(S.verse) h+='<button class="big q" id="wholeBtn">'+TR("btnWhole")+'</button>';
  h+='<button class="big q" id="songsBtn">'+TR("btnOther")+'</button><button class="big q" id="freeBtn">'+TR("btnFree")+'</button></div></div>';
  inner.innerHTML=h;
  const idx=S.songIdx, vs=S.verse;
  inner.querySelector("#backTo").onclick=showMenu;
  const wk=inner.querySelector("#weakBtn"); if(wk) wk.onclick=function(){ startSong(idx,weakV); };
  inner.querySelector("#againBtn").onclick=function(){ startSong(idx,vs); };
  const wb=inner.querySelector("#wholeBtn"); if(wb) wb.onclick=function(){ startSong(idx,0); };
  inner.querySelector("#songsBtn").onclick=function(){ showScreen("songs"); };
  inner.querySelector("#freeBtn").onclick=startFree;
  setVeil(true);
}
function finishDrill(){
  const d=S.drill, M=meters(), acc=S.total?Math.round(S.clean/S.total*100):0, groove=grooveVal();
  const prev=DB.drill[d.id]||0, isBest=acc>prev;
  if(isBest) DB.drill[d.id]=acc; dbSave(); S.drill=null;
  let h='<div class="shead"><h2>'+TR("mDrill")+'</h2><span class="note">'+TR("dn"+d.i)+'</span><button class="back" id="backTo">MENU</button></div><div class="cols"><div>';
  h+='<p class="tally">'+TR("acc")+' <b>'+acc+'%</b>'+(isBest&&prev?' <span class="hot">· '+TR("betterBefore")+'</span>':'')+(prev?' <span style="font-size:10px">'+TR("before",prev)+'</span>':'')+
     '<br>'+TR("jClean")+' <b>'+S.clean+'</b> · '+TR("jNear")+' <b>'+S.near+'</b> · '+TR("jMiss")+' <b>'+S.miss+'</b> · '+TR("strayW")+' <b>'+S.stray+'</b></p><div class="rule"></div>';
  const ms=[[TR("m0"),M.prsti],[TR("m1"),M.mijeh],[TR("m2"),M.ritam]]; if(groove!==null) ms.push(["GROOVE",groove]);
  ms.forEach(function(m){ h+='<div class="meter"><span>'+m[0]+'</span><i><b style="width:'+pct(m[1])+'%"></b></i><em>'+pct(m[1])+'</em></div>'; });
  h+='</div><div><p class="eyebrow">'+TR("resAgain")+'</p><button class="big" id="againBtn">'+TR("resAgain")+'</button>'+
     '<button class="big q" id="drillBtn">'+TR("otherDrill")+'</button><button class="big q" id="songsBtn">'+TR("mSongs")+'</button></div></div>';
  inner.innerHTML=h;
  const idx=S.songIdx;
  inner.querySelector("#backTo").onclick=showMenu;
  inner.querySelector("#againBtn").onclick=function(){ startDrill(idx); };
  inner.querySelector("#drillBtn").onclick=function(){ showScreen("drill"); };
  inner.querySelector("#songsBtn").onclick=function(){ showScreen("songs"); };
  setVeil(true);
}

  unlock:unlock,ac:function(){ return AC; },tap:function(n){ if(lim) lim.connect(n); },
