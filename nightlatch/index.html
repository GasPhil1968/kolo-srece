<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Night Latch</title>
<meta name="description" content="NIGHT LATCH - a noir point-and-click detective adventure. Brackwater, 1951.">
<style>
  html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { position: relative; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  html, body, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #050508; color: #b9a77a;
            font: 16px/1.5 monospace; letter-spacing: 2px; align-items: center; justify-content: center; text-align: center; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          color: #b9a77a; font: 14px/1.4 monospace; letter-spacing: 2px; pointer-events: none; }
</style>
</head>
<body oncontextmenu="return false">
<div id="game"></div>
<div id="rotate">&#x21bb;<br>Bitte Gerät quer halten<br>Please turn your device</div>
<div id="boot">NIGHT LATCH</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
