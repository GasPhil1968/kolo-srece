<script>
(function(){

/* ==========================================================================
   EVOLUCIJA PITE — od jufke do bureka
   Single-file, Canvas 2D, Web Audio, localStorage.  © by FG
   Ista kuhinja kao TRI FILDŽANA: virtuelno platno 720×1280, sve nacrtano

/* ---------- konfiguracija ---------- */
var W = 720, HH = 1280;
var cv, ctx, DPR = 1, SC = 1, OX = 0, OY = 0, VW = 720, VH = 1280;

var HUD_H   = 112;
/* tepsija: vanjski rub i unutrašnjost u kojoj žive pite */
var TRAY = { x0:40, x1:680, top:560, bot:1190, wall:18 };
var PL = TRAY.x0 + TRAY.wall, PR = TRAY.x1 - TRAY.wall, PFLOOR = TRAY.bot - TRAY.wall;
var DANGER_Y = 652;            /* crvena linija */
var DANGER_T = 2.0;            /* koliko sekundi iznad linije prije kraja */
var DROP_Y   = 470;            /* gdje visi pita prije puštanja */
var DROP_CD  = 0.5;            /* pauza dok ne dođe sljedeća */

/* fizika — ugođeno rukom, ne po udžbeniku */
var PH = { g:2300, rest:0.10, fric:0.42, air:0.06, iter:5, dt:1/120, slop:0.4, corr:0.55, maxCorr:7 };

/* ---------- pomoćne ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function eio(t){ return 0.5-0.5*Math.cos(Math.PI*clamp(t,0,1)); }
function eoc(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function eic(t){ t=clamp(t,0,1); return t*t*t; }
function eob(t){ t=clamp(t,0,1); var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function fmt(n){ /* 18450 → 18.450 */
  var s = String(Math.round(n)), o = '';
  while(s.length > 3){ o = '.' + s.slice(-3) + o; s = s.slice(0, -3); }
  return s + o;
}

function rr(g,x,y,w,h,r){ g.beginPath(); rrSub(g,x,y,w,h,r); }
/* ista stvar bez beginPath — za oblike s rupom (evenodd) */
function rrSub(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
var FONT = 'system-ui,-apple-system,"Segoe UI",sans-serif';
function txt(s,x,y,font,fill,align,base){
  ctx.font = font; ctx.fillStyle = fill;
  ctx.textAlign = align||'center'; ctx.textBaseline = base||'middle';
  ctx.fillText(s,x,y);
}
/* naslovni tekst s debelim tamnim obrubom — kao špica */
function txtO(s,x,y,font,fill,lw,align){
  ctx.font = font; ctx.textAlign = align||'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw||10; ctx.strokeStyle = 'rgba(18,10,6,0.9)';
  ctx.strokeText(s,x,y); ctx.fillStyle = fill; ctx.fillText(s,x,y);
}
function wrap(s,maxw,font){
  ctx.font = font;
  var words = String(s).split(' '), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(ctx.measureText(t).width > maxw && cur){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}
/* valovita kružnica — ništa u pekari nije savršeno okruglo */
function wobble(g, r, n, amp, seed){
  g.beginPath();
  for(var i=0;i<=n;i++){
    var a = i/n*Math.PI*2;
    var rad = r*(1 + amp*Math.sin(a*3+seed) + amp*0.6*Math.sin(a*7+seed*1.7) + amp*0.3*Math.sin(a*11-seed));
    var x = Math.cos(a)*rad, y = Math.sin(a)*rad;
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath();
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ==========================================================================
   SPREMANJE — localStorage, sve u jednom ključu
   ========================================================================== */
var STORE = 'evolucija_pite_v1';
var META = { best:0, games:0, merges:0, biggest:0, bestCombo:0, total:0, snd:1, eggGap:0, eggs:0 };
function load(){
  try{
    var r = localStorage.getItem(STORE);
    if(!r) return;
    var o = JSON.parse(r);
    if(!o || typeof o !== 'object') return;
    META.best      = clamp(o.best|0, 0, 99999999);
    META.games     = clamp(o.games|0, 0, 9999999);
    META.merges    = clamp(o.merges|0, 0, 99999999);
    META.biggest   = clamp(o.biggest|0, 0, 9);
    META.bestCombo = clamp(o.bestCombo|0, 0, 999);
    META.total     = clamp(o.total|0, 0, 999999999);
    META.snd       = (o.snd === 0) ? 0 : 1;
    META.eggGap    = clamp(o.eggGap|0, 0, 99999);
    META.eggs      = clamp(o.eggs|0, 0, 99999);
  }catch(e){}
}
function save(){
  try{ META.snd = AU.on ? 1 : 0; localStorage.setItem(STORE, JSON.stringify(META)); }catch(e){}
}

/* ==========================================================================
   ZVUK — Web Audio, sve sintetizirano. Isti kostur kao u fildžanima,
   samo su zvukovi iz pekare: tijesto, lim, para.
   ========================================================================== */
var AU = {
  on: true, ctx: null, amb: null,
  init: function(){
    if(this.ctx) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      var nlen = Math.floor(this.ctx.sampleRate*2);
      this.noiseBuf = this.ctx.createBuffer(1,nlen,this.ctx.sampleRate);
      var nd = this.noiseBuf.getChannelData(0);
      for(var ni=0;ni<nlen;ni++) nd[ni] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  ok: function(){
    if(!this.on || !this.ctx) return false;
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }
    return true;
  },
  tone: function(f,dur,type,vol,f2,delay){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.05);
  },
  noise: function(dur,freq,q,vol,delay,slideTo,type){
    if(!this.ok()) return;
    var t0 = this.ctx.currentTime + (delay||0);
    var s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    var f = this.ctx.createBiquadFilter();
    f.type = type||'bandpass'; f.frequency.setValueAtTime(freq,t0); f.Q.value = q||1;
    if(slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    var off = Math.random()*Math.max(0.01, s.buffer.duration-dur-0.01);
    s.start(t0, off, Math.min(dur, s.buffer.duration-off)); s.stop(t0+dur+0.02);
  },
  pluck: function(f,dur,vol,delay){
    if(!this.ok()) return;
    this.tone(f,dur,'triangle',vol||0.14,f*0.995,delay);
    this.tone(f*2.01,dur*0.4,'sine',(vol||0.14)*0.4,f*2,delay);
  },
  /* --- zvukovi igre --- */
  click: function(){ this.tone(1180,0.06,'triangle',0.10,1560); this.tone(1560,0.08,'sine',0.06,2100,0.05); },
  drop: function(){ this.noise(0.09,600,0.8,0.07,0,300,'lowpass'); this.tone(240,0.08,'sine',0.05,160); },
  /* dodir dvije pite: "plop" — jači udar, dublji ton */
  plop: function(k){
    k = clamp(k, 0, 1);
    this.tone(200+k*80, 0.05+k*0.05, 'sine', 0.04+k*0.10, 110);
    this.noise(0.05, 900, 0.9, 0.03+k*0.06, 0, 300, 'lowpass');
  },
  /* udar u lim tepsije */
  lim: function(k){
    k = clamp(k, 0, 1);
    this.tone(120, 0.12, 'sine', 0.06+k*0.12, 60);
    this.tone(1900, 0.05, 'triangle', 0.02+k*0.05, 1400);
    this.noise(0.08, 2400, 1.4, 0.02+k*0.05, 0, 900);
  },
  /* spajanje: "fup" tijesta — što veća pita, to dublje */
  merge: function(lvl){
    var f = 520*Math.pow(0.84, lvl);
    this.tone(f*1.6, 0.10, 'sine', 0.14, f*0.7);
    this.tone(f*0.8, 0.22, 'triangle', 0.08, f*0.45, 0.03);
    this.noise(0.14, 700, 0.8, 0.10, 0, 260, 'lowpass');
    if(lvl >= 6){
      this.tone(70, 0.30, 'sine', 0.18, 40, 0.02);
      this.noise(0.5, 3200, 0.6, 0.05, 0.05, 1600);      /* cvrči masnoća */
    }
    if(lvl >= 8){
      this.noise(0.9, 2600, 0.5, 0.07, 0.08, 800);
      this.tone(2450,0.09,'triangle',0.06,3100,0.12); this.tone(3300,0.06,'sine',0.04,3900,0.18);
    }
  },
  combo: function(n){
    var base = [392, 466.16, 587.33, 698.46, 783.99];
    var k = Math.min(n, 5);
    for(var i=0;i<k;i++) this.pluck(base[i]*(n>=5?1.5:1), 0.22, 0.10, i*0.06);
  },
  warn: function(){ this.tone(220, 0.22, 'square', 0.05, 200); this.tone(165, 0.22, 'square', 0.04, 150, 0.24); },
  over: function(){
    var f=[349.23,329.63,293.66,261.63,196.00];
    for(var i=0;i<f.length;i++) this.pluck(f[i],0.6,0.14,i*0.17);
    this.noise(0.6, 400, 0.6, 0.06, 0.1, 120, 'lowpass');
  },
  best: function(){
    var f=[392,493.88,587.33,783.99];
    for(var i=0;i<f.length;i++) this.pluck(f[i],0.4,0.12,i*0.09);
  },
  /* "Izađi." — jedan suhi udarac */
  izadji: function(){ this.tone(90, 0.35, 'sine', 0.2, 45); this.noise(0.2, 300, 0.7, 0.10, 0, 90, 'lowpass'); },

  /* --- ambijent: ventilacija + furuna, tiho, samo dok se igra --- */
  ambOn: function(){
    if(!this.ok() || this.amb) return;
    try{
      var c = this.ctx, g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.06, c.currentTime+1.5);
      g.connect(this.master);
      var hum = c.createOscillator(); hum.type = 'sine'; hum.frequency.value = 50;
      var hg = c.createGain(); hg.gain.value = 0.35; hum.connect(hg); hg.connect(g);
      var hum2 = c.createOscillator(); hum2.type = 'triangle'; hum2.frequency.value = 100.7;
      var hg2 = c.createGain(); hg2.gain.value = 0.10; hum2.connect(hg2); hg2.connect(g);
      var n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; f.Q.value = 0.6;
      var ng = c.createGain(); ng.gain.value = 0.55;
      var lfo = c.createOscillator(); lfo.frequency.value = 0.13;
      var lg = c.createGain(); lg.gain.value = 0.18; lfo.connect(lg); lg.connect(ng.gain);
      n.connect(f); f.connect(ng); ng.connect(g);
      hum.start(); hum2.start(); n.start(); lfo.start();
      this.amb = { g:g, nodes:[hum,hum2,n,lfo] };
    }catch(e){ this.amb = null; }
  },
  ambOff: function(){
    if(!this.amb || !this.ctx) return;
    var a = this.amb; this.amb = null;
    try{
      a.g.gain.setValueAtTime(a.g.gain.value, this.ctx.currentTime);
      a.g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.6);
      setTimeout(function(){ try{ for(var i=0;i<a.nodes.length;i++) a.nodes[i].stop(); }catch(e){} }, 800);
    }catch(e){}
  },
  /* povremeni zveket iz kuhinje */
  klink: function(){
    var f = pick([2100, 2600, 3100]);
    this.tone(f, 0.08, 'triangle', 0.025, f*0.8);
    this.tone(f*1.5, 0.05, 'sine', 0.015, f*1.2, 0.07);
  }
};

/* ==========================================================================

    fill:'#5e3020', fill2:'#7c4428', fillN:1.0, fillR:0.04, meat:true, steam:true, glow:true, sezam:true }
];
var MAX_LVL = PITE.length;
function pita(lvl){ return PITE[clamp(lvl,1,MAX_LVL)-1]; }
/* masa raste s površinom — velike pite guraju male */
for(var _i=0;_i<PITE.length;_i++) PITE[_i].m = PITE[_i].r*PITE[_i].r/900;

/* nivoi koji padaju s oklagije i njihova vjerovatnoća (prvih par bacanja bez sirnice) */
var SPAWN_W = [0, 0.34, 0.30, 0.22, 0.14];
function rollSpawn(dropsSoFar){
  var maxL = (dropsSoFar < 6) ? 3 : 4;
  var tot = 0, i;
  for(i=1;i<=maxL;i++) tot += SPAWN_W[i];
  var x = Math.random()*tot;
  for(i=1;i<=maxL;i++){ x -= SPAWN_W[i]; if(x <= 0) return i; }
  return 1;
}

/* deterministički "random" — sprite iste pite izgleda isto svaki put */
var _seed = 1;
function srand(s){ _seed = (s*9301 + 49297) % 233280; }
function sr(){ _seed = (_seed*9301 + 49297) % 233280; return _seed/233280; }
function srr(a,b){ return a + sr()*(b-a); }

/* ---------- crtanje pojedinih pita (u ishodištu, poluprečnik r) ---------- */
function drawJufka(g, P){
  var r = P.r;
  srand(11);
  var grad = g.createRadialGradient(-r*0.3, -r*0.35, r*0.1, 0, 0, r*1.05);
  grad.addColorStop(0, P.c0); grad.addColorStop(1, P.c1);
  g.fillStyle = grad;
  wobble(g, r*0.97, 40, 0.11, 2.3); g.fill();
  /* nabori — jufka je mlohava */
  g.strokeStyle = P.line; g.lineWidth = r*0.06; g.lineCap = 'round';
  for(var i=0;i<4;i++){
    var a = srr(0, 6.28), d = srr(r*0.2, r*0.6);
    var x = Math.cos(a)*d, y = Math.sin(a)*d;
    g.beginPath();
    g.moveTo(x - r*0.3, y + srr(-r*0.1, r*0.1));
    g.quadraticCurveTo(x, y + srr(-r*0.25, r*0.25), x + r*0.3, y + srr(-r*0.1, r*0.1));
    g.stroke();
  }
  /* brašno */
  g.fillStyle = 'rgba(255,255,255,0.55)';
  for(i=0;i<14;i++){
    var a2 = srr(0, 6.28), d2 = srr(0, r*0.85);
    g.beginPath(); g.arc(Math.cos(a2)*d2, Math.sin(a2)*d2, srr(0.8, 2.2), 0, 6.284); g.fill();
  }
  /* prozirnost — tanka je: sjenka pri dnu */
  var sh = g.createRadialGradient(r*0.2, r*0.3, r*0.3, 0, 0, r*1.1);
  sh.addColorStop(0, 'rgba(120,90,50,0)'); sh.addColorStop(1, 'rgba(120,90,50,0.22)');
  g.fillStyle = sh; wobble(g, r*0.97, 40, 0.11, 2.3); g.fill();
  g.strokeStyle = P.outline; g.lineWidth = 2.4; g.lineJoin = 'round';
  wobble(g, r*0.97, 40, 0.11, 2.3); g.stroke();
}

function drawSmotuljak(g, P){
  var r = P.r;
  srand(23);
  /* rolna gledana s kraja: spirala sirovog tijesta */
  var grad = g.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r*1.05);
  grad.addColorStop(0, P.c0); grad.addColorStop(1, P.c1);
  g.fillStyle = grad;
  wobble(g, r*0.96, 36, 0.05, 5.1); g.fill();
  g.strokeStyle = P.line; g.lineWidth = r*0.09; g.lineCap = 'round';
  g.beginPath();
  var turns = 2.2, n = 70;
  for(var i=0;i<=n;i++){
    var t = i/n, a = t*turns*Math.PI*2, rad = r*0.08 + t*r*0.78 + Math.sin(a*2.3)*r*0.02;
    var x = Math.cos(a)*rad, y = Math.sin(a)*rad;
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.stroke();
  /* strana rolne — tamniji polumjesec, da se vidi da je valjak */
  g.fillStyle = 'rgba(120,90,50,0.16)';
  g.beginPath(); g.ellipse(r*0.22, r*0.18, r*0.75, r*0.62, 0.4, 0, 6.284); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)';
  for(i=0;i<10;i++){
    var a2 = srr(0, 6.28), d2 = srr(0, r*0.85);
    g.beginPath(); g.arc(Math.cos(a2)*d2, Math.sin(a2)*d2, srr(0.8, 2.0), 0, 6.284); g.fill();
  }
  var sh = g.createRadialGradient(r*0.2, r*0.3, r*0.3, 0, 0, r*1.1);
  sh.addColorStop(0, 'rgba(100,70,40,0)'); sh.addColorStop(1, 'rgba(100,70,40,0.28)');
  g.fillStyle = sh; wobble(g, r*0.96, 36, 0.05, 5.1); g.fill();
  g.strokeStyle = P.outline; g.lineWidth = 2.6; g.lineJoin = 'round';
  wobble(g, r*0.96, 36, 0.05, 5.1); g.stroke();
}

/* pečena spirala: zvrk, sirnica, zeljanica, krompiruša, burek… */
function drawSpiralPita(g, P){
  var r = P.r;
  srand(P.id*7 + 3);
  var wob = P.rustic ? 0.06 : 0.035;
  var seed = P.id*1.3;
  /* kora */
  var grad = g.createRadialGradient(-r*0.32, -r*0.36, r*0.08, 0, 0, r*1.02);
  grad.addColorStop(0, P.c0); grad.addColorStop(0.72, P.c1); grad.addColorStop(1, P.c1);
  g.fillStyle = grad;
  wobble(g, r*0.97, 48, wob, seed); g.fill();

  /* spirala — brazda između namotaja */
  var turns = P.turns, n = Math.floor(60*turns);
  var r0 = r*0.10, r1 = r*0.90;
  var pts = [];
  for(var i=0;i<=n;i++){
    var t = i/n, a = t*turns*Math.PI*2;
    var rad = r0 + (r1-r0)*t + Math.sin(a*1.7+seed)*r*0.015;
    pts.push([Math.cos(a)*rad, Math.sin(a)*rad]);
  }
  g.lineCap = 'round'; g.lineJoin = 'round';
  /* svjetla strana namotaja (gore-lijevo) */
  g.strokeStyle = 'rgba(255,240,200,0.28)'; g.lineWidth = r*P.coil*1.3;
  g.beginPath();
  for(i=0;i<pts.length;i++){ if(i===0) g.moveTo(pts[i][0]-r*0.02, pts[i][1]-r*0.025); else g.lineTo(pts[i][0]-r*0.02, pts[i][1]-r*0.025); }
  g.stroke();
  /* sama brazda */
  g.strokeStyle = P.line; g.lineWidth = r*P.coil;
  g.beginPath();
  for(i=0;i<pts.length;i++){ if(i===0) g.moveTo(pts[i][0], pts[i][1]); else g.lineTo(pts[i][0], pts[i][1]); }
  g.stroke();

  /* fil koji proviruje kroz brazdu */
  if(P.fill){
    var cnt = Math.floor(turns*7*P.fillN);
    for(i=0;i<cnt;i++){
      var t2 = srr(0.15, 1), a2 = t2*turns*Math.PI*2;
      var rad2 = r0 + (r1-r0)*t2;
      var fx = Math.cos(a2)*rad2, fy = Math.sin(a2)*rad2;
      var fr = r*P.fillR*srr(0.6, 1.3);
      g.fillStyle = (P.fill2 && sr() < 0.45) ? P.fill2 : P.fill;
      g.globalAlpha = P.meat ? 0.75 : 0.9;
      g.beginPath(); g.ellipse(fx, fy, fr*1.4, fr, a2, 0, 6.284); g.fill();
      g.globalAlpha = 1;
    }
  }
  /* pečene fleke */
  var ns = Math.floor(4 + r/14);
  for(i=0;i<ns;i++){
    var a3 = srr(0, 6.28), d3 = srr(r*0.25, r*0.88);
    var sx = Math.cos(a3)*d3, sy = Math.sin(a3)*d3;
    g.fillStyle = P.spot; g.globalAlpha = srr(0.18, 0.42);
    g.beginPath(); g.ellipse(sx, sy, srr(r*0.05, r*0.13), srr(r*0.03, r*0.08), a3, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
  /* susam na carskom */
  if(P.sezam){
    g.fillStyle = '#f5e6bd';
    for(i=0;i<46;i++){
      var a4 = srr(0, 6.28), d4 = srr(r*0.15, r*0.9);
      g.save(); g.translate(Math.cos(a4)*d4, Math.sin(a4)*d4); g.rotate(srr(0,3.14));
      g.beginPath(); g.ellipse(0, 0, r*0.022, r*0.012, 0, 0, 6.284); g.fill();
      g.restore();
    }
  }
  /* masni odsjaji */
  if(P.gloss){
    g.fillStyle = 'rgba(255,250,230,'+P.gloss+')';
    var ng = Math.floor(3 + turns);
    for(i=0;i<ng;i++){
      var t5 = srr(0.2, 0.95), a5 = t5*turns*Math.PI*2 - 0.9;
      var rad5 = r0 + (r1-r0)*t5 - r*P.coil*0.5;
      g.save(); g.translate(Math.cos(a5)*rad5, Math.sin(a5)*rad5); g.rotate(a5+1.57);
      g.beginPath(); g.ellipse(0, 0, r*srr(0.06,0.14), r*0.028, 0, 0, 6.284); g.fill();
      g.restore();
    }
    g.beginPath(); g.ellipse(-r*0.38, -r*0.42, r*0.16, r*0.08, -0.7, 0, 6.284); g.fill();
  }
  /* sjena pri dnu — volumen */
  var sh = g.createRadialGradient(r*0.15, r*0.25, r*0.35, 0, 0, r*1.08);
  sh.addColorStop(0, 'rgba(70,35,10,0)'); sh.addColorStop(1, 'rgba(70,35,10,0.30)');
  g.fillStyle = sh; wobble(g, r*0.97, 48, wob, seed); g.fill();
  /* tamni obrub — ručno nacrtano */
  g.strokeStyle = P.outline; g.lineWidth = P.rustic ? 4 : 3;
  wobble(g, r*0.97, 48, wob, seed); g.stroke();
}

function drawPitaAt(g, P){
  if(P.draw === 'jufka') drawJufka(g, P);
  else if(P.draw === 'smotuljak') drawSmotuljak(g, P);
  else drawSpiralPita(g, P);
}

/* sprite-keš: svaka pita se crta jednom u dvostrukoj rezoluciji */
var SPR = {}, SPR_S = 2, SPR_PAD = 12;
function pitaSprite(lvl){
  if(SPR[lvl]) return SPR[lvl];
  var P = pita(lvl);
  var size = (P.r + SPR_PAD)*2;
  var c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size*SPR_S);
  var g = c.getContext('2d');
  g.scale(SPR_S, SPR_S);
  g.translate(size/2, size/2);
  drawPitaAt(g, P);
  SPR[lvl] = { c:c, size:size };
  return SPR[lvl];
}
function blitPita(lvl, x, y, rot, sx, sy, alpha){
  var s = pitaSprite(lvl);
  ctx.save();
  if(alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(rot||0);
  if(sx !== undefined) ctx.scale(sx, sy);
  ctx.drawImage(s.c, -s.size/2, -s.size/2, s.size, s.size);
  ctx.restore();
}

var PARTS = [], PART_N = 260, PART_I = 0;

function part(k, x, y, vx, vy, life, r, c){

         dark ? pick(['#7a4a20','#a86a30','#5e3a1c']) : pick(['#e8c98c','#d6a55c','#f3e2bd']));

    part(2, x+rnd(-14,14), y+rnd(-6,6), rnd(-18,18), rnd(-70,-30)*(big?1.4:1), rnd(0.9,1.8)*(big?1.4:1), rnd(10,18)*(big?1.5:1), '');
  }

function updateParts(dt){
  for(var i=0;i<PART_N;i++){
    var p = PARTS[i];
    if(!p.on) continue;
    p.life -= dt;
    if(p.life <= 0){ p.on = false; continue; }
    if(p.k === 0){ p.vy += 1400*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1-2*dt);
      if(p.y > PFLOOR - p.r){ p.y = PFLOOR - p.r; p.vy = -p.vy*0.3; p.vx *= 0.7; } }
    else if(p.k === 1){ p.vy += 500*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
    else { p.x += (p.vx + Math.sin(G.gt*2.3 + p.rot)*14)*dt; p.y += p.vy*dt; p.r += 16*dt; }
  }
}

function komSay(s, dur, prio){

  KOM.brow = 1; KOM.idleT = 0;

function komEvent(key, prio, dur){ return komSay(pick(L[key]), dur||2.8, prio||1); }
function updateKom(dt){

  if(KOM.cd > 0) KOM.cd -= dt;

  KOM.blinkT -= dt;
  if(KOM.blinkT <= 0){ KOM.blink = 0.14; KOM.blinkT = rnd(2.2, 5.5); }
  if(KOM.blink > 0) KOM.blink -= dt;
  /* gleda pitu koja visi; dok je jaje, gleda prema vratima */
  var target = 0, ty = 0;
  if(G.egg){ target = (G.egg.phase >= 1) ? 1 : 0.15; ty = -0.3; }

/* ==========================================================================
   TIJELA I FIZIKA — kružnice, impulsi, malo trenja, malo odskoka
   ========================================================================== */
function mkBody(lvl, x, y){
  var P = pita(lvl);
  return { id:G.nextId++, lvl:lvl, r:P.r, m:P.m, im:1/P.m, iI:1/(0.5*P.m*P.r*P.r),
           x:x, y:y, vx:0, vy:0, rot:rnd(-0.4,0.4), vr:0, age:0, sq:0, sqPh:0,
           dead:false, dropped:false, dropX:x, landed:false, steamT:rnd(0,0.4) };
}
var MERGES = [];          /* parovi koji se spajaju u ovom koraku */
var HIT = { pp:0, lim:0, x:0, y:0, lx:0, ly:0 };   /* najjači udari u frame-u — jedan zvuk, ne sto */

function stepPhysics(dt){
  var B = G.bodies, n = B.length, i, j, b;
  for(i=0;i<n;i++){
    b = B[i];
    b.vy += PH.g*dt;
    b.vx *= (1 - PH.air*dt); b.vy *= (1 - PH.air*dt*0.3);
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.rot += b.vr*dt; b.vr *= (1 - 0.9*dt);
    b.age += dt;
  }
  MERGES.length = 0;
  for(var it=0; it<PH.iter; it++){
    for(i=0;i<n;i++){
      var a = B[i];
      if(a.dead) continue;
      for(j=i+1;j<n;j++){
        b = B[j];
        if(b.dead) continue;
        var dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r;
        if(Math.abs(dx) > rs || Math.abs(dy) > rs) continue;
        var d2 = dx*dx + dy*dy;
        if(d2 >= rs*rs) continue;
        var d = Math.sqrt(d2);
        if(d < 0.001){ dx = 0.01; dy = -1; d = 1; }
        var nx = dx/d, ny = dy/d, pen = rs - d;
        if(it === 0 && a.lvl === b.lvl && a.lvl < MAX_LVL) MERGES.push(a, b);
        /* razdvajanje po masi */
        var ims = a.im + b.im;
        var corr = Math.min(PH.maxCorr, Math.max(pen - PH.slop, 0)*PH.corr);
        a.x -= nx*corr*a.im/ims; a.y -= ny*corr*a.im/ims;
        b.x += nx*corr*b.im/ims; b.y += ny*corr*b.im/ims;
        /* impuls */
        var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        var vn = rvx*nx + rvy*ny;
        if(vn >= 0) continue;
        var e = (-vn < 90) ? 0 : PH.rest;     /* spori dodiri ne poskakuju */
        var jn = -(1+e)*vn/ims;
        a.vx -= nx*jn*a.im; a.vy -= ny*jn*a.im;
        b.vx += nx*jn*b.im; b.vy += ny*jn*b.im;
        /* trenje + vrtnja */
        var tx = -ny, ty = nx;
        var vt = rvx*tx + rvy*ty - b.vr*b.r - a.vr*a.r;
        var den = ims + a.r*a.r*a.iI + b.r*b.r*b.iI;
        var jt = clamp(-vt/den, -PH.fric*jn, PH.fric*jn);
        a.vx -= tx*jt*a.im; a.vy -= ty*jt*a.im;
        b.vx += tx*jt*b.im; b.vy += ty*jt*b.im;
        a.vr -= jt*a.r*a.iI; b.vr -= jt*b.r*b.iI;
        if(it === 0){
          var imp = -vn;
          if(imp > HIT.pp){ HIT.pp = imp; HIT.x = a.x + nx*a.r; HIT.y = a.y + ny*a.r; }
          if(imp > 320){
            var s2 = Math.min(0.30, imp/3200);
            if(s2 > a.sq){ a.sq = s2; a.sqPh = 0; }
            if(s2 > b.sq){ b.sq = s2; b.sqPh = 0; }
          }
        }
      }
      wallContact(a, it === 0);
    }
  }
  /* niko ne bježi iz tepsije */
  for(i=0;i<n;i++){
    b = B[i];
    if(b.x < PL + b.r) b.x = PL + b.r;
    if(b.x > PR - b.r) b.x = PR - b.r;
    if(b.y > PFLOOR - b.r) b.y = PFLOOR - b.r;
  }
}
/* zidovi i dno tepsije: normala gleda u tijelo */
function wallContact(b, first){
  var pen, imp, jn, vt, jt, den;
  /* lijevo / desno */
  var side = 0;
  if(b.x - b.r < PL){ pen = PL - (b.x - b.r); b.x += pen; side = 1; }
  else if(b.x + b.r > PR){ pen = (b.x + b.r) - PR; b.x -= pen; side = -1; }
  if(side){
    var vn = b.vx*side;                 /* brzina prema zidu (negativna = udara) */
    if(vn < 0){
      imp = -vn;
      var e = (imp < 90) ? 0 : PH.rest;
      jn = -(1+e)*vn/b.im;
      b.vx += side*jn*b.im;
      /* trenje uz zid: tangenta je y */
      vt = b.vy - b.vr*b.r*side;
      den = b.im + b.r*b.r*b.iI;
      jt = clamp(-vt/den, -PH.fric*jn, PH.fric*jn);
      b.vy += jt*b.im; b.vr -= jt*b.r*b.iI*side;
      if(first && imp > HIT.lim){ HIT.lim = imp; HIT.lx = b.x - side*b.r; HIT.ly = b.y; }
    }
  }
  /* dno */
  if(b.y + b.r > PFLOOR){
    pen = (b.y + b.r) - PFLOOR; b.y -= pen;
    if(b.vy > 0){
      imp = b.vy;
      var e2 = (imp < 90) ? 0 : PH.rest;
      jn = (1+e2)*b.vy/b.im;
      b.vy -= jn*b.im;
      vt = b.vx + b.vr*b.r;
      den = b.im + b.r*b.r*b.iI;
      jt = clamp(-vt/den, -PH.fric*jn, PH.fric*jn);
      b.vx += jt*b.im; b.vr += jt*b.r*b.iI;
      if(first && imp > HIT.lim){ HIT.lim = imp; HIT.lx = b.x; HIT.ly = PFLOOR; }
      if(first && imp > 320){ var s2 = Math.min(0.30, imp/3200); if(s2 > b.sq){ b.sq = s2; b.sqPh = 0; } }
    }
  }
}

/* ---------- spajanje ---------- */
function comboMult(){ return 1 + Math.max(0, G.combo-1)*0.25; }
function doMerges(){
  for(var k=0;k<MERGES.length;k+=2){
    var a = MERGES[k], b = MERGES[k+1];
    if(a.dead || b.dead) continue;
    a.dead = true; b.dead = true;
    var lvl = a.lvl + 1, P = pita(lvl);
    var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    var nb = mkBody(lvl, mx, my);
    nb.vx = (a.vx+b.vx)*0.5; nb.vy = Math.min((a.vy+b.vy)*0.5, 0) - 40;
    nb.vr = (a.vr+b.vr)*0.5; nb.rot = a.rot;
    nb.sq = 0.42; nb.sqPh = 0;
    if(nb.y > PFLOOR - nb.r) nb.y = PFLOOR - nb.r;
    G.bodies.push(nb);

    /* combo: spajanja u brzom nizu */
    if(G.comboT < 1.4) G.combo++; else G.combo = 1;
    G.comboT = 0;
    if(G.combo > G.bestCombo) G.bestCombo = G.combo;
    var pts = Math.round(P.score*comboMult());
    G.score += pts;
    META.merges++; META.total += pts;
    popup(mx, my - nb.r*0.6, '+'+fmt(pts), lvl >= 7);
    if(G.combo >= 2){
      var ct = L.COMBO[Math.min(G.combo, 5)];
      if(ct !== G.comboText || G.comboTextT <= 0){ G.comboText = ct; G.comboTextT = 1.5; AU.combo(G.combo); }
      else G.comboTextT = Math.max(G.comboTextT, 1.0);
      if(G.combo === 3) komEvent('CHAIN', 2);
    }
    /* osjećaj: mrvice, mast, para, tresenje */
    crumbs(mx, my, 6 + lvl*2, lvl >= 6);
    if(lvl >= 4) grease(mx, my, 3 + lvl);
    if(lvl >= 6) steam(mx, my - nb.r*0.5, 3 + (lvl-5)*2, lvl >= 8);
    if(lvl >= 6) G.shake = Math.max(G.shake, (lvl-5)*3.2);
    if(lvl >= 8) G.flash = Math.max(G.flash, 0.4);
    AU.merge(lvl); vib(lvl >= 7 ? [20,30,40] : 8);

    if(lvl > G.biggest) G.biggest = lvl;
    if(lvl > META.biggest) META.biggest = lvl;
    if(!G.firstMerge){ G.firstMerge = true; komEvent('FIRST_MERGE', 2, 2.4); }
    if(lvl === 7 && !G.firstBurek){ G.firstBurek = true; komEvent('BUREK', 3, 3.2); }
    else if(lvl === 8) komEvent('BIG', 3, 3.0);
    else if(lvl === 9) komEvent('FINAL', 3, 3.6);
    KOM.brow = 1;
  }
  if(MERGES.length){
    var alive = [];
    for(var i=0;i<G.bodies.length;i++) if(!G.bodies[i].dead) alive.push(G.bodies[i]);
    G.bodies = alive;
  }
}

/* ---------- puštanje s oklagije ---------- */
function curRadius(){ return G.cur ? pita(G.cur).r : 30; }
function clampDropX(x){ var r = curRadius(); return clamp(x, PL + r + 2, PR - r - 2); }
function dropPiece(){
  if(G.st !== S.PLAYING || !G.cur || G.egg || G.curA < 0.6) return false;
  var x = clampDropX(G.dropXA);
  var b = mkBody(G.cur, x, DROP_Y);
  b.dropped = true; b.dropX = x;
  G.bodies.push(b);
  G.cur = 0; G.dropCd = DROP_CD; G.drops++; G.idleT = 0;
  AU.drop(); vib(6);
  /* sve na jednu stranu? */
  var side = (x < 300) ? -1 : (x > 420 ? 1 : 0);
  G.sideHist.push(side); if(G.sideHist.length > 5) G.sideHist.shift();
  if(G.sideHist.length === 5){
    var s0 = G.sideHist[0], same = s0 !== 0;
    for(var i=1;i<5;i++) if(G.sideHist[i] !== s0) same = false;
    if(same){ komEvent('SIDE', 1, 2.6); G.sideHist.length = 0; }
  }
  return true;
}
/* gdje bi pita otprilike pala — za vodilicu */
function landingY(x, r){
  var y = PFLOOR - r;
  for(var i=0;i<G.bodies.length;i++){
    var b = G.bodies[i], dx = Math.abs(b.x - x), rs = b.r + r;
    if(dx >= rs) continue;
    var cy = b.y - Math.sqrt(rs*rs - dx*dx);
    if(cy < y) y = cy;
  }
  return Math.max(y, DROP_Y);
}

/* ---------- nova partija / kraj ---------- */
function newGame(){
  G.st = S.PLAYING; G.t = 0; G.playT = 0;
  G.bodies = []; G.nextId = 1;
  G.score = 0; G.newBest = false; G.bestSaid = false;
  G.combo = 0; G.comboT = 9; G.comboText = ''; G.comboTextT = 0; G.bestCombo = 0;
  G.dangerT = 0; G.warnT = 0; G.dangerSaid = false;
  G.shake = 0; G.flash = 0; G.acc = 0;
  G.biggest = 0; G.firstMerge = false; G.firstBurek = false; G.crowdedSaid = false;
  G.drops = 0; G.idleT = 0; G.sideHist = []; G.fill = 0;
  G.cur = rollSpawn(0); G.next = rollSpawn(1); G.curA = 0; G.dropCd = 0;
  G.dropX = 360; G.dropXA = 360;
  for(var i=0;i<PART_N;i++) PARTS[i].on = false;
  for(i=0;i<POPS.length;i++) POPS[i].on = false;
  KOM.say = ''; KOM.sayT = 0; KOM.prio = 0; KOM.cd = 2.5; KOM.idleT = 0;
  G.egg = null; G.eggAt = -1;
  META.games++; META.eggGap++;
  /* "burek sa sirom" — rijetko, i nikad dvije partije zaredom */
  if(META.games > 3 && META.eggGap >= 30 && Math.random() < 1/100) G.eggAt = rnd(12, 40);
  save();
  AU.ambOn();
}
function gameOver(){
  if(G.st !== S.PLAYING) return;
  G.st = S.OVER; G.t = 0; G.egg = null;
  G.overLine = pick(L.OVER);
  if(G.score > META.best){ META.best = G.score; G.newBest = true; }
  if(G.bestCombo > META.bestCombo) META.bestCombo = G.bestCombo;
  save();
  KOM.say = ''; KOM.sayT = 0; KOM.prio = 0;
  AU.over(); AU.ambOff(); vib([40,60,80]);
  G.shake = 10;
}
function toMenu(){
  G.st = S.MENU; G.t = 0; G.egg = null;
  KOM.say = ''; KOM.sayT = 0;
  AU.ambOff();
}
function togglePause(){
  if(G.st === S.PLAYING){ G.st = S.PAUSED; G.t = 0; AU.ambOff(); }
  else if(G.st === S.PAUSED){ G.st = S.PLAYING; AU.ambOn(); }
}
function startEgg(){
  G.egg = { phase:0, t:0 };
  META.eggGap = 0; META.eggs++; save();
  KOM.say = ''; KOM.sayT = 0; KOM.prio = 0;
}

/* ==========================================================================
   GLAVNA PETLJA LOGIKE
   ========================================================================== */
function update(dt){
  G.gt += dt; G.t += dt;
  G.shake *= Math.pow(0.002, dt);
  G.flash = Math.max(0, G.flash - dt*1.8);
  updateParts(dt);
  for(var i=0;i<POPS.length;i++){ var p = POPS[i]; if(p.on){ p.t += dt; if(p.t > 1.1) p.on = false; } }
  updateKom(dt);
  if(G.comboTextT > 0) G.comboTextT -= dt;

  if(G.st !== S.PLAYING) return;
  G.playT += dt;

  /* jaje: sve stane, samo Amidža okreće glavu */
  if(G.egg){
    var E = G.egg; E.t += dt;
    if(E.phase === 0 && E.t > 2.3){ E.phase = 1; E.t = 0; }
    else if(E.phase === 1 && E.t > 1.6){ E.phase = 2; E.t = 0; komSay('Izađi.', 1.9, 5); AU.izadji(); KOM.brow = 1; }
    else if(E.phase === 2 && E.t > 2.0){ G.egg = null; }
    return;
  }
  if(G.eggAt > 0 && G.playT > G.eggAt && G.cur && G.dangerT <= 0){ G.eggAt = -1; startEgg(); return; }

  /* pita koja visi */
  G.dropXA = lerp(G.dropXA, G.dropX, Math.min(1, dt*18));
  if(!G.cur){
    G.dropCd -= dt;
    if(G.dropCd <= 0){ G.cur = G.next; G.next = rollSpawn(G.drops); G.curA = 0; }
  } else G.curA = Math.min(1, G.curA + dt*4);
  G.comboT += dt;
  G.idleT += dt;

  /* fizika u fiksnom koraku */
  HIT.pp = 0; HIT.lim = 0;
  G.acc += dt;
  var steps = 0;
  while(G.acc >= PH.dt && steps < 6){ stepPhysics(PH.dt); doMerges(); G.acc -= PH.dt; steps++; }
  if(steps === 6) G.acc = 0;
  for(i=0;i<G.bodies.length;i++){
    var b = G.bodies[i];
    if(b.sq > 0){ b.sqPh += dt*22; b.sq *= Math.pow(0.02, dt); if(b.sq < 0.01) b.sq = 0; }
    /* velike pite se puše */
    if(pita(b.lvl).steam){ b.steamT -= dt; if(b.steamT <= 0){ b.steamT = rnd(0.35, 0.7); steam(b.x + rnd(-b.r*0.5, b.r*0.5), b.y - b.r*0.8, 1, b.lvl === 9); } }
    /* puštena pita se smirila — je li to bilo pametno? */
    if(b.dropped && !b.landed && b.age > 0.35 && Math.abs(b.vx)+Math.abs(b.vy) < 40){
      b.landed = true;
      if(b.y - b.r < DANGER_Y + 50 && G.dangerT <= 0) komEvent('BAD', 1, 2.4);
      else if(b.lvl === 1 && Math.abs(b.x - b.dropX) > 200) komEvent('JUFKA', 1, 2.2);
    }
  }
  /* zvukovi udara — najjači iz frame-a */
  if(HIT.pp > 130){ AU.plop(clamp((HIT.pp-130)/900, 0, 1)); if(HIT.pp > 300) crumbs(HIT.x, HIT.y, 2 + ((HIT.pp/300)|0), false); }
  if(HIT.lim > 150){ AU.lim(clamp((HIT.lim-150)/1100, 0, 1)); if(HIT.lim > 700) G.shake = Math.max(G.shake, 2.5); }

  /* koliko je puna — za "inspekciju" */
  var area = 0;
  for(i=0;i<G.bodies.length;i++) area += G.bodies[i].r*G.bodies[i].r*3.14159;
  G.fill = area/((PR-PL)*(PFLOOR-DANGER_Y));
  if(G.fill > 0.62 && !G.crowdedSaid){ G.crowdedSaid = true; komEvent('CROWD', 2, 3.0); }

  /* rekord */
  if(G.score > META.best && META.best > 0 && !G.bestSaid){ G.bestSaid = true; G.newBest = true; komEvent('BEST', 2, 3.0); AU.best(); }

  /* crvena linija: ne kažnjavamo prolaz, nego stajanje */
  var above = false;
  for(i=0;i<G.bodies.length;i++){ b = G.bodies[i]; if(b.age > 0.7 && b.y - b.r < DANGER_Y){ above = true; break; } }
  if(above){
    if(G.dangerT === 0 && !G.dangerSaid){ G.dangerSaid = true; komEvent('DANGER', 2, 2.6); }
    G.dangerT += dt;
    G.warnT -= dt;
    if(G.warnT <= 0){ AU.warn(); G.warnT = 0.6; }
    if(G.dangerT >= DANGER_T){ gameOver(); return; }
  } else {
    G.dangerT = Math.max(0, G.dangerT - dt*2.5);
    if(G.dangerT === 0){ G.dangerSaid = false; G.warnT = 0; }
  }

  /* Amidža nešto progunđa kad ništa ne radiš */
  KOM.idleT += dt;
  if(G.idleT > 7 && KOM.idleT > 12 && Math.random() < dt*0.25){ komEvent('IDLE', 1, 2.6); }
  else if(KOM.idleT > 25 && Math.random() < dt*0.08){ komEvent('IDLE', 1, 2.6); }

  /* kuhinja živi */
  G.klinkT -= dt;
  if(G.klinkT <= 0){ G.klinkT = rnd(7, 16); AU.klink(); }
}

function drawParts(){
  var spr = steamSprite();

/* ---------- oblačić ---------- */
function speechBubble(s, x, y, maxw, tailX, tailY, small){
  if(!s) return;
  var font = (small?'600 22px':'700 26px')+' '+FONT;
  var lines = wrap(s, maxw-44, font);
  var lh = small?28:34;
  var h = lines.length*lh + 30;
  var w = 0;
  ctx.font = font;
  for(var i=0;i<lines.length;i++) w = Math.max(w, ctx.measureText(lines[i]).width);
  w = Math.min(maxw, w+44);
  var bx = clamp(x-w/2, 18, W-w-18), by = y-h;
  ctx.save();
  ctx.fillStyle = small?'rgba(28,24,36,0.92)':'rgba(250,244,232,0.96)';
  rr(ctx,bx,by,w,h,18); ctx.fill();
  ctx.strokeStyle = small?'rgba(255,220,170,0.35)':'rgba(120,80,40,0.55)'; ctx.lineWidth = 3;
  rr(ctx,bx,by,w,h,18); ctx.stroke();
  ctx.fillStyle = small?'rgba(28,24,36,0.92)':'rgba(250,244,232,0.96)';
  ctx.beginPath();
  ctx.moveTo(clamp(tailX-16,bx+14,bx+w-46), by+h-2);
  ctx.lineTo(clamp(tailX+16,bx+46,bx+w-14), by+h-2);
  ctx.lineTo(tailX, tailY);
  ctx.closePath(); ctx.fill();
  for(i=0;i<lines.length;i++) txt(lines[i], bx+w/2, by+22+i*lh, font, small?'#f0e2cc':'#2b1a10');
  ctx.restore();
}

/* Na tabletu/desktopu ostaje okvir okolo — stari televizor iz buregdžinice. */
function drawOkvir(){
  if(OX < 14 && OY < 14) return;
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var sx = OX, sy = OY, sw = W*SC, sh = HH*SC;
  ctx.beginPath();
  ctx.rect(0, 0, VW, sy); ctx.rect(0, sy + sh, VW, VH - (sy + sh));
  ctx.rect(0, sy, sx, sh); ctx.rect(sx + sw, sy, VW - (sx + sw), sh);
  ctx.clip();
  var wg = ctx.createLinearGradient(0, 0, VW, VH);
  wg.addColorStop(0, '#3d2a1c'); wg.addColorStop(0.45, '#2a1d13'); wg.addColorStop(1, '#170f0a');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = 'rgba(90,62,38,0.30)'; ctx.lineWidth = 1.5;
  for(var i=0;i<22;i++){
    var y = (i*VH/22) + (i%3)*4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(VW*0.3, y+7, VW*0.65, y-9, VW, y+3); ctx.stroke();
  }
  if(OX > 96){
    var pw = Math.min(OX-26, 130), px = OX/2 - pw/2;
    ctx.fillStyle = 'rgba(16,11,7,0.55)'; rr(ctx, px, sy + sh*0.30, pw, sh*0.34, 10); ctx.fill();
    ctx.fillStyle = 'rgba(120,92,60,0.35)';
    for(var g=0; g<14; g++){ var gy = sy + sh*0.30 + 10 + g*((sh*0.34-20)/14); ctx.fillRect(px+8, gy, pw-16, 3); }
    var kx = VW - OX/2;
    for(var k=0;k<2;k++){
      var ky = sy + sh*(0.34 + k*0.16), kr = Math.min(OX*0.26, 30);
      ctx.fillStyle = '#1b120b'; ctx.beginPath(); ctx.arc(kx, ky, kr, 0, 6.284); ctx.fill();
      ctx.strokeStyle = 'rgba(200,160,100,0.45)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(kx, ky, kr, 0, 6.284); ctx.stroke();
      ctx.strokeStyle = 'rgba(230,196,140,0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      var an = (k === 0) ? -0.9 : 0.5;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx+Math.cos(an)*kr*0.7, ky+Math.sin(an)*kr*0.7); ctx.stroke();
    }
    txt('PITA', kx, sy + sh*0.72, '800 ' + Math.round(Math.min(OX*0.34, 30)) + 'px '+FONT, 'rgba(226,190,132,0.75)');
  }
  var b = Math.max(6, Math.min(OX, OY, 26));
  ctx.strokeStyle = 'rgba(12,8,5,0.9)'; ctx.lineWidth = b*2;
  rr(ctx, sx - b, sy - b, sw + b*2, sh + b*2, b*1.4); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,112,68,0.45)'; ctx.lineWidth = 3;
  rr(ctx, sx - b*0.6, sy - b*0.6, sw + b*1.2, sh + b*1.2, b); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,170,0.10)'; ctx.lineWidth = 2;
  rr(ctx, sx - 2, sy - 2, sw + 4, sh + 4, 6); ctx.stroke();
  ctx.restore();
}

    txt(rows[i][1], 590, y, '800 30px '+FONT, '#ffd479', 'right');
  }
  if(G.biggest){
    var r = pita(G.biggest).r, sc = Math.min(1, 62/r);
    blitPita(G.biggest, 360, 780, Math.sin(G.gt)*0.1, sc, sc);
  }
  if(G.newBest){
    ctx.save();
    var pu = 1+Math.sin(G.gt*7)*0.05;
    ctx.translate(360, 700); ctx.scale(pu,pu);
    txtO('NOVI REKORD!', 0, 0, '900 40px '+FONT, '#9fe8a0', 9);
    ctx.restore();
  }
  btn('again', 160, 890, 400, 94, 'PONOVO', '', GOLD, false);
  btn('menu', 160, 1004, 400, 78, 'POČETAK', '', TAN, false);
  ctx.restore();
}

/* ==========================================================================
   RENDER — sve u jednom prolazu
   ========================================================================== */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0b0705';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(OX,OY); ctx.scale(SC,SC);
  ctx.beginPath(); ctx.rect(0,0,W,HH); ctx.clip();
  var sh = G.shake;
  if(sh>0.3) ctx.translate(rnd(-sh,sh), rnd(-sh,sh));
  BTN = [];

  drawBackLive();
  drawAmidza();
  drawTrayBack();
  drawBodies();
  drawDanger();
  drawTrayFront();
  drawDropper();
  drawParts();
  drawPops();
  drawCombo();
  if(G.flash>0){ ctx.fillStyle = 'rgba(255,230,170,'+(G.flash*0.4)+')'; ctx.fillRect(0,0,W,HH); }

  if(G.st === S.PLAYING || G.st === S.PAUSED){
    if(KOM.sayT > 0) speechBubble(KOM.say, 200, 214, 420, AM_X+30, 246, false);
    drawEgg();
    drawHUD();
    drawBottomBar();
  }
  if(G.st === S.MENU) drawMenu();
  if(G.st === S.HOWTO) drawHowto();
  if(G.st === S.STATS) drawStats();
  if(G.st === S.PAUSED) drawPaused();
  if(G.st === S.OVER){ drawHUD(); drawOver(); }

  drawCRT();
  ctx.restore();
  drawOkvir();
}

/* ==========================================================================
   UNOS — miš i prst rade isto: pomak = pomjeri pitu, otpuštanje = baci
   ========================================================================== */
function hit(x,y){
  for(var i=BTN.length-1;i>=0;i--){
    var b = BTN[i];
    if(x>=b.x-8 && x<=b.x+b.w+8 && y>=b.y-8 && y<=b.y+b.h+10) return b.id;
  }
  return null;
}
function toVirt(cx,cy){ return {x:(cx-OX)/SC, y:(cy-OY)/SC}; }
var DRAG = { on:false, sx:0, sy:0 };
function onDown(cx,cy){
  AU.init();
  var v = toVirt(cx,cy);
  var id = hit(v.x, v.y);
  if(id){ PRESS.id = id; DRAG.on = false; return; }
  PRESS.id = null;
  if(G.st === S.PLAYING && !G.egg){
    G.dropX = v.x; DRAG.on = true; DRAG.sx = v.x; DRAG.sy = v.y;
  }
}
function onMove(cx,cy){
  var v = toVirt(cx,cy);
  if(G.st === S.PLAYING && !G.egg && !PRESS.id) G.dropX = v.x;
}
function onUp(cx,cy){
  AU.init();
  var v = toVirt(cx,cy);
  var id = hit(v.x, v.y);
  var was = PRESS.id; PRESS.id = null;
  if(id && id === was){ handle(id); DRAG.on = false; return; }
  if(was){ DRAG.on = false; return; }
  if(G.st === S.PLAYING && DRAG.on){ G.dropX = v.x; dropPiece(); }
  DRAG.on = false;
}
function handle(id){
  if(id==='snd' || id==='sndbig'){ AU.on = !AU.on; if(AU.on){ AU.click(); if(G.st === S.PLAYING) AU.ambOn(); } else AU.ambOff(); save(); return; }
  AU.click();
  if(id==='play'){ newGame(); return; }
  if(id==='howto'){ G.st = S.HOWTO; G.t = 0; return; }
  if(id==='stats'){ G.st = S.STATS; G.t = 0; return; }
  if(id==='back'){ toMenu(); return; }
  if(id==='pause'){ togglePause(); return; }
  if(id==='resume'){ if(G.st === S.PAUSED) togglePause(); return; }
  if(id==='menu'){ toMenu(); return; }
  if(id==='again'){ newGame(); return; }
}
function onKey(e){
  if(e.key === 'ArrowLeft'){ G.dropX = clampDropX(G.dropX) - 26; }
  else if(e.key === 'ArrowRight'){ G.dropX = clampDropX(G.dropX) + 26; }
  else if(e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter'){
    AU.init();
    if(G.st === S.PLAYING) dropPiece();
    else if(G.st === S.MENU) handle('play');
    else if(G.st === S.OVER) handle('again');
    else if(G.st === S.PAUSED) togglePause();
    else if(G.st === S.HOWTO || G.st === S.STATS) toMenu();
    e.preventDefault();
  }
  else if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ if(G.st === S.PLAYING || G.st === S.PAUSED) togglePause(); }
  else if(e.key === 'm' || e.key === 'M'){ handle('snd'); }
}

/* ==========================================================================
   PLATNO, PETLJA, POKRETANJE
   ========================================================================== */
var RQ = 1;
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  var maxDpr = (Math.min(w, h) >= 700) ? 2 : 3;
  DPR = Math.min(window.devicePixelRatio||1, maxDpr) * RQ;
  cv.width = Math.floor(w*DPR); cv.height = Math.floor(h*DPR);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  SC = Math.min(w/W, h/HH);
  OX = (w - W*SC)/2; OY = (h - HH*SC)/2;
  VW = w; VH = h;
  /* gradijenti su vezani uz veličinu — čisti keš */
  _trayG = null; _trayIn = null; _vigG = null; _glowG = null; _scanP = null;
}

var lastT = 0, HIDDEN = false, FPS_T=0, FPS_N=0, FPS_SUM=0, LAST_RQ_CHANGE=0;
function frame(ts){
  if(HIDDEN){ lastT = ts; window.requestAnimationFrame(frame); return; }
  var dt = Math.min(0.05, (ts-lastT)/1000 || 0.016);
  lastT = ts;
  update(dt); render();
  /* adaptivna rezolucija kao kod fildžana: logika ostaje ista, pikseli padaju ako telefon ne stiže */
  FPS_T += dt; FPS_N++; FPS_SUM += 1/Math.max(0.001,dt);
  if(FPS_T > 2.4){
    var fps=FPS_SUM/FPS_N; FPS_T=0; FPS_N=0; FPS_SUM=0;
    if(ts-LAST_RQ_CHANGE>5000){
      var nr=RQ;
      if(fps<49 && RQ>0.62) nr=Math.max(0.60,RQ-0.12);
      else if(fps>58 && RQ<1) nr=Math.min(1,RQ+0.08);
      if(Math.abs(nr-RQ)>0.01){RQ=nr;LAST_RQ_CHANGE=ts;resize();}
    }
  }
  window.requestAnimationFrame(frame);
}

function boot(){
  cv = document.getElementById('c');
  ctx = cv.getContext('2d');
  load();
  AU.on = META.snd !== 0;
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
  document.addEventListener('visibilitychange', function(){
    HIDDEN = !!document.hidden;
    if(HIDDEN){
      if(G.st === S.PLAYING) togglePause();
      if(AU.ctx){ try{ AU.ctx.suspend(); }catch(e){} }
    } else if(AU.ctx){ try{ AU.ctx.resume(); }catch(e){} }
  });

  /* PWA — radi i bez mreže */
  if('serviceWorker' in navigator &&
     (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  if(window.PointerEvent){
    cv.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} onDown(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointermove', function(e){ e.preventDefault(); onMove(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointerup', function(e){ e.preventDefault(); onUp(e.clientX, e.clientY); }, {passive:false});
    cv.addEventListener('pointercancel', function(){ PRESS.id = null; DRAG.on = false; });
  }else{
    cv.addEventListener('touchstart', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onDown(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('touchmove', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onMove(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('touchend', function(e){ e.preventDefault(); var t = e.changedTouches[0]; onUp(t.clientX, t.clientY); }, {passive:false});
    cv.addEventListener('mousedown', function(e){ onDown(e.clientX,e.clientY); });
    cv.addEventListener('mousemove', function(e){ onMove(e.clientX,e.clientY); });
    cv.addEventListener('mouseup', function(e){ onUp(e.clientX,e.clientY); });
  }
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('keydown', onKey);

  /* sprite-ovi se crtaju odmah, da prva partija ne štuca */
  for(var i=1;i<=MAX_LVL;i++) pitaSprite(i);
  bgSprite();

  window.requestAnimationFrame(frame);
}

/* ---------- ikona i naslovna slika — crta ih sama igra (tools/icons.js) ---------- */
function renderIcon(size){
  var c = document.createElement('canvas'); c.width = c.height = size;
  var g = c.getContext('2d');
  var bg = g.createLinearGradient(0, 0, 0, size);
  bg.addColorStop(0, '#3a2718'); bg.addColorStop(1, '#120a06');
  g.fillStyle = bg; g.fillRect(0, 0, size, size);
  /* tepsija */
  g.fillStyle = '#5a5148'; rr(g, size*0.08, size*0.30, size*0.84, size*0.62, size*0.06); g.fill();
  g.strokeStyle = '#b3ada3'; g.lineWidth = size*0.035; rr(g, size*0.08, size*0.30, size*0.84, size*0.62, size*0.06); g.stroke();
  g.strokeStyle = 'rgba(20,14,10,0.8)'; g.lineWidth = size*0.012; rr(g, size*0.08, size*0.30, size*0.84, size*0.62, size*0.06); g.stroke();
  var s = pitaSprite(7), r = size*0.36;
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(size*0.52, size*0.62, r*1.02, r*0.95, 0, 0, 6.284); g.fill();
  g.drawImage(s.c, size*0.5 - r*(s.size/(2*pita(7).r)), size*0.58 - r*(s.size/(2*pita(7).r)), 2*r*(s.size/(2*pita(7).r)), 2*r*(s.size/(2*pita(7).r)));
  return c.toDataURL('image/png');
}
function renderCover(){
  var w = 1200, h = 630;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d');
  var bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#2b1c12'); bg.addColorStop(1, '#0b0705');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,190,90,0.10)'; g.beginPath(); g.arc(880, 330, 300, 0, 6.284); g.fill();
  var s = pitaSprite(9), r = 250, k = s.size/(2*pita(9).r);
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(890, 560, 260, 40, 0, 0, 6.284); g.fill();
  g.save(); g.translate(880, 330); g.rotate(-0.2);
  g.drawImage(s.c, -r*k, -r*k, 2*r*k, 2*r*k); g.restore();
  g.textAlign = 'left'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = '900 96px '+FONT; g.lineWidth = 16; g.strokeStyle = 'rgba(18,10,6,0.9)';
  g.strokeText('EVOLUCIJA', 70, 220); g.fillStyle = '#ffd479'; g.fillText('EVOLUCIJA', 70, 220);
  g.strokeText('PITE', 70, 320); g.fillStyle = '#ffe9b0'; g.fillText('PITE', 70, 320);
  g.font = '600 40px '+FONT; g.fillStyle = 'rgba(255,232,196,0.92)'; g.fillText('Od jufke do bureka.', 74, 410);
  g.font = '600 26px '+FONT; g.fillStyle = 'rgba(255,225,180,0.55)'; g.fillText('Dvije iste postaju jedna veća. Ne prelazi crvenu liniju.', 74, 470);
  return c.toDataURL('image/jpeg', 0.9);
}

/* test-kuka — samo kad je izričito uključena (tools/smoke.js) */
if(window.__EPTEST) window.EP = {
  G:G, S:S, META:META, KOM:KOM, PITE:PITE, PH:PH, AU:AU,
  update:update, render:render, newGame:newGame, dropPiece:dropPiece, gameOver:gameOver,
  togglePause:togglePause, handle:handle, startEgg:startEgg, toMenu:toMenu, resize:resize,
  onDown:onDown, onMove:onMove, onUp:onUp, hit:hit, btns:function(){ return BTN.slice(); },
  spawn:function(lvl, x, y){ var b = mkBody(lvl, x, y); G.bodies.push(b); return b; },
  mjere:function(){ return {SC:SC, OX:OX, OY:OY, DPR:DPR, VW:VW, VH:VH}; },
  icon:renderIcon, cover:renderCover, save:save, load:load,
  TRAY:TRAY, PL:PL, PR:PR, PFLOOR:PFLOOR, DANGER_Y:DANGER_Y, DROP_Y:DROP_Y
};

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
